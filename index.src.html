 T:[["١. الموافقة على الشروط","بإنشاء حساب AQX ID، يقر المستخدم بأنه قرأ هذه الشروط وفهمها ووافق عليها. إذا لم يوافق عليها، فلا ينبغي له إكمال التسجيل."],["٢. صحة البيانات","يلتزم المستخدم بتقديم بيانات صحيحة تخصه. يتحمل المستخدم مسؤولية تحديث بياناته عند تغييرها. يُحظر استخدام بيانات الآخرين أو انتحال شخصية أي شخص. لا يجوز استخدام الحساب في الاحتيال أو الإضرار بالآخرين."],["٣. حساب واحد لكل بريد إلكتروني","يُسمح بإنشاء حساب واحد فقط لكل عنوان بريد إلكتروني. يجب تأكيد ملكية البريد الإلكتروني قبل تفعيل الحساب. لا يجوز استخدام البريد الإلكتروني الخاص بشخص آخر دون إذنه. قد تُرفض محاولة التسجيل إذا كان البريد مرتبطًا بحساب قائم أو خاضعًا لفترة تعليق بعد الحذف."],["٤. أمان الحساب","المستخدم مسؤول عن المحافظة على سرية بيانات الدخول الخاصة به. يجب عدم مشاركة كلمات المرور أو رموز التحقق مع الآخرين. يُنصح باستخدام كلمة مرور قوية وعدم إعادة استخدامها في خدمات أخرى. يجب إبلاغ الدعم عند الاشتباه في وصول غير مصرح به إلى الحساب. يحق للنظام تطبيق إجراءات حماية مؤقتة عند اكتشاف نشاط مشبوه، مع إتاحة وسيلة للاعتراض على الحظر الخاطئ."],["٥. الاستخدام المقبول","يُحظر استخدام AQX ID في: الاحتيال أو سرقة الحسابات أو انتحال الهوية؛ إرسال الرسائل المزعجة أو تنفيذ هجمات آلية ضارة؛ محاولة اختراق الأنظمة أو تجاوز الصلاحيات الأمنية؛ نشر البرمجيات الخبيثة أو استغلال ثغرات النظام؛ انتهاك حقوق الآخرين أو استخدام الخدمات لأغراض غير قانونية."],["٦. مكافحة إساءة استخدام التسجيل","يجوز للنظام استخدام وسائل تقنية للحد من الحسابات الوهمية والتسجيل الآلي. قد يفرض النظام قيودًا مؤقتة على التسجيل عند اكتشاف نشاط غير طبيعي. لا يجوز اتخاذ قرار نهائي بإغلاق حساب لمجرد الاشتباه الآلي دون آلية مناسبة للمراجعة، متى كان ذلك ممكنًا."],["٧. البيانات والخصوصية","تُجمع البيانات اللازمة لإنشاء الحساب وتشغيله وتأمينه. قد تشمل البيانات البريد الإلكتروني، ورقم العضوية، وسجلات الدخول والأحداث الأمنية. لا تُجمع بيانات الموقع الدقيق إلا عند وجود حاجة واضحة وأساس مناسب لذلك. تُعالج البيانات وفق سياسة الخصوصية المعتمدة لدى AQX. يجب توضيح أغراض المعالجة، ومدة الاحتفاظ بالبيانات، والجهات التي قد تتلقى البيانات، وحقوق المستخدم في سياسة الخصوصية."],["٨. رقم العضوية","يحصل المستخدم على رقم عضوية خاص بحسابه. يُستخدم الرقم للتعرف على الحساب داخل خدمات AQX. لا يُعد رقم العضوية كلمة مرور أو وسيلة كافية لإثبات الهوية. لا يجوز استخدام رقم العضوية للوصول إلى بيانات حساب آخر."],["٩. إيقاف الحساب أو تقييده","يجوز تقييد الحساب أو تعليقه عند وجود دليل معقول على الاحتيال أو الاختراق أو مخالفة الشروط. ويجب أن يكون الإجراء متناسبًا مع المخالفة، مع إبلاغ المستخدم بالسبب قدر الإمكان وإتاحة وسيلة للاعتراض، باستثناء الحالات التي يمنع فيها القانون أو تقتضي فيها الضرورة الأمنية عدم الإفصاح."],["١٠. حذف الحساب","يمكن للمستخدم طلب حذف حسابه وفق الإجراءات المتاحة. تُوضح للمستخدم البيانات التي ستُحذف والبيانات التي قد يلزم الاحتفاظ بها لأسباب قانونية أو أمنية. قد تُطبق مهلة تصل إلى 40 يومًا قبل السماح بإعادة التسجيل بالبريد نفسه، بشرط الإفصاح عن ذلك قبل الموافقة. لا تعني مهلة إعادة التسجيل بالضرورة الاحتفاظ بجميع البيانات الشخصية طوال تلك الفترة. يُبلّغ المستخدم بحالة طلب الحذف وفق الإمكانات المتاحة."],["١١. توفر الخدمات والتعديلات","قد تتوقف بعض الخدمات مؤقتًا للصيانة أو لأسباب أمنية أو تقنية. قد تتغير بعض الميزات أو الشروط عند الحاجة. تُعلن التعديلات الجوهرية للمستخدمين بطريقة مناسبة، وقد تُطلب موافقتهم مجددًا عندما يستلزم القانون ذلك."],["١٢. مسؤولية المستخدم","يلتزم المستخدم باستخدام الخدمات بطريقة قانونية ومسؤولة، ولا يجوز استخدام حسابه للإضرار بالنظام أو بالمستخدمين الآخرين. ولا تهدف هذه الشروط إلى إعفاء AQX من المسؤوليات التي يفرضها القانون أو الانتقاص من الحقوق القانونية للمستخدم."],["١٣. التواصل والشكاوى","يحق للمستخدم التواصل مع القنوات الرسمية المعلنة لدى ALQURMANI X للاستفسار أو الإبلاغ عن مشكلة أمنية أو تقديم شكوى أو طلب مراجعة قرار متعلق بحسابه."],["١٤. سياسة الخصوصية","تُعد سياسة الخصوصية وثيقة مستقلة توضح كيفية جمع البيانات الشخصية واستخدامها وتخزينها وحمايتها ومشاركتها والاحتفاظ بها وحذفها. ينبغي الاطلاع عليها قبل التسجيل."],["١٥. الإقرار النهائي","بتحديد مربع الموافقة ثم الضغط على «إنشاء حساب»، يقر المستخدم بأنه قرأ شروط التسجيل واستخدام AQX ID ووافق عليها، واطلع على سياسة الخصوصية."]]},
