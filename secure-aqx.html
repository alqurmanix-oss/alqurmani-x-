<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AQX | الملف الأمني</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://rysafsualdcrhijurxai.supabase.co https://formsubmit.co; img-src data:; media-src data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Cinzel:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c84b;--gold2:#ffe9a6;--gold3:#c8932a;--line:rgba(255,230,160,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Cairo',system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#17419b 0%,#3b2a9c 48%,#0f6bb8 100%) fixed;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow-x:hidden}
img{-webkit-user-drag:none}
body.hide #app{filter:blur(28px);pointer-events:none}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:d 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:50vmax;height:50vmax;background:#7b5cff;top:-15vmax;right:-10vmax}
.aurora i:nth-child(2){width:45vmax;height:45vmax;background:#19b4ff;bottom:-15vmax;left:-10vmax;animation-delay:-7s}
.aurora i:nth-child(3){width:30vmax;height:30vmax;background:#ffcf5a;top:40%;left:40%;opacity:.25;animation-delay:-12s}
@keyframes d{to{transform:translate(5vmax,-4vmax) scale(1.15)}}
.aqx{font-family:'Cinzel',serif;font-weight:900;letter-spacing:.12em;line-height:1;background:linear-gradient(180deg,#fff7d0,var(--gold) 45%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,214,102,.8))}

/* شاشة التحقق */
#verify{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#17419b,#3b2a9c 50%,#0f6bb8);transition:opacity .8s}
#verify .aqx{font-size:4rem;animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.08)}}
#verify p{margin-top:18px;font-weight:800;color:var(--gold2)}
.scanbar{width:min(70vw,280px);height:6px;margin:18px auto 0;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.scanbar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,transparent,#7fffe0,#fff,#7fffe0,transparent);animation:sw 1s ease-in-out infinite alternate}
@keyframes sw{from{margin-right:0}to{margin-right:60%}}

/* لوحة التحكم */
#app{position:relative;z-index:5;display:none;padding:22px;max-width:1100px;margin:0 auto;transition:filter .2s}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;border-radius:22px;
  background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(20,10,90,.4)}
header .l{display:flex;align-items:center;gap:14px}
header .aqx{font-size:2.2rem}
header h1{font-size:1rem;font-weight:900}
header h1 small{display:block;font-size:.75rem;color:var(--gold2);font-weight:600}
.btn{height:46px;padding:0 22px;border:0;border-radius:14px;cursor:pointer;font:900 .95rem 'Cairo',sans-serif;color:#2a1a00;background:linear-gradient(180deg,#fff2b8,var(--gold) 50%,var(--gold3));box-shadow:0 8px 22px rgba(200,147,42,.5)}
.hero{margin:22px 0;padding:34px 24px;border-radius:26px;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid var(--line);box-shadow:0 0 70px rgba(245,200,75,.2)}
.hero .g{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(1.5rem,6vw,2.4rem);direction:ltr;background:linear-gradient(180deg,#fff,var(--gold) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(245,200,75,.7))}
.hero p{margin-top:10px;font-weight:700;line-height:2;color:#eef3ff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.st{padding:22px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.28);box-shadow:0 14px 40px rgba(20,10,90,.35)}
.st .ic{font-size:1.7rem}
.st b{display:block;margin-top:8px;font-size:.82rem;color:var(--gold2)}
.st span{display:block;margin-top:4px;font-weight:900;font-size:1.05rem;word-break:break-all}
.ok{color:#7fffd0}
#slot{margin-top:22px;padding:26px;border-radius:22px;border:2px dashed var(--line);text-align:center;font-weight:800;color:var(--gold2);background:rgba(255,255,255,.07)}

/* شاشة الطرد */
#breach{position:fixed;inset:0;z-index:2147483647;display:none;place-items:center;text-align:center;padding:20px;
  background:repeating-linear-gradient(45deg,#c30018 0 40px,#e1001e 40px 80px);animation:al .45s infinite alternate}
#breach.on{display:grid}
@keyframes al{from{filter:brightness(1)}to{filter:brightness(1.6) saturate(1.3)}}
#breach .inner{background:rgba(120,0,15,.9);border:4px solid #fff;border-radius:26px;padding:34px 24px;max-width:660px;box-shadow:0 0 100px #ff2040}
#breach h1{font-size:clamp(1.8rem,7vw,3rem);font-weight:900;animation:sh .22s infinite}
#breach p{margin-top:14px;font-weight:800;line-height:2;font-size:1.05rem}
#breach .cd{font-size:3.6rem;font-weight:900;margin-top:10px;font-family:'Cinzel',serif}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.nojs{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#c30018;color:#fff;font-weight:900;font-size:1.4rem;text-align:center;padding:20px}
@media print{html,body{display:none!important}}
</style>
</head>
<body>
<noscript><div class="nojs">⛔ دخول غير مصرح — JavaScript مطلوب</div></noscript>
<div class="aurora"></div>

<div id="verify"><div><div class="aqx">AQX</div><p>جارٍ التحقق الأمني من هويتك…</p><div class="scanbar"><i></i></div></div></div>
<div id="app"></div>

<div id="breach"><div class="inner">
  <h1>🚨 تحذير أمني شديد 🚨</h1>
  <p id="bwhy">دخول غير مصرح به إلى منطقة محمية.</p>
  <p>تم تسجيل جهازك وإرسال بلاغ فوري للإدارة المركزية.<br>سيتم طردك الآن.</p>
  <div class="cd" id="cd">6</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
/* ================= الإعدادات ================= */
const SUPABASE_URL='https://rysafsualdcrhijurxai.supabase.co';
const SUPABASE_KEY='sb_publishable_3PeD3OhddyVwY5E_chKNqA_jh2ESVsv';
const EXIT_URL='https://www.google.com';        // وجهة الطرد (بعد محاولة إغلاق المتصفح)
const GATE_URL='aqx-gate.html';                 // صفحة الدخول (عند تسجيل الخروج الطبيعي)
const ALERT_EMAIL='alqurmanix@gmail.com';
const IDLE_MIN=10;                              // خروج تلقائي بعد خمول
const RECHECK_SEC=20;                           // إعادة فحص الجلسة من السيرفر

/* ================= منع الإطارات ================= */
if(window.top!==window.self){try{window.top.location.replace(window.self.location.href)}catch(e){}document.documentElement.innerHTML='';throw 0}

const $=id=>document.getElementById(id);
let breached=false,authed=false,sirenNodes=null,AC=null;

/* ================= إشعار البريد ================= */
function notify(subject,details){
  try{fetch('https://formsubmit.co/ajax/'+ALERT_EMAIL,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({_subject:'[AQX-SECURE] '+subject,_template:'table',_captcha:'false',الحدث:subject,التفاصيل:details,
    الوقت:new Date().toLocaleString('ar-EG'),الجهاز:navigator.userAgent,الشاشة:screen.width+'x'+screen.height,المنطقة:Intl.DateTimeFormat().resolvedOptions().timeZone})}).catch(()=>{})}catch(e){}
}

/* ================= الصفارة والطرد ================= */
function siren(){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();
  const o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain();
  o.type='sawtooth';o.frequency.value=850;l.frequency.value=1.7;lg.gain.value=450;l.connect(lg).connect(o.frequency);
  g.gain.value=.7;o.connect(g).connect(AC.destination);o.start();l.start();sirenNodes=[o,l]}catch(e){}
}
function breach(reason){
  if(breached)return;breached=true;authed=false;
  try{$('app').remove();$('verify').remove();document.querySelector('.aurora').remove()}catch(e){}
  $('bwhy').textContent=reason;
  $('breach').classList.add('on');
  siren();
  /* بعض المتصفحات تمنع الصوت دون تفاعل: نعيد المحاولة عند أي حركة */
  ['pointerdown','keydown','touchstart','mousemove'].forEach(ev=>addEventListener(ev,()=>{try{AC&&AC.resume();if(!sirenNodes)siren()}catch(e){}},{once:true}));
  try{navigator.vibrate&&navigator.vibrate([600,200,600,200,600,200,600])}catch(e){}
  try{sessionStorage.clear();localStorage.removeItem('aqx_l')}catch(e){}
  notify('🚨 اختراق / دخول غير مصرح',reason+' | '+location.href);
  let n=6;const t=setInterval(()=>{const c=$('cd');if(c)c.textContent=--n;if(n<=0){clearInterval(t);expel()}},1000);
}
function expel(){
  try{sirenNodes&&sirenNodes.forEach(o=>o.stop())}catch(e){}
  try{window.open('','_self');window.close()}catch(e){}
  setTimeout(()=>{try{document.documentElement.innerHTML='';location.replace(EXIT_URL)}catch(e){location.href=EXIT_URL}},350);
}
window.__aqxBreach=undefined; /* لا نكشف الدالة للخارج */

/* ================= العميل ================= */
if(!window.supabase){breach('تعذّر تحميل وحدة التحقق — اتصال مشبوه');return}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});

/* ================= التحقق الأساسي (من السيرفر) ================= */
async function verify(){
  try{
    const {data:s}=await sb.auth.getSession();
    if(!s||!s.session)return null;
    const {data:u,error}=await sb.auth.getUser();      // تحقق فعلي من خادم Supabase
    if(error||!u||!u.user)return null;
    return {user:u.user,session:s.session};
  }catch(e){return null}
}

/* ================= رسم اللوحة (لا تُبنى إلا بعد النجاح) ================= */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(ctx){
  const u=ctx.user,last=u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString('ar-EG'):'—';
  $('app').innerHTML=`
  <header class="top">
    <div class="l"><div class="aqx">AQX</div><h1>لوحة القيادة المركزية<small>${esc(u.email||'')}</small></h1></div>
    <button class="btn" id="out">تسجيل الخروج الآمن</button>
  </header>
  <section class="hero">
    <div class="g">General Mohamed Basyouni</div>
    <p>أنت داخل المنطقة المحمية بالكامل. كل قرار تتخذه من هنا يصنع فرقًا.<br>القيادة تبدأ من هنا.</p>
  </section>
  <section class="stats">
    <div class="st"><div class="ic">🛡️</div><b>حالة الجلسة</b><span class="ok">موثّقة من الخادم ✔</span></div>
    <div class="st"><div class="ic">🔐</div><b>آخر دخول</b><span>${esc(last)}</span></div>
    <div class="st"><div class="ic">⏱️</div><b>انتهاء الجلسة بعد خمول</b><span id="idle">--:--</span></div>
    <div class="st"><div class="ic">📡</div><b>الاتصال</b><span class="ok">مشفّر ومراقَب</span></div>
  </section>
  <section id="slot">⬇︎ ضع هنا أقسام لوحة القيادة الحقيقية (داخل دالة render) ⬇︎</section>`;
  $('app').style.display='block';
  $('out').onclick=()=>logout();
}
async function logout(){try{await sb.auth.signOut()}catch(e){}try{sessionStorage.clear()}catch(e){}location.replace(GATE_URL)}

/* ================= الإقلاع ================= */
(async()=>{
  const ctx=await verify();
  if(!ctx){breach('محاولة دخول بدون جلسة صحيحة مسجّلة');return}
  authed=true;render(ctx);
  $('verify').style.opacity=0;setTimeout(()=>{const v=$('verify');v&&v.remove()},800);
  notify('فتح الملف الأمني',ctx.user.email);

  /* إعادة فحص دوري من السيرفر */
  setInterval(async()=>{if(breached)return;const c=await verify();if(!c)breach('انتهاء أو إلغاء الجلسة أثناء التصفح')},RECHECK_SEC*1000);
  sb.auth.onAuthStateChange(ev=>{if(!breached&&(ev==='SIGNED_OUT'))breach('تم إنهاء الجلسة')});

  /* خمول */
  let last=Date.now();
  ['mousemove','keydown','click','touchstart','scroll'].forEach(e=>addEventListener(e,()=>last=Date.now(),{passive:true}));
  setInterval(()=>{
    const left=IDLE_MIN*60-Math.floor((Date.now()-last)/1000),el=$('idle');
    if(el)el.textContent=String(Math.max(0,left/60|0)).padStart(2,'0')+':'+String(Math.max(0,left%60)).padStart(2,'0');
    if(left<=0&&!breached){logout()}
  },1000);
})();

/* ================= الرجوع بالمتصفح / الكاش ================= */
addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
addEventListener('storage',e=>{if(e.key&&e.key.includes('auth-token')&&!e.newValue&&!breached)breach('تم إنهاء الجلسة من نافذة أخرى')});

/* ================= حماية الواجهة ================= */
const block=e=>{e.preventDefault();e.stopPropagation();return false};
document.addEventListener('contextmenu',e=>{block(e);if(authed)breach('محاولة فتح قائمة النقر الأيمن')},true);
['copy','cut','paste','dragstart','selectstart','drop'].forEach(ev=>document.addEventListener(ev,block,true));
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(e.keyCode===123||k==='f12'){block(e);breach('محاولة فتح أدوات المطور (F12)')}
  else if(c&&e.shiftKey&&['i','j','c','k','e','m'].includes(k)){block(e);breach('اختصار أدوات المطور')}
  else if(c&&['u','s','p','a','c','x'].includes(k)){block(e);if(k==='u'||k==='s')breach('محاولة عرض المصدر أو حفظ الصفحة')}
  else if(e.altKey&&e.metaKey&&['i','j','u','c'].includes(k)){block(e);breach('أدوات المطور')}
  else if(k==='printscreen'){try{navigator.clipboard.writeText('')}catch(_){}document.body.classList.add('hide');setTimeout(()=>document.body.classList.remove('hide'),1500)}
},true);
addEventListener('beforeprint',()=>breach('محاولة طباعة أو حفظ PDF'));
/* إخفاء المحتوى عند فقدان التركيز (ضد لقطات الشاشة والمشاركة) */
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('hide',document.hidden));
addEventListener('blur',()=>document.body.classList.add('hide'));
addEventListener('focus',()=>document.body.classList.remove('hide'));

/* ================= كشف أدوات المطور ================= */
const bait=new Image();let hit=false;Object.defineProperty(bait,'id',{get(){hit=true}});
const mobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
setInterval(()=>{
  if(breached)return;
  hit=false;console.log('%c',bait);console.clear();
  const t0=performance.now();(function(){debugger})();const dt=performance.now()-t0;
  const dock=!mobile&&(outerWidth-innerWidth>170||outerHeight-innerHeight>170);
  if(hit||dt>120||dock)breach('رصد أدوات المطور مفتوحة');
},1200);

/* ================= كشف العبث بالصفحة ================= */
new MutationObserver(m=>{
  if(breached)return;
  for(const r of m){
    for(const n of r.removedNodes){if(n.id==='breach')return breach('محاولة حذف شاشة الحماية')}
    for(const n of r.addedNodes){
      if(n.nodeType===1&&/^(SCRIPT|IFRAME|OBJECT|EMBED|LINK)$/i.test(n.tagName)&&!n.src?.includes('cdn.jsdelivr.net')&&!n.href?.includes('fonts.googleapis.com'))
        return breach('محاولة حقن شيفرة داخل الصفحة');
    }
    if(r.type==='attributes'&&r.target.id==='breach'&&authed)return breach('عبث بشاشة الحماية');
  }
}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class','hidden']});

/* تجميد الدوال الحساسة */
try{Object.freeze(window.supabase)}catch(e){}
try{Object.defineProperty(window,'eval',{value:()=>{breach('استخدام eval');},writable:false,configurable:false})}catch(e){}
})();
</script>
</body>
</html>
