<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>الفحص الأمني | AQX Identity</title>

<style>
:root {
  color-scheme: dark;
  --bg:#10131b;
  --panel:#191f2b;
  --line:#30394a;
  --text:#f4f6fb;
  --muted:#aab4c5;
  --accent:#65a7ff;
  --success:#36c98b;
  --danger:#ff6b78;
  --warning:#e5b65c;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(ellipse at top,#1c2b43 0%,transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}

.card {
  width:min(100%,470px);
  padding:30px 24px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(25,31,43,.96);
  box-shadow:0 25px 80px #0007;
  text-align:center;
}

.logo {
  width:66px;
  height:66px;
  display:grid;
  place-items:center;
  margin:0 auto 20px;
  border-radius:20px;
  background:#233c5d;
  color:#8fc2ff;
  font-size:27px;
  font-weight:bold;
}

h1 {
  margin:0 0 12px;
  font-size:23px;
}

.description {
  color:var(--muted);
  font-size:14px;
  line-height:1.9;
}

.status {
  margin:24px 0 14px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#111722;
  line-height:1.9;
  font-size:14px;
  overflow-wrap:anywhere;
}

.status.success { border-color:#237c5b; }
.status.error { border-color:#873c49; }
.status.warning { border-color:#8b6c31; }

.spinner {
  width:30px;
  height:30px;
  margin:0 auto 12px;
  border:3px solid #34445b;
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

#captchaBox {
  display:none;
  margin:18px auto;
  min-height:65px;
  width:100%;
  overflow:hidden;
}

#captchaBox iframe {
  max-width:100%;
}

button {
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:12px;
  background:#347fda;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  font-family:inherit;
}

button:disabled {
  opacity:.45;
  cursor:not-allowed;
}

.footer {
  margin-top:22px;
  color:#748197;
  font-size:11px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>

<body>

    يجري التحقق من الهوية والجلسة وحالة الحساب قبل السماح بالوصول.
  </div>

  <div id="status" class="status">
    <div class="spinner"></div>
    جارٍ تهيئة نظام الحماية...
  </div>

  <div id="captchaBox"></div>

  <button id="retry" type="button" hidden disabled>
    إعادة المحاولة
  </button>

  </div>

</main>

<script>
"use strict";

/* =====================================================
   AQX IDENTITY — CENTRAL SECURITY GATE
===================================================== */

const CONFIG = Object.freeze({

  SUPABASE_URL:
    "https://fkiokwwztbyztleeuwks.supabase.co",

  SUPABASE_PUBLIC_KEY:
    "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_",

  IDENTITY:
    "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity",

  SOC:
    "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-soc",

  DASHBOARD:
    "https://id.alqurmanix.com/dashboard-aqx.html",

  ACCOUNT_STATUS:
    "https://id.alqurmanix.com/account-status.html",

  DENIED:
    "https://id.alqurmanix.com/security-denied.html",

  REQUEST_TIMEOUT:15000,

  CAPTCHA_TIMEOUT:180000,

  MAX_PROOF_LENGTH:4096

});

const $ = id => document.getElementById(id);

const statusBox = $("status");
const retryButton = $("retry");
const captchaBox = $("captchaBox");

let supabase = null;

let running = false;
let captchaWidgetId = null;
let captchaSiteKey = "";
let captchaScriptPromise = null;
let captchaWaiter = null;
let captchaToken = "";

/* =====================================================
   INITIALIZE SUPABASE
===================================================== */

try {

  if (!window.supabase?.createClient) {
    throw new Error("SUPABASE_CLIENT_UNAVAILABLE");
  }

  supabase = window.supabase.createClient(
    CONFIG.SUPABASE_URL,
    CONFIG.SUPABASE_PUBLIC_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:false,
        flowType:"pkce"
      }
    }
  );

} catch(error) {

  console.error("AQX INIT:",error);

}

/* =====================================================
   HELPERS
===================================================== */

function safeText(value,max = 300) {

  return typeof value === "string"
    ? value.slice(0,max)
    : "";

}

function showStatus(message,type = "normal",loading = false) {

  statusBox.className = "status";

  if (type !== "normal") {
    statusBox.classList.add(type);
  }

  statusBox.replaceChildren();

  if (loading) {

    const spinner = document.createElement("div");
    spinner.className = "spinner";
    statusBox.appendChild(spinner);

  }

  const text = document.createElement("div");
  text.textContent = message;
  statusBox.appendChild(text);

}

function fail(message) {

  running = false;

  showStatus(message,"error");

  retryButton.hidden = false;
  retryButton.disabled = false;

}

function goTo(url) {

  window.location.replace(url);

}

function safeSessionJSON(key) {

  try {

    const value = sessionStorage.getItem(key);

    return value ? JSON.parse(value) : null;

  } catch {

    return null;

  }

}

/* =====================================================
   ACCOUNT STATUS REDIRECT
===================================================== */

function goToAccountStatus(data = {}) {

  const url = new URL(CONFIG.ACCOUNT_STATUS);

  const status = safeText(data.account_status,60);

  if (status) {
    url.searchParams.set("status",status);
  }

  const restriction =
    data.restriction ||
    safeSessionJSON("aqx_restriction_data");

  if (
    restriction &&
    typeof restriction === "object"
  ) {

    const type = safeText(
      restriction.type || restriction.status || "",
      80
    );

    const message = safeText(
      restriction.message || restriction.reason || "",
      300
    );

    if (type) {
      url.searchParams.set("restriction",type);
    }

    if (message) {
      url.searchParams.set("message",message);
    }

  }

  if (data.session_expires_at) {

    url.searchParams.set(
      "expires_at",
      safeText(data.session_expires_at,80)
    );

  }

  goTo(url.toString());

}

function goToDenied(reason) {

  const url = new URL(CONFIG.DENIED);

  url.searchParams.set(
    "reason",
    safeText(reason,100)
  );

  goTo(url.toString());

}

/* =====================================================
   API ENGINE
===================================================== */

async function api(url,options = {}) {

  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    CONFIG.REQUEST_TIMEOUT
  );

  try {

    const response = await fetch(url,{

      ...options,

      signal:controller.signal,

      cache:"no-store",

      credentials:"omit"

    });

    const raw = await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("INVALID_SERVER_RESPONSE");
    }

    if (!data || typeof data !== "object") {
      throw new Error("INVALID_SERVER_RESPONSE");
    }

    return {
      ok:response.ok,
      status:response.status,
      data
    };

  } catch(error) {

    if (error.name === "AbortError") {
      throw new Error("REQUEST_TIMEOUT");
    }

    throw error;

  } finally {

    clearTimeout(timer);

  }

}

function identityHeaders(accessToken,extra = {}) {

  return {

    "Authorization":"Bearer " + accessToken,

    "apikey":CONFIG.SUPABASE_PUBLIC_KEY,

    "Content-Type":"application/json",

    ...extra

  };

}

/* =====================================================
   SUPABASE AUTH
===================================================== */

async function getAuthSession() {

  if (!supabase) {
    throw new Error("SUPABASE_CLIENT_UNAVAILABLE");
  }

  const result = await supabase.auth.getSession();

  if (result.error) {
    throw new Error("SUPABASE_SESSION_READ_FAILED");
  }

  const session = result.data?.session;

  if (
    !session?.access_token ||
    !session?.user?.id
  ) {
    throw new Error("AUTH_SESSION_MISSING");
  }

  return session;

}

/* =====================================================
   REGISTRATION STATUS
===================================================== */

async function getRegistrationStatus() {

  const result = await api(
    CONFIG.IDENTITY + "/v1/registration/status",
    {
      method:"GET",
      headers:{
        "apikey":CONFIG.SUPABASE_PUBLIC_KEY
      }
    }
  );

  if (
    !result.ok ||
    result.data.success !== true
  ) {

    throw new Error(
      result.data.error ||
      "REGISTRATION_STATUS_UNAVAILABLE"
    );

  }

  return result.data;

}

/* =====================================================
   TURNSTILE SCRIPT
===================================================== */

function loadTurnstile() {

  if (window.turnstile) {
    return Promise.resolve();
  }

  if (captchaScriptPromise) {
    return captchaScriptPromise;
  }

  captchaScriptPromise = new Promise((resolve,reject) => {

    const script = document.createElement("script");

    script.src =
      "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";

    script.async = true;
    script.defer = true;

    script.onload = () => {

      if (window.turnstile) {
        resolve();
      } else {
        captchaScriptPromise = null;
        reject(new Error("TURNSTILE_LOAD_FAILED"));
      }

    };

    script.onerror = () => {

      captchaScriptPromise = null;

      reject(new Error("TURNSTILE_LOAD_FAILED"));

    };

    document.head.appendChild(script);

  });

  return captchaScriptPromise;

}

/* =====================================================
   CAPTCHA WAIT CONTROL
===================================================== */

function settleCaptcha(error,token) {

  const waiter = captchaWaiter;

  if (!waiter) return;

  captchaWaiter = null;

  clearTimeout(waiter.timeout);

  if (error) {

    captchaToken = "";

    waiter.reject(error);

    return;

  }

  captchaToken = token;

  waiter.resolve(token);

}

function resetCaptcha() {

  captchaToken = "";

  if (
    captchaWidgetId !== null &&
    window.turnstile
  ) {

    try {
      window.turnstile.reset(captchaWidgetId);
    } catch(error) {
      console.error("AQX CAPTCHA RESET:",error);
    }

  }

}

/* =====================================================
   PREPARE CAPTCHA
===================================================== */

async function prepareCaptcha(registrationStatus) {

  const captcha = registrationStatus?.captcha || {};

  if (captcha.enabled !== true) {
    throw new Error("CAPTCHA_NOT_CONFIGURED");
  }

  const siteKey = safeText(captcha.site_key,200);

  if (!siteKey) {
    throw new Error("CAPTCHA_SITE_KEY_MISSING");
  }

  await loadTurnstile();

  captchaBox.style.display = "block";

  if (
    captchaWidgetId !== null &&
    captchaSiteKey !== siteKey
  ) {

    try {
      window.turnstile.remove(captchaWidgetId);
    } catch(error) {
      console.error(error);
    }

    captchaWidgetId = null;
    captchaBox.replaceChildren();

  }

  captchaSiteKey = siteKey;
  captchaToken = "";

  if (captchaWaiter) {
    settleCaptcha(new Error("CAPTCHA_RESTARTED"));
  }

  showStatus(
    "أكمل اختبار الحماية للمتابعة.",
    "warning"
  );

  return new Promise((resolve,reject) => {

    const timeout = setTimeout(() => {

      settleCaptcha(
        new Error("CAPTCHA_TIMEOUT")
      );

    },CONFIG.CAPTCHA_TIMEOUT);

    captchaWaiter = {
      resolve,
      reject,
      timeout
    };

    const options = {

      sitekey:captchaSiteKey,

      callback:token => {

        if (
          typeof token !== "string" ||
          token.length < 10
        ) {

          settleCaptcha(
            new Error("CAPTCHA_VERIFICATION_FAILED")
          );

          return;

        }

        settleCaptcha(null,token);

      },

      "expired-callback":() => {

        settleCaptcha(
          new Error("CAPTCHA_TOKEN_EXPIRED")
        );

      },

      "error-callback":() => {

        settleCaptcha(
          new Error("CAPTCHA_VERIFICATION_FAILED")
        );

      },

      theme:"dark",
      language:"ar"

    };

    try {

      if (captchaWidgetId === null) {

        captchaWidgetId = window.turnstile.render(
          captchaBox,
          options
        );

      } else {

        window.turnstile.reset(captchaWidgetId);

      }

    } catch(error) {

      settleCaptcha(
        new Error("CAPTCHA_VERIFICATION_FAILED")
      );

    }

  });

}

/* =====================================================
   RESTRICTED TEMPORARY SESSION
===================================================== */

async function checkRestrictedSession(authSession) {

  const restrictedToken =
    sessionStorage.getItem(
      "aqx_restricted_session_token"
    );

  if (!restrictedToken) {
    return false;
  }

  showStatus(
    "جارٍ التحقق من صلاحية الجلسة المؤقتة...",
    "normal",
    true
  );

  const result = await api(
    CONFIG.IDENTITY + "/v1/restricted-session/check",
    {

      method:"POST",

      headers:identityHeaders(
        authSession.access_token,
        {
          "x-aqx-restricted-session":restrictedToken
        }
      ),

      body:JSON.stringify({})

    }
  );

  if (
    !result.ok ||
    result.data.valid !== true ||
    result.data.restricted !== true
  ) {

    sessionStorage.removeItem(
      "aqx_restricted_session_token"
    );

    sessionStorage.removeItem(
      "aqx_restriction_data"
    );

    throw new Error(
      result.data.error ||
      "RESTRICTED_SESSION_INVALID"
    );

  }

  const restrictionData = {
    ...result.data,
    restriction:
      result.data.restriction ||
      safeSessionJSON("aqx_restriction_data")
  };

  goToAccountStatus(restrictionData);

  return true;

}

/* =====================================================
   AQX SESSION CHECK
===================================================== */

async function checkAqxSession(authSession) {

  const aqxToken =
    localStorage.getItem("aqx_session_token");

  if (
    !aqxToken ||
    aqxToken.length < 30
  ) {
    throw new Error("AQX_SESSION_MISSING");
  }

  showStatus(
    "جارٍ التحقق من جلسة AQX...",
    "normal",
    true
  );

  const result = await api(
    CONFIG.IDENTITY + "/v1/session/check",
    {

      method:"POST",

      headers:identityHeaders(
        authSession.access_token,
        {
          "x-aqx-session":aqxToken
        }
      ),

      body:JSON.stringify({})

    }
  );

  if (
    !result.ok ||
    result.data.valid !== true
  ) {

    throw new Error(
      result.data.error ||
      "AQX_SESSION_INVALID"
    );

  }

  return aqxToken;

}

/* =====================================================
   LOGIN PROOF NORMALIZATION
   يقبل النص المباشر أو JSON أو object
===================================================== */

function getLoginProofToken() {

  const stored =
    sessionStorage.getItem("aqx_login_proof");

  if (!stored) {
    throw new Error("LOGIN_PROOF_MISSING");
  }

  let proof = stored;

  try {
    proof = JSON.parse(stored);
  } catch {
    // التخزين كنص مباشر مقبول.
  }

  let token = "";

  if (typeof proof === "string") {

    token = proof;

  } else if (
    proof &&
    typeof proof === "object"
  ) {

    token =
      proof.token ||
      proof.proof_token ||
      "";

    if (
      proof.purpose &&
      proof.purpose !== "dashboard_access"
    ) {
      throw new Error("LOGIN_PROOF_PURPOSE_INVALID");
    }

  }

  if (typeof token !== "string") {
    throw new Error("LOGIN_PROOF_INVALID");
  }

  token = token.trim();

  if (
    token.length < 30 ||
    token.length > CONFIG.MAX_PROOF_LENGTH
  ) {
    throw new Error("LOGIN_PROOF_INVALID");
  }

  return token;

}

/* =====================================================
   CONSUME LOGIN PROOF
===================================================== */

async function consumeLoginProof(
  authSession,
  aqxToken,
  registrationStatus
) {

  const proofToken = getLoginProofToken();

  showStatus(
    "يرجى إكمال اختبار الحماية...",
    "normal"
  );

  // رمز CAPTCHA جديد لكل محاولة.
  const token = await prepareCaptcha(registrationStatus);

  if (!token) {
    throw new Error("CAPTCHA_VERIFICATION_FAILED");
  }

  showStatus(
    "جارٍ اعتماد إثبات الدخول...",
    "normal",
    true
  );

  const result = await api(
    CONFIG.IDENTITY + "/v1/security/login-proof/consume",
    {

      method:"POST",

      headers:identityHeaders(
        authSession.access_token,
        {
          "x-aqx-session":aqxToken
        }
      ),

      body:JSON.stringify({
        proof_token:proofToken,
        captcha_token:token
      })

    }
  );

  if (
    !result.ok ||
    result.data.success !== true ||
    result.data.valid !== true ||
    result.data.purpose !== "dashboard_access"
  ) {

    const code =
      safeText(result.data.error,100) ||
      "LOGIN_PROOF_REJECTED";

    captchaToken = "";

    if (
      code === "CAPTCHA_REQUIRED_OR_INVALID" ||
      code === "CAPTCHA_TOKEN_EXPIRED"
    ) {
      resetCaptcha();
    }

    throw new Error(code);

  }

  // لا نحذف إثبات الدخول إلا بعد نجاح الاستهلاك من الخادم.
  sessionStorage.removeItem("aqx_login_proof");

  captchaToken = "";

  return true;

}

/* =====================================================
   AQX SOC CENTRAL SECURITY CHECK
===================================================== */

async function runCentralSecurityCheck(
  authSession,
  aqxToken
) {

  showStatus(
    "جارٍ تنفيذ الفحص الأمني المركزي...",
    "normal",
    true
  );

  const telemetry = {

    page:location.pathname,

    referrer:document.referrer || null,

    language:navigator.language || null,

    platform:navigator.platform || null,

    timezone:
      Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone || null,

    screen:{
      width:screen.width,
      height:screen.height
    },

    viewport:{
      width:innerWidth,
      height:innerHeight
    },

    timestamp:new Date().toISOString()

  };

  const result = await api(
    CONFIG.SOC + "/v1/check",
    {

      method:"POST",

      headers:{
        "Authorization":"Bearer " + authSession.access_token,
        "apikey":CONFIG.SUPABASE_PUBLIC_KEY,
        "Content-Type":"application/json",
        "x-aqx-session":aqxToken
      },

      body:JSON.stringify({
        action:"dashboard_access",
        client_telemetry:telemetry
      })

    }
  );

  const data = result.data;

  if (
    result.ok &&
    data.success === true &&
    data.decision === "allow" &&
    data.verified === true &&
    data.next_action === "continue"
  ) {
    return data;
  }

  if (
    ["frozen","review","banned"].includes(
      data.account_status
    )
  ) {
    goToAccountStatus(data);
    return null;
  }

  if (
    [
      "ACCOUNT_FROZEN",
      "ACCOUNT_UNDER_SECURITY_REVIEW",
      "ACCOUNT_PERMANENTLY_BANNED"
    ].includes(data.error)
  ) {
    goToAccountStatus(data);
    return null;
  }

  throw new Error(
    data.error ||
    "CENTRAL_SECURITY_CHECK_DENIED"
  );

}

/* =====================================================
   REDIRECT TICKET
===================================================== */

async function consumeRedirectTicket() {

  const ticket =
    sessionStorage.getItem("aqx_redirect_ticket") ||
    localStorage.getItem("aqx_redirect_ticket");

  if (!ticket) {
    return false;
  }

  const result = await api(
    CONFIG.IDENTITY + "/v1/redirect/consume",
    {

      method:"POST",

      headers:{
        "apikey":CONFIG.SUPABASE_PUBLIC_KEY,
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        redirect_ticket:ticket
      })

    }
  );

  // التذكرة أحادية الاستخدام.
  sessionStorage.removeItem("aqx_redirect_ticket");
  localStorage.removeItem("aqx_redirect_ticket");

  if (
    !result.ok ||
    result.data.success !== true ||
    typeof result.data.redirect_uri !== "string"
  ) {

    throw new Error(
      result.data.error ||
      "REDIRECT_TICKET_INVALID"
    );

  }

  let target;

  try {
    target = new URL(result.data.redirect_uri);
  } catch {
    throw new Error("REDIRECT_TICKET_INVALID");
  }

  if (target.protocol !== "https:") {
    throw new Error("REDIRECT_PROTOCOL_NOT_ALLOWED");
  }

  const host = target.hostname.toLowerCase();

  if (
    host !== "alqurmanix.com" &&
    !host.endsWith(".alqurmanix.com")
  ) {
    throw new Error("REDIRECT_HOST_NOT_ALLOWED");
  }

  goTo(target.toString());

  return true;

}

/* =====================================================
   ERROR MESSAGES
===================================================== */

const ERROR_MESSAGES = {

  SUPABASE_CLIENT_UNAVAILABLE:
    "تعذر تحميل مكتبة الهوية.",

  AUTH_SESSION_MISSING:
    "جلسة الهوية غير موجودة. أعد تسجيل الدخول.",

  SUPABASE_SESSION_READ_FAILED:
    "تعذرت قراءة جلسة الهوية.",

  AQX_SESSION_MISSING:
    "جلسة AQX غير موجودة. أعد تسجيل الدخول.",

  AQX_SESSION_INVALID:
    "جلسة AQX غير صالحة أو انتهت صلاحيتها.",

  LOGIN_PROOF_MISSING:
    "إثبات الدخول غير موجود. أعد تسجيل الدخول.",

  LOGIN_PROOF_INVALID:
    "بيانات إثبات الدخول المخزنة غير صالحة.",

  LOGIN_PROOF_REJECTED:

/* =====================================================
   MAIN SECURITY GATE
===================================================== */

async function startSecurityGate() {

  if (running) return;

  running = true;

  retryButton.hidden = true;
  retryButton.disabled = true;

  captchaToken = "";
  captchaBox.style.display = "none";

  try {

    showStatus(
      "جارٍ تحميل بيانات الهوية...",
      "normal",
      true
    );

    // 1. Supabase authentication.
    const authSession = await getAuthSession();

    // 2. Restricted temporary session.
    const restricted =
      await checkRestrictedSession(authSession);

    if (restricted) return;

    // 3. Registration and CAPTCHA configuration.
    const registrationStatus =
      await getRegistrationStatus();

    // 4. AQX session.
    const aqxToken =
      await checkAqxSession(authSession);

    // 5. Single-use proof and CAPTCHA.
    await consumeLoginProof(
      authSession,
      aqxToken,
      registrationStatus
    );

    // 6. Central security check.
    const securityResult =
      await runCentralSecurityCheck(
        authSession,
        aqxToken
      );

    if (!securityResult) return;

    // 7. Redirect ticket.
    const redirected =
      await consumeRedirectTicket();

    if (redirected) return;

    // 8. Success.
    showStatus(
      "اكتمل الفحص الأمني بنجاح. جارٍ فتح لوحة التحكم...",
      "success",
      true
    );

    setTimeout(() => {
      goTo(CONFIG.DASHBOARD);
    },700);

  } catch(error) {

    console.error("AQX SECURITY GATE:",error);

    const code =
      error instanceof Error
        ? error.message
        : "SECURITY_CHECK_FAILED";

    const message =
      ERROR_MESSAGES[code] ||
      "تعذر إكمال الفحص الأمني. رمز الخطأ: " +
      safeText(code,100);

    fail(message);

  }

}

/* =====================================================
   RETRY
===================================================== */

retryButton.addEventListener("click",() => {

  if (running) return;

  captchaToken = "";

  retryButton.disabled = true;

  startSecurityGate();

});

/* =====================================================
   INITIALIZATION
===================================================== */

if (!supabase) {

  fail(
    ERROR_MESSAGES.SUPABASE_CLIENT_UNAVAILABLE
  );

} else {

  startSecurityGate();

}
