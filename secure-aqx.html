<script>
"use strict";

/* =====================================================
   1. إعدادات النظام
===================================================== */

const CONFIG = Object.freeze({
  SUPABASE_URL:
    "https://fkiokwwztbyztleeuwks.supabase.co",

  SUPABASE_KEY:
    "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_",

  IDENTITY:
    "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity",

  SOC:
    "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-soc",

  TURNSTILE_SITE_KEY:
    "0x4AAAAAAF3T0LhduY-AjZNc",

  LOGIN_URL:
    "https://id.alqurmanix.com/login.html",

  STATUS_URL:
    "https://id.alqurmanix.com/account-status.html",

  DASHBOARD_URL:
    "https://id.alqurmanix.com/dashboard-aqx.html",

  CAPTCHA_TIMEOUT: 120000
});

const STORAGE = Object.freeze({
  SESSION: "aqx_session_token",
  SESSION_ID: "aqx_session_id",
  RESTRICTED: "aqx_restricted_session_token",
  RESTRICTED_ID: "aqx_restricted_session_id",
  PROOF: "aqx_login_proof",
  TICKET: "aqx_redirect_ticket"
});

const supabase = window.supabase.createClient(
  CONFIG.SUPABASE_URL,
  CONFIG.SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const statusBox = document.getElementById("status");
const captchaBox = document.getElementById("captcha");
const continueBtn = document.getElementById("continueBtn");

let accessToken = null;
let sessionToken = null;
let proofToken = null;
let redirectTicket = null;
let captchaToken = null;
let captchaWidgetId = null;
let captchaReady = false;
let busy = false;
let proofConsumed = false;
let currentStage = "initialization";

/* =====================================================
   2. أدوات مساعدة
===================================================== */

function setStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = type;
}

function showCaptcha() {
  captchaBox.classList.remove("hidden");
}

function hideCaptcha() {
  captchaBox.classList.add("hidden");
}

function showButton() {
  continueBtn.classList.remove("hidden");
}

function hideButton() {
  continueBtn.classList.add("hidden");
}

function readStorage(key) {
  try {
    return sessionStorage.getItem(key);
  } catch {
    return null;
  }
}

function writeStorage(key, value) {
  try {
    sessionStorage.setItem(key, value);
  } catch {
    throw new Error("SESSION_STORAGE_UNAVAILABLE");
  }
}

function removeStorage(key) {
  try {
    sessionStorage.removeItem(key);
  } catch {}
}

function clearNormalSession() {
  removeStorage(STORAGE.SESSION);
  removeStorage(STORAGE.SESSION_ID);
  removeStorage(STORAGE.PROOF);
  removeStorage(STORAGE.TICKET);
}

function clearRestrictedSession() {
  removeStorage(STORAGE.RESTRICTED);
  removeStorage(STORAGE.RESTRICTED_ID);
}

function redirectToLogin() {
  const url = new URL(CONFIG.LOGIN_URL);

  url.searchParams.set(
    "return_to",
    window.location.href
  );

  window.location.replace(url.toString());
}

function redirectToAccountStatus() {
  window.location.replace(CONFIG.STATUS_URL);
}

function normalizeError(error) {
  const errors = {
    SESSION_REQUIRED: "لا توجد جلسة صالحة.",
    INVALID_SESSION: "جلسة الهوية غير صالحة.",
    LOGIN_PROOF_REQUIRED: "إثبات الدخول غير موجود.",
    LOGIN_PROOF_INVALID_OR_EXPIRED:
      "انتهت صلاحية إثبات الدخول. سجّل الدخول مرة أخرى.",

    CAPTCHA_REQUIRED_OR_INVALID:
      "فشل اختبار الحماية. أعد المحاولة.",

    CAPTCHA_NOT_CONFIGURED:
      "خدمة اختبار الحماية غير مهيأة على الخادم.",

    ACCOUNT_FROZEN:
      "الحساب موقوف مؤقتًا.",

    ACCOUNT_UNDER_SECURITY_REVIEW:
      "الحساب قيد المراجعة الأمنية.",

    ACCOUNT_PERMANENTLY_BANNED:
      "الحساب محظور نهائيًا.",

    ACCOUNT_SECURITY_RESTRICTED:
      "الحساب مقيّد أمنيًا.",

    ACCOUNT_SELF_DISABLED:
      "الحساب معطّل بناءً على طلب صاحبه.",

    ACCOUNT_ADMIN_DISABLED:
      "الحساب معطّل إداريًا.",

    SECURITY_CHECK_UNAVAILABLE:
      "تعذر إكمال الفحص الأمني. تم إيقاف العملية احتياطيًا.",

    REDIRECT_TICKET_EXPIRED_OR_USED:
      "تذكرة التحويل انتهت أو سبق استخدامها.",

    REDIRECT_TICKET_INVALID:
      "تذكرة التحويل غير صالحة.",

    REDIRECT_TICKET_REDEEM_FAILED:
      "تعذر إتمام التحويل إلى الخدمة."
  };

  return errors[error] || "تعذر إتمام العملية. يرجى تسجيل الدخول مجددًا.";
}

async function readJson(response) {
  return await response.json().catch(() => ({}));
}

async function identityRequest(path, options = {}) {
  const headers = {
    "apikey": CONFIG.SUPABASE_KEY,
    "Authorization": "Bearer " + accessToken,
    ...options.headers
  };

  const response = await fetch(CONFIG.IDENTITY + path, {
    method: options.method || "POST",
    headers,
    body: options.body === undefined
      ? "{}"
      : JSON.stringify(options.body),
    cache: "no-store",
    credentials: "omit"
  });

  const data = await readJson(response);

  return { response, data };
}

async function socRequest(path, body) {
  const response = await fetch(CONFIG.SOC + path, {
    method: "POST",
    headers: {
      "apikey": CONFIG.SUPABASE_KEY,
      "Authorization": "Bearer " + accessToken,
      "Content-Type": "application/json",
      "x-aqx-session": sessionToken
    },
    body: JSON.stringify(body),
    cache: "no-store",
    credentials: "omit"
  });

  const data = await readJson(response);

  return { response, data };
}

/* =====================================================
   3. جمع بيانات الجهاز المعلنة من المتصفح
===================================================== */

function getClientTelemetry() {
  const nav = navigator;
  const screenInfo = window.screen || {};
  const connection =
    nav.connection ||
    nav.mozConnection ||
    nav.webkitConnection ||
    {};

  let storageEstimate = {};

  const orientation =
    screenInfo.orientation?.type || "unknown";

  const data = {
    telemetry_version: "1.0",
    collected_at: new Date().toISOString(),

    timezone:
      Intl.DateTimeFormat().resolvedOptions().timeZone || null,

    timezone_offset_minutes:
      new Date().getTimezoneOffset(),

    locale: nav.language || null,
    languages: Array.from(nav.languages || []).slice(0, 8),

    platform: nav.platform || null,
    vendor: nav.vendor || null,
    user_agent: nav.userAgent || null,

    ua_mobile:
      /android|iphone|ipad|mobile/i.test(nav.userAgent || ""),

    screen_width: screenInfo.width || null,
    screen_height: screenInfo.height || null,

    screen_avail_width: screenInfo.availWidth || null,
    screen_avail_height: screenInfo.availHeight || null,

    viewport_width: window.innerWidth || null,
    viewport_height: window.innerHeight || null,

    pixel_ratio: window.devicePixelRatio || null,
    color_depth: screenInfo.colorDepth || null,
    orientation,

    touch_points: nav.maxTouchPoints || 0,
    hardware_concurrency: nav.hardwareConcurrency || null,
    device_memory_gb: nav.deviceMemory || null,

    connection_type: connection.type || null,
    connection_effective_type: connection.effectiveType || null,
    connection_downlink_mbps: connection.downlink || null,
    connection_rtt_ms: connection.rtt || null,
    connection_save_data: connection.saveData === true,

    online: nav.onLine,
    cookie_enabled: nav.cookieEnabled,
    do_not_track: nav.doNotTrack || null,

    webdriver: nav.webdriver === true,
    pdf_viewer_enabled: nav.pdfViewerEnabled === true,

    color_scheme:
      matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light",

    reduced_motion:
      matchMedia("(prefers-reduced-motion: reduce)").matches
        ? "reduce" : "no-preference"
  };

  if (nav.userAgentData) {
    data.ua_mobile = nav.userAgentData.mobile === true;
    data.ua_platform = nav.userAgentData.platform || null;

    data.ua_brands =
      (nav.userAgentData.brands || []).slice(0, 8);
  }

  if (navigator.storage?.estimate) {
    navigator.storage.estimate()
      .then(result => {
        storageEstimate = result;
        data.storage_quota_bytes =
          storageEstimate.quota || null;

        data.storage_usage_bytes =
          storageEstimate.usage || null;
      })
      .catch(() => {});
  }

  return data;
}

/* =====================================================
   4. الحصول على جلسة Supabase المصادق عليها
===================================================== */

async function getAuthenticatedSession() {
  const result = await supabase.auth.getSession();

  if (result.error) {
    throw new Error("AUTH_SESSION_READ_FAILED");
  }

  const session = result.data?.session;

  if (!session?.access_token || !session?.user?.id) {
    throw new Error("INVALID_SESSION");
  }

  accessToken = session.access_token;

  return session;
}

/* =====================================================
   5. فحص الجلسة المؤقتة للحساب المقيّد
===================================================== */

async function checkRestrictedSession() {
  const restrictedToken = readStorage(STORAGE.RESTRICTED);

  if (!restrictedToken) {
    return false;
  }

  const result = await identityRequest(
    "/v1/restricted-session/check",
    {
      headers: {
        "x-aqx-restricted-session": restrictedToken
      }
    }
  );

  if (
    result.response.ok &&
    result.data.valid === true
  ) {
    if (result.data.restricted === true) {
      writeStorage(
        "aqx_restriction_details",
        JSON.stringify(result.data)
      );

      redirectToAccountStatus();
      return true;
    }

    redirectToAccountStatus();
    return true;
  }

  clearRestrictedSession();

  return false;
}

/* =====================================================
   6. فحص الجلسة العادية
===================================================== */

async function checkNormalSession() {
  sessionToken = readStorage(STORAGE.SESSION);
  proofToken = readStorage(STORAGE.PROOF);
  redirectTicket = readStorage(STORAGE.TICKET);

  if (
    !sessionToken ||
    sessionToken.length < 30 ||
    sessionToken.length > 100
  ) {
    throw new Error("SESSION_REQUIRED");
  }

  if (
    !proofToken ||
    proofToken.length < 30 ||
    proofToken.length > 100
  ) {
    throw new Error("LOGIN_PROOF_REQUIRED");
  }

  const result = await identityRequest(
    "/v1/session/check",
    {
      headers: {
        "x-aqx-session": sessionToken
      }
    }
  );

  if (
    !result.response.ok ||
    result.data.valid !== true
  ) {
    throw new Error(
      result.data.error || "INVALID_SESSION"
    );
  }

  return true;
}

/* =====================================================
   7. تهيئة Cloudflare Turnstile
===================================================== */

function waitForTurnstile() {
  return new Promise((resolve, reject) => {
    const started = Date.now();

    const timer = setInterval(() => {
      if (window.turnstile?.render) {
        clearInterval(timer);
        resolve(true);
        return;
      }

      if (
        Date.now() - started >
        CONFIG.CAPTCHA_TIMEOUT
      ) {
        clearInterval(timer);
        reject(new Error("CAPTCHA_LOAD_FAILED"));
      }
    }, 250);
  });
}

async function initializeCaptcha() {
  await waitForTurnstile();

  showCaptcha();

  captchaWidgetId = window.turnstile.render(
    captchaBox,
    {
      sitekey: CONFIG.TURNSTILE_SITE_KEY,
      theme: "dark",
      language: "ar",

      callback: token => {
        captchaToken = token;
        captchaReady = true;

        continueBtn.disabled = false;

        setStatus(
          "تم اجتياز اختبار الحماية. يمكنك متابعة الفحص.",
          "success"
        );
      },

      "expired-callback": () => {
        captchaToken = null;
        captchaReady = false;
        continueBtn.disabled = true;

        setStatus(
          "انتهت صلاحية اختبار الحماية. أعد الاختبار.",
          "error"
        );
      },

      "error-callback": () => {
        captchaToken = null;
        captchaReady = false;
        continueBtn.disabled = true;

        setStatus(
          "تعذر تحميل اختبار الحماية. تحقق من الاتصال.",
          "error"
        );
      }
    }
  );

  return true;
}

/* =====================================================
   8. استهلاك إثبات الدخول مرة واحدة
===================================================== */

async function consumeLoginProof() {
  if (proofConsumed) {
    throw new Error("LOGIN_PROOF_ALREADY_CONSUMED");
  }

  if (!captchaToken) {
    throw new Error("CAPTCHA_REQUIRED_OR_INVALID");
  }

  const result = await identityRequest(
    "/v1/security/login-proof/consume",
    {
      headers: {
        "x-aqx-session": sessionToken
      },

      body: {
        proof_token: proofToken,
        captcha_token: captchaToken
      }
    }
  );

  if (
    !result.response.ok ||
    result.data.success !== true ||
    result.data.valid !== true ||
    result.data.purpose !== "dashboard_access"
  ) {
    throw new Error(
      result.data.error || "LOGIN_PROOF_INVALID_OR_EXPIRED"
    );
  }

  proofConsumed = true;

  removeStorage(STORAGE.PROOF);

  return true;
}

/* =====================================================
   9. الفحص الأمني المركزي AQX SOC v24
===================================================== */

async function runSOCCheck() {
  const result = await socRequest(
    "/v1/check",
    {
      action: "dashboard_access",
      client_telemetry: getClientTelemetry()
    }
  );

  if (
    result.response.status === 403 &&
    [
      "ACCOUNT_FROZEN",
      "ACCOUNT_UNDER_SECURITY_REVIEW",
      "ACCOUNT_PERMANENTLY_BANNED",
      "ACCOUNT_SECURITY_RESTRICTED",
      "ACCOUNT_SELF_DISABLED",
      "ACCOUNT_ADMIN_DISABLED"
    ].includes(result.data.error)
  ) {
    redirectToAccountStatus();
    return false;
  }

  if (
    !result.response.ok ||
    result.data.success !== true ||
    result.data.decision !== "allow" ||
    result.data.verified !== true
  ) {
    throw new Error(
      result.data.error || "SECURITY_CHECK_UNAVAILABLE"
    );
  }

  return true;
}

/* =====================================================
   10. استهلاك تذكرة التحويل وإنشاء جلسة الخدمة
===================================================== */

async function consumeRedirectTicket() {
  if (!redirectTicket) {
    window.location.replace(CONFIG.DASHBOARD_URL);
    return;
  }

  const result = await identityRequest(
    "/v1/redirect/consume",
    {
      body: {
        redirect_ticket: redirectTicket
      }
    }
  );

  if (
    !result.response.ok ||
    result.data.success !== true ||
    typeof result.data.redirect_uri !== "string" ||
    typeof result.data.service_session_token !== "string"
  ) {
    throw new Error(
      result.data.error || "REDIRECT_TICKET_REDEEM_FAILED"
    );
  }

  const target = new URL(result.data.redirect_uri);

  if (
    target.protocol !== "https:" ||
    !(
      target.hostname === "alqurmanix.com" ||
      target.hostname.endsWith(".alqurmanix.com")
    )
  ) {
    throw new Error("REDIRECT_ORIGIN_NOT_ALLOWED");
  }

  /*
    يتم تمرير رمز جلسة الخدمة في fragment،
    وليس في query string.
    على صفحة الخدمة التقاطه والتحقق منه
    عبر /v1/service/session/check.
  */

  const fragment = new URLSearchParams(
    target.hash.replace(/^#/, "")
  );

  fragment.set(
    "aqx_service_session",
    result.data.service_session_token
  );

  target.hash = fragment.toString();

  removeStorage(STORAGE.TICKET);

  window.location.replace(target.toString());
}

/* =====================================================
   11. تنفيذ مراحل الفحص بالترتيب
===================================================== */

async function executeSecurityPipeline() {
  if (busy) return;

  busy = true;
  continueBtn.disabled = true;
  hideButton();

  try {
    currentStage = "proof";

    setStatus(
      "جارٍ التحقق من إثبات الدخول واختبار الحماية..."
    );

    await consumeLoginProof();

    currentStage = "soc";

    setStatus(
      "تم التحقق من الهوية. جارٍ تنفيذ الفحص الأمني المركزي..."
    );

    const allowed = await runSOCCheck();

    if (!allowed) return;

    currentStage = "redirect";

    setStatus(
      "نجح الفحص الأمني. جارٍ تجهيز جلسة الخدمة والتحويل..."
    );

    await consumeRedirectTicket();

  } catch (error) {
    console.error("AQX security pipeline error:", error);

    const code =
      error instanceof Error
        ? error.message
        : "UNKNOWN_ERROR";

    /*
      إثبات الدخول أحادي الاستخدام.
      إذا استُهلك ثم فشلت مرحلة لاحقة،
      لا نعيد استخدامه.
    */

    if (proofConsumed) {
      clearNormalSession();

      setStatus(
        normalizeError(code) +
        " يجب تسجيل الدخول مرة أخرى لإصدار إثبات جديد.",
        "error"
      );

      continueBtn.textContent = "تسجيل الدخول مجددًا";
      continueBtn.disabled = false;
      continueBtn.classList.remove("hidden");

      continueBtn.onclick = () => redirectToLogin();

      return;
    }

    setStatus(normalizeError(code), "error");

    if (
      [
        "SESSION_REQUIRED",
        "INVALID_SESSION",
        "LOGIN_PROOF_REQUIRED",
        "AUTH_SESSION_READ_FAILED"
      ].includes(code)
    ) {
      clearNormalSession();

      continueBtn.textContent = "تسجيل الدخول";
      continueBtn.disabled = false;
      continueBtn.classList.remove("hidden");

      continueBtn.onclick = () => redirectToLogin();
    } else {
      captchaToken = null;
      captchaReady = false;

      if (window.turnstile && captchaWidgetId !== null) {
        try {
          window.turnstile.reset(captchaWidgetId);
        } catch {}
      }

      continueBtn.disabled = true;
      showButton();
    }

  } finally {
    busy = false;
  }
}

/* =====================================================
   12. بدء تشغيل الصفحة
===================================================== */

async function initialize() {
  try {
    currentStage = "initialization";

    setStatus("جارٍ الاتصال بخدمة الهوية...");

    await getAuthenticatedSession();

    /*
      نفحص الجلسة المؤقتة أولًا.
      الحساب المقيّد لا يدخل مسار الجلسة العادية.
    */

    setStatus("جارٍ التحقق من حالة الجلسة المؤقتة...");

    const restricted = await checkRestrictedSession();

    if (restricted) return;

    setStatus("جارٍ التحقق من الجلسة العادية...");

    await checkNormalSession();

    setStatus("الجلسة صالحة. جارٍ تحميل اختبار الحماية...");

    await initializeCaptcha();

    showButton();

    continueBtn.disabled = true;

    continueBtn.onclick = executeSecurityPipeline;

    setStatus(
      "تم التحقق من الجلسة. أكمل اختبار الحماية للمتابعة.",
      "success"
    );

  } catch (error) {
    console.error("AQX initialization error:", error);

    const code =
      error instanceof Error
        ? error.message
        : "UNKNOWN_ERROR";

    setStatus(normalizeError(code), "error");

    if (
      [
        "SESSION_REQUIRED",
        "INVALID_SESSION",
        "AUTH_SESSION_READ_FAILED",
        "LOGIN_PROOF_REQUIRED"
      ].includes(code)
    ) {
      clearNormalSession();

      continueBtn.textContent = "العودة لتسجيل الدخول";
      continueBtn.disabled = false;
      showButton();

      continueBtn.onclick = redirectToLogin;

      return;
    }

    continueBtn.textContent = "إعادة المحاولة";
    continueBtn.disabled = false;
    showButton();

    continueBtn.onclick = () => {
      window.location.reload();
    };
  }
}

/* =====================================================
   13. تشغيل النظام
===================================================== */

document.addEventListener("DOMContentLoaded", initialize);

</script>
