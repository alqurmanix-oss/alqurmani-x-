
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131b">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>الفحص الأمني | AQX Identity</title>

<style>
:root {
  color-scheme: dark;
  --bg:#10131b;
  --panel:#191f2b;
  --line:#30394a;
  --text:#f4f6fb;
  --muted:#aab4c5;
  --accent:#65a7ff;
  --success:#36c98b;
  --danger:#ff6b78;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(ellipse at top,#1c2b43 0%,transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}
.card {
  width:min(100%,470px);
  padding:30px 24px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(25,31,43,.96);
  box-shadow:0 25px 80px #0007;
  text-align:center;
}
.logo {
  width:66px;
  height:66px;
  display:grid;
  place-items:center;
  margin:0 auto 20px;
  border-radius:20px;
  background:#233c5d;
  color:#8fc2ff;
  font-size:27px;
  font-weight:bold;
}
h1 { margin:0 0 12px; font-size:23px; }
.description {
  color:var(--muted);
  font-size:14px;
  line-height:1.9;
}
.status {
  margin:24px 0 14px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#111722;
  line-height:1.9;
  font-size:14px;
}
.spinner {
  width:30px;
  height:30px;
  margin:0 auto 12px;
  border:3px solid #34445b;
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.status.success { border-color:#237c5b; }
.status.error { border-color:#873c49; }
.status.warning { border-color:#8b6c31; }
#captchaBox {
  display:none;
  margin:18px auto;
  min-height:65px;
}
button {
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:12px;
  background:#347fda;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled {
  opacity:.45;
  cursor:not-allowed;
}
.footer {
  margin-top:22px;
  color:#748197;
  font-size:11px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
</head>

<body>
<main class="card">
  <div class="logo">AQX</div>

  <h1>الفحص الأمني المركزي</h1>

  <div class="description">
    يجري التحقق من الهوية والجلسة وحالة الحساب قبل السماح بالوصول.
  </div>

  <div id="status" class="status">
    <div class="spinner"></div>
    جارٍ تهيئة نظام الحماية...
  </div>

  <div id="captchaBox"></div>

  <button id="retry" type="button" hidden>
    إعادة المحاولة
  </button>

  <div class="footer">
    AQX Identity · Central Security Verification
  </div>
</main>

<script>
"use strict";

/* =====================================================
   AQX SECURITY GATE
   لا تضع أي مفاتيح سرية داخل هذا الملف.
===================================================== */

const CONFIG = Object.freeze({
  SUPABASE_URL:
    "https://fkiokwwztbyztleeuwks.supabase.co",

  SUPABASE_PUBLIC_KEY:
    "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_",

  IDENTITY:
    "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity",

  SOC:
    "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-soc",

  DASHBOARD:
    "https://id.alqurmanix.com/dashboard-aqx.html",

  ACCOUNT_STATUS:
    "https://id.alqurmanix.com/account-status.html",

  DENIED:
    "https://id.alqurmanix.com/security-denied.html",

  REQUEST_TIMEOUT: 15000
});

const $ = id => document.getElementById(id);

const statusBox = $("status");
const retryButton = $("retry");
const captchaBox = $("captchaBox");

const supabase = window.supabase.createClient(
  CONFIG.SUPABASE_URL,
  CONFIG.SUPABASE_PUBLIC_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: false,
      flowType: "pkce"
    }
  }
);

let running = false;
let captchaWidgetId = null;
let captchaToken = "";
let captchaSiteKey = "";
let captchaScriptPromise = null;

/* =====================================================
   واجهة الحالة
===================================================== */

function showStatus(message, type = "normal", loading = false) {
  statusBox.className = "status";
  if (type !== "normal") statusBox.classList.add(type);

  statusBox.replaceChildren();

  if (loading) {
    const spinner = document.createElement("div");
    spinner.className = "spinner";
    statusBox.appendChild(spinner);
  }

  const text = document.createElement("div");
  text.textContent = message;
  statusBox.appendChild(text);
}

function fail(message) {
  running = false;
  showStatus(message, "error");
  retryButton.hidden = false;
}

function safeText(value, max = 300) {
  return typeof value === "string"
    ? value.slice(0, max)
    : "";
}

/* =====================================================
   طلبات API مع مهلة زمنية
===================================================== */

async function api(url, options = {}) {
  const controller = new AbortController();
  const timer = setTimeout(
    () => controller.abort(),
    CONFIG.REQUEST_TIMEOUT
  );

  try {
    const response = await fetch(url, {
      ...options,
      signal: controller.signal,
      cache: "no-store",
      credentials: "omit"
    });

    const data = await response.json().catch(() => null);

    if (!data || typeof data !== "object") {
      throw new Error("INVALID_SERVER_RESPONSE");
    }

    return {
      ok: response.ok,
      status: response.status,
      data
    };
  } finally {
    clearTimeout(timer);
  }
}

function identityHeaders(accessToken, extra = {}) {
  return {
    "Authorization": "Bearer " + accessToken,
    "apikey": CONFIG.SUPABASE_PUBLIC_KEY,
    "Content-Type": "application/json",
    ...extra
  };
}

/* =====================================================
   تحويلات آمنة
===================================================== */

function goTo(url) {
  window.location.replace(url);
}

function goToAccountStatus(data = {}) {
  const url = new URL(CONFIG.ACCOUNT_STATUS);

  const status = safeText(data.account_status, 60);
  const restriction = data.restriction;

  if (status) {
    url.searchParams.set("status", status);
  }

  if (restriction && typeof restriction === "object") {
    const type = safeText(
      restriction.type || restriction.status || "",
      80
    );

    const message = safeText(
      restriction.message || restriction.reason || "",
      300
    );

    if (type) url.searchParams.set("restriction", type);
    if (message) url.searchParams.set("message", message);
  }

  if (data.session_expires_at) {
    url.searchParams.set(
      "expires_at",
      safeText(data.session_expires_at, 80)
    );
  }

  goTo(url.toString());
}

function goToDenied(reason) {
  const url = new URL(CONFIG.DENIED);
  url.searchParams.set("reason", safeText(reason, 100));
  goTo(url.toString());
}

/* =====================================================
   قراءة جلسة Supabase
===================================================== */

async function getAuthSession() {
  const result = await supabase.auth.getSession();

  if (result.error) {
    throw new Error("SUPABASE_SESSION_READ_FAILED");
  }

  const session = result.data?.session;

  if (!session?.access_token || !session?.user?.id) {
    throw new Error("AUTH_SESSION_MISSING");
  }

  return session;
}

/* =====================================================
   حالة التسجيل وإعدادات CAPTCHA
===================================================== */

async function getRegistrationStatus() {
  const result = await api(
    CONFIG.IDENTITY + "/v1/registration/status",
    {
      method: "GET",
      headers: {
        "apikey": CONFIG.SUPABASE_PUBLIC_KEY
      }
    }
  );

  if (!result.ok || result.data.success !== true) {
    throw new Error("REGISTRATION_STATUS_UNAVAILABLE");
  }

  return result.data;
}

/* =====================================================
   Cloudflare Turnstile
===================================================== */

function loadTurnstile() {
  if (window.turnstile) {
    return Promise.resolve();
  }

  if (captchaScriptPromise) {
    return captchaScriptPromise;
  }

  captchaScriptPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");

    script.src =
      "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";

    script.async = true;
    script.defer = true;

    script.onload = () => {
      if (window.turnstile) resolve();
      else reject(new Error("TURNSTILE_LOAD_FAILED"));
    };

    script.onerror = () => {
      reject(new Error("TURNSTILE_LOAD_FAILED"));
    };

    document.head.appendChild(script);
  });

  return captchaScriptPromise;
}

async function prepareCaptcha(registrationStatus) {
  const captcha = registrationStatus?.captcha || {};

  if (captcha.enabled !== true) {
    throw new Error("CAPTCHA_SERVER_SECRET_NOT_CONFIGURED");
  }

  captchaSiteKey = safeText(captcha.site_key, 200);

  if (!captchaSiteKey) {
    throw new Error("CAPTCHA_SITE_KEY_MISSING");
  }

  captchaBox.style.display = "block";

  await loadTurnstile();

  return new Promise((resolve, reject) => {
    try {
      captchaWidgetId = window.turnstile.render(
        captchaBox,
        {
          sitekey: captchaSiteKey,

          callback: token => {
            captchaToken = token;
            resolve(token);
          },

          "expired-callback": () => {
            captchaToken = "";
            showStatus(
              "انتهت صلاحية اختبار الحماية. أكمله مرة أخرى.",
              "warning"
            );
          },

          "error-callback": () => {
            captchaToken = "";
            reject(new Error("CAPTCHA_VERIFICATION_FAILED"));
          },

          theme: "dark",
          language: "ar"
        }
      );
    } catch (error) {
      reject(error);
    }
  });
}

/* =====================================================
   فحص الجلسة المقيّدة المؤقتة
===================================================== */

async function checkRestrictedSession(authSession) {
  const restrictedToken =
    sessionStorage.getItem("aqx_restricted_session_token");

  if (!restrictedToken) return false;

  showStatus(
    "جارٍ التحقق من صلاحية الجلسة المؤقتة...",
    "normal",
    true
  );

  const result = await api(
    CONFIG.IDENTITY + "/v1/restricted-session/check",
    {
      method: "POST",

      headers: identityHeaders(
        authSession.access_token,
        {
          "x-aqx-restricted-session": restrictedToken
        }
      ),

      body: JSON.stringify({})
    }
  );

  if (
    !result.ok ||
    result.data.valid !== true ||
    result.data.restricted !== true
  ) {
    sessionStorage.removeItem(
      "aqx_restricted_session_token"
    );

    sessionStorage.removeItem(
      "aqx_restriction_data"
    );

    throw new Error(
      result.data.error || "RESTRICTED_SESSION_INVALID"
    );
  }

  const restrictionData = {
    ...result.data,
    restriction: result.data.restriction ||
      JSON.parse(
        sessionStorage.getItem("aqx_restriction_data") || "null"
      )
  };

  goToAccountStatus(restrictionData);
  return true;
}

/* =====================================================
   فحص جلسة AQX العادية
===================================================== */

async function checkAqxSession(authSession) {
  const aqxToken =
    localStorage.getItem("aqx_session_token");

  if (!aqxToken || aqxToken.length < 30) {
    throw new Error("AQX_SESSION_MISSING");
  }

  showStatus(
    "جارٍ التحقق من جلسة AQX...",
    "normal",
    true
  );

  const result = await api(
    CONFIG.IDENTITY + "/v1/session/check",
    {
      method: "POST",

      headers: identityHeaders(
        authSession.access_token,
        {
          "x-aqx-session": aqxToken
        }
      ),

      body: JSON.stringify({})
    }
  );

  if (!result.ok || result.data.valid !== true) {
    throw new Error(
      result.data.error || "AQX_SESSION_INVALID"
    );
  }

  return aqxToken;
}

/* =====================================================
   استهلاك إثبات تسجيل الدخول لمرة واحدة
===================================================== */

async function consumeLoginProof(
  authSession,
  aqxToken,
  registrationStatus
) {
  const proofData = sessionStorage.getItem(
    "aqx_login_proof"
  );

  if (!proofData) {
    throw new Error("LOGIN_PROOF_MISSING");
  }

  let proof;

  try {
    proof = JSON.parse(proofData);
  } catch {
    throw new Error("LOGIN_PROOF_INVALID");
  }

  const proofToken =
    typeof proof === "string"
      ? proof
      : proof?.token;

  if (
    typeof proofToken !== "string" ||
    proofToken.length < 30
  ) {
    throw new Error("LOGIN_PROOF_INVALID");
  }

  if (
    proof?.purpose &&
    proof.purpose !== "dashboard_access"
  ) {
    throw new Error("LOGIN_PROOF_PURPOSE_INVALID");
  }

  showStatus(
    "يرجى إكمال اختبار الحماية...",
    "normal"
  );

  const token = await prepareCaptcha(registrationStatus);

  showStatus(
    "جارٍ اعتماد إثبات الدخول...",
    "normal",
    true
  );

  const result = await api(
    CONFIG.IDENTITY + "/v1/security/login-proof/consume",
    {
      method: "POST",

      headers: identityHeaders(
        authSession.access_token,
        {
          "x-aqx-session": aqxToken
        }
      ),

      body: JSON.stringify({
        proof_token: proofToken,
        captcha_token: token
      })
    }
  );

  if (
    !result.ok ||
    result.data.success !== true ||
    result.data.valid !== true ||
    result.data.purpose !== "dashboard_access"
  ) {
    throw new Error(
      result.data.error || "LOGIN_PROOF_REJECTED"
    );
  }

  // إثبات الدخول أحادي الاستخدام.
  sessionStorage.removeItem("aqx_login_proof");

  return true;
}

/* =====================================================
   الفحص الأمني المركزي عبر AQX-SOC
===================================================== */

async function runCentralSecurityCheck(
  authSession,
  aqxToken
) {
  showStatus(
    "جارٍ تنفيذ الفحص الأمني المركزي...",
    "normal",
    true
  );

  const telemetry = {
    page: location.pathname,
    referrer: document.referrer || null,
    language: navigator.language || null,
    platform: navigator.platform || null,
    timezone:
      Intl.DateTimeFormat().resolvedOptions().timeZone || null,
    screen: {
      width: screen.width,
      height: screen.height
    },
    viewport: {
      width: innerWidth,
      height: innerHeight
    },
    timestamp: new Date().toISOString()
  };

  const result = await api(
    CONFIG.SOC + "/v1/check",
    {
      method: "POST",

      headers: {
        "Authorization":
          "Bearer " + authSession.access_token,

        "apikey": CONFIG.SUPABASE_PUBLIC_KEY,

        "Content-Type": "application/json",

        "x-aqx-session": aqxToken
      },

      body: JSON.stringify({
        action: "dashboard_access",
        client_telemetry: telemetry
      })
    }
  );

  const data = result.data;

  if (
    result.ok &&
    data.success === true &&
    data.decision === "allow" &&
    data.verified === true &&
    data.next_action === "continue"
  ) {
    return data;
  }

  if (
    data.account_status === "frozen" ||
    data.account_status === "review" ||
    data.account_status === "banned"
  ) {
    goToAccountStatus(data);
    return null;
  }

  if (
    data.error === "ACCOUNT_FROZEN" ||
    data.error === "ACCOUNT_UNDER_SECURITY_REVIEW" ||
    data.error === "ACCOUNT_PERMANENTLY_BANNED"
  ) {
    goToAccountStatus(data);
    return null;
  }

  throw new Error(
    data.error || "CENTRAL_SECURITY_CHECK_DENIED"
  );
}

/* =====================================================
   استهلاك تذكرة إعادة التوجيه
===================================================== */

async function consumeRedirectTicket(authSession) {
  const ticket =
    sessionStorage.getItem("aqx_redirect_ticket") ||
    localStorage.getItem("aqx_redirect_ticket");

  if (!ticket) return false;

  const result = await api(
    CONFIG.IDENTITY + "/v1/redirect/consume",
    {
      method: "POST",

      headers: {
        "apikey": CONFIG.SUPABASE_PUBLIC_KEY,
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        redirect_ticket: ticket
      })
    }
  );

  // التذكرة أحادية الاستخدام؛ لا نعيد استخدامها.
  sessionStorage.removeItem("aqx_redirect_ticket");
  localStorage.removeItem("aqx_redirect_ticket");

  if (
    !result.ok ||
    result.data.success !== true ||
    typeof result.data.redirect_uri !== "string"
  ) {
    throw new Error(
      result.data.error || "REDIRECT_TICKET_INVALID"
    );
  }

  const target = new URL(result.data.redirect_uri);

  // لا نسمح بالتحويل إلا إلى HTTPS.
  if (target.protocol !== "https:") {
    throw new Error("REDIRECT_PROTOCOL_NOT_ALLOWED");
  }

  // يجب أن تكون وجهة التحويل ضمن نطاقات AQX.
  const host = target.hostname.toLowerCase();

  if (
    host !== "alqurmanix.com" &&
    !host.endsWith(".alqurmanix.com")
  ) {
    throw new Error("REDIRECT_HOST_NOT_ALLOWED");
  }

  goTo(target.toString());
  return true;
}

/* =====================================================
   نقطة تشغيل الفحص
===================================================== */

async function startSecurityGate() {
  if (running) return;

  running = true;
  retryButton.hidden = true;
  captchaBox.style.display = "none";
  captchaToken = "";

  try {
    showStatus(
      "جارٍ تحميل بيانات الهوية...",
      "normal",
      true
    );

    if (!window.supabase?.createClient) {
      throw new Error("SUPABASE_CLIENT_UNAVAILABLE");
    }

    const authSession = await getAuthSession();

    // الجلسة المقيّدة لها مسار مستقل ولا تدخل لوحة التحكم.
    const restricted = await checkRestrictedSession(authSession);

    if (restricted) return;

    const registrationStatus =
      await getRegistrationStatus();

    const aqxToken =
      await checkAqxSession(authSession);

    await consumeLoginProof(
      authSession,
      aqxToken,
      registrationStatus
    );

    const securityResult =
      await runCentralSecurityCheck(
        authSession,
        aqxToken
      );

    if (!securityResult) return;

    // التذكرة إن وجدت تُستهلك بعد نجاح الفحص المركزي.
    const redirected =
      await consumeRedirectTicket(authSession);

    if (redirected) return;

    showStatus(
      "اكتمل الفحص الأمني بنجاح. جارٍ فتح لوحة التحكم...",
      "success",
      true
    );

    setTimeout(() => {
      goTo(CONFIG.DASHBOARD);
    }, 700);

  } catch (error) {
    console.error("AQX Security Gate:", error);

    const code =
      error instanceof Error
        ? error.message
        : "SECURITY_CHECK_FAILED";

    const messages = {
      AUTH_SESSION_MISSING:
        "جلسة الهوية غير موجودة. أعد تسجيل الدخول.",

      SUPABASE_SESSION_READ_FAILED:
        "تعذرت قراءة جلسة الهوية.",

      AQX_SESSION_MISSING:
        "جلسة AQX غير موجودة. أعد تسجيل الدخول.",

      AQX_SESSION_INVALID:
        "جلسة AQX غير صالحة أو انتهت صلاحيتها.",

      LOGIN_PROOF_MISSING:
        "إثبات الدخول غير موجود. أعد تسجيل الدخول.",

      LOGIN_PROOF_INVALID:
        "إثبات الدخول غير صالح.",

      LOGIN_PROOF_REJECTED:
        "تعذر اعتماد إثبات الدخول.",

      CAPTCHA_SERVER_SECRET_NOT_CONFIGURED:
        "خدمة اختبار الحماية غير مفعّلة على الخادم. يجب ضبط TURNSTILE_SECRET_KEY.",

      CAPTCHA_SITE_KEY_MISSING:
        "مفتاح اختبار الحماية غير متوفر.",

      CAPTCHA_VERIFICATION_FAILED:
        "فشل اختبار الحماية. حاول مرة أخرى.",

      TURNSTILE_LOAD_FAILED:
        "تعذر تحميل خدمة اختبار الحماية.",

      REGISTRATION_STATUS_UNAVAILABLE:
        "تعذر الاتصال بخدمة إعدادات الهوية.",

      RESTRICTED_SESSION_INVALID:
        "الجلسة المؤقتة غير صالحة أو انتهت صلاحيتها.",

      CENTRAL_SECURITY_CHECK_DENIED:
        "لم يجتز الحساب الفحص الأمني المركزي.",

      REDIRECT_TICKET_INVALID:
        "تذكرة التحويل غير صالحة أو انتهت صلاحيتها.",

      REDIRECT_HOST_NOT_ALLOWED:
        "وجهة التحويل غير معتمدة.",

      REDIRECT_PROTOCOL_NOT_ALLOWED:
        "بروتوكول وجهة التحويل غير آمن."
    };

    fail(
      messages[code] ||
      "تعذر إكمال الفحص الأمني. رمز الخطأ: " + code
    );
  }
}

retryButton.addEventListener(
  "click",
  startSecurityGate
);

startSecurityGate();

</script>
</body>
</html>
