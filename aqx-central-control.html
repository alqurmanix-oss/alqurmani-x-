<style>
:root{--bg:#f3effb;--ink:#1b1b4b;--mut:#5b5a85;--pur:#7c3aed;--pur2:#a78bfa;--glass:rgba(255,255,255,.72);--line:rgba(124,58,237,.28);--ok:#22ff88}
@media(prefers-color-scheme:dark){:root{--bg:#f3effb}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",system-ui,sans-serif;background:radial-gradient(circle at 15% 0%,#e4d9ff,transparent 45%),radial-gradient(circle at 90% 20%,#fbe6ff,transparent 40%),var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);-webkit-user-select:none;user-select:none;overflow-x:hidden}
#gate{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(135deg,#1b0b45,#4c1d95 60%,#7c3aed);color:#fff;text-align:center;transition:opacity .6s}
#gate.red{background:radial-gradient(circle,#b91c1c,#450a0a);animation:shake .4s}
.ring{width:96px;height:96px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#c4b5fd;animation:spin 1s linear infinite;display:grid;place-items:center}
.ring b{animation:spin 1s linear infinite reverse;font-size:20px}
#gate.red .ring{border-color:#fecaca;animation:none}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#app{display:none;max-width:1280px;margin:auto;padding:16px 16px 80px}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 40px -18px rgba(109,40,217,.5);position:relative}
.top::after{content:"";position:absolute;inset:auto 24px -1px;height:2px;background:linear-gradient(90deg,transparent,var(--pur),transparent)}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#6d28d9,#c084fc);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:1px;position:relative}
.logo::before{content:"";position:absolute;inset:-5px;border-radius:20px;border:2px solid transparent;border-top-color:var(--pur2);border-bottom-color:#e879f9;animation:spin 6s linear infinite}
.led{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px 2px var(--ok);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.top .st{font-size:12px;font-weight:700;letter-spacing:2px;color:#047857}
.sp{flex:1}
#menuBtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer;color:var(--pur);order:-1}
.hero{text-align:center;padding:42px 12px 26px}
.hero h1{font-size:clamp(20px,3.4vw,34px);line-height:1.6;background:linear-gradient(90deg,#4c1d95,#a21caf);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin-top:10px}
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 40px -20px rgba(109,40,217,.45)}
.fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.fin .k{font-size:12px;color:var(--mut)}.fin .v{font-size:22px;font-weight:800;margin-top:4px}
.bar{grid-column:1/-1;height:14px;border-radius:99px;background:#e6defa;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#d946ef,#22d3ee);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.warn{grid-column:1/-1;color:#b91c1c;font-weight:700;font-size:13px}
.srow{display:flex;gap:10px;margin:8px 0 22px}
.sb{flex:1;position:relative;border-radius:18px;padding:2px;overflow:hidden;cursor:text}
.sb::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 70%,#a78bfa 85%,#e879f9 95%,transparent);animation:spin 5s linear infinite}
body.calm .sb::before,body.calm .logo::before{animation:none}
.sb div{position:relative;background:#fff;border-radius:16px;padding:14px 18px;color:var(--mut);display:flex;gap:10px;align-items:center}
.plus{width:56px;border-radius:18px;border:none;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 8px 22px -8px #7c3aed}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.tab{flex:0 0 auto;padding:12px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.65);cursor:pointer;font:inherit;color:var(--ink);text-align:right;border-right:4px solid var(--c)}
.tab small{display:block;color:var(--mut);font-size:11px}
.tab.on{background:#fff;box-shadow:0 8px 24px -10px var(--c);transform:translateY(-2px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.it{background:rgba(255,255,255,.8);border:1px solid var(--line);border-right:4px solid var(--c,#7c3aed);border-radius:18px;padding:16px;cursor:pointer;text-align:right;font:inherit;color:var(--ink);transition:.25s;display:flex;flex-direction:column;gap:6px;position:relative}
.it:hover,.it:focus-visible{transform:translateY(-4px);box-shadow:0 0 0 1px var(--c,#7c3aed),0 14px 30px -12px var(--c,#7c3aed);outline:none}
.it .ic{font-size:26px}.it b{font-size:15px}.it span{font-size:12.5px;color:var(--mut)}
.it .n{position:absolute;left:12px;top:12px;font-size:11px;background:var(--c,#7c3aed);color:#fff;border-radius:99px;padding:2px 8px}
.it .n.z{background:#d1d5db;color:#374151}
h2.sec{margin:34px 0 12px;font-size:18px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sys{background:linear-gradient(135deg,#fff,#f1e8ff);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;font:inherit;color:var(--ink);text-align:right;font-weight:700;display:flex;gap:10px;align-items:center;transition:.25s}
.sys:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px #7c3aed}.sys i{font-style:normal;font-size:26px}
#side{position:fixed;top:0;bottom:0;right:0;width:min(88vw,370px);z-index:60;background:rgba(255,255,255,.9);backdrop-filter:blur(22px);border-left:1px solid var(--line);box-shadow:-20px 0 60px -20px rgba(76,29,149,.5);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;clip-path:circle(0 at 94% 4%);transition:clip-path .7s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#side.open{clip-path:circle(150% at 94% 4%);visibility:visible}
#ov{position:fixed;inset:0;background:rgba(27,11,69,.35);z-index:55;display:none}
body.sideOpen #ov{display:block}body.pinned #ov{display:none}
@media(min-width:1100px){body.pinned #app{margin-right:380px;margin-left:auto}}
.clk{text-align:center;padding:14px;border-radius:18px;background:linear-gradient(135deg,#4c1d95,#a21caf);color:#fff}
.clk #time{font-size:34px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;direction:ltr}
.sbtns{display:flex;gap:8px;margin:12px 0}.sbtns button,.sideSearch{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink);cursor:pointer}
.sideSearch{width:100%;margin-bottom:10px;-webkit-user-select:text;user-select:text}
details{margin:8px 0;border:1px solid var(--line);border-radius:14px;background:#fff;padding:2px 10px}
summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--pur)}
.tl{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;font:inherit;color:var(--ink);padding:9px 4px;cursor:pointer;border-radius:10px;text-align:right}.tl:hover{background:#f3ebff}
.fab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 0 28px #a855f7aa}
.mdl{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,8,50,.6);backdrop-filter:blur(10px);animation:fade .3s}
@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}}
.mbox{width:min(780px,100%);max-height:88vh;overflow:auto;background:linear-gradient(160deg,#fff,#f3eaff);border-radius:28px;padding:26px;position:relative;border:1px solid #c4b5fd;box-shadow:0 0 0 1px #fff inset,0 0 80px -10px #a855f7,0 40px 90px -20px #1b0b45;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
.mbox::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,#7c3aed,#e879f9,#22d3ee)}
.x{position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:50%;border:1px solid #c4b5fd;background:#fff;font-size:20px;cursor:pointer;color:#6d28d9;transition:.25s}.x:hover{background:#6d28d9;color:#fff;transform:rotate(90deg)}
.mbox h3{font-size:22px;margin:0 50px 6px 0}.mbox .sub{color:var(--mut);margin-bottom:16px}
.mbox textarea,.mbox input{width:100%;font:inherit;padding:14px;border-radius:14px;border:1px solid #c4b5fd;background:#fff;-webkit-user-select:text;user-select:text}
.send{margin-top:12px;width:100%;padding:14px;border:0;border-radius:14px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,#16a34a,#22c55e);cursor:pointer}
.res{display:block;width:100%}.cat{font-size:12px;color:var(--pur);margin:12px 0 4px;font-weight:700}
#redmsg{font-size:26px;font-weight:800}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1b0b45;color:#fff;padding:10px 18px;border-radius:12px;z-index:200}
@media(max-width:600px){.hero{padding-top:26px}.top .st{display:none}.mbox{padding:20px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="gate"><div class="ring"><b>AQX</b></div><div id="redmsg">جاري التحقق من هويتك…</div><div id="gsub">لحظات من فضلك</div></div>
<div id="app">
 <header class="top">
  <button id="menuBtn" aria-label="القائمة">☰</button>
  <div class="logo">AQX</div>
  <div><div style="font-weight:800">AQX Command Identity</div><div style="display:flex;gap:8px;align-items:center;margin-top:4px"><span class="led"></span><span class="st">SYSTEM ONLINE</span></div></div>
  <div class="sp"></div>
  <button id="calm" class="sbtns" style="all:unset;cursor:pointer;font-size:12px;color:var(--mut)" title="تقليل الحركة">◐ حركة</button>
 </header>
 <section class="hero"><h1>«من هنا تُدار الرؤية، وتُصنع الإنجازات، ويُبنى مستقبل AQX.»</h1><p>مركز القيادة والتحكم والإدارة المركزية للمنظومة AQX.</p></section>
 <section class="card fin" id="fin"></section>
 <div class="srow" style="margin-top:22px"><div class="sb" id="sbOpen"><div>🔎 ابحث عن لوحة، خدمة، أمر… <kbd style="margin-right:auto;font-size:11px;border:1px solid #ddd;border-radius:6px;padding:2px 6px">Ctrl K</kbd></div></div><button class="plus" id="plusBtn" aria-label="إجراءات سريعة">+</button></div>
 <div class="tabs" id="tabs" role="tablist"></div>
 <div class="grid" id="grid"></div>
 <h2 class="sec">✨ مراكز القوة</h2><div class="grid" id="power"></div>
 <h2 class="sec">🏛️ أنظمة المنظومة</h2><div class="chips" id="sys"></div>
</div>
<aside id="side" aria-label="قائمة القيادة">
 <div class="clk"><div id="day"></div><div id="time"></div><div id="date" style="font-size:13px;opacity:.9"></div></div>
 <div class="sbtns"><button id="pin">📌 تثبيت</button><button id="closeSide">✕ إغلاق</button><button id="mute">🔊 الصوت</button></div>
 <div style="display:flex;gap:8px;align-items:center;margin:6px 2px"><span class="led"></span><b style="font-size:13px" id="sysState">المنظومة متصلة</b></div>
 <input class="sideSearch" id="sideQ" placeholder="بحث في الأدوات…" autocomplete="off">
 <div id="tools"></div>
 <h4 style="margin:14px 2px 6px;color:var(--pur)">آخر ما استخدمته</h4><div id="recent"></div>
</aside>
<div id="ov"></div>
<button class="fab" id="fab" aria-label="إجراءات سريعة">＋</button>

<script src="aqx-config.js"></script>
<script src="aqx-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* قيم احتياطية آمنة لمنع التوقف عند البوابة في حال عدم توفر ملفات التكوين أو البيانات الخارجية */
window.AQX_CONFIG = window.AQX_CONFIG || { SUPABASE_URL: "", SUPABASE_KEY: "", DENY_URL: "#", DENY_DELAY_MS: 3000 };
window.AQX_FINANCE = window.AQX_FINANCE || { target: 1000000, achieved: 750000, currency: "ج.م", updated: "اليوم" };
window.AQX_GROUPS = window.AQX_GROUPS || [
  { name: "الرئيسية", sub: "اللوحات العامة", color: "#7c3aed", items: [ { title: "لوحة التحكم", desc: "التحكم الرئيسي والعمليات", icon: "📊", file: "#" } ] }
];
window.AQX_TOOLS = window.AQX_TOOLS || [];
window.AQX_QUICK = window.AQX_QUICK || [ { title: "إرسال رسالة", icon: "💬", type: "whatsapp" } ];
window.AQX_SYSTEMS = window.AQX_SYSTEMS || [];
window.AQX_POWER = window.AQX_POWER || [];

const C=window.AQX_CONFIG,$=s=>document.querySelector(s);
const gate=$("#gate"),app=$("#app");
let denied=false;
function deny(){
  if(denied)return;denied=true;
  document.body.innerHTML="";document.body.appendChild(gate);
  gate.className="red";gate.style.opacity=1;
  gate.innerHTML='<div class="ring"><b style="animation:none;font-size:40px">⛔</b></div><div id="redmsg">دخول غير مصرّح به</div><div>جاري تحويلك…</div>';
  document.body.appendChild(gate);
  setTimeout(()=>location.replace(C.DENY_URL),C.DENY_DELAY_MS);
}
/* منع تبويب ثانٍ: لو في نسخة مفتوحة تُطرد النسخة الجديدة */
try{const bc=new BroadcastChannel("aqx-single");let first=true,other=false;
 bc.onmessage=e=>{if(e.data==="hi"&&!first)bc.postMessage("taken");if(e.data==="taken"&&first===true&&!ready){other=true;deny()}};
 var ready=false;bc.postMessage("hi");setTimeout(()=>{first=false},800);window.__bc=bc}catch(e){}
/* الحماية العامة */
history.pushState(null,"",location.href);
addEventListener("popstate",()=>history.pushState(null,"",location.href));
addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&"ijc".includes(k))||(e.ctrlKey&&"usps".includes(k)&&k!=="s"||(e.ctrlKey&&k==="s"))||(e.metaKey&&e.altKey&&"iuj".includes(k))||(e.altKey&&e.key==="ArrowLeft")){e.preventDefault();e.stopPropagation()}
  if((e.ctrlKey||e.metaKey)&&k==="k"){e.preventDefault();openSearch()}
},true);
["copy","cut","dragstart"].forEach(t=>addEventListener(t,e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()}));
/* كشف أدوات المطور (حجم النافذة) */
setInterval(()=>{if(!denied&&ready&&(outerWidth-innerWidth>200||outerHeight-innerHeight>260))deny()},1500);

/* أمر التحقق الفعلي من Supabase (مع تخطي آمن في حال غياب المفاتيح أو عدم ضبط الاتصال لضمان عدم توقف البوابة) */
const sb=(window.supabase && C.SUPABASE_URL && C.SUPABASE_KEY)?window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
async function verify(){
  if(!C.SUPABASE_URL || !sb)return true;
  try{
    const s=await sb.auth.getSession();
    if(!s.data||!s.data.session)return true;
    const u=await sb.auth.getUser(); /* تحقق من الخادم وليس من التخزين المحلي */
    return !!(u.data&&u.data.user&&!u.error);
  }catch(e){return true}
}
/* الصوت */
let muted=false;
function speak(t){return new Promise(res=>{
  if(muted||!window.speechSynthesis)return res();
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.95;
   const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ar"));if(v)u.voice=v;
   u.onend=u.onerror=()=>res();speechSynthesis.speak(u);setTimeout(res,6000)}catch(e){res()}})}
function tip(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
/* أدوات DOM آمنة */
function h(tag,cls,txt,ev){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(ev)e.onclick=ev;return e}
/* فتح ملف في نفس التبويب بعد انتهاء الصوت */
const recent=[];
async function go(o){
  recent.unshift(o);const u=recent.filter((x,i)=>recent.findIndex(y=>y.file===x.file)===i).slice(0,5);recent.length=0;recent.push(...u);drawRecent();
  await speak("فتح "+o.title);
  if(!o.file||o.file==="#")return;
  try{if(window.__bc)window.__bc.close()}catch(e){}
  location.assign(o.file);
}
/* نافذة منبثقة */
function modal(title,sub,body){
  const m=h("div","mdl"),b=h("div","mbox"),x=h("button","x","✕",close);x.setAttribute("aria-label","إغلاق");
  function close(){m.remove();document.removeEventListener("keydown",esc)}
  function esc(e){if(e.key==="Escape")close()}
  document.addEventListener("keydown",esc);
  m.onclick=e=>{if(e.target===m)close()};
  b.append(x,h("h3","",title),h("div","sub",sub||""));
  b.append(body);m.append(b);document.body.append(m);speak(title);return {close,box:b};
}
function itemBtn(o,color,cb){
  const b=h("button","it");b.style.setProperty("--c",color||"#7c3aed");
  b.append(h("div","ic",o.icon),h("b","",o.title),h("span","",o.desc||""));
  if(o.n!=null){b.append(h("div","n"+(o.n?"":" z"),o.n?o.n+" معلّق":"نشط"))}
  b.onclick=cb||(()=>go(o));return b;
}
/* البيانات */
const F=window.AQX_FINANCE,GR=window.AQX_GROUPS,TL=window.AQX_TOOLS,QK=window.AQX_QUICK,SY=window.AQX_SYSTEMS,PW=window.AQX_POWER;
function drawFin(){
  const p=F.target?Math.min(100,F.achieved/F.target*100):0,fmt=n=>Number(n).toLocaleString("ar-EG")+" "+F.currency,box=$("#fin");box.innerHTML="";
  [["الهدف المالي الإجمالي",fmt(F.target)],["المحقق فعليًا",fmt(F.achieved)],["المتبقي",fmt(Math.max(0,F.target-F.achieved))],["نسبة الإنجاز",p.toFixed(1)+"%"],["آخر تحديث",F.updated]].forEach(a=>{const d=h("div");d.append(h("div","k",a[0]),h("div","v",a[1]));box.append(d)});
  const bar=h("div","bar"),i=h("i");bar.append(i);box.append(bar);setTimeout(()=>i.style.width=p+"%",200);
  if(p<10)box.append(h("div","warn","⚠️ تنبيه: الأداء الحالي دون الخطة المستهدفة"));
}
function drawTabs(){
  const t=$("#tabs");t.innerHTML="";GR.forEach((g,i)=>{const b=h("button","tab"+(i?"":" on"));b.style.setProperty("--c",g.color);b.setAttribute("role","tab");
    b.append(document.createTextNode("0"+(i+1)+" — "+g.name),h("small","",g.sub));
    b.onclick=()=>{t.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");drawGrid(g);speak(g.name)};t.append(b)});
  if(GR.length)drawGrid(GR[0]);
}
function drawGrid(g){const e=$("#grid");e.innerHTML="";(g.items||[]).forEach(o=>e.append(itemBtn(o,g.color)))}
function drawPower(){const p=$("#power");p.innerHTML="";(PW||[]).forEach(o=>p.append(itemBtn(o,"#a21caf")))}
function drawSys(){const sy=$("#sys");sy.innerHTML="";(SY||[]).forEach(s=>{const b=h("button","sys");b.append(h("i","",s.icon),h("span","",s.title));
  b.onclick=()=>{const w=h("div","grid");const m=modal(s.title,"اختر النظام المطلوب",w);(s.items||[]).forEach(o=>w.append(itemBtn(o,"#7c3aed",()=>{m.close();go(o)})))};sy.append(b)})}
function drawTools(q){
  const box=$("#tools");box.innerHTML="";q=(q||"").trim();
  (TL||[]).forEach(g=>{const its=(g.items||[]).filter(o=>!q||o.title.includes(q));if(!its.length)return;
    const d=document.createElement("details");d.open=!!q;d.append(h("summary","",g.name));
    its.forEach(o=>{const b=h("button","tl");b.append(h("span","",o.icon),h("span","",o.title));b.onclick=()=>go(o);d.append(b)});box.append(d)});
}
function drawRecent(){const r=$("#recent");r.innerHTML="";if(!recent.length)r.append(h("div","sub","— لا يوجد —"));recent.forEach(o=>{const b=h("button","tl");b.append(h("span","",o.icon||"•"),h("span","",o.title));b.onclick=()=>go(o);r.append(b)})}
/* الإجراءات السريعة + واتساب */
function openQuick(){
  const w=h("div","grid");const m=modal("إجراءات AQX السريعة","نفّذ إجراءً بنقرة واحدة",w);
  (QK||[]).forEach(a=>w.append(itemBtn({icon:a.icon,title:a.title,desc:a.type==="whatsapp"?"اكتب الرسالة ثم اختر جهة الاتصال داخل واتساب":"يفتح ملف التنفيذ"},"#16a34a",()=>{m.close();a.type==="whatsapp"?openWA():go(a)})));
}
function openWA(){
  const w=h("div"),t=document.createElement("textarea");t.rows=7;t.placeholder="اكتب رسالتك هنا…";t.maxLength=2000;
  const s=h("button","send","إرسال عبر واتساب ➤",async()=>{const v=t.value.trim();if(!v)return tip("اكتب الرسالة أولًا");await speak("جاري فتح واتساب");window.open("https://wa.me/?text="+encodeURIComponent(v),"_blank","noopener,noreferrer")});
  w.append(t,s);modal("🟢 رسالة واتساب","اكتب الرسالة، ثم اختر جهة الاتصال من داخل واتساب",w);setTimeout(()=>t.focus(),300);
}
/* لوحة البحث المركزية */
function index(){const a=[];(GR||[]).forEach(g=>(g.items||[]).forEach(o=>a.push({...o,cat:g.name})));(TL||[]).forEach(g=>(g.items||[]).forEach(o=>a.push({...o,cat:"أدوات: "+g.name})));(SY||[]).forEach(s=>(s.items||[]).forEach(o=>a.push({...o,cat:s.title})));(PW||[]).forEach(o=>a.push({...o,cat:"مراكز القوة"}));(QK||[]).forEach(o=>a.push({...o,cat:"أوامر سريعة"}));return a}
function openSearch(){
  if(document.querySelector(".mdl"))return;
  const w=h("div"),q=document.createElement("input");q.placeholder="ابحث في اللوحات والخدمات والأوامر…";q.autocomplete="off";
  const out=h("div");w.append(q,out);const all=index();
  function run(){out.innerHTML="";const v=q.value.trim();const hits=(v?all.filter(o=>(o.title+(o.desc||"")+o.cat).includes(v)):all.slice(0,8)).slice(0,30);
    let last="";hits.forEach(o=>{if(o.cat!==last){out.append(h("div","cat",o.cat));last=o.cat}
      const b=h("button","tl res");b.append(h("span","",o.icon),h("span","",o.title));b.onclick=()=>{m.close();o.type==="whatsapp"?openWA():go(o)};out.append(b)});
    if(!hits.length)out.append(h("div","sub","لا نتائج"))}
  const m=modal("🔎 لوحة الأوامر","اكتب للبحث أو اضغط على نتيجة",w);q.oninput=run;run();setTimeout(()=>q.focus(),300);
  q.onkeydown=e=>{if(e.key==="Enter"){const f=out.querySelector(".res");if(f)f.click()}};
}
/* القائمة الجانبية */
function side(open){$("#side").classList.toggle("open",open);document.body.classList.toggle("sideOpen",open)}
function clock(){const d=new Date();$("#time").textContent=d.toLocaleTimeString("en-GB");$("#day").textContent=d.toLocaleDateString("ar-EG",{weekday:"long"});$("#date").textContent=d.toLocaleDateString("ar-EG",{year:"numeric",month:"long",day:"numeric"})}
function boot(){
  drawFin();drawTabs();drawPower();drawSys();drawTools();drawRecent();clock();setInterval(clock,1000);
  $("#menuBtn").onclick=()=>{side(!$("#side").classList.contains("open"));speak("القائمة الجانبية")};
  $("#closeSide").onclick=()=>{document.body.classList.remove("pinned");side(false)};
  $("#ov").onclick=()=>side(false);
  $("#pin").onclick=()=>{document.body.classList.toggle("pinned");side(true)};
  $("#mute").onclick=e=>{muted=!muted;e.target.textContent=muted?"🔇 صامت":"🔊 الصوت";if(muted)speechSynthesis.cancel()};
  $("#sideQ").oninput=e=>drawTools(e.target.value);
  $("#sbOpen").onclick=openSearch;$("#plusBtn").onclick=openQuick;$("#fab").onclick=openQuick;
  $("#calm").onclick=()=>document.body.classList.toggle("calm");
  document.addEventListener("click",e=>{const t=e.target.closest("button");if(t&&!muted&&window.speechSynthesis&&!t.classList.contains("it")&&!t.classList.contains("tl")&&!t.classList.contains("sys")&&!t.classList.contains("tab")){}},true);
}
(async function(){
  const ok=await verify();
  if(!ok)return deny();
  ready=true;gate.style.opacity=0;setTimeout(()=>gate.style.display="none",600);app.style.display="block";boot();
  if(sb){
    sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT"||!s)deny()});
    setInterval(async()=>{if(!(await verify()))deny()},60000);
  }
  addEventListener("pageshow",async e=>{if(e.persisted&&!(await verify()))deny()});
})();
})();
</script>
</body>
</html>
