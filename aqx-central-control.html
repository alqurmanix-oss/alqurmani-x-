let vOn=true,pend=0,voice=null;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/^ar/i.test(x.lang));voice=v.find(x=>!/tarik|naayf|maged|hamed|shakir|male(?!.*female)/i.test(x.name))||v[0]||null}
try{pick();speechSynthesis.onvoiceschanged=pick}catch(e){}
function say(t){if(!vOn||!('speechSynthesis'in window))return;if(pend>3){speechSynthesis.cancel();pend=0}
 const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.95;u.pitch=1.25;if(voice)u.voice=voice;pend++;u.onend=u.onerror=()=>{pend=Math.max(0,pend-1)};speechSynthesis.speak(u)}
let ac;function ping(f=660){if(!vOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.18);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}catch(e){}}

 const close=()=>{const i=stack.indexOf(close);if(i<0)return;stack.splice(i,1);m.classList.remove('in');m.classList.add('out');setTimeout(()=>m.remove(),400);document.body.style.overflow=stack.length?'hidden':'';ping(440)};

function drawRecent(){const b=$('#recent');let r=[];try{r=JSON.parse(localStorage.getItem('aqx_recent')||'[]')}catch(e){}b.innerHTML=r.length?'<span>🕘 آخر ما استخدمته:</span>':'';r.forEach(e=>{const c=document.createElement('button');c.className='chip';c.textContent=e.i+' '+e.n;c.onclick=()=>open(e);b.append(c)})}
function open(e){say('فتح '+e.n);ping(780);recent(e);
 if(e.id==='wa')return modal('إرسال رسالة واتساب','💬','#16a34a',waBox());
 modal(e.n,e.i,e.c,frame(e))}
function actions(){const n=document.createElement('div');n.className='pad';const g=document.createElement('div');g.className='pg';
 A.forEach(e=>{const b=document.createElement('button');b.innerHTML='<span>'+e.i+'</span>'+esc(e.n);b.onclick=()=>{stack[stack.length-1]();setTimeout(()=>open(e),250)};g.append(b)});n.append(g);say('إجراءات إيه كيو إكس السريعة');ping(700);modal('إجراءات AQX السريعة','⚡','#16a34a',n)}
function timeline(){const n=document.createElement('div');n.className='pad';const ev=(D&&Array.isArray(D.events)?D.events:[]).slice().sort((a,b)=>new Date(b.d)-new Date(a.d));
 const col={done:'#22c55e',launch:'#7c3aed',approved:'#0891b2',update:'#d946ef'};
 n.innerHTML=ev.length?'<div class="tl">'+ev.map(x=>'<div class="ev" style="--k:'+(col[x.type]||'#7c3aed')+'"><b>'+esc(x.t||'')+'</b><small>'+esc(x.d?new Date(x.d).toLocaleString('ar-EG'):'')+'</small></div>').join('')+'</div>':'<div class="emp">لا توجد أحداث مسجّلة بعد في aqx-data.js</div>';
 say('الخط الزمني الحي');modal('الخط الزمني الحي','⏳','#7c3aed',n)}
/* ===== search ===== */
const norm=s=>String(s).toLowerCase().replace(/[\u064B-\u0652ـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function bind(inp,box,done){let sel=-1,cur=[];
 function draw(){const q=norm(inp.value.trim());let list=q?IDX.filter(e=>norm(e.n+' '+e.cat+' '+e.id).includes(q)):[];cur=list.slice(0,24);sel=-1;
  if(!q){box.classList.remove('on');return}
  if(!cur.length){box.innerHTML='<div class="emp">لا نتائج مطابقة</div>';box.classList.add('on');return}
  let h='',last='';cur.forEach((e,k)=>{if(e.cat!==last){h+='<h6>'+esc(e.cat)+'</h6>';last=e.cat}h+='<button data-k="'+k+'"><span>'+esc(e.i)+'</span>'+esc(e.n)+'<em>↵</em></button>'});box.innerHTML=h;box.classList.add('on')}
 function go(e){if(!e)return;box.classList.remove('on');inp.value='';done&&done();open(e)}
 inp.oninput=draw;inp.onfocus=draw;
 box.onclick=ev=>{const b=ev.target.closest('button[data-k]');if(b)go(cur[+b.dataset.k])};
 inp.onkeydown=ev=>{const bs=$$('#'+box.id+' button[data-k]');if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();sel=(sel+(ev.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,k)=>b.classList.toggle('sel',k===sel));bs[sel]&&bs[sel].scrollIntoView({block:'nearest'})}else if(ev.key==='Enter')go(cur[sel>=0?sel:0])};
 return draw}
function palette(){const n=document.createElement('div');n.className='pad';n.innerHTML='<div class="ssr" style="height:54px"><span>⌘</span><input id="pq" autocomplete="off" placeholder="اكتب اسم لوحة أو أمر…" style="font-size:16px"></div><div class="res on" id="pres" style="margin-top:12px;max-height:55vh"></div>';
 const close=modal('لوحة الأوامر','⌘','#7c3aed',n);const i=n.querySelector('input'),r=n.querySelector('#pres');
 r.innerHTML='<h6>اقتراحات</h6>'+A.slice(0,6).map((e,k)=>'<button data-s="'+k+'"><span>'+e.i+'</span>'+esc(e.n)+'</button>').join('');
 r.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){close();setTimeout(()=>open(A[+b.dataset.s]),250)}});
 bind(i,r,()=>close());setTimeout(()=>i.focus(),400);say('لوحة الأوامر')}
/* ===== render ===== */
function badge(id){const b=D&&D.badges&&D.badges[id];if(!b)return '<span class="bd"><i></i>—</span>';const s=['ok','warn','bad'].includes(b.s)?b.s:'ok';return '<span class="bd '+s+'"><i></i>'+fmt(b.n)+'</span>'}
let curTab=0;
function tab(k,speak){curTab=k;const g=G[k];$$('.tab').forEach((t,i)=>t.classList.toggle('on',i===k));$('#ph').innerHTML='<b>'+g.i+' '+esc(g.n)+'</b><p>'+esc(g.s)+'</p>';
 const gr=$('#grid');gr.innerHTML='';g.items.forEach((e,j)=>{const c=document.createElement('button');c.className='card';c.style.setProperty('--c',e.c);c.style.animationDelay=j*35+'ms';
  c.innerHTML='<div class="t"><span class="ic">'+e.i+'</span>'+badge(e.id)+'</div><b>'+esc(e.n)+'</b><p>'+esc(e.d)+'</p>';c.onclick=()=>open(e);gr.append(c)});
 if(speak){say('قسم '+g.n);ping(600)}}
function renderTabs(){const t=$('#tabs');G.forEach((g,k)=>{const b=document.createElement('button');b.className='tab';b.style.setProperty('--c',g.c);b.setAttribute('role','tab');b.innerHTML='<span>'+g.i+'</span>'+esc(String(k+1).padStart(2,'0')+' · '+g.n);b.onclick=()=>{tab(k,true);b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})};t.append(b)})}
function renderGoal(){const s=$('#goal');const g=D&&D.goal;
 if(!g){s.innerHTML='<h2>🎯 الهدف المالي العام</h2><div class="alert n">⚠️ لم يتم العثور على بيانات الهدف. أنشئ الملف aqx-data.js وعرّف window.AQX_DATA.goal.</div>';return}
 const tot=+g.total||0,ach=+g.achieved||0,rem=Math.max(tot-ach,0),pct=tot>0?Math.min(ach/tot*100,100):0,cur=g.currency?' '+esc(g.currency):'';
 let upd='—';if(g.updated){const d=new Date(g.updated);if(!isNaN(d))upd=d.toLocaleString('ar-EG')}
 let al='';if(g.planned!=null){const pl=+g.planned;al=ach<pl*.9?'<div class="alert">⚠️ انحراف عن الخطة: المتحقق أقل من المخطط بمقدار '+fmt(pl-ach)+cur+'</div>':'<div class="alert ok">✅ الأداء ضمن الخطة (المخطط حتى الآن: '+fmt(pl)+cur+')</div>'}
 s.innerHTML='<h2><span>🎯 الهدف المالي العام</span><small style="color:var(--mut);font-weight:600">آخر تحديث: '+esc(upd)+'</small></h2><div class="gs"><div><small>الهدف الإجمالي</small><b>'+fmt(tot)+cur+'</b></div><div><small>المحقق فعليًا</small><b style="color:#059669">'+fmt(ach)+cur+'</b></div><div><small>المتبقي</small><b style="color:#dc2626">'+fmt(rem)+cur+'</b></div><div><small>نسبة الإنجاز</small><b style="color:var(--v)">'+pct.toFixed(1)+'%</b></div></div><div class="bar" role="progressbar" aria-valuenow="'+pct.toFixed(0)+'" aria-valuemin="0" aria-valuemax="100"><i></i></div>'+al;
 setTimeout(()=>{const i=s.querySelector('.bar i');if(i)i.style.width=pct+'%'},300)}
function renderSide(){const sb=$('#sb');T.forEach((g,k)=>{const d=document.createElement('div');d.className='sg';d.innerHTML='<button class="h"><span>'+g.i+'</span>'+esc(g.n)+'</button><div class="l"></div>';const l=d.querySelector('.l');
  g.items.forEach(e=>{const b=document.createElement('button');b.innerHTML='<span>'+e.i+'</span>'+esc(e.n);b.onclick=()=>{open(e);if(!pinned())side(false)};l.append(b)});
  d.querySelector('.h').onclick=()=>{const w=d.classList.contains('on');$$('.sg').forEach(x=>x.classList.remove('on'));if(!w){d.classList.add('on');say(g.n);ping(520)}};sb.append(d)});
 const st=$('#sts'),ss=D&&Array.isArray(D.status)?D.status:[];st.innerHTML=ss.length?ss.map(x=>'<span><i class="lamp '+(x.s==='bad'?'b':x.s==='warn'?'w':'')+'"></i>'+esc(x.n)+'</span>').join(''):'<span>لا توجد بيانات حالة بعد</span>';
 const mini=$('#stmini'),bad=ss.some(x=>x.s==='bad'),warn=ss.some(x=>x.s==='warn');$('#lamp').className='lamp'+(bad?' b':warn?' w':'');mini.textContent=ss.length?ss.filter(x=>!x.s||x.s==='ok').length+' / '+ss.length+' خدمة تعمل بشكل سليم':''}
const pinned=()=>document.body.classList.contains('pinned');
function side(on){const s=$('#side');if(on){const w=s.offsetWidth||350;s.style.setProperty('--cx',(w-innerWidth/2)+'px');s.style.setProperty('--cy','50%');say('مركز الأوامر')}s.classList.toggle('on',on);$('#scrim').classList.toggle('on',on&&!(pinned()&&innerWidth>=1100));if(on)ping(500)}
function clock(){const n=new Date();$('#ck').textContent=n.toLocaleTimeString('ar-EG',{hour12:false});$('#dt').innerHTML=n.toLocaleDateString('ar-EG',{weekday:'long'})+'<br>'+n.toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})}
function init(){$('#gate').remove();$('#app').classList.add('on');renderGoal();renderTabs();tab(0,false);renderSide();drawRecent();clock();setInterval(clock,1000);
 const dr=bind($('#q'),$('#res'));bind($('#sq'),$('#sres'));
 $('#plus').onclick=actions;$('#plus2').onclick=actions;$('#mb').onclick=()=>side(!$('#side').classList.contains('on'));$('#scrim').onclick=()=>side(false);
 $('#pin').onclick=()=>{document.body.classList.toggle('pinned');try{localStorage.setItem('aqx_pin',pinned()?'1':'')}catch(e){}$('#scrim').classList.toggle('on',!(pinned()&&innerWidth>=1100));say(pinned()?'تم التثبيت':'تم إلغاء التثبيت')};
 $('#snd').onclick=()=>{vOn=!vOn;$('#snd').textContent=vOn?'🔊 الصوت':'🔇 صامت';if(!vOn)speechSynthesis.cancel();else say('تم تشغيل الصوت')};
 $('#calm').onclick=()=>{document.body.classList.toggle('calm');say('وضع الحركة المخفّفة')};
 $('#out').onclick=async()=>{say('تسجيل الخروج');try{await sb.auth.signOut()}catch(e){}kick()};
 const tl=document.createElement('div');tl.className='sg';tl.innerHTML='<button class="h"><span>⏳</span>الخط الزمني الحي</button>';tl.querySelector('.h').onclick=timeline;$('#sb').append(tl);
 try{if(localStorage.getItem('aqx_pin')&&innerWidth>=1100){document.body.classList.add('pinned');side(true)}}catch(e){}
 setTimeout(()=>say('أهلاً بك في مركز قيادة إيه كيو إكس'),600)}
/* ===== auth gate ===== */
async function verify(){
 try{
  const ref=/secure-aqx\.html/.test(document.referrer),ts=+sessionStorage.getItem('aqx_gate')||0,fresh=ts&&Date.now()-ts<TTL;
  if(!ref&&!fresh)return kick('E1-GATE');
  if(!window.supabase)return kick('E2-SDK');
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const {data:{session}}=await sb.auth.getSession();if(!session)return kick('E3-NOSESSION');
  const bad=r=>r&&((r.error&&[400,401,403].includes(r.error.status))||(!r.error&&!(r.data&&r.data.user)));
  let r=null;try{r=await sb.auth.getUser()}catch(e){}
  if(bad(r))return kick('E4-INVALID');
  sessionStorage.setItem('aqx_gate',String(Date.now()));
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT')kick('E6-SIGNEDOUT')});
  setInterval(async()=>{try{if(bad(await sb.auth.getUser()))kick('E7-EXPIRED')}catch(e){}},60000);
  if(!dead)init()
 }catch(e){kick('E5-'+((e&&e.message)||'ERR'))}}
verify();
})();
