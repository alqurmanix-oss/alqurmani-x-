en:{h1:'Welcome to the AQX universe',lead:'Your unified identity for every AQX service.',slogan:'One Account. Infinite Possibilities.',c1t:'Create account',c1d:'Start your journey with AQX.',c2t:'Sign in',c2d:'Pick up where you left off.',c3t:'Plans & subscriptions',c3d:'Explore available services and plans.',note:'A subscription is separate from an account: the account is your identity, the subscription is the services you choose.',about:'AQX Unified Account (AQX-UA) is the official gateway to the AQX (Alqurmani X, alqurmanix) ecosystem: one account to sign in, manage subscriptions and reach every service.',skip:'Skip intro',sndOff:'Sound: off',sndOn:'Sound: on',hint:'Tap the screen to enable sound',stU:'Checking status',stUp:'All services operational',stDeg:'Partial degradation',stDown:'Services down',stErr:'Status unavailable',msg:'Your world starts here.',btn:'العربية',back:'Back',

const SP={
home:[['أهلًا بك في عالم AQX القرمانى إكس.','ar'],['Welcome to the world of AQX, Alqurmani X.','en']],
signup:[['إنشاء حساب جديد. ابدأ رحلتك بهوية واحدة تفتح لك كل أبواب AQX.','ar'],['Create a new account. Begin your journey with one identity that opens every door.','en']],
login:[['تسجيل الدخول. عالمك بانتظارك، تابع من حيث توقفت.','ar'],['Sign in. Your world is waiting. Pick up right where you left off.','en']],
plans:[['الاشتراكات والباقات. اختر الباقة التي تناسب طموحك.','ar'],['Plans and subscriptions. Choose the plan that fits your ambition.','en']]};
const TC={intro:'#05040d',home:'#0b0724',signup:'#06202e',login:'#150b33',plans:'#1d0b36'};
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),B=document.body,H=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lang='ar',stKey='stU',soundOn=true,cur='home',first=true,speaking=false;
try{const s=localStorage.getItem('aqx-lang');lang=s||((navigator.language||'').startsWith('en')?'en':'ar')}catch(e){}
const t=k=>D[lang][k]??k;
const theme=v=>{$('meta[name=theme-color]').content=TC[v]};
const li=x=>{const e=document.createElement('li');e.textContent=x;return e};
function render(){
 H.lang=lang;H.dir=lang==='ar'?'rtl':'ltr';
 $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $$('.snd').forEach(b=>b.textContent=t(soundOn?'sndOn':'sndOff'));
 $('#lang').textContent=t('btn');$('#stTxt').textContent=t(stKey);
 $('#perks1').replaceChildren(...t('p1').map(li));$('#perks2').replaceChildren(...t('p2').map(li));
 $('#plans').replaceChildren(...CFG.plans.map(p=>{
  const d=document.createElement('div');d.className='plan'+(p.ft?' ft':'');
  const k=document.createElement('p');k.className='k';k.textContent=p.k[lang];
  const h=document.createElement('h3');h.textContent=p.n[lang];
  const q=document.createElement('p');q.textContent=p.d[lang];
  const u=document.createElement('ul');p.f[lang].forEach(x=>u.append(li(x)));
  const a=document.createElement('a');a.className='cta';a.href=CFG.files.plans+'?plan='+p.id;a.textContent=t('s3x');
  d.append(k,h,q,u,a);return d}));
}
$('#lang').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('aqx-lang',lang)}catch(e){}render()};

/* ===== الصوت: أجواء مجرة مولَّدة (همهمة كونية + حركة دوّارة + ومضات نجوم) ===== */
let ac,master,fx,ready=false,base=.8,ducked=false,pend=null,touched=false;
function audioInit(){
 if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;lp.Q.value=5;
 const dg=ac.createGain();dg.gain.value=.55;lp.connect(dg).connect(master);
 [[55,'sawtooth',.16],[82.6,'sawtooth',.12],[110.4,'sine',.14],[165,'triangle',.08]].forEach(([f,ty,v])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;o.detune.value=(Math.random()-.5)*16;g.gain.value=v;o.connect(g).connect(lp);o.start()});
 const lf=ac.createOscillator(),lg=ac.createGain();lf.frequency.value=.08;lg.gain.value=280;lf.connect(lg).connect(lp.frequency);lf.start();
 const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;
 const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=7;
 const ng=ac.createGain();ng.gain.value=.035;ns.connect(bp).connect(ng);
 const pn=ac.createStereoPanner?ac.createStereoPanner():null;
 if(pn){ng.connect(pn).connect(master);const l3=ac.createOscillator();l3.frequency.value=.12;l3.connect(pn.pan);l3.start()}else ng.connect(master);
 const l2=ac.createOscillator(),l2g=ac.createGain();l2.frequency.value=.14;l2g.gain.value=800;l2.connect(l2g).connect(bp.frequency);l2.start();ns.start();
 fx={bp,ng};
}
function vol(){if(master)master.gain.setTargetAtTime(soundOn?(ducked?.1:base):0,ac.currentTime,.5)}
function ping(f,v){if(!ready||!soundOn)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),p=ac.createStereoPanner?ac.createStereoPanner():null;o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+1.8);o.connect(g);if(p){p.pan.value=Math.random()*2-1;g.connect(p).connect(master)}else g.connect(master);o.start(n);o.stop(n+1.9)}
function sparkle(){ping([523,659,784,988,1175,1319][Math.random()*6|0]*(Math.random()<.3?2:1),.03+Math.random()*.03);setTimeout(sparkle,800+Math.random()*1800)}
function boom(){if(!ready||!soundOn)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(95,n);o.frequency.exponentialRampToValueAtTime(30,n+1.3);g.gain.setValueAtTime(.5,n);g.gain.exponentialRampToValueAtTime(.0001,n+1.4);o.connect(g).connect(master);o.start(n);o.stop(n+1.5)}
function whoosh(d){if(!ready||!soundOn)return;const n=ac.currentTime;fx.bp.frequency.cancelScheduledValues(n);fx.bp.frequency.setValueAtTime(300,n);fx.bp.frequency.exponentialRampToValueAtTime(5000,n+d);fx.ng.gain.cancelScheduledValues(n);fx.ng.gain.setValueAtTime(.035,n);fx.ng.gain.linearRampToValueAtTime(.22,n+d*.8);fx.ng.gain.linearRampToValueAtTime(.035,n+d+.8)}
function wake(){if(!soundOn)return;audioInit();if(!ac)return;ac.resume().then(()=>{if(ac.state==='running'&&!ready){ready=true;B.dataset.snd='on';vol();sparkle()}}).catch(()=>{})}
$$('.snd').forEach(b=>b.onclick=()=>{soundOn=!soundOn;render();if(soundOn)wake();vol();if(!soundOn)speechSynthesis?.cancel()});
B.dataset.snd='locked';
['pointerup','keydown','click','touchend'].forEach(e=>addEventListener(e,()=>{touched=true;wake();if(pend&&soundOn){const p=pend;pend=null;say(p)}},{passive:true}));
wake();

/* ===== صوت بنت رقيق: عربي ثم إنجليزي (أصوات الجهاز) ===== */
let voices=[];const loadV=()=>{voices=speechSynthesis.getVoices()};
if('speechSynthesis' in window){loadV();speechSynthesis.onvoiceschanged=loadV}
const FEM=/female|zira|hoda|salma|laila|maryam|mariam|zariyah|samantha|karen|moira|tessa|victoria|aria|jenny|sara|hedda|susan|catherine|fiona|serena|ava|allison|emma|libby|sonia|google (us|uk) english|google العربية/i;
const pick=l=>{const v=voices.filter(x=>x.lang.toLowerCase().startsWith(l));return v.find(x=>FEM.test(x.name))||v[0]};
function say(parts){
 if(!soundOn||!('speechSynthesis' in window))return;
 speechSynthesis.cancel();ducked=true;vol();speaking=true;B.classList.add('speaking');
 const end=()=>{ducked=false;speaking=false;B.classList.remove('speaking');vol()};
 parts.forEach(([x,l],i)=>{const u=new SpeechSynthesisUtterance(x);u.lang=l==='ar'?'ar-SA':'en-US';const v=pick(l);if(v)u.voice=v;u.pitch=1.2;u.rate=.92;if(i===parts.length-1)u.onend=u.onerror=end;speechSynthesis.speak(u)});
}
function want(p){if(touched||navigator.userActivation?.hasBeenActive)say(p);else pend=p}

/* ===== التنقل بين البطاقات ===== */
const V=['home','signup','login','plans'];
function route(){
 const k=location.hash.replace('#/','');const v=V.includes(k)?k:'home';
 V.forEach(x=>$('#v-'+x).classList.toggle('on',x===v));cur=v;
 if(!B.classList.contains('intro-on'))theme(v);
 scrollTo(0,0);
 if(v!=='home'){B.classList.add('warp');setTimeout(()=>B.classList.remove('warp'),700);if(!first)say(SP[v])}else if(!first)speechSynthesis?.cancel();
 first=false;
}
addEventListener('hashchange',route);

/* ===== مجرة الخلفية ===== */
const cv=$('#fx'),c=cv.getContext('2d');let W,Hh,dpr,mode='galaxy',grow=0,glow=0,tilt=.5,ringA=0;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*dpr;Hh=cv.height=innerHeight*dpr}
size();addEventListener('resize',size);
const N=innerWidth<700?650:1300;
const P=Array.from({length:N},()=>{const r=Math.pow(Math.random(),.65);return{a:((Math.random()*3)|0)*2.094+r*5+(Math.random()-.5)*.55,r0:r,cr:0,s:.3+Math.random()*.9,z:Math.random(),h:Math.random()<.6?188:262,j:Math.random()}});
const S=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),z:Math.random(),p:Math.random()*6}));
function target(p){switch(mode){case'galaxy':return p.r0*grow;case'logo':case'msg':return p.r0*.55+.05;case'ring':return .62+p.j*.015;case'open':return 2.2+p.r0*2;default:return p.r0*1.1+.05}}
function frame(tm){
 c.globalCompositeOperation='source-over';c.clearRect(0,0,W,Hh);
 const cx=W/2,cy=Hh/2,R=Math.min(W,Hh)*.44,ring=mode==='ring'||mode==='open',amb=mode==='ambient';
 for(const s of S){c.fillStyle=`rgba(190,215,255,${(.25+.35*Math.sin(tm/700+s.p))*s.z})`;c.fillRect(s.x*W,s.y*Hh,s.z*1.6*dpr,s.z*1.6*dpr)}
 c.globalCompositeOperation='lighter';
 grow+=((mode==='open'?0:1)-grow)*.02;
 glow+=((({ring:1.2,open:2.4,logo:.7,msg:.7,ambient:.18})[mode]??.6)+(speaking?.45:0)-glow)*.03;
 tilt+=((ring?1:.5)-tilt)*.03;ringA+=((mode==='ring'?1:0)-ringA)*.04;
 const g=c.createRadialGradient(cx,cy,0,cx,cy,R*(.35+glow*.25));g.addColorStop(0,`rgba(255,255,255,${Math.min(.9,.5*glow)})`);g.addColorStop(.25,`rgba(37,232,255,${.35*glow})`);g.addColorStop(1,'rgba(123,77,255,0)');
 c.fillStyle=g;c.fillRect(0,0,W,Hh);
 for(const p of P){
  p.cr+=(target(p)-p.cr)*(mode==='open'?.05:.035);
  p.a+=(.0015+.004*(1-p.r0*.6))*p.s*(mode==='ring'?2.5:1)*(speaking?1.8:1);
  const al=(amb?.45:.9)*(.35+p.z*.65)*(mode==='open'?Math.max(0,1-(p.cr-.8)/1.6):1);
  c.fillStyle=`hsla(${p.h},100%,${60+p.z*25}%,${al})`;const z=(.6+p.z*1.8)*dpr;
  c.fillRect(cx+Math.cos(p.a)*p.cr*R,cy+Math.sin(p.a)*p.cr*R*tilt,z,z)}
 if(ringA>.02){const gr=c.createLinearGradient(cx-R,cy,cx+R,cy);[0,.5,1].forEach((o,i)=>gr.addColorStop(o,i==1?`rgba(37,232,255,${ringA})`:`rgba(123,77,255,${ringA})`));
  c.lineWidth=5*dpr;c.strokeStyle=gr;c.shadowColor='#25e8ff';c.shadowBlur=30*dpr;c.beginPath();c.ellipse(cx,cy,R*.62,R*.62*tilt,0,0,6.283);c.stroke();c.shadowBlur=0}
 if(!reduce)requestAnimationFrame(frame);
}

/* ===== خط المقدمة الزمني ===== */
let ids=[],done=false;
function ph(n,ms){ids.push(setTimeout(()=>{B.dataset.ph=n;mode=n;
 if(n==='logo'){boom();[784,988,1568].forEach((f,i)=>setTimeout(()=>ping(f,.06),i*220))}
 if(n==='ring')whoosh(2.4);
 if(n==='msg')typeMsg()},ms))}
function typeMsg(){const el=$('#msg'),x=t('msg');let i=0;const k=setInterval(()=>{el.textContent=x.slice(0,++i);if(i>=x.length)clearInterval(k)},90)}
function finish(){if(done)return;done=true;ids.forEach(clearTimeout);mode='ambient';delete B.dataset.ph;$('#intro').classList.remove('flash');B.classList.remove('intro-on');B.classList.add('revealed');theme(cur);base=.3;vol();want(SP.home)}
render();route();
if(reduce){mode='ambient';P.forEach(p=>p.cr=target(p));frame(0);theme(cur);base=.3;want(SP.home)}
else{B.classList.add('intro-on');requestAnimationFrame(frame);
 ph('galaxy',0);ph('logo',3200);ph('msg',6400);ph('ring',9200);
 ids.push(setTimeout(()=>{B.dataset.ph='open';mode='open';boom();whoosh(1.4);$('#intro').classList.add('flash')},11000));
 ids.push(setTimeout(finish,12300));
 $('#skip').onclick=finish;addEventListener('keydown',e=>{if(e.key==='Escape')finish()})}
$$('.gate').forEach(g=>g.addEventListener('pointermove',e=>{const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')}));
/* حالة الخدمات من status.json (فحص حقيقي) */
async function check(){const el=$('#status');
 try{const r=await fetch(CFG.status,{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();const s=j.status==='operational'?'up':j.status==='degraded'?'degraded':'down';el.dataset.s=s;stKey={up:'stUp',degraded:'stDeg',down:'stDown'}[s]}
 catch(e){el.dataset.s='unknown';stKey='stErr'}
 $('#stTxt').textContent=t(stKey)}
check();setInterval(check,60000);
</script>
