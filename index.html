en:{h1:'Welcome to the AQX universe',lead:'Your unified identity for every AQX service.',slogan:'One Account. Infinite Possibilities.',c1t:'Create account',c1d:'Start your journey with AQX.',c2t:'Sign in',c2d:'Pick up where you left off.',c3t:'Plans & subscriptions',c3d:'Explore available services and plans.',note:'A subscription is separate from an account: the account is your identity, the subscription is the services you choose.',about:'AQX Unified Account (AQX-UA) is the official gateway to the AQX (Alqurmani X, alqurmanix) ecosystem: one account to sign in, manage subscriptions and reach every service.',skip:'Skip intro',sndOff:'Sound: off',sndOn:'Sound: on',stU:'Checking status',stUp:'All services operational',stDeg:'Partial degradation',stDown:'Services down',stErr:'Status unavailable',msg:'Your world starts here.',btn:'العربية',back:'Back',fName:'Name',fEmail:'Email',fPass:'Password',fPass2:'Confirm password',terms:'I accept the terms of use and privacy policy',have:'Have an account?',noAcc:'No account yet?',soon:'Soon',choose:'Start with an account',eName:'Enter your name.',eMail:'Invalid email address.',ePass:'Password needs 10+ characters with letters and numbers.',eMatch:'Passwords do not match.',eTerms:'You must accept the terms.',eApi:'No auth service is connected yet. Set it in CFG inside the file.',eLock:'Too many attempts. Wait a minute and retry.',eNet:'Connection failed. Try again later.',eBad:'Request failed. Check your details.',ok:'Done.'}};
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),B=document.body,H=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lang='ar',stKey='stU',soundOn=false,ac;
try{const s=localStorage.getItem('aqx-lang');lang=s||((navigator.language||'').startsWith('en')?'en':'ar')}catch(e){}
const t=k=>D[lang][k]||k;
function render(){
 H.lang=lang;H.dir=lang==='ar'?'rtl':'ltr';
 $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $('#lang').textContent=t('btn');$('#snd').textContent=t(soundOn?'sndOn':'sndOff');$('#stTxt').textContent=t(stKey);
 $('#plans').replaceChildren(...CFG.plans.map(p=>{
  const d=document.createElement('div');d.className='plan'+(p.ft?' ft':'');
  const h=document.createElement('h3');h.textContent=p.n[lang];
  const q=document.createElement('p');q.textContent=p.d[lang];
  const pr=document.createElement('p');pr.className='pr';pr.textContent=t('soon');
  const u=document.createElement('ul');p.f[lang].forEach(x=>{const li=document.createElement('li');li.textContent=x;u.append(li)});
  const a=document.createElement('a');a.className='cta';a.href='#/signup';a.textContent=t('choose');
  d.append(h,q,pr,u,a);return d}));
}
$('#lang').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('aqx-lang',lang)}catch(e){}render()};
/* router */
const V=['home','signup','login','plans'];
function route(){const k=location.hash.replace('#/','');const v=V.includes(k)?k:'home';V.forEach(x=>$('#v-'+x).classList.toggle('on',x===v));scrollTo(0,0)}
addEventListener('hashchange',route);
/* sound (opt-in, synthesized) */
function tone(f1,f2,d,ty,v){if(!soundOn||!ac)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v,n+.06);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+d)}
$('#snd').onclick=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){return}soundOn=!soundOn;render();if(soundOn)tone(120,360,2,'sine',.08)};
/* galaxy canvas */
const cv=$('#fx'),c=cv.getContext('2d');let W,Hh,dpr,mode='galaxy',grow=0,glow=0,tilt=.5,ringA=0;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*dpr;Hh=cv.height=innerHeight*dpr}
size();addEventListener('resize',size);
const N=innerWidth<700?650:1300;
const P=Array.from({length:N},()=>{const r=Math.pow(Math.random(),.65);return{a:((Math.random()*3)|0)*2.094+r*5+(Math.random()-.5)*.55,r0:r,cr:0,s:.3+Math.random()*.9,z:Math.random(),h:Math.random()<.6?188:262,j:Math.random()}});
const S=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),z:Math.random(),p:Math.random()*6}));
function target(p){switch(mode){case'galaxy':return p.r0*grow;case'logo':case'msg':return p.r0*.55+.05;case'ring':return .62+p.j*.015;case'open':return 2.2+p.r0*2;default:return p.r0*1.1+.05}}
function frame(tm){
 c.globalCompositeOperation='source-over';c.clearRect(0,0,W,Hh);
 const cx=W/2,cy=Hh/2,R=Math.min(W,Hh)*.44,ring=mode==='ring'||mode==='open',amb=mode==='ambient';
 for(const s of S){c.fillStyle=`rgba(190,215,255,${(.25+.35*Math.sin(tm/700+s.p))*s.z})`;c.fillRect(s.x*W,s.y*Hh,s.z*1.6*dpr,s.z*1.6*dpr)}
 c.globalCompositeOperation='lighter';
 grow+=((mode==='open'?0:1)-grow)*.02;
 glow+=((({ring:1.2,open:2.4,logo:.7,msg:.7,ambient:.18})[mode]??.6)-glow)*.03;
 tilt+=((ring?1:.5)-tilt)*.03;ringA+=((mode==='ring'?1:0)-ringA)*.04;
 const g=c.createRadialGradient(cx,cy,0,cx,cy,R*(.35+glow*.25));g.addColorStop(0,`rgba(255,255,255,${Math.min(.9,.5*glow)})`);g.addColorStop(.25,`rgba(37,232,255,${.35*glow})`);g.addColorStop(1,'rgba(123,77,255,0)');
 c.fillStyle=g;c.fillRect(0,0,W,Hh);
 for(const p of P){
  p.cr+=(target(p)-p.cr)*(mode==='open'?.05:.035);
  p.a+=(.0015+.004*(1-p.r0*.6))*p.s*(mode==='ring'?2.5:1);
  const al=(amb?.45:.9)*(.35+p.z*.65)*(mode==='open'?Math.max(0,1-(p.cr-.8)/1.6):1);
  c.fillStyle=`hsla(${p.h},100%,${60+p.z*25}%,${al})`;const z=(.6+p.z*1.8)*dpr;
  c.fillRect(cx+Math.cos(p.a)*p.cr*R,cy+Math.sin(p.a)*p.cr*R*tilt,z,z)}
 if(ringA>.02){const gr=c.createLinearGradient(cx-R,cy,cx+R,cy);[0,.5,1].forEach((o,i)=>gr.addColorStop(o,i==1?`rgba(37,232,255,${ringA})`:`rgba(123,77,255,${ringA})`));
  c.lineWidth=5*dpr;c.strokeStyle=gr;c.shadowColor='#25e8ff';c.shadowBlur=30*dpr;c.beginPath();c.ellipse(cx,cy,R*.62,R*.62*tilt,0,0,6.283);c.stroke();c.shadowBlur=0}
 if(!reduce)requestAnimationFrame(frame);
}
/* intro timeline */
let ids=[],done=false;
function ph(n,ms){ids.push(setTimeout(()=>{B.dataset.ph=n;mode=n;if(n==='logo')tone(300,900,.5,'triangle',.09);if(n==='ring')tone(90,700,1.8,'sawtooth',.04);if(n==='msg')typeMsg()},ms))}
function typeMsg(){const el=$('#msg'),x=t('msg');let i=0;const k=setInterval(()=>{el.textContent=x.slice(0,++i);if(i>=x.length)clearInterval(k)},90)}
function finish(){if(done)return;done=true;ids.forEach(clearTimeout);mode='ambient';delete B.dataset.ph;$('#intro').classList.remove('flash');B.classList.remove('intro-on');B.classList.add('revealed')}
render();route();
if(reduce){mode='ambient';P.forEach(p=>p.cr=target(p));frame(0)}
else{B.classList.add('intro-on');requestAnimationFrame(frame);
 ph('galaxy',0);ph('logo',3200);ph('msg',6400);ph('ring',9200);
 ids.push(setTimeout(()=>{B.dataset.ph='open';mode='open';tone(200,1400,1.4,'sine',.07);$('#intro').classList.add('flash')},11000));
 ids.push(setTimeout(finish,12300));
 $('#skip').onclick=finish;addEventListener('keydown',e=>{if(e.key==='Escape')finish()})}
$$('.gate').forEach(g=>g.addEventListener('pointermove',e=>{const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')}));
/* forms */
const MAIL=/^[^\s@]{1,64}@[^\s@]+\.[^\s@]{2,}$/;let fails=0,lock=0;
function strength(v){let s=0;if(v.length>=10)s++;if(v.length>=14)s++;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^\w\s]/.test(v))s++;return s}
const sp=$('#f-signup [name=pass]');sp.addEventListener('input',()=>{const s=strength(sp.value),m=$('#f-signup .meter i');m.style.width=s*20+'%';m.style.background=s<3?'var(--bad)':s<4?'var(--warn)':'var(--ok)'});
async function submit(kind,f,e){
 e.preventDefault();const m=f.querySelector('.fmsg'),b=f.querySelector('.cta'),d=Object.fromEntries(new FormData(f));
 const say=(k,ok)=>{m.textContent=t(k);m.dataset.ok=ok?1:0};
 if(d.website)return;
 if(Date.now()<lock)return say('eLock');
 if(kind==='signup'&&!d.name.trim())return say('eName');
 if(!MAIL.test(d.email.trim()))return say('eMail');
 if(kind==='signup'){if(strength(d.pass)<2||!/\d/.test(d.pass)||!/[A-Za-z]/.test(d.pass)||d.pass.length<10)return say('ePass');if(d.pass!==d.pass2)return say('eMatch');if(!d.terms)return say('eTerms')}
 else if(!d.pass)return say('ePass');
 const url=CFG.api[kind];if(!url)return say('eApi');
 b.disabled=true;
 try{const r=await fetch(url,{method:'POST',credentials:'omit',referrerPolicy:'no-referrer',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:d.name,email:d.email.trim(),password:d.pass})});
  if(r.ok){fails=0;say('ok',1)}else{if(++fails>=5)lock=Date.now()+60000;say('eBad')}}
 catch(x){say('eNet')}
 b.disabled=false;
}
$('#f-signup').addEventListener('submit',e=>submit('signup',e.currentTarget,e));
$('#f-login').addEventListener('submit',e=>submit('login',e.currentTarget,e));
/* حالة الخدمات من status.json (فحص حقيقي) */
async function check(){const el=$('#status');
 try{const r=await fetch(CFG.status,{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();const s=j.status==='operational'?'up':j.status==='degraded'?'degraded':'down';el.dataset.s=s;stKey={up:'stUp',degraded:'stDeg',down:'stDown'}[s]}
 catch(e){el.dataset.s='unknown';stKey='stErr'}
 $('#stTxt').textContent=t(stKey)}
check();setInterval(check,60000);
</script>
</body>
