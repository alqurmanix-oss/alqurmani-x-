<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد — AQX</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .turnstile-box { margin: 20px 0; display: flex; justify-content: center; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; text-align: center; font-size: 14px; padding: 10px; border-radius: 6px; word-break: break-word; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>إنشاء حساب جديد</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label for="password">كلمة السر (8 خانات على الأقل)</label>
            <input type="password" id="password" required placeholder="••••••••••••">
        </div>
        <div class="form-group">
            <label for="confirmPassword">تأكيد كلمة السر</label>
            <input type="password" id="confirmPassword" required placeholder="••••••••••••">
        </div>

        <div class="turnstile-box">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAFh8zv9K_UZuq3Fm" data-action="aqx_register"></div>
        </div>

        <button type="submit" id="submitBtn">تسجيل الحساب</button>
    </form>
    <div id="message"></div>
</div>

<script>
    const PIPEDREAM_URL = "https://eopyvduj2s3rcj0.m.pipedream.net";

    function getOrCreateDeviceId() {
        let deviceId = localStorage.getItem("aqx_device_id");
        if (!deviceId || deviceId.length < 16) {
            deviceId = "dev_web_" + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem("aqx_device_id", deviceId);
        }
        return deviceId;
    }

    document.getElementById("registerForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        
        const turnstileInput = document.querySelector('[name="cf-turnstile-response"]');
        const turnstileToken = turnstileInput ? turnstileInput.value : "";

        const messageDiv = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");

        messageDiv.textContent = "";
        messageDiv.className = "";

        if (password !== confirmPassword) {
            messageDiv.className = "error";
            messageDiv.textContent = "خطأ: كلمة السر وتأكيدها غير متطابقتين.";
            return;
        }

        if (!turnstileToken) {
            messageDiv.className = "error";
            messageDiv.textContent = "يرجى إكمال التحقق الأمني (Turnstile).";
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "جاري إنشاء الحساب...";

        try {
            const response = await fetch(PIPEDREAM_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    confirmPassword: confirmPassword,
                    deviceId: getOrCreateDeviceId(),
                    turnstileToken: turnstileToken
                })
            });

            // قراءة الرد كـ Text أولاً لتجنب انهيار الـ JSON لو الخادم أرجع خطأ نصي
            const rawText = await response.text();
            let data = {};
            try {
                data = JSON.parse(rawText);
            } catch {
                data = { code: rawText || "SERVER_INVALID_RESPONSE" };
            }

            if (response.ok && (data.success || data.ok)) {
                messageDiv.className = "success";
                messageDiv.textContent = "تم إنشاء الحساب بنجاح! تم إرسال بريد التفعيل.";
                document.getElementById("registerForm").reset();
            } else {
                messageDiv.className = "error";
                messageDiv.textContent = "خطأ من الخادم: " + (data.code || data.message || response.statusText);
            }
        } catch (err) {
            messageDiv.className = "error";
            messageDiv.textContent = "خطأ في الشبكة أو الاتصال: " + err.message;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "تسجيل الحساب";
            if (typeof turnstile !== "undefined") {
                turnstile.reset();
            }
        }
    });
</script>

</body>
</html>
