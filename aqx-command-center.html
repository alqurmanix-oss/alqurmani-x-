*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;padding-top:env(safe-area-inset-top,0)}

#side{position:fixed;top:0;right:0;bottom:0;width:250px;background:linear-gradient(180deg,#fff,#effbfa);border-left:2px solid var(--g2);padding:18px 12px;overflow:auto;z-index:30;transition:.3s}
.lg{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}.lg b{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--t),var(--g));color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 8px 20px #14b8a655}
.lg span{font-weight:800;line-height:1.2}.lg small{display:block;color:var(--g);font-size:11px;letter-spacing:1px}
#side a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;color:var(--tx);text-decoration:none;font-weight:500;margin:2px 0;transition:.2s;cursor:pointer}
#side a:hover{background:linear-gradient(90deg,#14b8a622,#d4a01722);transform:translateX(-4px)}
main{margin-right:250px;padding:0 22px 60px}
#top{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:14px 0;backdrop-filter:blur(14px);background:#f4fbfbd9}
#top input{flex:1;min-width:0;padding:12px 18px;border-radius:30px;border:1.5px solid var(--bd);background:#fff;font:inherit;color:var(--tx);outline:0}
#top input:focus{border-color:var(--t);box-shadow:0 0 0 4px #14b8a622}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--bd);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:18px;position:relative}
.ib i{position:absolute;top:-4px;left:-4px;background:var(--g);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;font-style:normal}
.ac{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--bd);border-radius:30px;padding:4px 14px 4px 6px;font-size:13px}.ac b{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--t),var(--s));display:grid;place-items:center;color:#fff}
#burger{display:none}
.hero{border-radius:28px;padding:28px;background:linear-gradient(120deg,#fff 0,#dff8f4 45%,#d9efff 100%);border:1.5px solid var(--g2);box-shadow:0 20px 50px #14b8a618;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(#f5d36b88,transparent 70%)}
.hero h1{font-size:clamp(24px,4vw,40px);font-weight:800;background:linear-gradient(90deg,var(--t2),var(--s),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
.hero p{color:var(--mu);margin-top:4px}.clk{text-align:center;z-index:1}.clk b{font-size:clamp(26px,4vw,38px);display:block;color:var(--t2)}.clk span{color:var(--mu);font-size:13px}
.tk{margin:16px 0;overflow:hidden;border-radius:14px;background:#fff;border:1.5px solid var(--bd);white-space:nowrap}
.tk div{display:inline-block;padding:11px 0;animation:mq 45s linear infinite}.tk:hover div{animation-play-state:paused}
.tk span{margin:0 22px;font-weight:700}.up{color:#0a9a6a}.dn{color:#d33}
@keyframes mq{to{transform:translateX(50%)}}
h2{margin:30px 0 14px;font-size:22px;display:flex;align-items:center;gap:10px}h2:before{content:"";width:6px;height:24px;border-radius:4px;background:linear-gradient(var(--t),var(--g))}

.tabs button.on{background:linear-gradient(90deg,var(--t),var(--s));color:#fff;border-color:transparent;box-shadow:0 8px 18px #14b8a644}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:12px}

.cd:hover{transform:translateY(-5px);box-shadow:0 18px 36px #14b8a622;border-color:var(--g2)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.ic{font-size:30px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#dff8f4,#fff6d8);margin-bottom:10px}
.cd h3{font-size:15px;font-weight:700}.cd .v{font-size:26px;font-weight:800;color:var(--t2);margin-top:6px}.cd .d{font-size:12px;margin-top:2px;color:var(--mu);min-height:16px}
.lp{position:absolute;top:14px;left:14px;width:12px;height:12px;border-radius:50%;background:#e53935;box-shadow:0 0 0 3px #e5393522}
.lp.ok{background:#12c26b;animation:bl 1.6s infinite}
@keyframes bl{0%,100%{box-shadow:0 0 0 3px #12c26b33,0 0 4px #12c26b}50%{box-shadow:0 0 0 6px #12c26b11,0 0 16px #12c26b}}
