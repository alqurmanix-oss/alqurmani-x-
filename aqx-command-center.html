<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد | AQX Auth</title>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #fff; margin-bottom: 20px; }
    .group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; }
    input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #2ea043; }
    .msg { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; display: none; text-align: center; }
    .error { background: rgba(218,54,51,0.2); border: 1px solid #da3633; color: #f85149; }
    .success { background: rgba(35,134,54,0.2); border: 1px solid #238636; color: #3fb950; }
  </style>
</head>
<body>

  <div class="card">
    <h2>إنشاء حساب جديد</h2>
    <div id="msgBox" class="msg"></div>

    <form id="regForm" action="https://script.google.com/macros/s/AKfycbwY1gTZS7rEvPfCCRvqD1E3pdOjB3hgCTDEx6eYMfyHkCzIqczfpaEunw2JBebVIE1WBw/exec" method="POST" onsubmit="return validateForm(event)">
      <input type="hidden" name="device_id" id="deviceId">
      
      <div class="group">
        <label>البريد الإلكتروني</label>
        <input type="email" name="email" id="email" required>
      </div>

      <div class="group">
        <label>كلمة السر</label>
        <input type="password" name="password" id="password" required>
      </div>

      <div class="group">
        <label>تأكيد كلمة السر</label>
        <input type="password" name="password_confirm" id="passwordConfirm" required>
      </div>

      <button type="submit" id="submitBtn">تسجيل الحساب</button>
    </form>
  </div>

  <script>
    let devId = localStorage.getItem("aqx_dev_id");
    if (!devId) {
      devId = "DEV-" + Math.random().toString(36).substring(2, 10) + "-" + Date.now();
      localStorage.setItem("aqx_dev_id", devId);
    }
    document.getElementById("deviceId").value = devId;

    function validateForm(e) {
      const p1 = document.getElementById("password").value;
      const p2 = document.getElementById("passwordConfirm").value;
      const msgBox = document.getElementById("msgBox");

      if (p1 !== p2) {
        e.preventDefault();
        msgBox.textContent = "كلمة السر وتأكيد كلمة السر غير متطابقين.";
        msgBox.className = "msg error";
        msgBox.style.display = "block";
        return false;
      }

      if (p1.length < 8) {
        e.preventDefault();
        msgBox.textContent = "كلمة السر يجب أن تكون 8 أحرف على الأقل.";
        msgBox.className = "msg error";
        msgBox.style.display = "block";
        return false;
      }

      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").textContent = "جاري التسجيل...";
      return true;
    }
  </script>
</body>
</html>
