
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>إنشاء حساب AQX</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f3f5f9;
      color: #182230;
    }
    .card {
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid #e0e5ed;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 40px #15243b12;
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .intro { margin: 0 0 24px; color: #637083; line-height: 1.7; }
    label { display: block; margin: 16px 0 7px; font-weight: 650; }
    input {
      display: block;
      width: 100%;
      min-height: 47px;
      padding: 11px 13px;
      border: 1px solid #ccd4df;
      border-radius: 9px;
      font: inherit;
      background: #fff;
    }
    input:focus {
      outline: 3px solid #2563eb25;
      border-color: #2563eb;
    }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #174ea6;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    #status.show { display: block; }
    #status.error { color: #9c2020; background: #fff0f0; }
    #status.success { color: #17653a; background: #eaf8ef; }
    #status.info { color: #174a85; background: #edf5ff; }
    .captcha { margin-top: 18px; overflow-x: auto; }
    .foot { margin-top: 18px; color: #6c7787; font-size: 13px; line-height: 1.7; }
  </style>
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async defer>
  </script>
</head>
<body>
  <main class="card">
    <h1>إنشاء حساب AQX</h1>
    <p class="intro">أنشئ حسابك الموحد للوصول إلى خدمات AQX.</p>

    <form id="registerForm">
      <label for="displayName">الاسم</label>
      <input id="displayName" name="displayName"
        autocomplete="name" maxlength="100" required>

      <label for="email">البريد الإلكتروني</label>
      <input id="email" name="email" type="email"
        autocomplete="email" maxlength="254" required>

      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password"
        autocomplete="new-password" minlength="8" maxlength="128" required>

      <div class="captcha">
        <div class="cf-turnstile"
          data-sitekey="0x4AAAAAAFh8zv9K_UZuq3Fm"
          data-action="aqx_register"
          data-callback="aqxCaptchaSuccess"
          data-expired-callback="aqxCaptchaExpired"
          data-error-callback="aqxCaptchaExpired">
        </div>
      </div>

      <button id="submitButton" type="submit">إنشاء الحساب</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>

    <p class="foot">
      تُرسل بيانات التسجيل إلى خدمة AQX المركزية عبر اتصال HTTPS.
      لا تشارك كلمة المرور مع أي شخص.
    </p>
  </main>

  <script>
    "use strict";

    const REGISTER_ENDPOINT =
      "https://eopyvduj2s3rcj0.m.pipedream.net";

    const form = document.getElementById("registerForm");
    const button = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");

    let captchaToken = "";

    window.aqxCaptchaSuccess = function (token) {
      captchaToken = token;
    };

    window.aqxCaptchaExpired = function () {
      captchaToken = "";
    };

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = "show " + type;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!captchaToken) {
        showStatus("أكمل اختبار التحقق الأمني أولًا.", "error");
        return;
      }

      const payload = {
        displayName: document.getElementById("displayName").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        turnstileToken: captchaToken
      };

      button.disabled = true;
      showStatus("جارٍ إرسال طلب التسجيل...", "info");

      try {
        const response = await fetch(REGISTER_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          cache: "no-store",
          credentials: "omit"
        });

        let result;
        try {
          result = await response.json();
        } catch {
          throw new Error(
            "استجابة الخادم ليست JSON صالحًا. تحقق من إعداد استجابة Pipedream."
          );
        }

        if (!response.ok || result.ok !== true) {
          const requestId = result.requestId
            ? "\nرقم الطلب: " + result.requestId
            : "";

          throw new Error(
            (result.message || "فشل إنشاء الحساب.") + requestId
          );
        }

        form.reset();
        captchaToken = "";

        if (window.turnstile) {
          window.turnstile.reset();
        }

        showStatus(
          result.message || "تم إنشاء الحساب بنجاح.",
          "success"
        );
      } catch (error) {
        showStatus(
          error.message ||
            "تعذر الاتصال بمحرك التسجيل. حاول مرة أخرى.",
          "error"
        );

        captchaToken = "";
        if (window.turnstile) {
          window.turnstile.reset();
        }
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
