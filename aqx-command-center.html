
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>إنشاء حساب جديد | AQX ID</title>
  <meta name="description" content="أنشئ حساب AQX موحدًا للوصول إلى خدمات ومشاريع AQX.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #111c30;
      --border: #283750;
      --text: #f4f7fb;
      --muted: #9eacc2;
      --accent: #68a5ff;
      --danger: #ff8585;
      --success: #72e0ad;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #1b3154 0, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .container { width: 100%; max-width: 440px; }
    .brand { text-align: center; margin-bottom: 24px; }
    .logo {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #6caaff, #5365df);
      color: white;
      font-size: 27px;
      font-weight: 850;
      letter-spacing: -2px;
    }
    h1 { font-size: 27px; margin: 0 0 9px; }
    .subtitle { color: var(--muted); font-size: 14px; line-height: 1.8; }
    .panel {
      background: rgba(17, 28, 48, .96);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 25px 22px;
      box-shadow: 0 24px 70px #0004;
    }
    .field { margin-bottom: 17px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; }
    input {
      display: block;
      width: 100%;
      min-height: 48px;
      border-radius: 11px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      background: #0b1425;
      color: var(--text);
      font: inherit;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #68a5ff20;
    }
    .hint { color: var(--muted); font-size: 12px; margin-top: 7px; }
    .check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
      margin: 5px 0 18px;
    }
    .check input {
      width: 17px;
      min-height: 17px;
      margin-top: 4px;
      flex: 0 0 auto;
      accent-color: var(--accent);
    }
    .check a, .footer a { color: var(--accent); }
    button {
      width: 100%;
      min-height: 49px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #081426;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin: 0 0 16px;
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    #message.error { display: block; color: var(--danger); background: #ff858512; }
    #message.success { display: block; color: var(--success); background: #72e0ad12; }
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 20px;
    }
    .security {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 17px;
      line-height: 1.8;
    }
    @media (max-width: 380px) {
      .panel { padding: 21px 16px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand">
      <div class="logo" aria-hidden="true">AQX</div>
      <h1>إنشاء حساب جديد</h1>
      <div class="subtitle">
        أنشئ هويتك الموحدة للوصول إلى خدمات AQX.
      </div>
    </header>

    <section class="panel">
      <form id="registerForm">
        <div id="message" role="status" aria-live="polite"></div>

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" name="email" type="email"
                 autocomplete="email" maxlength="254"
                 placeholder="name@example.com" required>
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password"
                 autocomplete="new-password" minlength="8"
                 maxlength="128" placeholder="8 أحرف على الأقل" required>
          <div class="hint">استخدم كلمة مرور قوية لا تستخدمها في مواقع أخرى.</div>
        </div>

        <div class="field">
          <label for="confirmPassword">تأكيد كلمة المرور</label>
          <input id="confirmPassword" name="confirmPassword"
                 type="password" autocomplete="new-password"
                 minlength="8" maxlength="128"
                 placeholder="أعد كتابة كلمة المرور" required>
        </div>

        <label class="check">
          <input id="terms" type="checkbox" required>
          <span>أوافق على شروط الاستخدام وسياسة الخصوصية.</span>
        </label>

        <button id="submitButton" type="submit">إنشاء الحساب</button>
      </form>
    </section>

    <div class="footer">
      لديك حساب بالفعل؟ <a href="https://id.alqurmanix.com">تسجيل الدخول</a>
    </div>

    <div class="security">
      حماية الحساب والتحقق من التسجيل عبر أنظمة AQX.
      <br>لن يُطلب منك تحديد موقعك الجغرافي.
    </div>
  </main>

  <script>
    "use strict";

    const REGISTER_ENDPOINT =
      "https://eopyvduj2s3rcj0.m.pipedream.net";

    const form = document.getElementById("registerForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    // معرف عشوائي محلي للجهاز، وليس بصمة مادية موثوقة.
    function getDeviceId() {
      const key = "aqx_registration_device_id";
      try {
        let id = localStorage.getItem(key);
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem(key, id);
        }
        return id;
      } catch {
        return crypto.randomUUID();
      }
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "";
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("كلمتا المرور غير متطابقتين.", "error");
        return;
      }

      /*
       * المحرك الحالي يشترط turnstileToken عند تفعيل الحماية.
       * لا يمكن إنشاء هذا الرمز من الواجهة دون إعداد Turnstile
       * بمفتاح الموقع الصحيح.
       */
      showMessage(
        "تعذر بدء التسجيل: يجب إعداد Cloudflare Turnstile وربطه بالواجهة أولًا.",
        "error"
      );
    });
  </script>
</body>
</html>
