
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081426">
<meta name="description" content="إنشاء حساب AQX Identity">
<title>إنشاء حساب | AQX Identity</title>

<style>
:root{
  --bg:#071323;
  --panel:#10243b;
  --field:#08192b;
  --gold:#d7b46a;
  --gold2:#f0d596;
  --text:#f5f3ed;
  --muted:#aab8c9;
  --green:#4bd49a;
  --red:#ff7777;
  --blue:#83baff;
  --line:rgba(215,180,106,.22);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:24px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 15% 10%,rgba(30,75,115,.25),transparent 38%),
    radial-gradient(ellipse at 90% 90%,rgba(180,135,60,.10),transparent 35%),
    linear-gradient(145deg,#06111f,#0a1b30 55%,#071323);
}

button,input{font:inherit}
button{cursor:pointer}

.page{width:100%;max-width:510px;margin:auto}

.brand{text-align:center;margin-bottom:22px}

.brand-mark{
  width:62px;height:62px;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(215,180,106,.55);
  border-radius:19px;color:var(--gold2);
  background:linear-gradient(145deg,#18324e,#0c1c30);
  font-size:27px;font-weight:bold;
}

.brand h1{margin:0;font-size:25px;color:var(--gold2)}
.brand p{margin:8px 0 0;color:var(--muted);font-size:13px}

.card{
  padding:30px;
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(160deg,rgba(19,43,69,.97),rgba(10,27,46,.98));
  box-shadow:0 24px 70px rgba(0,0,0,.35);
}

.card-title{margin:0 0 8px;font-size:22px}
.card-subtitle{margin:0 0 23px;color:var(--muted);font-size:13px;line-height:1.9}

.field{margin-bottom:17px}

.field label{
  display:block;margin-bottom:8px;
  color:#e7eaf0;font-size:13px;font-weight:bold;
}

.field input{
  width:100%;height:49px;padding:0 14px;
  outline:none;color:#fff;background:var(--field);
  border:1px solid rgba(170,190,215,.20);
  border-radius:11px;direction:ltr;text-align:left;
  transition:.2s;
}

.field input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(215,180,106,.10);
}

.field input::placeholder{color:#75869b}

.password-wrap{position:relative}
.password-wrap input{padding-left:75px}

.toggle-password{
  position:absolute;left:9px;top:50%;
  transform:translateY(-50%);
  border:0;color:var(--gold2);
  background:transparent;font-size:12px;padding:7px;
}

.hint{
  display:block;min-height:18px;margin-top:6px;
  color:var(--muted);font-size:11px;line-height:1.7;
}

.hint.success{color:var(--green)}
.hint.error{color:var(--red)}
.hint.info{color:var(--blue)}

.email-result{
  display:none;margin-top:9px;padding:11px 12px;
  border-radius:9px;font-size:12px;line-height:1.8;
}

.email-result.show{display:block}
.email-result.success{
  color:#a9f1d0;background:rgba(75,212,154,.08);
  border:1px solid rgba(75,212,154,.25);
}
.email-result.error{
  color:#ffc0c0;background:rgba(255,119,119,.08);
  border:1px solid rgba(255,119,119,.25);
}
.email-result.info{
  color:#c7ddf7;background:rgba(131,186,255,.08);
  border:1px solid rgba(131,186,255,.25);
}

.message{
  display:none;padding:13px 14px;margin:0 0 17px;
  border-radius:10px;font-size:12px;line-height:1.9;
  white-space:pre-line;
}
.message.show{display:block}
.message.success{color:#a9f1d0;background:rgba(75,212,154,.08);border:1px solid rgba(75,212,154,.25)}
.message.error{color:#ffc0c0;background:rgba(255,119,119,.08);border:1px solid rgba(255,119,119,.25)}
.message.info{color:#c7ddf7;background:rgba(131,186,255,.08);border:1px solid rgba(131,186,255,.25)}

.check-row{
  display:flex;align-items:flex-start;gap:9px;
  margin:17px 0;color:#cbd5e1;
  font-size:12px;line-height:1.9;
}
.check-row input{
  width:16px;height:16px;margin-top:3px;
  accent-color:var(--gold);
}
.check-row a{color:var(--gold2);text-decoration:none}

.primary-btn{
  width:100%;min-height:50px;border:0;border-radius:11px;
  color:#172235;
  background:linear-gradient(110deg,#c49a4d,#f0d596);
  font-weight:bold;font-size:15px;
  transition:.2s;
}
.primary-btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.primary-btn:disabled{opacity:.55;cursor:not-allowed}

.divider{
  display:flex;align-items:center;gap:12px;
  margin:22px 0;color:#8292a6;font-size:11px;
}
.divider:before,.divider:after{
  content:"";height:1px;flex:1;background:rgba(170,190,215,.17);
}

.providers{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.providers.show{display:grid}

.provider-btn{
  min-height:46px;border:1px solid rgba(170,190,215,.22);
  border-radius:10px;background:#0b1b2e;
  color:#e9edf4;font-size:12px;
}
.provider-btn:hover{border-color:var(--gold);background:#132b45}
.provider-btn:disabled{opacity:.5;cursor:not-allowed}

.bottom-link{
  margin:23px 0 0;text-align:center;
  color:var(--muted);font-size:13px;
}
.bottom-link a{color:var(--gold2);font-weight:bold;text-decoration:none}

.footer{text-align:center;margin-top:18px;color:#718198;font-size:11px}

.captcha-area{margin:14px 0}
.captcha-area:empty{display:none}

.honeypot{
  position:absolute!important;width:1px!important;height:1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;
}

@media(max-width:520px){
  body{padding:18px 12px}
  .card{padding:23px 18px}
  .brand h1{font-size:22px}
}
</style>
</head>

<body>
<main class="page">

  <header class="brand">
    <div class="brand-mark">AQX</div>
    <h1>AQX Identity</h1>
    <p>الحساب الموحد لمنظومة القرماني إكس</p>
  </header>

  <section class="card">

    <h2 class="card-title">إنشاء حساب جديد</h2>
    <p class="card-subtitle">
      أنشئ حسابك الموحد للوصول إلى خدمات ومنصات AQX.
    </p>

    <div id="registrationNotice" class="message"></div>
    <div id="formMessage" class="message"></div>

    <form id="signupForm" novalidate>

      <div class="honeypot" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input
          id="email"
          type="email"
          placeholder="example@email.com"
          autocomplete="email"
          maxlength="254"
          required
        >

        <small id="emailHint" class="hint">
          أدخل بريدك الإلكتروني.
        </small>

        <div id="emailResult" class="email-result"></div>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>

        <div class="password-wrap">
          <input
            id="password"
            type="password"
            placeholder="8 أحرف على الأقل"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            required
          >
          <button class="toggle-password" type="button" data-target="password">إظهار</button>
        </div>

        <small id="passwordHint" class="hint">
          يجب ألا تقل كلمة المرور عن 8 أحرف.
        </small>
      </div>

      <div class="field">
        <label for="confirmPassword">تأكيد كلمة المرور</label>

        <div class="password-wrap">
          <input
            id="confirmPassword"
            type="password"
            placeholder="أعد كتابة كلمة المرور"
            autocomplete="new-password"
            required
          >
          <button class="toggle-password" type="button" data-target="confirmPassword">إظهار</button>
        </div>

        <small id="confirmHint" class="hint"></small>
      </div>

      <div id="captchaArea" class="captcha-area"></div>

      <label class="check-row">
        <input id="terms" type="checkbox" required>
        <span>
          أوافق على
          <a href="https://id.alqurmanix.com/terms.html" target="_blank" rel="noopener">
            الشروط والأحكام
          </a>
          وسياسة استخدام منظومة AQX.
        </span>
      </label>

      <button id="submitButton" class="primary-btn" type="submit">
        إنشاء الحساب
      </button>

    </form>

    <div id="providerSection" hidden>
      <div class="divider">أو التسجيل باستخدام</div>
      <div id="providers" class="providers"></div>
    </div>

    <p class="bottom-link">
      لديك حساب بالفعل؟
      <a href="https://id.alqurmanix.com/login.html">
        سجل دخول
      </a>
    </p>

  </section>

  <footer class="footer">
    AQX Identity · Unified Digital Identity System
  </footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

<script>
(() => {
"use strict";

/* =========================================
   إعدادات AQX Identity
========================================= */

const CFG = {
  URL: "https://fkiokwwztbyztleeuwks.supabase.co",
  KEY: "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_",

  STATUS: "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity/v1/registration/status",

  EMAIL: "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity/v1/registration/email-status",

  SIGNUP: "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity/v1/registration/signup",

  OAUTH: "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity/v1/registration/oauth-check",

  LOGIN: "https://id.alqurmanix.com/login.html",
  CONFIRMED: "https://id.alqurmanix.com/confirmed.html",

  TIMEOUT: 15000
};

const $ = id => document.getElementById(id);

const state = {
  policy: null,
  policyLoaded: false,
  policyBusy: false,

  emailTimer: null,
  emailRequest: 0,
  emailChecked: "",
  emailStatus: "",
  emailBusy: false,

  submitting: false,
  oauthBusy: false,

  captchaRequired: false,
  captchaSiteKey: "",
  captchaToken: "",
  captchaWidget: null,

  startedAt: Date.now()
};

/* =========================================
   أدوات عامة
========================================= */

function showMessage(id, type, text) {
  const el = $(id);
  el.className = "message show " + type;
  el.textContent = text;
}

function hideMessage(id) {
  const el = $(id);
  el.className = "message";
  el.textContent = "";
}

function setHint(id, text, type = "") {
  const el = $(id);
  el.textContent = text;
  el.className = "hint" + (type ? " " + type : "");
}

function showEmailResult(type, text) {
  const el = $("emailResult");
  el.className = "email-result show " + type;
  el.textContent = text;
}

function hideEmailResult() {
  const el = $("emailResult");
  el.className = "email-result";
  el.textContent = "";
}

async function requestJSON(url, options = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), CFG.TIMEOUT);

  try {
    const response = await fetch(url, {
      ...options,
      signal: controller.signal,
      cache: "no-store",
      headers: {
        apikey: CFG.KEY,
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    const data = await response.json().catch(() => null);

    return {
      ok: response.ok,
      status: response.status,
      data
    };
  } finally {
    clearTimeout(timer);
  }
}

function validEmail(value) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value) &&
    value.length <= 254;
}

function providerEnabled(methods, name) {
  const item = methods?.[name];

  if (item === true) return true;

  if (item && typeof item === "object") {
    return item.signup_enabled === true || item.enabled === true;
  }

  return false;
}

function getReferral() {
  const params = new URLSearchParams(location.search);

  const platform = params.get("platform_id") || "";
  const code = (
    params.get("ref") ||
    params.get("code") ||
    ""
  ).toLowerCase();

  if (
    /^[0-9a-f-]{36}$/i.test(platform) &&
    /^[0-9a-f]{32}$/.test(code)
  ) {
    return {
      platform_id: platform,
      code
    };
  }

  return null;
}

/* =========================================
   سياسة التسجيل
   لا تؤثر على ظهور الصفحة
========================================= */

async function loadPolicy() {
  if (state.policyBusy) return;

  state.policyBusy = true;

  try {
    const result = await requestJSON(CFG.STATUS, {
      method: "GET"
    });

    if (!result.ok || result.data?.success !== true) {
      throw new Error("POLICY_UNAVAILABLE");
    }

    const policy = result.data;
    state.policy = policy;
    state.policyLoaded = true;

    const methods = policy.signup_methods || {};
    const open = policy.registration_open === true;

    if (!open) {
      showMessage(
        "registrationNotice",
        "error",
        policy.closed_reason || "التسجيل مغلق حاليًا."
      );

      $("submitButton").disabled = true;
      renderProviders({});
      return;
    }

    hideMessage("registrationNotice");

    $("submitButton").disabled =
      !providerEnabled(methods, "email");

    if (!providerEnabled(methods, "email")) {
      showMessage(
        "registrationNotice",
        "info",
        "التسجيل بالبريد الإلكتروني غير متاح حاليًا."
      );
    }

    renderProviders(methods);

    state.captchaRequired = policy.captcha?.enabled === true;
    state.captchaSiteKey = policy.captcha?.site_key || "";

    if (state.captchaRequired && state.captchaSiteKey) {
      loadCaptcha();
    }

  } catch (error) {
    /*
      لا نعرض تفاصيل الاتصال للزائر.
      لا نخفي النموذج.
      يظل الخادم هو صاحب القرار النهائي.
    */
    console.warn("AQX policy request failed:", error);
  } finally {
    state.policyBusy = false;
  }
}

/* =========================================
   مزودات التسجيل
   لا يظهر إلا المزود المفعّل
========================================= */

const PROVIDERS = [
  {key:"google", name:"Google", oauth:"google"},
  {key:"github", name:"GitHub", oauth:"github"},
  {key:"microsoft", name:"Microsoft", oauth:"azure"},
  {key:"apple", name:"Apple", oauth:"apple"},
  {key:"facebook", name:"Facebook", oauth:"facebook"},
  {key:"discord", name:"Discord", oauth:"discord"},
  {key:"linkedin", name:"LinkedIn", oauth:"linkedin_oidc"}
];

function renderProviders(methods) {
  const container = $("providers");
  const section = $("providerSection");

  container.replaceChildren();

  const active = PROVIDERS.filter(item =>
    providerEnabled(methods, item.key)
  );

  if (!active.length) {
    section.hidden = true;
    container.classList.remove("show");
    return;
  }

  active.forEach(item => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "provider-btn";
    button.textContent = item.name;
    button.dataset.provider = item.key;
    button.dataset.oauth = item.oauth;

    button.addEventListener("click", () => {
      startOAuth(item);
    });

    container.appendChild(button);
  });

  section.hidden = false;
  container.classList.add("show");
}

/* =========================================
   فحص البريد
   يتم عند مغادرة خانة البريد
   ويظهر قبل كتابة كلمة المرور
========================================= */

function normalizeEmailStatus(data) {
  const status = String(data?.status || "").toLowerCase();

  if (status === "registered") return "registered";
  if (status === "reserved") return "reserved";
  if (status === "blocked") return "blocked";
  if (status === "available") return "available";
  if (status === "invalid") return "invalid";

  return "unknown";
}

function displayEmailStatus(status) {
  state.emailStatus = status;

  if (status === "registered") {
    showEmailResult(
      "error",
      "هذا البريد موجود بالفعل ومسجل في AQX. استخدم تسجيل الدخول."
    );
    setHint("emailHint", "البريد مسجل بالفعل.", "error");
    return;
  }

  if (status === "reserved") {
    showEmailResult(
      "error",
      "هذا البريد محجوز حاليًا ولا يمكن استخدامه للتسجيل."
    );
    setHint("emailHint", "البريد محجوز.", "error");
    return;
  }

  if (status === "blocked") {
    showEmailResult(
      "error",
      "هذا البريد محظور وغير مسموح بالتسجيل به."
    );
    setHint("emailHint", "البريد محظور.", "error");
    return;
  }

  if (status === "invalid") {
    showEmailResult(
      "error",
      "صيغة البريد الإلكتروني غير صحيحة."
    );
    setHint("emailHint", "البريد غير صحيح.", "error");
    return;
  }

  if (status === "available") {
    showEmailResult(
      "success",
      "هذا البريد متاح ويمكنك متابعة التسجيل."
    );
    setHint("emailHint", "البريد متاح.", "success");
    return;
  }

  showEmailResult(
    "info",
    "تعذر تحديد حالة البريد حاليًا. يمكنك المتابعة وسيعيد المحرك التحقق عند التسجيل."
  );
  setHint("emailHint", "لم يتم تأكيد حالة البريد.", "info");
}

async function checkEmail() {
  const email = $("email").value.trim().toLowerCase();

  if (!email) {
    state.emailChecked = "";
    state.emailStatus = "";
    hideEmailResult();
    setHint("emailHint", "أدخل بريدك الإلكتروني.");
    return;
  }

  if (!validEmail(email)) {
    state.emailChecked = "";
    state.emailStatus = "invalid";
    displayEmailStatus("invalid");
    return;
  }

  if (state.emailChecked === email && state.emailStatus) {
    return;
  }

  const requestNumber = ++state.emailRequest;

  state.emailBusy = true;
  state.emailStatus = "";
  state.emailChecked = "";

  showEmailResult("info", "جارٍ فحص البريد...");
  setHint("emailHint", "يتم فحص البريد الإلكتروني.", "info");

  try {
    const result = await requestJSON(CFG.EMAIL, {
      method: "POST",
      body: JSON.stringify({email})
    });

    if (requestNumber !== state.emailRequest) return;

    if (!result.ok || result.data?.success !== true) {
      throw new Error("EMAIL_CHECK_FAILED");
    }

    const status = normalizeEmailStatus(result.data);

    state.emailChecked = email;
    displayEmailStatus(status);

  } catch (error) {
    if (requestNumber !== state.emailRequest) return;

    state.emailChecked = email;
    state.emailStatus = "unknown";

    showEmailResult(
      "info",
      "تعذر فحص البريد الآن. سيعيد المحرك التحقق عند التسجيل."
    );

    setHint(
      "emailHint",
      "تعذر تأكيد حالة البريد.",
      "info"
    );

  } finally {
    if (requestNumber === state.emailRequest) {
      state.emailBusy = false;
    }
  }
}

$("email").addEventListener("input", () => {
  clearTimeout(state.emailTimer);

  state.emailRequest++;
  state.emailChecked = "";
  state.emailStatus = "";
  state.emailBusy = false;

  hideEmailResult();

  const value = $("email").value.trim();

  if (!value) {
    setHint("emailHint", "أدخل بريدك الإلكتروني.");
    return;
  }

  if (!validEmail(value)) {
    setHint("emailHint", "صيغة البريد غير صحيحة.", "error");
    return;
  }

  setHint("emailHint", "سيتم فحص البريد عند الانتقال إلى كلمة المرور.");
});

/*
  عند مغادرة البريد يبدأ الفحص.
  وعند دخول المستخدم إلى كلمة المرور نضمن بدء الفحص فورًا.
*/
$("email").addEventListener("blur", () => {
  clearTimeout(state.emailTimer);
  checkEmail();
});

$("password").addEventListener("focus", () => {
  const email = $("email").value.trim().toLowerCase();

  if (
    validEmail(email) &&
    state.emailChecked !== email &&
    !state.emailBusy
  ) {
    checkEmail();
  }
});

/* =========================================
   التحقق من كلمات المرور
========================================= */

function validatePasswords() {
  const password = $("password").value;
  const confirm = $("confirmPassword").value;

  if (password.length < 8) {
    setHint(
      "passwordHint",
      "كلمة المرور يجب ألا تقل عن 8 أحرف.",
      "error"
    );
  } else {
    setHint(
      "passwordHint",
      "كلمة المرور مناسبة.",
      "success"
    );
  }

  if (!confirm) {
    setHint("confirmHint", "");
    return false;
  }

  if (password !== confirm) {
    setHint(
      "confirmHint",
      "كلمتا المرور غير متطابقتين.",
      "error"
    );
    return false;
  }

  setHint(
    "confirmHint",
    "كلمتا المرور متطابقتان.",
    "success"
  );

  return password.length >= 8;
}

$("password").addEventListener("input", validatePasswords);
$("confirmPassword").addEventListener("input", validatePasswords);

document.querySelectorAll(".toggle-password").forEach(button => {
  button.addEventListener("click", () => {
    const input = $(button.dataset.target);
    const visible = input.type === "text";

    input.type = visible ? "password" : "text";
    button.textContent = visible ? "إظهار" : "إخفاء";
  });
});

/* =========================================
   Turnstile
========================================= */

function loadCaptcha() {
  if (!state.captchaSiteKey || window.turnstile) {
    if (window.turnstile) renderCaptcha();
    return;
  }

  if ($("turnstileScript")) return;

  window.aqxCaptchaLoaded = renderCaptcha;

  const script = document.createElement("script");
  script.id = "turnstileScript";
  script.src =
    "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=aqxCaptchaLoaded&render=explicit";
  script.async = true;
  script.defer = true;

  document.head.appendChild(script);
}

function renderCaptcha() {
  if (!window.turnstile || !state.captchaSiteKey) return;
  if (state.captchaWidget !== null) return;

  try {
    state.captchaWidget = window.turnstile.render(
      $("captchaArea"),
      {
        sitekey: state.captchaSiteKey,
        theme: "dark",

        callback: token => {
          state.captchaToken = token;
        },

        "expired-callback": () => {
          state.captchaToken = "";
        },

        "error-callback": () => {
          state.captchaToken = "";
        }
      }
    );
  } catch (error) {
    console.error("AQX captcha error:", error);
  }
}

/* =========================================
   التسجيل بالبريد
========================================= */

function errorMessage(code) {
  const messages = {
    REGISTRATION_CLOSED:
      "التسجيل مغلق حاليًا.",

    EMAIL_SIGNUP_DISABLED:
      "التسجيل بالبريد الإلكتروني غير متاح حاليًا.",

    INVALID_EMAIL:
      "صيغة البريد الإلكتروني غير صحيحة.",

    PASSWORD_POLICY_FAILED:
      "كلمة المرور يجب أن تكون 8 أحرف على الأقل.",

    EMAIL_NOT_ALLOWED:
      "هذا البريد غير مسموح به.",

    EMAIL_REUSE_HOLD:
      "هذا البريد محجوز وفق سياسة حماية الحسابات.",

    DISPOSABLE_EMAIL_NOT_ALLOWED:
      "البريد المؤقت غير مسموح به.",

    SIGNUP_RATE_LIMITED:
      "تم تجاوز عدد محاولات التسجيل. حاول لاحقًا.",

    CAPTCHA_REQUIRED_OR_INVALID:
      "أكمل اختبار التحقق الأمني أولًا.",

    CAPTCHA_NOT_CONFIGURED:
      "خدمة التحقق الأمني غير متاحة حاليًا.",

    TERMS_REQUIRED:
      "يجب الموافقة على الشروط والأحكام.",

    FORM_SUBMITTED_TOO_FAST:
      "انتظر لحظة ثم أعد المحاولة.",

    SIGNUP_REJECTED:
      "تعذر قبول طلب التسجيل. راجع البيانات وحاول مرة أخرى.",

    SIGNUP_SERVICE_UNAVAILABLE:
      "خدمة التسجيل غير متاحة مؤقتًا.",

    REGISTRATION_POLICY_UNAVAILABLE:
      "تعذر التحقق من سياسة التسجيل حاليًا."
  };

  return messages[code] || "تعذر إتمام التسجيل. حاول مرة أخرى.";
}

function validateForm() {
  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;
  const confirm = $("confirmPassword").value;

  if (!validEmail(email)) {
    showMessage("formMessage", "error", "أدخل بريدًا إلكترونيًا صحيحًا.");
    $("email").focus();
    return false;
  }

  /*
    لا نمنع التسجيل بسبب حالة بريد مجهولة أو فشل الفحص.
    نمنعه فقط إذا رجع المحرك بحالة مؤكدة مانعة.
  */
  if (
    state.emailChecked === email &&
    ["registered", "reserved", "blocked", "invalid"].includes(state.emailStatus)
  ) {
    showMessage(
      "formMessage",
      "error",
      "لا يمكن استخدام هذا البريد. راجع حالة البريد الموضحة أسفل خانته."
    );
    $("email").focus();
    return false;
  }

  if (password.length < 8 || password.length > 128) {
    showMessage("formMessage", "error", "كلمة المرور يجب أن تكون من 8 إلى 128 حرفًا.");
    $("password").focus();
    return false;
  }

  if (password !== confirm) {
    showMessage("formMessage", "error", "كلمتا المرور غير متطابقتين.");
    $("confirmPassword").focus();
    return false;
  }

  if (!$("terms").checked) {
    showMessage("formMessage", "error", "يجب الموافقة على الشروط والأحكام.");
    return false;
  }

  if (state.captchaRequired && !state.captchaToken) {
    showMessage("formMessage", "error", "أكمل اختبار التحقق الأمني.");
    return false;
  }

  return true;
}

$("signupForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (state.submitting) return;

  hideMessage("formMessage");

  if (!validateForm()) return;

  state.submitting = true;

  const button = $("submitButton");
  const oldText = button.textContent;

  button.disabled = true;
  button.textContent = "جارٍ إنشاء الحساب...";

  try {
    const email = $("email").value.trim().toLowerCase();

    const payload = {
      email,
      password: $("password").value,
      terms_accepted: $("terms").checked,
      form_started_at: state.startedAt,
      website: $("website").value.trim(),
      captcha_token: state.captchaToken || ""
    };

    const referral = getReferral();
    if (referral) payload.referral = referral;

    const result = await requestJSON(CFG.SIGNUP, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const data = result.data || {};

    if (!result.ok || data.success !== true) {
      throw new Error(data.error || "SIGNUP_SERVICE_UNAVAILABLE");
    }

    if (data.email_confirmation_required === false && data.session) {
      showMessage(
        "formMessage",
        "success",
        "تم إنشاء الحساب بنجاح. سيتم تحويلك إلى تسجيل الدخول."
      );

      setTimeout(() => {
        location.href = CFG.LOGIN;
      }, 1800);

      return;
    }

    showMessage(
      "formMessage",
      "success",
      "تم استلام طلب التسجيل بنجاح.\n\nإذا كان البريد مؤهلًا، ستصلك رسالة تأكيد. افتح الرسالة واضغط رابط التفعيل لإكمال إنشاء الحساب."
    );

    $("signupForm").reset();

    state.emailChecked = "";
    state.emailStatus = "";
    state.captchaToken = "";
    state.startedAt = Date.now();

    hideEmailResult();

    setHint("emailHint", "أدخل بريدك الإلكتروني.");
    setHint("passwordHint", "يجب ألا تقل كلمة المرور عن 8 أحرف.");
    setHint("confirmHint", "");

    if (window.turnstile && state.captchaWidget !== null) {
      window.turnstile.reset(state.captchaWidget);
    }

  } catch (error) {
    const code = error.message || "SIGNUP_SERVICE_UNAVAILABLE";

    showMessage(
      "formMessage",
      "error",
      errorMessage(code)
    );

    if (code === "REGISTRATION_CLOSED") {
      showMessage(
        "registrationNotice",
        "error",
        errorMessage(code)
      );
      button.disabled = true;
    }

    if (code === "EMAIL_SIGNUP_DISABLED") {
      showMessage(
        "registrationNotice",
        "info",
        errorMessage(code)
      );
      button.disabled = true;
    }

    if (
      code === "CAPTCHA_REQUIRED_OR_INVALID" &&
      window.turnstile &&
      state.captchaWidget !== null
    ) {
      state.captchaToken = "";
      window.turnstile.reset(state.captchaWidget);
    }

  } finally {
    state.submitting = false;
    button.textContent = oldText;

    if (
      !state.policy ||
      state.policy.registration_open !== false
    ) {
      button.disabled = false;
    }
  }
});

/* =========================================
   التسجيل الاجتماعي
========================================= */

async function startOAuth(item) {
  if (state.oauthBusy) return;

  hideMessage("formMessage");

  if (!window.supabase?.createClient) {
    showMessage(
      "formMessage",
      "error",
      "تعذر بدء تسجيل الدخول الاجتماعي. حاول مرة أخرى."
    );
    return;
  }

  state.oauthBusy = true;

  const buttons = $("providers").querySelectorAll("button");
  buttons.forEach(button => button.disabled = true);

  try {
    const check = await requestJSON(CFG.OAUTH, {
      method: "POST",
      body: JSON.stringify({provider:item.key})
    });

    if (!check.ok || check.data?.success !== true) {
      throw new Error(check.data?.error || "PROVIDER_SIGNUP_DISABLED");
    }

    const client = window.supabase.createClient(
      CFG.URL,
      CFG.KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "pkce"
        }
      }
    );

    const {error} = await client.auth.signInWithOAuth({
      provider: item.oauth,
      options: {
        redirectTo: CFG.CONFIRMED
      }
    });

    if (error) throw new Error("OAUTH_START_FAILED");

  } catch (error) {
    const code = error.message || "OAUTH_START_FAILED";

    showMessage(
      "formMessage",
      "error",
      code === "PROVIDER_SIGNUP_DISABLED"
        ? "التسجيل بهذا المزود غير متاح حاليًا."
        : code === "SIGNUP_RATE_LIMITED"
          ? "تم تجاوز عدد محاولات التسجيل. حاول لاحقًا."
          : "تعذر بدء التسجيل الاجتماعي. حاول مرة أخرى."
    );

    state.oauthBusy = false;

    buttons.forEach(button => {
      button.disabled = false;
    });
  }
}

/* =========================================
   تشغيل الصفحة
========================================= */

/*
  الواجهة موجودة بالفعل.
  لا توجد شاشة انتظار.
  لا توجد دولة معروضة.
  لا توجد رسائل تقنية للزائر.
*/

loadPolicy();

setInterval(() => {
  if (!state.submitting && !state.oauthBusy) {
    loadPolicy();
  }
}, 30000);

})();
</script>
