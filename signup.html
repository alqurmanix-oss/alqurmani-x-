<style>:root{--void:#05040d;--cy:#25e8ff;--vi:#7b4dff;--ice:#eaf4ff;--mut:#8fa3c7}
*{box-sizing:border-box;margin:0}
html{background:#05040d;color-scheme:dark}

a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cy);outline-offset:4px}

.brand{display:flex;align-items:center;gap:12px;direction:ltr;letter-spacing:.18em}
.brand .ring{width:26px;height:26px;border-radius:50%;border:3px solid var(--cy);box-shadow:0 0 14px var(--cy),inset 0 0 10px var(--vi);position:relative}
.brand .ring:after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--vi);box-shadow:0 0 10px var(--vi)}
.speaking .brand .ring{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);box-shadow:0 0 26px var(--cy),inset 0 0 16px var(--vi)}}
.top-end{display:flex;gap:10px}
.pill{font:inherit;font-size:.85rem;color:var(--ice);background:rgba(255,255,255,.06);border:1px solid rgba(37,232,255,.35);border-radius:99px;padding:9px 18px;cursor:pointer;backdrop-filter:blur(8px);transition:background .2s,box-shadow .2s}
.pill:hover{background:rgba(37,232,255,.16);box-shadow:0 0 18px rgba(37,232,255,.4)}
main{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:10px clamp(16px,4vw,48px) 30px}
.core{--ch:0;position:relative;width:clamp(180px,50vw,270px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transform:scale(calc(1 + var(--ch)*.14));animation:enter 1.6s cubic-bezier(.2,.7,.2,1) both}
.core:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--cy),var(--vi),transparent 42%,var(--cy));-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%);animation:spin 6s linear infinite;filter:drop-shadow(0 0 calc(12px + var(--ch)*44px) var(--cy))}
.core:after{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,rgba(37,232,255,calc(.14 + var(--ch)*.55)),rgba(123,77,255,.12) 60%,transparent 72%);animation:breathe 3s ease-in-out infinite}
.mk{position:relative;z-index:1;font-size:clamp(1.3rem,5vw,1.8rem);font-weight:800;letter-spacing:.14em;direction:ltr;background:linear-gradient(180deg,#fff,#9fb2da);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(37,232,255,.7))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.1);opacity:.7}}
@keyframes enter{from{opacity:0;transform:scale(.3);filter:blur(14px)}to{opacity:1;filter:none}}
.chip{margin-top:10px;padding:7px 18px;border-radius:99px;border:1px solid rgba(37,232,255,.4);background:rgba(37,232,255,.08);color:var(--cy);font-size:.9rem;animation:up 1s .5s both}
h1{font-size:clamp(2.4rem,9vw,5rem);line-height:1.15;font-weight:800;background:linear-gradient(180deg,#fff,#a9bcea);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(37,232,255,.4));animation:up 1.2s .8s both}
@keyframes up{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.tag{direction:ltr;letter-spacing:.34em;color:var(--cy);font-size:clamp(.62rem,2.5vw,.9rem);animation:up 1.2s 1s both}
.rot{min-height:3.2em;max-width:560px;font-size:clamp(1.05rem,3.4vw,1.4rem);color:#cfe0ff;line-height:1.7;transition:opacity .45s,transform .45s;animation:up 1.2s 1.2s both}

.cd b{display:block;font-size:1.7rem}.cd i{font-style:normal;font-size:.72rem;color:var(--mut)}
.hold{color:var(--mut);font-size:.85rem;animation:up 1.2s 1.5s both}
.hint{display:none;color:var(--cy);font-size:.85rem;animation:blink 2s ease-in-out infinite}

.cta{margin-top:6px;padding:14px 34px;border-radius:14px;font-weight:700;color:#04121a;background:linear-gradient(90deg,var(--cy),#8d7bff);box-shadow:0 0 28px rgba(37,232,255,.45);transition:transform .2s,box-shadow .2s;animation:up 1.2s 1.7s both}

<script>'use strict';
if(top!==self){try{top.location=self.location}catch(e){document.documentElement.style.display='none'}}
/* ===== اضبط موعد الإطلاق هنا لإظهار عدّاد حقيقي، مثال: '2026-12-01T18:00:00+02:00'. إن تُرك فارغًا لا يظهر عدّاد ===== */
const LAUNCH='';
const PAGE={"id": "signup", "ar": "إنشاء حساب جديد", "en": "Create account", "spAr": "إنشاء حساب جديد. الانطلاق قريبًا، جهّز نفسك لرحلة استثنائية في عالم AQX.", "spEn": "Create a new account. Launching soon. Get ready for an extraordinary journey in the world of AQX."};
const PL={starter:{ar:'أساسية',en:'Starter'},plus:{ar:'متقدمة',en:'Plus'},pro:{ar:'احترافية',en:'Pro'}};
const D={
ar:{soon:'الانطلاق قريبًا',hold:'اضغط مع الاستمرار على الحلقة لشحن المحرك، ثم اتركها للانطلاق',hint:'المس الشاشة لتفعيل الصوت',back:'العودة إلى البوابة',sndOn:'الصوت: يعمل',sndOff:'الصوت: متوقف',btn:'English',coreLbl:'حلقة الانطلاق',d:'يوم',h:'ساعة',m:'دقيقة',s:'ثانية',sel:'الباقة المختارة: ',
lines:['نصقل كل تفصيلة الآن، لتبدأ رحلتك بخطوة واحدة.','الأشياء العظيمة تحتاج لحظة تحضير.','حساب واحد. عالم كامل.','المستقبل ليس وجهة، بل بوابة تبدأ منها.','كن أول من يعبر البوابة.']},
en:{soon:'Launching Soon',hold:'Press and hold the ring to charge the engine, then release to launch',hint:'Tap the screen to enable sound',back:'Back to the gateway',sndOn:'Sound: on',sndOff:'Sound: off',btn:'العربية',coreLbl:'Launch ring',d:'Days',h:'Hours',m:'Min',s:'Sec',sel:'Selected plan: ',
lines:['Every detail is being refined, so your journey starts in one step.','Great things take a moment to prepare.','One Account. Infinite Possibilities.','The future is not a destination, but a gateway you start from.','Be the first to cross the gate.']}};
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),B=document.body,H=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lang='ar',soundOn=true,speaking=false,li=0;
try{const s=localStorage.getItem('aqx-lang');lang=s||((navigator.language||'').startsWith('en')?'en':'ar')}catch(e){}
const t=k=>D[lang][k];
const plan=new URLSearchParams(location.search).get('plan');
function render(){
 H.lang=lang;H.dir=lang==='ar'?'rtl':'ltr';
 $$('[data-i]').forEach(e=>{const k=e.dataset.i;if(k==='coreLbl')e.setAttribute('aria-label',t(k));else e.textContent=t(k)});
 $$('.snd').forEach(b=>b.textContent=t(soundOn?'sndOn':'sndOff'));$('#lang').textContent=t('btn');
 $('#chip').textContent=PAGE[lang]+(PAGE.id==='plans'&&PL[plan]?' · '+t('sel')+PL[plan][lang]:'');
 $('#rot').textContent=t('lines')[li%5];
}
$('#lang').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('aqx-lang',lang)}catch(e){}render();$('#cd').querySelectorAll('i').forEach(()=>{})};
if(!reduce)setInterval(()=>{const r=$('#rot');r.classList.add('out');setTimeout(()=>{li++;r.textContent=t('lines')[li%5];r.classList.remove('out')},450)},4600);
/* عدّاد حقيقي إن حُدّد LAUNCH */
const LT=Date.parse(LAUNCH);
if(LT>Date.now()){$('#cd').hidden=false;const tick=()=>{let s=Math.max(0,(LT-Date.now())/1000|0);[86400,3600,60,1].forEach((u,i)=>{$('#cd'+i).textContent=String(s/u|0).padStart(2,'0');s%=u})};tick();setInterval(tick,1000)}

/* ===== صوت المجرة (مولَّد) ===== */
let ac,master,fx,ready=false,base=.55,ducked=false,pend=null,touched=false,ch=0,charging=false,co=null;
function audioInit(){
 if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;lp.Q.value=5;
 const dg=ac.createGain();dg.gain.value=.55;lp.connect(dg).connect(master);
 [[55,'sawtooth',.16],[82.6,'sawtooth',.12],[110.4,'sine',.14],[165,'triangle',.08]].forEach(([f,ty,v])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;o.detune.value=(Math.random()-.5)*16;g.gain.value=v;o.connect(g).connect(lp);o.start()});
 const lf=ac.createOscillator(),lg=ac.createGain();lf.frequency.value=.08;lg.gain.value=280;lf.connect(lg).connect(lp.frequency);lf.start();
 const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;
 const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=7;
 const ng=ac.createGain();ng.gain.value=.035;ns.connect(bp).connect(ng);
 const pn=ac.createStereoPanner?ac.createStereoPanner():null;
 if(pn){ng.connect(pn).connect(master);const l3=ac.createOscillator();l3.frequency.value=.12;l3.connect(pn.pan);l3.start()}else ng.connect(master);
 const l2=ac.createOscillator(),l2g=ac.createGain();l2.frequency.value=.14;l2g.gain.value=800;l2.connect(l2g).connect(bp.frequency);l2.start();ns.start();
 fx={bp,ng};
}
const vol=()=>{if(master)master.gain.setTargetAtTime(soundOn?(ducked?.1:base):0,ac.currentTime,.5)};
function ping(f,v){if(!ready||!soundOn)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),p=ac.createStereoPanner?ac.createStereoPanner():null;o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+1.8);o.connect(g);if(p){p.pan.value=Math.random()*2-1;g.connect(p).connect(master)}else g.connect(master);o.start(n);o.stop(n+1.9)}
const NOTES=[523,659,784,988,1175,1319];
function sparkle(){ping(NOTES[Math.random()*6|0]*(Math.random()<.3?2:1),.03+Math.random()*.03);setTimeout(sparkle,900+Math.random()*2000)}
function boom(v){if(!ready||!soundOn)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(95,n);o.frequency.exponentialRampToValueAtTime(30,n+1.3);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+1.4);o.connect(g).connect(master);o.start(n);o.stop(n+1.5)}
function whoosh(d){if(!ready||!soundOn)return;const n=ac.currentTime;fx.bp.frequency.cancelScheduledValues(n);fx.bp.frequency.setValueAtTime(300,n);fx.bp.frequency.exponentialRampToValueAtTime(5000,n+d);fx.ng.gain.cancelScheduledValues(n);fx.ng.gain.setValueAtTime(.035,n);fx.ng.gain.linearRampToValueAtTime(.24,n+d*.8);fx.ng.gain.linearRampToValueAtTime(.035,n+d+.8)}
function wake(){if(!soundOn)return;audioInit();if(!ac)return;ac.resume().then(()=>{if(ac.state==='running'&&!ready){ready=true;B.dataset.snd='on';vol();sparkle();boom(.35);[659,988,1319].forEach((f,i)=>setTimeout(()=>ping(f,.06),i*240))}}).catch(()=>{})}
$$('.snd').forEach(b=>b.onclick=()=>{soundOn=!soundOn;render();if(soundOn)wake();vol();if(!soundOn)speechSynthesis?.cancel()});
B.dataset.snd='locked';
function chargeStart(){if(!ready||!soundOn||co)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=70;g.gain.value=.0001;g.gain.linearRampToValueAtTime(.05,n+.2);o.connect(g).connect(master);o.start();co={o,g}}
function chargeStop(){if(!co)return;const{o,g}=co;co=null;g.gain.setTargetAtTime(.0001,ac.currentTime,.05);o.stop(ac.currentTime+.3)}

/* ===== صوت بنت رقيق: عربي ثم إنجليزي ===== */
let voices=[];const loadV=()=>{voices=speechSynthesis.getVoices()};
if('speechSynthesis' in window){loadV();speechSynthesis.onvoiceschanged=loadV}
const FEM=/female|zira|hoda|salma|laila|maryam|mariam|zariyah|samantha|karen|moira|tessa|victoria|aria|jenny|sara|hedda|susan|catherine|fiona|serena|ava|allison|emma|libby|sonia|google (us|uk) english|google العربية/i;
const pick=l=>{const v=voices.filter(x=>x.lang.toLowerCase().startsWith(l));return v.find(x=>FEM.test(x.name))||v[0]};
function say(parts){
 if(!soundOn||!('speechSynthesis' in window))return;
 speechSynthesis.cancel();ducked=true;vol();speaking=true;B.classList.add('speaking');
 const end=()=>{ducked=false;speaking=false;B.classList.remove('speaking');vol()};
 parts.forEach(([x,l],i)=>{const u=new SpeechSynthesisUtterance(x);u.lang=l==='ar'?'ar-SA':'en-US';const v=pick(l);if(v)u.voice=v;u.pitch=1.2;u.rate=.92;if(i===parts.length-1)u.onend=u.onerror=end;speechSynthesis.speak(u)});
}
const VOICE=[[PAGE.spAr,'ar'],[PAGE.spEn,'en']];
['pointerup','keydown','click','touchend'].forEach(e=>addEventListener(e,()=>{touched=true;wake();if(pend&&soundOn){pend=null;say(VOICE)}},{passive:true}));
/* محاولة تلقائية، وإلا عند أول لمسة */
wake();setTimeout(()=>{if(touched||navigator.userActivation?.hasBeenActive)say(VOICE);else pend=1},1600);

/* ===== نفق الانطلاق ===== */
const cv=$('#fx'),c=cv.getContext('2d');let W,Hh,dpr,v=.004,vT=.004,mx=0,my=0;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*dpr;Hh=cv.height=innerHeight*dpr}
size();addEventListener('resize',size);
const N=innerWidth<700?260:520;
const rs=s=>{s.x=(Math.random()-.5)*2;s.y=(Math.random()-.5)*2;s.z=1;s.h=Math.random()<.6?188:262};
const ST=Array.from({length:N},()=>{const s={};rs(s);s.z=Math.random();return s});
addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5)},{passive:true});
function frame(){
 c.globalCompositeOperation='source-over';c.clearRect(0,0,W,Hh);
 const cx=W/2-mx*40*dpr,cy=Hh/2-my*40*dpr,f=Math.min(W,Hh)*.6;
 if(charging)ch=Math.min(1,ch+.012);else if(ch>0)ch=Math.max(0,ch-.03);
 $('#core').style.setProperty('--ch',ch.toFixed(3));
 if(charging&&co)co.o.frequency.setTargetAtTime(70+ch*520,ac.currentTime,.05);
 vT=.004+ch*.03+(speaking?.004:0);v+=(vT-v)*.06;
 const g=c.createRadialGradient(cx,Hh/2,0,cx,Hh/2,f*(.7+ch*.5));g.addColorStop(0,`rgba(37,232,255,${.1+ch*.25})`);g.addColorStop(1,'rgba(123,77,255,0)');c.fillStyle=g;c.fillRect(0,0,W,Hh);
 c.globalCompositeOperation='lighter';
 for(const s of ST){
  const pz=s.z;s.z-=v*(.4+pz);
  if(s.z<=.03){rs(s);continue}
  const px=cx+s.x/pz*f,py=cy+s.y/pz*f,qx=cx+s.x/s.z*f,qy=cy+s.y/s.z*f;
  if(qx<0||qx>W||qy<0||qy>Hh){rs(s);continue}
  c.strokeStyle=`hsla(${s.h},100%,75%,${(1-s.z)*.9})`;c.lineWidth=(1-s.z)*2.4*dpr;c.beginPath();c.moveTo(px,py);c.lineTo(qx,qy);c.stroke()}
 if(!reduce)requestAnimationFrame(frame);
}
/* شحن وإطلاق */
const core=$('#core');
function down(){if(charging)return;charging=true;chargeStart()}
function up(){if(!charging)return;charging=false;chargeStop();if(ch>.25){const p=ch;v=.02+p*.14;boom(.3+p*.3);whoosh(1+p*1.2);const fl=$('#flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go')}else ping(NOTES[Math.random()*6|0],.08)}
core.addEventListener('pointerdown',e=>{e.preventDefault();down()});
['pointerup','pointercancel','pointerleave'].forEach(e=>core.addEventListener(e,up));
core.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)down()}});
core.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')up()});
/* نبضة لمس */
addEventListener('pointerdown',e=>{if(core.contains(e.target)||e.target.closest('button,a'))return;const r=document.createElement('div');r.className='rp';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.append(r);setTimeout(()=>r.remove(),900);ping(NOTES[Math.random()*6|0],.08)},{passive:true});
render();requestAnimationFrame(frame);
</script>
