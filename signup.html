
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AQX | إنشاء حساب جديد</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101827;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .register-box {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 18px;
      background: #1c293b;
      border: 1px solid #34445b;
    }

    h2 {
      text-align: center;
      margin: 0 0 10px;
    }

    .description {
      text-align: center;
      color: #b8c5d6;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #40516a;
      border-radius: 9px;
      background: #111c2b;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #39b9a5;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #16a58e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.7;
      font-size: 14px;
    }

    .success {
      display: block !important;
      background: #124b3d;
      color: #a8f3d8;
    }

    .error {
      display: block !important;
      background: #542b32;
      color: #ffd1d5;
    }
  </style>
</head>

<body>

  <main class="register-box">
    <h2>AQX Identity</h2>
    <p class="description">إنشاء حساب جديد</p>

    <form id="registerForm">

      <label for="email">البريد الإلكتروني</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
        maxlength="254"
        placeholder="name@example.com"
      >

      <label for="password">كلمة المرور</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        required
        minlength="8"
        maxlength="72"
        placeholder="8 أحرف على الأقل"
      >

      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        required
        minlength="8"
        maxlength="72"
        placeholder="أعد كتابة كلمة المرور"
      >

      <button id="registerButton" type="submit">
        إنشاء الحساب
      </button>

    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </main>

<script>
"use strict";

// إعداد مشروع AQX Identity
const SUPABASE_URL =
  "https://fkiokwwztbyztleeuwks.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: false,
      autoRefreshToken: false,
      detectSessionInUrl: false
    }
  }
);

const form = document.getElementById("registerForm");
const button = document.getElementById("registerButton");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value
    .trim()
    .toLowerCase();

  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  message.className = "";

  if (password !== confirmPassword) {
    showMessage("كلمتا المرور غير متطابقتين.", "error");
    return;
  }

  if (password.length < 8 || password.length > 72) {
    showMessage("كلمة المرور يجب أن تكون بين 8 و72 حرفًا.", "error");
    return;
  }

  button.disabled = true;
  button.textContent = "جارٍ إنشاء الحساب...";

  try {
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: "https://id.alqurmanix.com/"
      }
    });

    if (error) throw error;

    // لا ننشئ جلسة AQX هنا.
    // لا نسجل دخول المستخدم.
    // لا ننفذ أي عمليات أخرى.

    if (data.session) {
      await supabase.auth.signOut({ scope: "local" });
    }

    showMessage(
      "تم إرسال طلب التسجيل. راجع بريدك الإلكتروني واضغط رابط التأكيد لإكمال إنشاء الحساب.",
      "success"
    );

    form.reset();

  } catch (error) {
    showMessage(
      error.message || "تعذر إنشاء الحساب. حاول مرة أخرى.",
      "error"
    );

  } finally {
    button.disabled = false;
    button.textContent = "إنشاء الحساب";
  }
});
</script>

</body>
</html>
