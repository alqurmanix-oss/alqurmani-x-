<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="إنشاء حساب AQX Identity - الهوية الموحدة لخدمات القرماني إكس">
  <title>إنشاء حساب | AQX Identity</title>

  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --text: #172338;
      --muted: #738096;
      --primary: #315efb;
      --primary-dark: #2448d8;
      --border: #e4eaf3;
      --success: #13865c;
      --danger: #c43c4b;
      --warning: #a36b13;
      --radius: 20px;
      --shadow: 0 18px 55px rgba(25, 42, 75, .09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, #e4ebff 0, transparent 35%),
        radial-gradient(circle at 90% 90%, #e5f4f1 0, transparent 35%),
        var(--bg);
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-icon {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
      border-radius: 21px;
      color: white;
      background: linear-gradient(145deg, #4777ff, #233fc1);
      box-shadow: 0 10px 25px #315efb40;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 850;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(220, 228, 241, .8);
      border-radius: var(--radius);
      padding: 30px 25px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      margin: 0 0 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 750;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 51px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fbfcfe;
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: .2s;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px #315efb16;
      background: #fff;
    }

    input:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 14px;
      padding-left: 75px;
    }

    .toggle-password {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      padding: 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 11px;
      margin-top: 7px;
    }

    .submit {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
      margin-top: 6px;
    }

    .submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 9px 22px #315efb35;
    }

    .submit:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 13px 14px;
      margin: 17px 0;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .message.show {
      display: block;
    }

    .message.success {
      color: var(--success);
      background: #eaf8f1;
      border: 1px solid #ccebdc;
    }

    .message.error {
      color: var(--danger);
      background: #fff0f1;
      border: 1px solid #f5d4d8;
    }

    .message.warning {
      color: var(--warning);
      background: #fff8e9;
      border: 1px solid #f0e0b9;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #aab4c5;
    }

    .dot.online {
      background: #20a878;
      box-shadow: 0 0 0 3px #20a87820;
    }

    .dot.offline {
      background: #d94b59;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .links a {
      color: var(--primary);
      font-weight: 750;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 11px;
      color: #8b96a8;
    }

    @media (max-width: 420px) {
      .card {
        padding: 25px 19px;
      }

      .brand h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="brand">
      <div class="brand-icon">AQX</div>
      <h1>القرماني إكس</h1>
      <p>نظام الهوية الموحدة AQX Identity</p>
    </header>

    <section class="card">

      <h2>إنشاء حساب جديد</h2>

      <p class="subtitle">
        أنشئ هويتك الموحدة للوصول إلى خدمات ومنصات القرماني إكس.
      </p>

      <div id="message" class="message" role="alert" aria-live="polite"></div>

      <form id="signupForm" novalidate>

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="name@example.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="أدخل كلمة المرور"
              minlength="8"
              required
            >
            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
            >إظهار</button>
          </div>
          <div class="hint">يجب ألا تقل كلمة المرور عن 8 أحرف.</div>
        </div>

        <div class="field">
          <label for="confirmPassword">تأكيد كلمة المرور</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="أعد كتابة كلمة المرور"
            required
          >
        </div>

        <button class="submit" id="submitButton" type="submit" disabled>
          جاري التحقق من حالة التسجيل...
        </button>

      </form>

      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">جاري الاتصال بمحرك التسجيل</span>
      </div>

      <div class="links">
        لديك حساب بالفعل؟
        <a href="https://id.alqurmanix.com/login.html">تسجيل الدخول</a>
      </div>

    </section>

    <footer class="footer">
      © AQX — Alqurmani X. All rights reserved.
    </footer>

  </main>

  <script>
  (() => {
    "use strict";

    /* =========================================
       AQX IDENTITY — CENTRAL CONFIGURATION
       ========================================= */

    const CONFIG = Object.freeze({

      VERSION: "1.0.0",

      SUPABASE_URL:
        "https://fkiokwwztbyztleeuwks.supabase.co",

      SUPABASE_KEY:
        "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_",

      ENGINE_STATUS_URL:
        "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity/v1/registration/status",

      REDIRECT_URL:
        "https://id.alqurmanix.com/confirmed.html",

      LOGIN_URL:
        "https://id.alqurmanix.com/login.html",

      REFRESH_INTERVAL: 20000,

      REQUEST_TIMEOUT: 15000,

      MIN_PASSWORD_LENGTH: 8

    });

    /* =========================================
       ELEMENTS
       ========================================= */

    const form = document.getElementById("signupForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const submitButton = document.getElementById("submitButton");
    const messageBox = document.getElementById("message");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const togglePassword = document.getElementById("togglePassword");

    /* =========================================
       STATE
       ========================================= */

    const STATE = {
      engineAvailable: false,
      registrationOpen: false,
      emailEnabled: false,
      checking: false,
      submitting: false,
      lastPolicy: null,
      lastCheck: 0
    };

    /* =========================================
       UTILITIES
       ========================================= */

    function showMessage(text, type = "warning") {
      messageBox.textContent = text;
      messageBox.className = "message show " + type;
    }

    function hideMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function setStatus(text, mode = "") {
      statusText.textContent = text;
      statusDot.className = "dot " + mode;
    }

    function setButton(text, disabled) {
      submitButton.textContent = text;
      submitButton.disabled = disabled;
    }

    function getErrorMessage(data) {
      if (!data) return "تعذر إتمام العملية. حاول مرة أخرى.";

      const message =
        data.msg ||
        data.message ||
        data.error_description ||
        data.error;

      if (typeof message === "string") {
        return message;
      }

      return "تعذر إتمام العملية. حاول مرة أخرى.";
    }

    async function fetchWithTimeout(url, options = {}) {
      const controller = new AbortController();

      const timer = setTimeout(
        () => controller.abort(),
        CONFIG.REQUEST_TIMEOUT
      );

      try {
        return await fetch(url, {
          ...options,
          signal: controller.signal,
          cache: "no-store"
        });
      } finally {
        clearTimeout(timer);
      }
    }

    async function readJson(response) {
      const raw = await response.text();

      try {
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {
          message: "استجابة غير صالحة من الخادم."
        };
      }
    }

    /* =========================================
       POLICY READER
       يدعم أكثر من شكل لاستجابة المحرك.
       لا يسمح بالتسجيل عند غياب القرار.
       ========================================= */

    function getPolicyCandidates(data) {
      return [
        data,
        data?.data,
        data?.policy,
        data?.settings,
        data?.registration,
        data?.data?.policy,
        data?.data?.settings,
        data?.data?.registration
      ].filter(Boolean);
    }

    function readPolicy(data) {
      const candidates = getPolicyCandidates(data);

      let registrationOpen;
      let emailEnabled;

      for (const item of candidates) {

        if (typeof item.registration_open === "boolean") {
          registrationOpen = item.registration_open;
        }

        if (
          typeof item.signup_methods?.email?.signup_enabled === "boolean"
        ) {
          emailEnabled = item.signup_methods.email.signup_enabled;
        }

        if (typeof item.email_signup_enabled === "boolean") {
          emailEnabled = item.email_signup_enabled;
        }
      }

      return {
        registrationOpen,
        emailEnabled
      };
    }

    /* =========================================
       APPLY REGISTRATION POLICY
       ========================================= */

    function applyPolicy() {

      if (!navigator.onLine) {
        STATE.engineAvailable = false;
        setButton("لا يوجد اتصال بالإنترنت", true);
        setStatus("تحقق من اتصال الإنترنت", "offline");
        return;
      }

      if (!STATE.engineAvailable) {
        setButton("التسجيل غير متاح حاليًا", true);
        return;
      }

      if (!STATE.registrationOpen) {
        setButton("التسجيل مغلق حاليًا", true);
        setStatus("التسجيل مغلق من إدارة النظام", "offline");
        return;
      }

      if (!STATE.emailEnabled) {
        setButton("التسجيل بالبريد غير متاح", true);
        setStatus("طريقة التسجيل بالبريد معطلة", "offline");
        return;
      }

      if (STATE.submitting) return;

      setButton("إنشاء الحساب", false);
      setStatus("محرك التسجيل متصل وجاهز", "online");
    }

    /* =========================================
       FETCH ENGINE STATUS
       ========================================= */

    async function refreshRegistrationStatus() {

      if (STATE.checking || STATE.submitting) return;

      if (!navigator.onLine) {
        STATE.engineAvailable = false;
        applyPolicy();
        return;
      }

      STATE.checking = true;

      try {

        const response = await fetchWithTimeout(
          CONFIG.ENGINE_STATUS_URL,
          {
            method: "GET",
            headers: {
              "apikey": CONFIG.SUPABASE_KEY,
              "Accept": "application/json"
            }
          }
        );

        const data = await readJson(response);

        if (!response.ok) {
          throw new Error(
            getErrorMessage(data)
          );
        }

        const policy = readPolicy(data);

        if (
          typeof policy.registrationOpen !== "boolean" ||
          typeof policy.emailEnabled !== "boolean"
        ) {
          throw new Error(
            "استجابة محرك التسجيل لا تحتوي على حالة التسجيل وطريقة البريد بشكل صحيح."
          );
        }

        STATE.lastPolicy = data;
        STATE.registrationOpen = policy.registrationOpen;
        STATE.emailEnabled = policy.emailEnabled;
        STATE.engineAvailable = true;
        STATE.lastCheck = Date.now();

        applyPolicy();

      } catch (error) {

        STATE.engineAvailable = false;

        setButton("تعذر التحقق من حالة التسجيل", true);

        setStatus("محرك التسجيل غير متاح", "offline");

        console.error(
          "[AQX Identity] Engine status error:",
          error
        );

      } finally {
        STATE.checking = false;
      }
    }

    /* =========================================
       PASSWORD VISIBILITY
       ========================================= */

    togglePassword.addEventListener("click", () => {

      const hidden = passwordInput.type === "password";

      passwordInput.type = hidden ? "text" : "password";

      togglePassword.textContent = hidden ? "إخفاء" : "إظهار";

    });

    /* =========================================
       VALIDATION
       ========================================= */

    function validateForm() {

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirm = confirmInput.value;

      if (!email) {
        throw new Error("يرجى إدخال البريد الإلكتروني.");
      }

      if (!emailInput.validity.valid) {
        throw new Error("يرجى إدخال بريد إلكتروني صحيح.");
      }

      if (password.length < CONFIG.MIN_PASSWORD_LENGTH) {
        throw new Error(
          "كلمة المرور يجب ألا تقل عن 8 أحرف."
        );
      }

      if (password !== confirm) {
        throw new Error("كلمتا المرور غير متطابقتين.");
      }

      return {
        email,
        password
      };
    }

    /* =========================================
       CREATE ACCOUNT
       ========================================= */

    async function createAccount(email, password) {

      const endpoint =
        CONFIG.SUPABASE_URL +
        "/auth/v1/signup?redirect_to=" +
        encodeURIComponent(CONFIG.REDIRECT_URL);

      const response = await fetchWithTimeout(
        endpoint,
        {
          method: "POST",

          headers: {
            "apikey": CONFIG.SUPABASE_KEY,
            "Content-Type": "application/json",
            "Accept": "application/json"
          },

          body: JSON.stringify({
            email,
            password
          })
        }
      );

      const data = await readJson(response);

      if (!response.ok) {
        throw new Error(
          getErrorMessage(data)
        );
      }

      return data;
    }

    /* =========================================
       FORM SUBMISSION
       ========================================= */

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      if (STATE.submitting) return;

      hideMessage();

      try {

        if (!navigator.onLine) {
          throw new Error("تحقق من اتصال الإنترنت أولًا.");
        }

        if (
          !STATE.engineAvailable ||
          !STATE.registrationOpen ||
          !STATE.emailEnabled
        ) {
          throw new Error(
            "التسجيل غير متاح حاليًا. يرجى المحاولة لاحقًا."
          );
        }

        const credentials = validateForm();

        STATE.submitting = true;

        setButton("جاري إنشاء الحساب...", true);

        setStatus("جاري التواصل مع خدمة التسجيل", "online");

        const result = await createAccount(
          credentials.email,
          credentials.password
        );

        /*
          Supabase قد يعيد user دون session
          عندما يكون تأكيد البريد الإلكتروني مطلوبًا.
        */

        if (!result || (!result.user && !result.id)) {
          throw new Error(
            "لم نتلقَّ تأكيدًا صالحًا من خدمة التسجيل."
          );
        }

        form.reset();

        showMessage(
          "تم إنشاء طلب الحساب بنجاح. أرسلنا رسالة تفعيل إلى بريدك الإلكتروني. افتح الرسالة واضغط على رابط تأكيد البريد لإكمال تفعيل حسابك.",
          "success"
        );

        setButton("تم إرسال طلب التسجيل", true);

        setStatus("في انتظار تأكيد البريد الإلكتروني", "online");

      } catch (error) {

        console.error(
          "[AQX Identity] Signup error:",
          error
        );

        showMessage(
          error.message ||
          "حدث خطأ أثناء إنشاء الحساب. حاول مرة أخرى.",
          "error"
        );

      } finally {

        STATE.submitting = false;

        if (
          !messageBox.classList.contains("success")
        ) {
          await refreshRegistrationStatus();
        }

      }

    });

    /* =========================================
       NETWORK EVENTS
       ========================================= */

    window.addEventListener("online", () => {
      refreshRegistrationStatus();
    });

    window.addEventListener("offline", () => {
      STATE.engineAvailable = false;
      applyPolicy();
    });

    document.addEventListener("visibilitychange", () => {

      if (!document.hidden) {
        refreshRegistrationStatus();
      }

    });

    /* =========================================
       AUTOMATIC ENGINE UPDATES
       ========================================= */

    setInterval(
      refreshRegistrationStatus,
      CONFIG.REFRESH_INTERVAL
    );

    /* =========================================
       INITIALIZATION
       ========================================= */

    refreshRegistrationStatus();

  })();
  </script>

</body>
</html>
