.oauth-btn:hover {

.oauth-btn:disabled {

.message {

<script>
(function () {
"use strict";

/* =========================================
   AQX IDENTITY CONFIGURATION
========================================= */

const CONFIG = Object.freeze({

  SUPABASE_URL:
    "https://fkiokwwztbyztleeuwks.supabase.co",

  SUPABASE_KEY:
    "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_",

  API_BASE:
    "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity",

  CONFIRMED_URL:
    "https://id.alqurmanix.com/confirmed.html",

  LOGIN_URL:
    "https://id.alqurmanix.com/login.html",

  EMAIL_CACHE_MS:25000,

  STATUS_REFRESH_MS:60000,

  API_TIMEOUT:20000
});

const $ = id => document.getElementById(id);

/* =========================================
   STATE
========================================= */

let currentPolicy = null;
let policyLoaded = false;

let emailCache = new Map();
let emailSequence = 0;
let emailCheckLastResult = null;

let captchaWidgetId = null;
let captchaToken = "";
let captchaLoaded = false;

let supabaseClient = null;

let isSubmitting = false;
let isOAuthStarting = false;

const formStartedAt = Date.now();

/* =========================================
   MESSAGES
========================================= */

const M = {

  emailChecking:"جارٍ فحص البريد الإلكتروني...",

  emailAvailable:"هذا البريد متاح للتسجيل لأول مرة.",

  emailRegistered:"هذا البريد مسجل بالفعل. استخدم تسجيل الدخول بدلًا من إنشاء حساب جديد.",

  emailReserved:"هذا البريد محجوز مؤقتًا ولا يمكن استخدامه حاليًا.",

  emailBlocked:"هذا البريد غير مؤهل للتسجيل في منظومة AQX.",

  emailInvalid:"يرجى إدخال بريد إلكتروني صحيح.",

  emailError:"تعذر التحقق من البريد الآن. حاول مرة أخرى.",

  emailRate:"وصلت إلى الحد المسموح لفحص البريد. انتظر قليلًا ثم حاول مجددًا.",

  required:"يرجى إدخال البريد الإلكتروني.",

  invalidEmail:"صيغة البريد الإلكتروني غير صحيحة.",

  passwordShort:"كلمة المرور يجب أن تكون 8 أحرف على الأقل.",

  passwordMismatch:"كلمتا المرور غير متطابقتين.",

  termsRequired:"يرجى الموافقة على الشروط والأحكام.",

  registrationClosed:"التسجيل مغلق حاليًا.",

  emailDisabled:"التسجيل بالبريد الإلكتروني غير متاح حاليًا.",

  unavailable:"تعذر الاتصال بمحرك التسجيل. يرجى المحاولة لاحقًا.",

  submitting:"جارٍ إنشاء الحساب...",

  submit:"إنشاء حساب",

  signupSuccess:"تم استلام طلب التسجيل. إذا كان البريد مؤهلًا فستصلك رسالة تأكيد.",

  signupSuccessSession:"تم إنشاء الحساب بنجاح.",

  sessionWarning:"تم إنشاء الحساب، لكن تعذر حفظ جلسة الدخول. يمكنك تسجيل الدخول الآن.",

  disposable:"هذا البريد المؤقت غير مسموح به.",

  emailHold:"هذا البريد محجوز مؤقتًا.",

  rateLimited:"محاولات كثيرة. يرجى الانتظار قليلًا قبل المحاولة مجددًا.",

  captcha:"تعذر التحقق الأمني. أعد المحاولة.",

  signupFailed:"تعذر إتمام التسجيل. حاول مرة أخرى.",

  oauthDisabled:"طريقة التسجيل هذه غير متاحة حاليًا.",

  oauthFailed:"تعذر بدء التسجيل بهذه الخدمة. حاول مرة أخرى.",

  genericError:"حدث خطأ غير متوقع. حاول مرة أخرى."
};

/* =========================================
   SUPABASE CLIENT
========================================= */

function getSupabaseClient() {

  if (supabaseClient) return supabaseClient;

  if (
    !window.supabase ||
    typeof window.supabase.createClient !== "function"
  ) {
    throw new Error("SUPABASE_LIBRARY_UNAVAILABLE");
  }

  supabaseClient = window.supabase.createClient(
    CONFIG.SUPABASE_URL,
    CONFIG.SUPABASE_KEY,
    {
      auth:{
        autoRefreshToken:true,
        persistSession:true,
        detectSessionInUrl:true,
        flowType:"implicit"
      }
    }
  );

  return supabaseClient;
}

/* =========================================
   API ENGINE
========================================= */

async function api(path, options = {}) {

  const controller = new AbortController();

  const timeout = setTimeout(
    () => controller.abort(),
    options.timeout || CONFIG.API_TIMEOUT
  );

  try {

    const headers = {
      "Content-Type":"application/json",

      // مهم: تعريف المشروع أمام Supabase Gateway
      "apikey":CONFIG.SUPABASE_KEY,

      ...(options.headers || {})
    };

    const response = await fetch(
      CONFIG.API_BASE + path,
      {
        method:options.method || "GET",

        headers,

        body:options.body !== undefined
          ? JSON.stringify(options.body)
          : undefined,

        cache:"no-store",

        signal:controller.signal
      }
    );

    const payload = await response.json().catch(() => ({}));

    if (!response.ok) {

      const error = new Error(
        payload.error || "REQUEST_FAILED"
      );

      error.status = response.status;
      error.payload = payload;

      throw error;
    }

    return payload;

  } finally {
    clearTimeout(timeout);
  }
}

/* =========================================
   MESSAGE FUNCTIONS
========================================= */

function showMessage(type, message) {

  const box = $("mainMessage");

  box.className = "message show " + type;

  box.textContent = message;
}

function clearMessage() {

  const box = $("mainMessage");

  box.className = "message";

  box.textContent = "";
}

function setSystemStatus(online) {

  $("systemStatus").classList.toggle(
    "offline",
    !online
  );

  $("systemStatusText").textContent = online
    ? "محرك التسجيل متصل"
    : "محرك التسجيل غير متصل";
}

/* =========================================
   EMAIL VALIDATION
========================================= */

function validEmail(email) {

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
    && email.length <= 254;
}

function setEmailStatus(type, message) {

  const box = $("emailStatus");

  box.className = "email-status show " + type;

  box.textContent = message;
}

function clearEmailStatus() {

  const box = $("emailStatus");

  box.className = "email-status";

  box.textContent = "";

  emailCheckLastResult = null;
}

function applyEmailStatus(status) {

  emailCheckLastResult = status;

  switch (status) {

    case "available":

      setEmailStatus(
        "available",
        "✓ " + M.emailAvailable
      );

      return true;

    case "registered":

      setEmailStatus(
        "registered",
        "✕ " + M.emailRegistered
      );

      return false;

    case "reserved":

      setEmailStatus(
        "reserved",
        "✕ " + M.emailReserved
      );

      return false;

    case "blocked":

      setEmailStatus(
        "blocked",
        "✕ " + M.emailBlocked
      );

      return false;

    case "invalid":

      setEmailStatus(
        "invalid",
        "✕ " + M.emailInvalid
      );

      return false;

    default:

      setEmailStatus(
        "error",
        M.emailError
      );

      return false;
  }
}

/* =========================================
   EMAIL AVAILABILITY ENGINE
========================================= */

async function checkEmailAvailability(force = false) {

  const email = $("email").value
    .trim()
    .toLowerCase();

  if (!email) {
    clearEmailStatus();
    return false;
  }

  if (!validEmail(email)) {

    applyEmailStatus("invalid");

    return false;
  }

  const cached = emailCache.get(email);

  if (
    !force &&
    cached &&
    Date.now() - cached.time < CONFIG.EMAIL_CACHE_MS
  ) {
    return applyEmailStatus(cached.status);
  }

  const sequence = ++emailSequence;

  emailCheckLastResult = null;

  setEmailStatus(
    "checking",
    "◌ " + M.emailChecking
  );

  try {

    const result = await api(
      "/v1/registration/email-status",
      {
        method:"POST",
        body:{email}
      }
    );

    // منع النتائج القديمة
    if (sequence !== emailSequence) return false;

    if (
      $("email").value.trim().toLowerCase() !== email
    ) {
      return false;
    }

    const status = result.status || "invalid";

    emailCache.set(email,{
      status,
      time:Date.now()
    });

    return applyEmailStatus(status);

  } catch (error) {

    if (sequence !== emailSequence) return false;

    emailCheckLastResult = "error";

    if (
      error.status === 429 ||
      error.payload?.error === "EMAIL_STATUS_RATE_LIMITED"
    ) {

      setEmailStatus(
        "error",
        M.emailRate
      );

    } else {

      setEmailStatus(
        "error",
        M.emailError
      );
    }

    console.error("AQX EMAIL CHECK:",error);

    return false;
  }
}

$("email").addEventListener("blur",() => {

  checkEmailAvailability(false);

});

$("email").addEventListener("input",() => {

  emailSequence++;

  clearEmailStatus();

  clearMessage();

});

$("email").addEventListener("keydown",event => {

  if (event.key === "Enter") {

    event.preventDefault();

    $("password").focus();
  }

});

/* =========================================
   REGISTRATION POLICY
========================================= */

function methodEnabled(methods,method) {

  const value = methods?.[method];

  if (value === true) return true;

  if (value && typeof value === "object") {

    return value.signup_enabled === true ||
           value.enabled === true;
  }

  return false;
}

function renderRegistrationPolicy(policy) {

  currentPolicy = policy;

  policyLoaded = true;

  // الواجهة لا تختفي بسبب سياسة التسجيل
  $("signupForm").hidden = false;

  const registrationOpen =
    policy.registration_open === true;

  const emailEnabled =
    methodEnabled(policy.signup_methods,"email");

  const canRegister =
    registrationOpen && emailEnabled;

  $("submitBtn").disabled =
    !canRegister || isSubmitting;

  $("submitBtn").querySelector("span").textContent =
    M.submit;

  if (!registrationOpen) {

    showMessage(
      "info",
      policy.closed_reason || M.registrationClosed
    );

  } else if (!emailEnabled) {

    showMessage(
      "info",
      M.emailDisabled
    );

  } else {

    clearMessage();
  }

  // مزودو التسجيل
  document.querySelectorAll("[data-provider]").forEach(button => {

    const provider = button.dataset.provider;

    const enabled =
      registrationOpen &&
      methodEnabled(policy.signup_methods,provider);

    button.classList.toggle("visible",enabled);

    button.disabled = !enabled;

  });

  const anyOAuth = [
    ...document.querySelectorAll("[data-provider]")
  ].some(button => button.classList.contains("visible"));

  $("oauthDivider").hidden = !anyOAuth;

  $("oauthList").hidden = !anyOAuth;

  // الشروط
  const termsRequired =
    policy.terms_required === true;

  $("termsRow").hidden = !termsRequired;

  $("termsAccepted").required = termsRequired;

  // CAPTCHA
  if (
    policy.captcha?.enabled === true &&
    typeof policy.captcha.site_key === "string" &&
    policy.captcha.site_key
  ) {
    loadTurnstile(policy.captcha.site_key);
  }
}

/* =========================================
   REGISTRATION STATUS
========================================= */

async function loadRegistrationStatus() {

  try {

    const policy = await api(
      "/v1/registration/status",
      {method:"GET"}
    );

    if (
      policy.success !== true ||
      typeof policy.registration_open !== "boolean"
    ) {
      throw new Error("INVALID_REGISTRATION_POLICY");
    }

    renderRegistrationPolicy(policy);

    setSystemStatus(true);

    return true;

  } catch (error) {

    console.error(
      "AQX REGISTRATION STATUS:",
      error
    );

    setSystemStatus(false);

    // المحافظة على الواجهة
    $("signupForm").hidden = false;

    // عند الفشل الأول نمنع التسجيل
    // وعند فشل تحديث لاحق نحافظ على السياسة السابقة
    if (!policyLoaded) {

      $("submitBtn").disabled = true;

      $("submitBtn").querySelector("span").textContent =
        M.submit;

      showMessage(
        "error",
        M.unavailable
      );
    }

    return false;
  }
}

/* =========================================
   CLOUDFLARE TURNSTILE
========================================= */

function loadTurnstile(siteKey) {

  if (captchaLoaded) return;

  captchaLoaded = true;

  const script = document.createElement("script");

  script.src =
    "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";

  script.async = true;

  script.defer = true;

  script.onload = () => {

    if (!window.turnstile) {

      captchaLoaded = false;

      return;
    }

    try {

      captchaWidgetId = window.turnstile.render(
        "#captchaContainer",
        {
          sitekey:siteKey,

          callback:token => {
            captchaToken = token;
          },

          "expired-callback":() => {
            captchaToken = "";
          },

          "error-callback":() => {
            captchaToken = "";
          }
        }
      );

    } catch(error) {

      console.error("TURNSTILE:",error);

      captchaLoaded = false;
    }
  };

  script.onerror = () => {

    captchaLoaded = false;

    console.error("Turnstile failed to load");
  };

  document.head.appendChild(script);
}

/* =========================================
   PASSWORD VISIBILITY
========================================= */

$("togglePassword").addEventListener("click",() => {

  const input = $("password");

  input.type =
    input.type === "password"
      ? "text"
      : "password";

});

/* =========================================
   REFERRAL SYSTEM
========================================= */

function getReferralData() {

  const params = new URLSearchParams(
    window.location.search
  );

  const platformId =
    params.get("aqx_platform") ||
    params.get("platform_id") ||
    "";

  const code =
    params.get("aqx_ref") ||
    params.get("ref") ||
    "";

  if (
    /^[0-9a-f-]{36}$/i.test(platformId) &&
    /^[0-9a-f]{32}$/i.test(code)
  ) {

    return {
      platform_id:platformId,
      code:code.toLowerCase()
    };
  }

  return null;
}

function getOAuthRedirect() {

  const url = new URL(CONFIG.CONFIRMED_URL);

  const referral = getReferralData();

  if (referral) {

    url.searchParams.set(
      "aqx_platform",
      referral.platform_id
    );

    url.searchParams.set(
      "aqx_ref",
      referral.code
    );
  }

  return url.toString();
}

/* =========================================
   ERROR TRANSLATION
========================================= */

function errorMessage(code) {

  const map = {

    REGISTRATION_CLOSED:M.registrationClosed,

    EMAIL_SIGNUP_DISABLED:M.emailDisabled,

    INVALID_EMAIL:M.invalidEmail,

    PASSWORD_POLICY_FAILED:M.passwordShort,

    TERMS_REQUIRED:M.termsRequired,

    EMAIL_REUSE_HOLD:M.emailHold,

    DISPOSABLE_EMAIL_NOT_ALLOWED:M.disposable,

    SIGNUP_RATE_LIMITED:M.rateLimited,

    CAPTCHA_REQUIRED_OR_INVALID:M.captcha,

    CAPTCHA_NOT_CONFIGURED:M.captcha,

    SIGNUP_REJECTED:M.signupFailed,

    EMAIL_NOT_ALLOWED:M.emailBlocked,

    FORM_SUBMITTED_TOO_FAST:M.rateLimited,

    SIGNUP_SERVICE_UNAVAILABLE:M.signupFailed,

    EMAIL_ALREADY_REGISTERED:M.emailRegistered
  };

  return map[code] || M.signupFailed;
}

/* =========================================
   SAVE AUTH SESSION
========================================= */

async function saveReturnedSession(session) {

  if (
    !session ||
    !session.access_token ||
    !session.refresh_token
  ) {
    return true;
  }

  try {

    const client = getSupabaseClient();

    const {error} = await client.auth.setSession({

      access_token:session.access_token,

      refresh_token:session.refresh_token

    });

    if (error) throw error;

    return true;

  } catch(error) {

    console.error("AQX SESSION:",error);

    return false;
  }
}

/* =========================================
   SIGNUP ENGINE
========================================= */

$("signupForm").addEventListener("submit",async event => {

  event.preventDefault();

  if (isSubmitting) return;

  clearMessage();

  const email =
    $("email").value.trim().toLowerCase();

  const password =
    $("password").value;

  const passwordConfirm =
    $("passwordConfirm").value;

  const termsAccepted =
    $("termsAccepted").checked;

  if (!email) {

    showMessage("error",M.required);

    $("email").focus();

    return;
  }

  if (!validEmail(email)) {

    applyEmailStatus("invalid");

    $("email").focus();

    return;
  }

  if (
    password.length < 8 ||
    password.length > 128
  ) {

    showMessage("error",M.passwordShort);

    $("password").focus();

    return;
  }

  if (password !== passwordConfirm) {

    showMessage("error",M.passwordMismatch);

    $("passwordConfirm").focus();

    return;
  }

  if (
    currentPolicy?.terms_required === true &&
    !termsAccepted
  ) {

    showMessage("error",M.termsRequired);

    $("termsAccepted").focus();

    return;
  }

  if (!policyLoaded) {

    showMessage("error",M.unavailable);

    return;
  }

  if (currentPolicy?.registration_open !== true) {

    showMessage("error",M.registrationClosed);

    return;
  }

  if (
    !methodEnabled(
      currentPolicy.signup_methods,
      "email"
    )
  ) {

    showMessage("error",M.emailDisabled);

    return;
  }

  isSubmitting = true;

  const submitButton = $("submitBtn");

  submitButton.disabled = true;

  submitButton.querySelector("span").textContent =
    M.submitting;

  try {

    // فحص البريد من الخادم
    const emailAvailable =
      await checkEmailAvailability(false);

    if (!emailAvailable) {

      if (emailCheckLastResult === "registered") {

        showMessage("error",M.emailRegistered);

      } else if (emailCheckLastResult === "reserved") {

        showMessage("error",M.emailReserved);

      } else if (emailCheckLastResult === "blocked") {

        showMessage("error",M.emailBlocked);

      } else if (emailCheckLastResult === "invalid") {

        showMessage("error",M.invalidEmail);

      } else if (emailCheckLastResult === "error") {

        showMessage("error",M.emailError);

      } else {

        showMessage("error",M.emailError);
      }

      $("email").focus();

      return;
    }

    // CAPTCHA
    if (
      currentPolicy?.captcha?.enabled === true &&
      !captchaToken
    ) {

      showMessage("error",M.captcha);

      return;
    }

    const referral = getReferralData();

    const payload = {

      email,

      password,

      terms_accepted:termsAccepted,

      website:$("website").value,

      form_started_at:formStartedAt,

      captcha_token:captchaToken || "",

      referral:referral || undefined
    };

    // التسجيل الفعلي من خلال محرك AQX
    const result = await api(
      "/v1/registration/signup",
      {
        method:"POST",
        body:payload,
        timeout:30000
      }
    );

    if (
      result.success !== true ||
      result.accepted !== true
    ) {

      throw Object.assign(
        new Error(result.error || "SIGNUP_REJECTED"),
        {payload:result}
      );
    }

    let successText =
      result.message || M.signupSuccess;

    if (result.session?.access_token) {

      const sessionSaved =
        await saveReturnedSession(result.session);

      successText = sessionSaved
        ? M.signupSuccessSession
        : M.sessionWarning;
    }

    showMessage("success",successText);

    // إعادة تهيئة النموذج
    $("signupForm").reset();

    clearEmailStatus();

    emailCache.clear();

    emailSequence++;

    emailCheckLastResult = null;

    // إعادة CAPTCHA
    if (
      window.turnstile &&
      captchaWidgetId !== null
    ) {

      window.turnstile.reset(captchaWidgetId);

      captchaToken = "";
    }

  } catch(error) {

    console.error("AQX SIGNUP:",error);

    const code =
      error.payload?.error ||
      error.message;

    showMessage(
      "error",
      errorMessage(code)
    );

  } finally {

    isSubmitting = false;

    const canRegister =
      policyLoaded &&
      currentPolicy?.registration_open === true &&
      methodEnabled(
        currentPolicy?.signup_methods,
        "email"
      );

    submitButton.disabled = !canRegister;

    submitButton.querySelector("span").textContent =
      M.submit;
  }

});

/* =========================================
   OAUTH SIGNUP
========================================= */

async function startOAuth(provider,button) {

  if (isOAuthStarting) return;

  clearMessage();

  if (
    !policyLoaded ||
    currentPolicy?.registration_open !== true ||
    !methodEnabled(
      currentPolicy?.signup_methods,
      provider
    )
  ) {

    showMessage("error",M.oauthDisabled);

    return;
  }

  isOAuthStarting = true;

  button.disabled = true;

  try {

    // التحقق من السماح من محرك AQX
    await api(
      "/v1/registration/oauth-check",
      {
        method:"POST",
        body:{provider}
      }
    );

    const client = getSupabaseClient();

    const {error} =
      await client.auth.signInWithOAuth({

        provider,

        options:{
          redirectTo:getOAuthRedirect()
        }

      });

    if (error) throw error;

  } catch(error) {

    console.error("AQX OAUTH:",error);

    if (
      error.status === 403 ||
      error.payload?.error === "PROVIDER_SIGNUP_DISABLED"
    ) {

      showMessage("error",M.oauthDisabled);

    } else {

      showMessage(
        "error",
        error.message === "SUPABASE_LIBRARY_UNAVAILABLE"
          ? M.oauthFailed
          : errorMessage(
              error.payload?.error || "OAUTH_FAILED"
            )
      );
    }

    button.disabled = false;

  } finally {

    isOAuthStarting = false;
  }
}

document.querySelectorAll("[data-provider]").forEach(button => {

  button.addEventListener("click",() => {

    startOAuth(
      button.dataset.provider,
      button
    );

  });

});

/* =========================================
   GLOBAL ERROR PROTECTION
========================================= */

window.addEventListener("error",event => {

  console.error(
    "AQX PAGE ERROR:",
    event.message,
    event.filename,
    event.lineno
  );

});

window.addEventListener("unhandledrejection",event => {

  console.error(
    "AQX UNHANDLED ERROR:",
    event.reason
  );

});

/* =========================================
   INITIALIZATION
========================================= */

async function initialize() {

  // إبقاء الصفحة ظاهرة منذ البداية
  $("signupForm").hidden = false;

  $("submitBtn").disabled = true;

  $("submitBtn").querySelector("span").textContent =
    M.submit;

  // جلب سياسة التسجيل الفعلية
  await loadRegistrationStatus();

  // تحديث السياسة دون إعادة تحميل الصفحة
  setInterval(
    loadRegistrationStatus,
    CONFIG.STATUS_REFRESH_MS
  );

}

// بدء المحرك
initialize().catch(error => {

  console.error("AQX INITIALIZATION:",error);

  setSystemStatus(false);

  $("signupForm").hidden = false;

  $("submitBtn").disabled = true;

  showMessage("error",M.unavailable);

});

})();
</script>
