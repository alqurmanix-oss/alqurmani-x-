
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081426">
<title>إنشاء حساب | AQX Identity</title>

<style>
:root{
  color-scheme:dark;
  --bg:#081426;
  --panel:#101f35;
  --gold:#d8b66a;
  --gold-light:#f0d797;
  --text:#f4f6fa;
  --muted:#9eabc0;
  --line:#293c57;
  --green:#43d49b;
  --red:#ff8585;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  padding:25px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(ellipse at top,#172e4d 0%,#081426 60%);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}
.container{width:100%;max-width:460px}
.brand{text-align:center;margin-bottom:22px}
.logo{
  width:65px;height:65px;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #a78a4f;border-radius:18px;
  background:#11233b;color:var(--gold-light);
  font-size:25px;font-weight:bold;
}
.brand h1{font-size:25px;color:var(--gold-light);margin:0 0 8px}
.brand p{font-size:13px;color:var(--muted);margin:0}
.card{
  background:linear-gradient(155deg,#12233b,#0d192b);
  border:1px solid var(--line);
  border-radius:18px;
  padding:25px 21px;
  box-shadow:0 18px 50px #0005;
}
.card h2{font-size:21px;margin:0 0 8px}
.subtitle{font-size:13px;color:var(--muted);line-height:1.8;margin:0 0 22px}
.field{margin-bottom:17px}
label{display:block;font-size:13px;margin-bottom:8px;color:#dce4f0}
input[type=email],input[type=password]{
  width:100%;height:49px;padding:0 13px;
  background:#091629;color:white;
  border:1px solid #30445f;border-radius:9px;
  outline:none;font-size:14px;
}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d8b66a18}
input::placeholder{color:#74839a}
.email-status{
  display:none;margin-top:8px;padding:9px 11px;
  border-radius:8px;font-size:12px;line-height:1.8;
}
.email-status.show{display:block}
.email-status.good{color:#82e8b7;background:#12372d;border:1px solid #23644c}
.email-status.bad{color:#ffaaaa;background:#3b2028;border:1px solid #713742}
.email-status.wait{color:#b6d1ff;background:#172c49;border:1px solid #2e4d75}
.email-status.neutral{color:#c3ccda;background:#1b293d;border:1px solid #34465e}
.hint{font-size:11px;color:var(--muted);margin-top:7px}
.terms{
  display:flex;gap:9px;align-items:flex-start;
  margin:18px 0;color:#c6d0df;font-size:12px;line-height:1.8;
}
.terms input{margin-top:4px;accent-color:var(--gold)}
a{color:var(--gold-light);text-decoration:none}
.primary{
  width:100%;height:49px;border:0;border-radius:9px;
  background:linear-gradient(110deg,#b9944e,#ead18e);
  color:#172033;font-size:15px;font-weight:bold;
  cursor:pointer;
}
.primary:disabled{opacity:.55;cursor:not-allowed}
.notice{
  display:none;margin-top:14px;padding:12px;
  border-radius:9px;font-size:12px;line-height:1.8;
}
.notice.show{display:block}
.notice.error{background:#3b2028;color:#ffb2b2;border:1px solid #713742}
.notice.success{background:#12372d;color:#8ce5b9;border:1px solid #23644c}
.notice.info{background:#172c49;color:#b6d1ff;border:1px solid #2e4d75}
.separator{
  display:flex;align-items:center;gap:12px;
  color:#8290a5;font-size:12px;margin:22px 0 15px;
}
.separator:before,.separator:after{content:"";height:1px;background:#30415a;flex:1}
.social-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.social-btn{
  min-height:43px;border:1px solid #30445f;border-radius:9px;
  background:#0b192c;color:#e7edf6;font-size:12px;
  cursor:pointer;font-family:inherit;padding:8px;
}
.social-btn:hover{border-color:var(--gold)}
.social-btn:disabled{opacity:.5;cursor:wait}
.login{text-align:center;margin-top:21px;color:var(--muted);font-size:13px}
.footer{text-align:center;margin-top:18px;color:#718098;font-size:11px}
#socialSection[hidden]{display:none!important}
#captchaBox{display:flex;justify-content:center;margin:12px 0}
#captchaBox:empty{display:none}
.hp{
  position:absolute!important;left:-10000px!important;
  width:1px!important;height:1px!important;overflow:hidden!important
}
@media(max-width:390px){
  .card{padding:21px 16px}
  .social-list{grid-template-columns:1fr}
}
</style>
</head>

<body>
<main class="container">

  <header class="brand">
    <div class="logo">AQX</div>
    <h1>AQX Identity</h1>
    <p>حسابك الموحد لخدمات ومنصات AQX</p>
  </header>

  <section class="card">
    <h2>إنشاء حساب جديد</h2>
    <p class="subtitle">أنشئ حسابك الموحد للوصول إلى خدمات AQX.</p>

    <form id="signupForm" novalidate>

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="email"
          placeholder="name@example.com" maxlength="254" required>
        <div id="emailStatus" class="email-status" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="password">كلمة السر</label>
        <input id="password" type="password"
          autocomplete="new-password" placeholder="أدخل كلمة السر"
          minlength="8" maxlength="128" required>
        <div class="hint">8 أحرف على الأقل.</div>
      </div>

      <div class="field">
        <label for="confirmPassword">تأكيد كلمة السر</label>
        <input id="confirmPassword" type="password"
          autocomplete="new-password" placeholder="أعد كتابة كلمة السر"
          minlength="8" maxlength="128" required>
      </div>

      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <div class="terms">
        <input id="terms" type="checkbox">
        <label for="terms">
          أوافق على <a href="terms.html" target="_blank" rel="noopener">الشروط والأحكام</a>
          و<a href="privacy.html" target="_blank" rel="noopener">سياسة الخصوصية</a>.
        </label>
      </div>

      <div id="captchaBox"></div>

      <button id="submitBtn" class="primary" type="submit">
        إنشاء الحساب
      </button>

      <div id="formNotice" class="notice" role="status" aria-live="polite"></div>
    </form>

    <div id="socialSection" hidden>
      <div class="separator">أو التسجيل باستخدام</div>
      <div id="socialList" class="social-list"></div>
    </div>

    <div class="login">
      لديك حساب بالفعل؟ <a href="login.html">سجل دخول</a>
    </div>
  </section>

  <footer class="footer">AQX Identity — Unified Account System</footer>
</main>

<script>
(function(){
"use strict";

/* إعدادات الاتصال */
const API = "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity";
const SUPABASE = "https://fkiokwwztbyztleeuwks.supabase.co";
const PUBLIC_KEY = "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_";
const CONFIRM_URL = "https://id.alqurmanix.com/confirmed.html";

const $ = id => document.getElementById(id);

const email = $("email");
const password = $("password");
const confirmPassword = $("confirmPassword");
const emailStatus = $("emailStatus");
const submitBtn = $("submitBtn");
const notice = $("formNotice");

const state = {
  policyLoaded:false,
  policy:null,
  registrationOpen:true,
  emailEnabled:true,
  emailState:"unchecked",
  checkedEmail:"",
  emailRequest:0,
  emailBusy:false,
  submitting:false,
  startedAt:Date.now(),
  captchaEnabled:false,
  captchaSiteKey:"",
  captchaToken:"",
  captchaWidget:null
};

const providers = {
  google:{name:"Google",oauth:"google"},
  github:{name:"GitHub",oauth:"github"},
  microsoft:{name:"Microsoft",oauth:"azure"},
  apple:{name:"Apple",oauth:"apple"},
  facebook:{name:"Facebook",oauth:"facebook"},
  discord:{name:"Discord",oauth:"discord"},
  linkedin:{name:"LinkedIn",oauth:"linkedin_oidc"}
};

/* أدوات مساعدة */
function message(text,type){
  notice.textContent=text;
  notice.className="notice show "+(type||"info");
}
function clearMessage(){
  notice.textContent="";
  notice.className="notice";
}
function emailMessage(text,type){
  emailStatus.textContent=text;
  emailStatus.className="email-status show "+type;
}
function clearEmailMessage(){
  emailStatus.textContent="";
  emailStatus.className="email-status";
}
function normalize(value){
  return String(value||"").trim().toLowerCase();
}
function validEmail(value){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value) && value.length<=254;
}
function enabled(settings,name){
  const item=settings && settings[name];
  return item===true ||
    !!(item && typeof item==="object" &&
    (item.signup_enabled===true || item.enabled===true));
}

/* الاتصال بالخلفية */
async function request(path,method,body){
  const response=await fetch(API+path,{
    method:method||"GET",
    headers:{
      "apikey":PUBLIC_KEY,
      "Content-Type":"application/json"
    },
    body:body ? JSON.stringify(body) : undefined,
    cache:"no-store",
    credentials:"omit"
  });

  let data=null;
  try{data=await response.json();}catch(_){}

  return {ok:response.ok,status:response.status,data:data};
}

/* حالة التسجيل العامة */
async function loadPolicy(){
  try{
    const result=await request("/v1/registration/status","GET");

    if(!result.ok || !result.data || result.data.success!==true) return;

    const p=result.data;
    state.policy=p;
    state.policyLoaded=true;
    state.registrationOpen=p.registration_open===true;
    state.emailEnabled=enabled(p.signup_methods,"email");
    state.captchaEnabled=p.captcha && p.captcha.enabled===true;
    state.captchaSiteKey=p.captcha && p.captcha.site_key || "";

    renderProviders(p.signup_methods||{});
    renderAvailability();
    setupCaptcha();
  }catch(_){
    /* فشل الاتصال لا يخفي الصفحة */
  }
}

function renderAvailability(){
  if(state.submitting) return;

  if(state.policyLoaded && !state.registrationOpen){
    submitBtn.disabled=true;
    submitBtn.textContent="التسجيل غير متاح حاليًا";
    return;
  }

  if(state.policyLoaded && !state.emailEnabled){
    submitBtn.disabled=true;
    submitBtn.textContent="التسجيل بالبريد غير متاح";
    return;
  }

  updateSubmit();
}

/* فحص البريد */
function updateSubmit(){
  if(state.submitting) return;

  if(state.policyLoaded && !state.registrationOpen){
    submitBtn.disabled=true;
    submitBtn.textContent="التسجيل غير متاح حاليًا";
    return;
  }

  if(state.policyLoaded && !state.emailEnabled){
    submitBtn.disabled=true;
    submitBtn.textContent="التسجيل بالبريد غير متاح";
    return;
  }

  const blocked=["registered","reserved","blocked"].includes(state.emailState);

  submitBtn.disabled=blocked;
  submitBtn.textContent=blocked ? "تعذر استخدام هذا البريد" : "إنشاء الحساب";
}

function showEmailResult(status){
  if(status==="registered"){
    emailMessage("هذا البريد مسجل بالفعل","bad");
  }else if(status==="reserved"){
    emailMessage("هذا البريد محجوز مؤقتًا ولا يمكن استخدامه حاليًا.","bad");
  }else if(status==="blocked"){
    emailMessage("لا يمكن التسجيل بهذا البريد.","bad");
  }else if(status==="available"){
    emailMessage("هذا البريد متاح للتسجيل.","good");
  }else if(status==="invalid"){
    emailMessage("البريد غير صحيح.","bad");
  }else{
    emailMessage("تعذر التحقق من البريد حاليًا. يمكنك المحاولة مرة أخرى.","neutral");
  }
}

async function checkEmail(force){
  const value=normalize(email.value);

  if(!value){
    state.emailState="unchecked";
    state.checkedEmail="";
    state.emailBusy=false;
    clearEmailMessage();
    updateSubmit();
    return;
  }

  if(!validEmail(value)){
    state.emailState="invalid";
    state.checkedEmail=value;
    showEmailResult("invalid");
    updateSubmit();
    return;
  }

  if(state.emailBusy && state.checkedEmail===value) return;

  if(!force && state.checkedEmail===value &&
     ["registered","reserved","blocked","available"].includes(state.emailState)){
    updateSubmit();
    return;
  }

  const requestId=++state.emailRequest;
  state.emailBusy=true;
  state.checkedEmail=value;
  state.emailState="checking";

  emailMessage("جارٍ التحقق من البريد...","wait");
  updateSubmit();

  try{
    const result=await request(
      "/v1/registration/email-status",
      "POST",
      {email:value}
    );

    if(requestId!==state.emailRequest) return;

    if(!result.ok || !result.data || result.data.success!==true){
      state.emailState="unknown";
      showEmailResult("unknown");
      updateSubmit();
      return;
    }

    const status=String(result.data.status||"unknown");
    state.emailState=status;
    showEmailResult(status);
    updateSubmit();

  }catch(_){
    if(requestId!==state.emailRequest) return;
    state.emailState="unknown";
    showEmailResult("unknown");
    updateSubmit();
  }finally{
    if(requestId===state.emailRequest) state.emailBusy=false;
  }
}

/* الفحص بمجرد الخروج من البريد */
email.addEventListener("blur",function(){
  checkEmail(true);
});

/* الانتقال إلى كلمة السر لا ينتظر زر التسجيل */
password.addEventListener("focus",function(){
  checkEmail(false);
});

email.addEventListener("input",function(){
  state.emailRequest++;
  state.emailBusy=false;
  state.emailState="unchecked";
  state.checkedEmail="";
  clearEmailMessage();
  updateSubmit();
});

/* مزودو التسجيل: المفعّل فقط */
function renderProviders(settings){
  const section=$("socialSection");
  const list=$("socialList");
  list.innerHTML="";

  const names=Object.keys(providers).filter(name=>enabled(settings,name));

  if(!names.length){
    section.hidden=true;
    return;
  }

  section.hidden=false;

  names.forEach(name=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="social-btn";
    button.textContent="المتابعة باستخدام "+providers[name].name;
    button.addEventListener("click",function(){
      socialSignup(name,button);
    });
    list.appendChild(button);
  });
}

async function socialSignup(name,button){
  button.disabled=true;
  try{
    const check=await request(
      "/v1/registration/oauth-check",
      "POST",
      {provider:name}
    );

    if(!check.ok || !check.data || check.data.success!==true){
      message(
        check.data && check.data.error==="PROVIDER_SIGNUP_DISABLED"
          ? "التسجيل باستخدام هذا المزود غير متاح حاليًا."
          : "تعذر بدء التسجيل باستخدام هذا المزود. حاول مرة أخرى.",
        "error"
      );
      return;
    }

    const url=SUPABASE+"/auth/v1/authorize?provider="+
      encodeURIComponent(providers[name].oauth)+
      "&redirect_to="+encodeURIComponent(CONFIRM_URL);

    window.location.href=url;
  }catch(_){
    message("تعذر الاتصال بالخدمة حاليًا.","error");
  }finally{
    button.disabled=false;
  }
}

/* بيانات الإحالة */
function referralData(){
  const params=new URLSearchParams(location.search);
  const platform=params.get("platform_id")||"";
  const code=(params.get("ref")||params.get("code")||"").toLowerCase();

  if(!/^[0-9a-f-]{36}$/i.test(platform)) return {};
  if(!/^[0-9a-f]{32}$/.test(code)) return {};

  return {platform_id:platform,code:code};
}

/* كابتشا اختيارية حسب إعدادات المحرك */
function loadTurnstile(){
  return new Promise((resolve,reject)=>{
    if(window.turnstile){resolve();return;}

    const old=document.getElementById("aqxTurnstileScript");
    if(old){
      old.addEventListener("load",resolve,{once:true});
      old.addEventListener("error",reject,{once:true});
      return;
    }

    const script=document.createElement("script");
    script.id="aqxTurnstileScript";
    script.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    script.async=true;
    script.defer=true;
    script.onload=resolve;
    script.onerror=reject;
    document.head.appendChild(script);
  });
}

async function setupCaptcha(){
  if(!state.captchaEnabled || !state.captchaSiteKey || state.captchaWidget!==null) return;

  try{
    await loadTurnstile();

    if(!window.turnstile) return;

    state.captchaWidget=window.turnstile.render("#captchaBox",{
      sitekey:state.captchaSiteKey,
      callback:function(token){state.captchaToken=token||"";},
      "expired-callback":function(){state.captchaToken="";},
      "error-callback":function(){state.captchaToken="";}
    });
  }catch(_){}
}

/* رسائل أخطاء التسجيل */
function signupError(code){
  const map={
    INVALID_INPUT:"يرجى مراجعة البيانات المدخلة.",
    INVALID_EMAIL:"البريد غير صحيح.",
    PASSWORD_POLICY_FAILED:"كلمة السر يجب ألا تقل عن 8 أحرف.",
    REGISTRATION_CLOSED:"التسجيل مغلق حاليًا.",
    EMAIL_SIGNUP_DISABLED:"التسجيل باستخدام البريد غير متاح حاليًا.",
    TERMS_REQUIRED:"يجب الموافقة على الشروط والأحكام.",
    SIGNUP_RATE_LIMITED:"تم تجاوز عدد المحاولات المسموح بها. حاول لاحقًا.",
    CAPTCHA_NOT_CONFIGURED:"تعذر إتمام التحقق الأمني حاليًا.",
    CAPTCHA_REQUIRED_OR_INVALID:"يرجى إكمال التحقق الأمني ثم المحاولة مرة أخرى.",
    EMAIL_REUSE_HOLD:"هذا البريد محجوز مؤقتًا ولا يمكن استخدامه حاليًا.",
    DISPOSABLE_EMAIL_NOT_ALLOWED:"لا يمكن التسجيل باستخدام هذا البريد.",
    EMAIL_NOT_ALLOWED:"لا يمكن التسجيل بهذا البريد.",
    SIGNUP_REJECTED:"تعذر قبول التسجيل بهذا البريد. حاول مرة أخرى.",
    FORM_SUBMITTED_TOO_FAST:"يرجى الانتظار قليلًا ثم المحاولة مرة أخرى.",
    SIGNUP_SERVICE_UNAVAILABLE:"الخدمة غير متاحة مؤقتًا. حاول مرة أخرى."
  };
  return map[code]||"تعذر إتمام التسجيل حاليًا. حاول مرة أخرى.";
}

/* إنشاء الحساب */
$("signupForm").addEventListener("submit",async function(event){
  event.preventDefault();
  clearMessage();

  if(state.submitting) return;

  const address=normalize(email.value);
  const pass=password.value;
  const confirm=confirmPassword.value;

  if(!validEmail(address)){
    state.emailState="invalid";
    showEmailResult("invalid");
    email.focus();
    updateSubmit();
    return;
  }

  if(pass.length<8 || pass.length>128){
    message("كلمة السر يجب ألا تقل عن 8 أحرف.","error");
    password.focus();
    return;
  }

  if(pass!==confirm){
    message("كلمتا السر غير متطابقتين.","error");
    confirmPassword.focus();
    return;
  }

  if(!$("terms").checked){
    message("يجب الموافقة على الشروط والأحكام.","error");
    $("terms").focus();
    return;
  }

  if(state.checkedEmail!==address || state.emailState==="unchecked"){
    await checkEmail(true);
  }

  if(["registered","reserved","blocked"].includes(state.emailState)){
    showEmailResult(state.emailState);
    email.focus();
    updateSubmit();
    return;
  }

  if(state.policyLoaded && !state.registrationOpen){
    message("التسجيل مغلق حاليًا.","error");
    return;
  }

  if(state.policyLoaded && !state.emailEnabled){
    message("التسجيل باستخدام البريد غير متاح حاليًا.","error");
    return;
  }

  if(state.captchaEnabled && !state.captchaToken){
    message("يرجى إكمال التحقق الأمني.","error");
    return;
  }

  const payload={
    email:address,
    password:pass,
    terms_accepted:$("terms").checked,
    form_started_at:state.startedAt,
    website:$("website").value,
    captcha_token:state.captchaToken||"",
    referral:referralData()
  };

  state.submitting=true;
  submitBtn.disabled=true;
  submitBtn.textContent="جارٍ إنشاء الحساب...";

  try{
    const result=await request("/v1/registration/signup","POST",payload);
    const data=result.data||{};

    if(!result.ok || data.success!==true){
      const code=data.error||"SIGNUP_SERVICE_UNAVAILABLE";

      if(code==="EMAIL_REUSE_HOLD"){
        state.emailState="reserved";
        showEmailResult("reserved");
      }else if(code==="EMAIL_NOT_ALLOWED"){
        state.emailState="blocked";
        showEmailResult("blocked");
      }else if(code==="INVALID_EMAIL"){
        state.emailState="invalid";
        showEmailResult("invalid");
      }else{
        message(signupError(code),"error");
      }
      return;
    }

    if(data.session && data.session.access_token){
      message("تم إنشاء الحساب بنجاح. جارٍ تحويلك...","success");
      window.location.href=CONFIRM_URL;
      return;
    }

    message(
      "تم استلام طلب التسجيل. إذا كان البريد مؤهلًا فستصلك رسالة تأكيد لتفعيل الحساب.",
      "success"
    );

    $("signupForm").reset();
    state.emailState="unchecked";
    state.checkedEmail="";
    state.startedAt=Date.now();
    state.captchaToken="";
    clearEmailMessage();

    if(window.turnstile && state.captchaWidget!==null){
      try{window.turnstile.reset(state.captchaWidget);}catch(_){}
    }

  }catch(_){
    message("تعذر الاتصال بالخدمة حاليًا. حاول مرة أخرى.","error");
  }finally{
    state.submitting=false;
    updateSubmit();
  }
});

/* التشغيل */
loadPolicy();

/* تحديث إعدادات التسجيل والمزودين تلقائيًا */
window.setInterval(loadPolicy,30000);

})();
</script>
</body>
</html>
