      color-scheme: light;
      --primary:#6658e8;
      --primary-dark:#5143d0;
      --ink:#172033;
      --muted:#718096;
      --line:#e8eaf2;
      --surface:#ffffff;
      --background:#f4f5fb;
      --success:#13865b;
      --danger:#c43c4b;
      --radius:22px;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      padding:24px 16px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Cairo",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 10%,#e7e4ff 0,transparent 35%),
        radial-gradient(circle at 90% 90%,#e1f0ff 0,transparent 35%),
        var(--background);
    }

    button,input { font:inherit; }

    .shell {
      width:100%;
      max-width:480px;
    }

    .card {
      background:var(--surface);
      border:1px solid rgba(230,232,242,.9);
      border-radius:var(--radius);
      padding:34px;
      box-shadow:0 22px 70px rgba(28,35,75,.10);
    }

    .brand {
      text-align:center;
      margin-bottom:25px;
    }

    .logo {
      width:68px;
      height:68px;
      margin:0 auto 12px;
      display:grid;
      place-items:center;
      border-radius:21px;
      color:#fff;
      font-size:23px;
      font-weight:800;
      letter-spacing:-1px;
      background:linear-gradient(135deg,#8173ff,#4e43cb);
      box-shadow:0 10px 24px rgba(102,88,232,.27);
    }

    .brand-name {
      margin:0;
      font-size:23px;
      font-weight:800;
      letter-spacing:.4px;
    }

    .brand-name span { color:var(--primary); }

    .subtitle {
      margin:5px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    h1 {
      margin:0 0 5px;
      text-align:center;
      font-size:22px;
      font-weight:800;
    }

    .intro {
      margin:0 0 24px;
      color:var(--muted);
      text-align:center;
      font-size:13px;
    }

    .field { margin-bottom:16px; }

    label {
      display:block;
      margin-bottom:7px;
      font-size:13px;
      font-weight:700;
    }

    input {
      width:100%;
      height:51px;
      padding:0 15px;
      border:1px solid var(--line);
      border-radius:13px;
      outline:none;
      color:var(--ink);
      background:#fff;
      transition:.2s;
      direction:ltr;
      text-align:left;
    }

    input:focus {
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(102,88,232,.10);
    }

    input::placeholder { color:#a8afbd; }

    .password-note {
      margin:6px 2px 0;
      color:var(--muted);
      font-size:11px;
    }

    .check-row {
      display:flex;
      align-items:flex-start;
      gap:9px;
      margin:17px 0;
      font-size:12px;
      color:#596477;
      line-height:1.8;
    }

    .check-row input {
      width:17px;
      height:17px;
      flex:0 0 17px;
      margin:4px 0 0;
      accent-color:var(--primary);
    }

    a {
      color:var(--primary);
      text-decoration:none;
      font-weight:700;
    }

    .primary-btn,.provider-btn {
      width:100%;
      min-height:51px;
      border-radius:13px;
      cursor:pointer;
      font-weight:800;
      transition:.2s;
    }

    .primary-btn {
      border:0;
      color:white;
      background:linear-gradient(135deg,#7567f4,#5547d2);
      box-shadow:0 8px 18px rgba(102,88,232,.20);
    }

    .primary-btn:hover { transform:translateY(-1px); }
    button:disabled { opacity:.55; cursor:not-allowed; transform:none; }

    .divider {
      display:flex;
      align-items:center;
      gap:12px;
      margin:22px 0;
      color:#9aa2b1;
      font-size:12px;
    }

    .divider:before,.divider:after {
      content:"";
      height:1px;
      flex:1;
      background:var(--line);
    }

    .providers {
      display:grid;
      gap:10px;
    }

    .provider-btn {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border:1px solid var(--line);
      color:#344054;
      background:#fff;
    }

    .provider-btn:hover {
      border-color:#c9c4fa;
      background:#faf9ff;
    }

    .provider-icon {
      width:20px;
      height:20px;
      display:inline-grid;
      place-items:center;
      font-size:15px;
      font-weight:800;
    }

    .message {
      display:none;
      margin:0 0 17px;
      padding:12px 14px;
      border-radius:12px;
      font-size:12px;
      line-height:1.8;
    }

    .message.show { display:block; }
    .message.error { color:#9f2938; background:#fff0f1; }
    .message.success { color:#116b49; background:#eaf8f1; }
    .message.info { color:#4c459f; background:#f0efff; }

    .engine-status {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      margin:18px 0 0;
      color:var(--muted);
      font-size:11px;
    }

    .status-dot {
      width:7px;
      height:7px;
      border-radius:50%;
      background:#c5cad4;
    }

    .status-dot.online { background:#20a36d; }
    .status-dot.offline { background:#d34b58; }

    .footer {
      margin-top:20px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }

    .footer a { margin-inline:4px; }

    .hidden { display:none!important; }

    .loading {
      display:inline-block;
      width:15px;
      height:15px;
      margin-inline-end:7px;
      vertical-align:middle;
      border:2px solid rgba(255,255,255,.4);
      border-top-color:white;
      border-radius:50%;
      animation:spin .7s linear infinite;
    }

    @keyframes spin { to { transform:rotate(360deg); } }

    @media(max-width:480px) {
      body { padding:14px 10px; }
      .card { padding:26px 20px; }
    }
  </style>
</head>

    async function fetchWithTimeout(url, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(
        () => controller.abort(),
        CONFIG.REQUEST_TIMEOUT
      );

      try {
        return await fetch(url, {
          ...options,
          signal: controller.signal,
          cache: "no-store"
        });
      } finally {
        clearTimeout(timer);
      }
    }

    function firstBoolean(objects, keys) {
      for (const object of objects) {
        if (!object || typeof object !== "object") continue;

        for (const key of keys) {
          if (typeof object[key] === "boolean") {
            return object[key];
          }
        }
      }
      return undefined;
    }

    function findObjects(root, predicate, output = [], depth = 0) {
      if (!root || typeof root !== "object" || depth > 7) return output;

      if (!Array.isArray(root) && predicate(root)) output.push(root);

      const values = Array.isArray(root) ? root : Object.values(root);

      for (const value of values) {
        if (value && typeof value === "object") {
          findObjects(value, predicate, output, depth + 1);
        }
      }

      return output;
    }

    function extractPolicy(payload) {
      const roots = [
        payload,
        payload?.policy,
        payload?.settings,
        payload?.registration
      ].filter(Boolean);

      const providerObjects = findObjects(
        payload,
        object => [
          "google", "github", "facebook", "apple",
          "azure", "microsoft", "discord"
        ].some(key => Object.prototype.hasOwnProperty.call(object, key))
      );

      const emailObjects = findObjects(
        payload,
        object =>
          Object.prototype.hasOwnProperty.call(object, "email_signup_enabled") ||
          Object.prototype.hasOwnProperty.call(object, "signup_enabled")
      );

      const registrationOpen = firstBoolean(
        roots,
        ["registration_open", "signup_open", "enabled"]
      );

      const emailEnabled = firstBoolean(
        [
          payload?.signup_methods?.email,
          payload?.registration?.signup_methods?.email,
          ...emailObjects
        ],
        ["signup_enabled", "email_signup_enabled", "enabled"]
      );

      const providers = {};

      for (const provider of [
        "google", "github", "facebook", "apple",
        "azure", "microsoft", "discord"
      ]) {
        const candidates = [];

        for (const object of providerObjects) {
          if (object[provider] && typeof object[provider] === "object") {
            candidates.push(object[provider]);
          }

          if (Object.prototype.hasOwnProperty.call(object, provider)) {
            candidates.push({ enabled: object[provider] });
          }
        }

        const direct = payload?.provider_settings?.[provider] ??
                       payload?.signup_methods?.[provider] ??
                       payload?.providers?.[provider];

        if (direct !== undefined) {
          candidates.unshift(
            typeof direct === "object" ? direct : { enabled: direct }
          );
        }

        providers[provider] = firstBoolean(
          candidates,
          ["enabled", "signup_enabled", "active"]
        );
      }

      const passwordPolicy =
        payload?.password_policy ||
        payload?.policies?.password ||
        payload?.registration_policy?.password ||
        {};

      const termsPolicy =
        payload?.terms ||
        payload?.terms_policy ||
        payload?.policies?.terms ||
        {};

      return {
        raw: payload,
        registrationOpen,
        emailEnabled,
        providers,
        password: {
          minLength: Number(
            passwordPolicy.min_length ??
            passwordPolicy.minimum_length ??
            CONFIG.DEFAULT_MIN_PASSWORD_LENGTH
          ),
          maxLength: Number(
            passwordPolicy.max_length ??
            CONFIG.MAX_PASSWORD_LENGTH
          ),
          requireUppercase: passwordPolicy.require_uppercase === true,
          requireLowercase: passwordPolicy.require_lowercase === true,
          requireNumber: passwordPolicy.require_number === true,
          requireSpecial: passwordPolicy.require_special === true
        },
        termsRequired:
          termsPolicy.required === true ||
          payload?.terms_required === true
      };
    }

    function renderProviders() {
      const container = $("providers");
      container.innerHTML = "";

      if (!currentPolicy) {
        $("providerSection").classList.add("hidden");
        return;
      }

      const configured = Object.entries(currentPolicy.providers)
        .filter(([name, enabled]) =>
          enabled === true &&
          PROVIDER_INFO[name]
        );

      if (!configured.length || currentPolicy.registrationOpen !== true) {
        $("providerSection").classList.add("hidden");
        return;
      }

      $("providerSection").classList.remove("hidden");

      configured.forEach(([provider]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "provider-btn";
        button.dataset.provider = provider;

        const info = PROVIDER_INFO[provider];
        const label = provider === "azure" ? "microsoft" : provider;

        const icon = document.createElement("span");
        icon.className = "provider-icon";
        icon.textContent = info.icon;
        icon.style.color = info.color;

        const text = document.createElement("span");
        text.textContent = t(label);

        button.append(icon, text);
        button.addEventListener("click", () => startOAuth(provider));

        container.appendChild(button);
      });
    }

    function renderPolicy() {
      const policy = currentPolicy;

      if (!policy || policy.registrationOpen !== true) {
        $("signupForm").classList.add("hidden");
        $("providerSection").classList.add("hidden");
        $("registrationClosed").classList.remove("hidden");
        $("registrationClosed").textContent =
          policy?.raw?.closed_reason || t("closed");
        return;
      }

      $("registrationClosed").classList.add("hidden");
      $("signupForm").classList.remove("hidden");

      if (policy.emailEnabled !== true) {
        $("email").disabled = true;
        $("password").disabled = true;
        $("confirmPassword").disabled = true;
        $("terms").disabled = true;
        $("submitButton").disabled = true;
      } else {
        $("email").disabled = false;
        $("password").disabled = false;
        $("confirmPassword").disabled = false;
        $("terms").disabled = false;
        $("submitButton").disabled = false;
      }

      const min = Math.max(
        8,
        Math.min(policy.password.minLength || 8, 128)
      );

      const max = Math.max(
        min,
        Math.min(policy.password.maxLength || 128, 128)
      );

      $("password").minLength = min;
      $("password").maxLength = max;
      $("confirmPassword").maxLength = max;

      $("passwordHint").textContent =
        currentLanguage === "ar"
          ? `الحد الأدنى ${min} أحرف.`
          : currentLanguage === "es"
            ? `Mínimo ${min} caracteres.`
            : `Minimum ${min} characters.`;

      $("termsRow").classList.toggle(
        "hidden",
        !policy.termsRequired
      );

      $("terms").required = policy.termsRequired;

      renderProviders();
    }

    async function loadPolicy() {
      policyReady = false;
      $("submitButton").disabled = true;
      $("engineStatusText").textContent = t("checkingPolicy");

      try {
        const response = await fetchWithTimeout(CONFIG.STATUS_URL, {
          method: "GET",
          headers: {
            "Accept": "application/json",
            "apikey": CONFIG.SUPABASE_KEY
          }
        });

        if (!response.ok) throw new Error("POLICY_HTTP_" + response.status);

        const payload = await response.json();

        if (payload?.success !== true) {
          throw new Error("POLICY_NOT_CONFIRMED");
        }

        const policy = extractPolicy(payload);

        /*
          Fail closed:
          لا نسمح بالتسجيل إذا لم يعلن المحرك صراحة أن التسجيل مفتوح.
        */
        if (policy.registrationOpen !== true) {
          currentPolicy = policy;
          renderPolicy();
          setEngineStatus(true);
          policyReady = true;
          return;
        }

        currentPolicy = policy;
        renderPolicy();
        setEngineStatus(true);
        policyReady = true;

      } catch (error) {
        currentPolicy = null;
        policyReady = false;

        $("signupForm").classList.add("hidden");
        $("providerSection").classList.add("hidden");
        $("registrationClosed").classList.remove("hidden");
        $("registrationClosed").textContent = t("policyUnavailable");

        setEngineStatus(false);
      }
    }

    function validatePassword(password, policy) {
      const p = policy.password;

      if (password.length < p.minLength) {
        return t("shortPassword");
      }

      if (password.length > p.maxLength) {
        return t("longPassword");
      }

      if (p.requireUppercase && !/[A-Z]/.test(password)) {
        return t("shortPassword");
      }

      if (p.requireLowercase && !/[a-z]/.test(password)) {
        return t("shortPassword");
      }

      if (p.requireNumber && !/[0-9]/.test(password)) {
        return t("shortPassword");
      }

      if (p.requireSpecial && !/[^A-Za-z0-9]/.test(password)) {
        return t("shortPassword");
      }

      return null;
    }

    function normalizeEmail(email) {
      return email.trim().toLowerCase();
    }

    function mapAuthError(error) {
      const message = String(error?.message || "").toLowerCase();

      if (
        message.includes("already registered") ||
        message.includes("already exists") ||
        message.includes("user already")
      ) {
        return t("duplicate");
      }

      if (
        message.includes("password") ||
        message.includes("weak")
      ) {
        return t("shortPassword");
      }

      if (
        message.includes("network") ||
        message.includes("fetch")
      ) {
        return t("networkError");
      }

      return t("genericError");
    }

    function setLoading(loading) {
      requestInProgress = loading;

      const button = $("submitButton");
      button.disabled = loading || !policyReady ||
        currentPolicy?.registrationOpen !== true ||
        currentPolicy?.emailEnabled !== true;

      button.innerHTML = loading
        ? `<span class="loading"></span>${t("creating")}`
        : `<span>${t("createAccount")}</span>`;
    }

    async function submitSignup(event) {
      event.preventDefault();
      clearMessage();

      if (requestInProgress) return;

      /*
        لا يتم التسجيل دون قراءة سياسة المحرك بنجاح.
      */
      if (!policyReady || !currentPolicy) {
        showMessage(t("policyUnavailable"), "error");
        await loadPolicy();
        return;
      }

      if (currentPolicy.registrationOpen !== true) {
        showMessage(t("closed"), "error");
        return;
      }

      if (currentPolicy.emailEnabled !== true) {
        showMessage(t("emailDisabled"), "error");
        return;
      }

      const email = normalizeEmail($("email").value);
      const password = $("password").value;
      const confirmation = $("confirmPassword").value;

      if (!email || !password || !confirmation) {
        showMessage(t("required"), "error");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage(t("invalidEmail"), "error");
        return;
      }

      const passwordError = validatePassword(
        password,
        currentPolicy
      );

      if (passwordError) {
        showMessage(passwordError, "error");
        return;
      }

      if (password !== confirmation) {
        showMessage(t("mismatch"), "error");
        return;
      }

      if (currentPolicy.termsRequired && !$("terms").checked) {
        showMessage(t("termsRequired"), "error");
        return;
      }

      setLoading(true);

      try {
        /*
          إعادة قراءة السياسة قبل تنفيذ التسجيل.
          هذا يقلل احتمال استخدام سياسة قديمة.
        */
        const policyResponse = await fetchWithTimeout(
          CONFIG.STATUS_URL,
          {
            method: "GET",
            headers: {
              "Accept": "application/json",
              "apikey": CONFIG.SUPABASE_KEY
            }
          }
        );

        if (!policyResponse.ok) {
          throw new Error("POLICY_RECHECK_FAILED");
        }

        const latestPayload = await policyResponse.json();

        if (latestPayload?.success !== true) {
          throw new Error("POLICY_RECHECK_FAILED");
        }

        const latestPolicy = extractPolicy(latestPayload);

        if (
          latestPolicy.registrationOpen !== true ||
          latestPolicy.emailEnabled !== true
        ) {
          currentPolicy = latestPolicy;
          renderPolicy();
          throw new Error("REGISTRATION_DISABLED");
        }

        currentPolicy = latestPolicy;

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: CONFIG.CONFIRMED_URL,
            data: {
              aqx_identity: true,
              registration_source: "aqx_identity_web"
            }
          }
        });

        if (error) throw error;

        /*
          لا نعرض رسالة نجاح إلا بعد استجابة Supabase الناجحة.
          لا نعتمد على وجود user وحده لإثبات تفعيل البريد.
        */
        if (!data || !data.user) {
          throw new Error("SIGNUP_RESPONSE_INVALID");
        }

        $("signupForm").reset();
        showMessage(t("signupSuccess"), "success");

      } catch (error) {
        if (error.message === "REGISTRATION_DISABLED") {
          showMessage(t("closed"), "error");
        } else if (error.message === "POLICY_RECHECK_FAILED") {
          showMessage(t("policyUnavailable"), "error");
        } else {
          showMessage(mapAuthError(error), "error");
        }

      } finally {
        setLoading(false);
      }
    }

    async function startOAuth(provider) {
      clearMessage();

      if (
        !policyReady ||
        !currentPolicy ||
        currentPolicy.registrationOpen !== true ||
        currentPolicy.providers[provider] !== true
      ) {
        showMessage(t("providerDisabled"), "error");
        return;
      }

      try {
        /*
          لا يكفي إظهار الزر:
          إعداد المزود يجب أن يكون مفعّلًا أيضًا في Supabase Auth.
        */
        const { error } = await supabase.auth.signInWithOAuth({
          provider,
          options: {
            redirectTo: CONFIG.CONFIRMED_URL,
            queryParams: provider === "google"
              ? { access_type:"offline", prompt:"select_account" }
              : undefined
          }
        });

        if (error) throw error;

      } catch (error) {
        showMessage(t("oauthError"), "error");
      }
    }

    async function initialize() {
      currentLanguage = detectLanguage();
      applyLanguage();

      $("loginLink").href = CONFIG.LOGIN_URL;
      $("signupForm").addEventListener("submit", submitSignup);

      await loadPolicy();

      /*
        تحديث السياسة دوريًا:
        فتح/غلق التسجيل وتغيير مزودي الدخول يظهر تلقائيًا.
      */
      setInterval(async () => {
        await loadPolicy();
      }, CONFIG.REFRESH_INTERVAL);
    }

    initialize();

  })();
  </script>
</body>
</html>
