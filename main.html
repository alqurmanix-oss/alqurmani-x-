<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlQurmanix — الواجهة الرئيسية</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Scheherazade+New:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet" />
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ── Firebase Config ──
    const firebaseConfig = {
      apiKey: "AIzaSyCoM-Aqq7VwTDx5ZeHmIpHM4sm2XM0WdKw",
      authDomain: "alqurmanix-15b92.firebaseapp.com",
      projectId: "alqurmanix-15b92",
      storageBucket: "alqurmanix-15b92.firebasestorage.app",
      messagingSenderId: "477352026568",
      appId: "1:477352026568:web:49f90cd3fc74b6948ba0fd",
      measurementId: "G-VJF36N1MCD"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ── Redirect to index ──
    function redirectToIndex() {
      sessionStorage.removeItem("aqx_auth_entry");
      window.location.replace("./index.html");
    }

    // ── History Guard — block back/forward manipulation ──
    window.history.pushState(null, "", window.location.href);
    window.addEventListener("popstate", () => {
      if (!sessionStorage.getItem("aqx_auth_entry")) redirectToIndex();
      else window.history.pushState(null, "", window.location.href);
    });

    // ── Auth Guard (الدخول اللحظي الصارم) ──
    onAuthStateChanged(auth, async (user) => {
      if (!user) { redirectToIndex(); return; }
      if (!user.emailVerified) { await signOut(auth); redirectToIndex(); return; }

      // 1. إظهار الواجهة فوراً للمستخدم (دخول سريع لحظي)
      const loader = document.getElementById("loading-screen");
      const dashboard = document.getElementById("dashboard");
      
      if(loader && dashboard) {
        loader.style.opacity = "0";
        setTimeout(() => {
          loader.style.display = "none";
          dashboard.style.display = "grid"; // تفعيل شبكة التصميم
        }, 300);
      }

      // وضع اسم المستخدم في الواجهة
      const userNameEl = document.getElementById("user-name");
      if(userNameEl) userNameEl.textContent = user.displayName || user.email.split("@")[0];

      // 2. تحديث القاعدة في الخلفية بصمت تام وبنفس الصرامة
      try {
        sessionStorage.setItem("aqx_auth_entry", "true");
        const userRef = doc(db, "users", user.uid);
        updateDoc(userRef, { lastActivity: serverTimestamp() }).catch(e => console.warn("Firestore Logic Executed"));
      } catch (e) {
        console.warn("DB Auth Handled");
      }
    });

    // ── Make signOut available globally ──
    window._aqxSignOut = async () => {
      sessionStorage.removeItem("aqx_auth_entry");
      await signOut(auth);
      redirectToIndex();
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #d4af37; --gold2: #f0d060; --gold3: #c8961e;
      --bg-deep: #050510; --bg-mid: #0a0a1f; --bg-card: #0f0f2a;
      --bg-glass: rgba(212,175,55,0.04);
      --border-gold: rgba(212,175,55,0.25);
      --text-primary: #f5e6b8; --text-muted: rgba(245,230,184,0.55);
      --neon-green: #00ff88;
      --sidebar-w: 280px;
      --radius: 14px;
      --shadow-gold: 0 0 24px rgba(212,175,55,0.18), 0 4px 32px rgba(0,0,0,0.7);
    }

    html, body { height: 100%; background: var(--bg-deep); color: var(--text-primary); font-family: 'Scheherazade New', 'Playfair Display', serif; overflow-x: hidden; }

    /* ─── Loading Screen ─── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: radial-gradient(ellipse at 50% 30%, #1a1020 0%, var(--bg-deep) 70%);
      transition: opacity 0.3s ease;
    }
    .spinner-ring {
      width: 72px; height: 72px; border-radius: 50%;
      border: 3px solid var(--border-gold); border-top-color: var(--gold);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 1.1rem; color: var(--text-muted); letter-spacing: 0.06em; }

    /* ─── Main Layout ─── */
    #dashboard {
      display: none;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(212,175,55,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 90% 100%, rgba(212,175,55,0.04) 0%, transparent 60%),
        var(--bg-deep);
      animation: fadeIn 0.5s ease both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ─── Sidebar ─── */
    .sidebar {
      background: linear-gradient(180deg, rgba(212,175,55,0.07) 0%, rgba(212,175,55,0.02) 100%), var(--bg-card);
      border-left: 1px solid var(--border-gold);
      display: flex; flex-direction: column;
      height: 100vh; position: sticky; top: 0; overflow-y: auto;
      padding: 20px 12px;
      scrollbar-width: thin; scrollbar-color: rgba(212,175,55,0.2) transparent;
    }

    /* Clock */
    .clock-block {
      background: linear-gradient(135deg, rgba(212,175,55,0.12) 0%, rgba(212,175,55,0.04) 100%);
      border: 1px solid var(--border-gold); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 20px; text-align: center;
      box-shadow: var(--shadow-gold);
    }
    .clock-time {
      font-family: 'Cinzel Decorative', serif; font-size: 1.3rem; color: var(--gold);
      letter-spacing: 0.1em; text-shadow: 0 0 12px rgba(212,175,55,0.5);
    }
    .clock-date { font-size: 0.74rem; color: var(--text-muted); margin-top: 6px; line-height: 1.6; }

    /* Nav */
    .nav-list { display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 10px; border: 1px solid transparent;
      background: transparent; color: var(--text-primary); cursor: pointer;
      font-family: inherit; font-size: 0.87rem;
      transition: all 0.22s ease; text-align: right; text-decoration: none;
      animation: fadeInRight 0.4s ease both;
    }
    @keyframes fadeInRight { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }
    .nav-item:hover {
      background: rgba(212,175,55,0.1); border-color: var(--border-gold); color: var(--gold2);
      transform: translateX(-4px); box-shadow: 0 0 12px rgba(212,175,55,0.15);
    }
    .nav-emoji { font-size: 1.1rem; flex-shrink: 0; }
    .nav-label { flex: 1; }
    .nav-arrow { color: var(--gold3); font-size: 1.1rem; opacity: 0.6; }

    /* Logout */
    .logout-btn {
      margin-top: 14px; padding: 11px 16px; border-radius: var(--radius);
      border: 1px solid rgba(255,80,80,0.3); background: rgba(255,80,80,0.06);
      color: #ff7070; cursor: pointer; font-family: inherit; font-size: 0.88rem;
      transition: all 0.2s ease; width: 100%;
    }
    .logout-btn:hover { background: rgba(255,80,80,0.15); border-color: rgba(255,80,80,0.6); }

    /* ─── Main Content ─── */
    .main-content { padding: 28px 36px; display: flex; flex-direction: column; gap: 30px; overflow-y: auto; min-height: 100vh; }

    /* Topbar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 20px; border-bottom: 1px solid var(--border-gold);
      flex-wrap: wrap; gap: 12px;
    }
    .topbar-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

    /* Logo */
    .logo-text {
      font-family: 'Cinzel Decorative', serif; font-size: 1.7rem; font-weight: 900;
      background: linear-gradient(135deg, #f0d060 0%, #d4af37 40%, #c8961e 70%, #f0d060 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: shimmerGold 3s linear infinite;
      letter-spacing: 0.08em;
      filter: drop-shadow(0 0 14px rgba(212,175,55,0.45));
    }
    @keyframes shimmerGold { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    .logo-wrap { display: flex; flex-direction: column; }
    .logo-under {
      height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: pulseWidth 2s ease-in-out infinite; margin-top: 3px;
    }
    @keyframes pulseWidth { 0%,100%{opacity:.4;transform:scaleX(.7)} 50%{opacity:1;transform:scaleX(1)} }

    /* Connection */
    .connection-badge { display: flex; align-items: center; gap: 8px; }
    .neon-bulb {
      width: 10px; height: 10px; border-radius: 50%; background: var(--neon-green);
      box-shadow: 0 0 6px var(--neon-green), 0 0 14px rgba(0,255,136,0.5);
      animation: blinkNeon 2.5s ease-in-out infinite; flex-shrink: 0;
    }
    @keyframes blinkNeon { 0%,100%{opacity:1;box-shadow:0 0 6px var(--neon-green),0 0 18px rgba(0,255,136,.6)} 50%{opacity:.55;box-shadow:0 0 3px var(--neon-green)} }
    .conn-label { font-size: 0.8rem; color: var(--neon-green); letter-spacing: 0.05em; }

    /* Globe */
    .globe-wrapper { position: relative; }
    .globe-btn { cursor: pointer; user-select: none; }
    .globe-orb {
      width: 42px; height: 42px; position: relative;
      animation: rotateGlobe 12s linear infinite; transition: transform .3s;
    }
    .globe-btn:hover .globe-orb { transform: scale(1.15); }
    @keyframes rotateGlobe { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .globe-svg { width: 100%; height: 100%; }
    .globe-flag {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; animation: counterRotate 12s linear infinite;
    }
    @keyframes counterRotate { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
    .lang-dropdown {
      position: absolute; top: 52px; left: 0;
      background: var(--bg-card); border: 1px solid var(--border-gold); border-radius: var(--radius);
      padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      z-index: 1000; min-width: 220px; box-shadow: var(--shadow-gold);
      animation: dropIn .18s ease;
    }
    @keyframes dropIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:none} }
    .lang-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px;
      background: transparent; border: 1px solid transparent; color: var(--text-primary);
      cursor: pointer; font-size: 0.82rem; font-family: inherit; transition: all .15s ease;
    }
    .lang-item:hover, .lang-item.active-lang { background: rgba(212,175,55,.1); border-color: var(--border-gold); color: var(--gold2); }
    .lang-flag { font-size: 1.2rem; }

    /* User Chip */
    .user-chip {
      display: flex; align-items: center; gap: 8px; padding: 6px 14px;
      border-radius: 50px; border: 1px solid var(--border-gold);
      background: rgba(212,175,55,.06); color: var(--text-primary);
    }
    .user-name { font-size: 0.82rem; color: var(--gold2); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Welcome */
    .welcome-strip {
      text-align: center; padding: 20px;
      border: 1px solid var(--border-gold); border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(212,175,55,.08) 0%, rgba(212,175,55,.02) 100%);
      box-shadow: var(--shadow-gold);
      animation: fadeInUp .6s ease both;
    }
    .welcome-text { font-size: 1.4rem; color: var(--text-muted); }
    .welcome-brand {
      font-family: 'Cinzel Decorative', serif; font-size: 1.6rem; font-weight: 900;
      background: linear-gradient(90deg, #f0d060, #d4af37, #c8961e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }

    /* Gates */
    .section-title {
      font-family: 'Cinzel Decorative', serif; font-size: 1rem; color: var(--gold);
      letter-spacing: .15em; text-transform: uppercase; margin-bottom: 18px; text-align: center;
    }
    .gates-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .gate-card {
      position: relative; overflow: hidden; padding: 28px 20px; border-radius: var(--radius);
      border: 1px solid var(--border-gold);
      background: linear-gradient(135deg, rgba(212,175,55,.1) 0%, rgba(212,175,55,.03) 100%);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      cursor: pointer; font-family: inherit; color: var(--text-primary);
      transition: all .3s ease; box-shadow: var(--shadow-gold);
      animation: fadeInUp .5s ease both; text-decoration: none;
    }
    .gate-card:hover {
      transform: translateY(-6px);
      border-color: var(--gold);
      box-shadow: 0 8px 40px rgba(212,175,55,.25), 0 0 0 1px rgba(212,175,55,.3);
      background: linear-gradient(135deg, rgba(212,175,55,.18) 0%, rgba(212,175,55,.06) 100%);
    }
    .gate-icon { font-size: 2.4rem; filter: drop-shadow(0 0 8px rgba(212,175,55,.4)); }
    .gate-label { font-size: .92rem; color: var(--gold2); text-align: center; font-weight: 600; }
    .gate-shine { position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,transparent 50%); pointer-events:none; }

    /* Holding Banner */
    .holding-banner {
      border: 1px solid var(--border-gold); border-radius: var(--radius);
      padding: 20px 28px;
      background: linear-gradient(90deg, rgba(212,175,55,.08) 0%, rgba(212,175,55,.03) 50%, rgba(212,175,55,.08) 100%);
      animation: bannerFloat 3s ease-in-out infinite; box-shadow: var(--shadow-gold);
      text-align: center;
    }
    @keyframes bannerFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    .holding-inner { display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; }
    .holding-diamond { color:var(--gold); font-size:.8rem; animation:rotateDiamond 4s linear infinite; }
    @keyframes rotateDiamond { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .holding-text {
      font-family: 'Cinzel Decorative', serif; font-size: .88rem; color: var(--gold2);
      letter-spacing: .08em;
    }

    /* Hand Pointer */
    .hand-pointer {
      display: flex; align-items: center; gap: 14px; padding: 20px 32px;
      border-radius: var(--radius); border: 1px solid var(--border-gold);
      background: linear-gradient(135deg, rgba(212,175,55,.1) 0%, transparent 100%);
      cursor: pointer; font-family: inherit; color: var(--text-primary);
      align-self: center; width: fit-content; margin: 0 auto;
      animation: handBounce 1.8s ease-in-out infinite;
      transition: all .2s ease; box-shadow: var(--shadow-gold);
      text-decoration: none;
    }
    @keyframes handBounce { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-6px) scale(1.03)} }
    .hand-pointer:hover { background:rgba(212,175,55,.18); border-color:var(--gold); box-shadow:0 0 24px rgba(212,175,55,.3); }
    .hand-emoji { font-size: 2rem; animation: pointUp 1.2s ease-in-out infinite; }
    @keyframes pointUp { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    .hand-label { font-family:'Cinzel Decorative',serif; font-size:1rem; color:var(--gold2); letter-spacing:.08em; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(212,175,55,.25); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(212,175,55,.45); }

    /* Responsive */
    @media (max-width: 768px) {
      #dashboard { grid-template-columns: 1fr !important; }
      .sidebar { position: fixed; bottom: 0; left: 0; right: 0; height: auto; max-height: 50vh; overflow-y: auto; z-index: 100; border-left: none; border-top: 1px solid var(--border-gold); flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 10px; }
      .main-content { padding: 16px; padding-bottom: 240px; }
      .gates-grid { grid-template-columns: 1fr 1fr; }
      .clock-block { display: none; }
    }
  </style>
</head>

    const NAV_ITEMS = [
      {key:"profile",emoji:"👤",file:"./profile.html"},
      {key:"settings",emoji:"⚙️",file:"./settings.html"},
      {key:"notifications",emoji:"🔔",file:"./notifications.html"},
      {key:"support",emoji:"🎧",file:"./support.html"},
      {key:"ai",emoji:"🤖",file:"./alqurmanix-ai.html"},
      {key:"docs",emoji:"📚",file:"./docs-membership.html"},
      {key:"policies",emoji:"⚖️",file:"./policies.html"},
      {key:"parking",emoji:"🅿️",file:"./parking.html"},
      {key:"wallet",emoji:"💰",file:"./wallet.html"},
      {key:"earnCoin",emoji:"🪙",file:"./earn-coin.html"},
      {key:"careers",emoji:"💼",file:"./careers.html"},
      {key:"supportUs",emoji:"❤️",file:"./support-us.html"},
      {key:"donate",emoji:"🤲",file:"./donate.html"},
      {key:"marketplace",emoji:"🛒",file:"./marketplace.html"},
      {key:"community",emoji:"🏛️",file:"./community.html"},
    ];

    const GATES = [
      {key:"employees",emoji:"👔",file:"./gate-employees.html"},
      {key:"clients",emoji:"🤝",file:"./gate-clients.html"},
      {key:"business",emoji:"🏢",file:"./gate-business.html"},
      {key:"social",emoji:"🌐",file:"./gate-social.html"},
    ];

    let currentLang = "ar";

    function applyLang(lang) {
      currentLang = lang;
      const L = LANGS[lang] || LANGS["ar"];
      const t = L.t;
      document.documentElement.lang = lang;
      document.documentElement.dir = L.dir;
      document.getElementById("globe-flag").textContent = L.flag;

      // Labels
      document.getElementById("lbl-connected").textContent = t.connected;
      document.getElementById("lbl-welcome").textContent = t.welcome;
      document.getElementById("lbl-holding").textContent = t.holding;
      document.getElementById("lbl-next").textContent = t.nextPage;
      document.getElementById("lbl-logout").textContent = t.logout;
      document.getElementById("lbl-gates-title").textContent = t.gatesTitle;

      // Nav
      const navList = document.getElementById("nav-list");
      navList.innerHTML = "";
      NAV_ITEMS.forEach((item, i) => {
        const a = document.createElement("a");
        a.className = "nav-item";
        a.href = item.file;
        a.style.animationDelay = (i * 40) + "ms";
        a.onclick = (e) => { e.preventDefault(); sessionStorage.setItem("aqx_auth_entry","true"); window.location.href = item.file; };
        a.innerHTML = `<span class="nav-emoji">${item.emoji}</span><span class="nav-label">${t[item.key]||item.key}</span><span class="nav-arrow">›</span>`;
        navList.appendChild(a);
      });

      // Gates
      const gatesGrid = document.getElementById("gates-grid");
      gatesGrid.innerHTML = "";
      GATES.forEach((gate, i) => {
        const a = document.createElement("a");
        a.className = "gate-card";
        a.href = gate.file;
        a.style.animationDelay = (i * 80) + "ms";
        a.onclick = (e) => { e.preventDefault(); sessionStorage.setItem("aqx_auth_entry","true"); window.location.href = gate.file; };
        a.innerHTML = `<span class="gate-icon">${gate.emoji}</span><span class="gate-label">${t[gate.key]||gate.key}</span><div class="gate-shine"></div>`;
        gatesGrid.appendChild(a);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Initialize Language
      applyLang(localStorage.getItem("aqx_lang") || "ar");

      // Setup Globe Dropdown
      const globeBtn = document.getElementById("globe-btn");
      const langDd = document.getElementById("lang-dropdown");
      
      // Build dropdown items dynamically
      langDd.innerHTML = "";
      Object.keys(LANGS).forEach(key => {
        const btn = document.createElement("button");
        btn.className = "lang-item";
        btn.innerHTML = `<span class="lang-flag">${LANGS[key].flag}</span><span>${LANGS[key].label}</span>`;
        btn.onclick = () => {
          localStorage.setItem("aqx_lang", key);
          applyLang(key);
          langDd.style.display = "none";
        };
        langDd.appendChild(btn);
      });

      globeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        langDd.style.display = langDd.style.display === "none" || langDd.style.display === "" ? "grid" : "none";
      });
      document.addEventListener("click", () => { langDd.style.display = "none"; });

      // Setup Live Clock
      function updateClock() {
        const now = new Date();
        const loc = currentLang === 'ar' ? 'ar-EG' : 'en-US'; // Adjust formatting based on Arabic or English
        document.getElementById("clock-time").textContent = now.toLocaleTimeString(loc, {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        document.getElementById("clock-date").textContent = now.toLocaleDateString(loc, {weekday:'long', year:'numeric', month:'long', day:'numeric'});
      }
      setInterval(updateClock, 1000);
      updateClock(); // Initial call
    });
  </script>
