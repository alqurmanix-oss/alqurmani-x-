<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlQurmanix — الواجهة الرئيسية</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #d4af37; --gold2: #f0d060; --gold3: #c8961e;
      --bg-deep: #050510; --bg-card: #0c0c22;
      --border-gold: rgba(212,175,55,0.22);
      --text-primary: #f5e6b8; --text-muted: rgba(245,230,184,0.52);
      --neon-green: #00ff88;
      --sidebar-w: 272px;
      --radius: 13px;
      --shadow-gold: 0 0 22px rgba(212,175,55,0.15), 0 4px 28px rgba(0,0,0,0.65);
    }

    html, body { height: 100%; background: var(--bg-deep); color: var(--text-primary); font-family: 'Scheherazade New', serif; overflow-x: hidden; }

    /* ═══ LOADING SCREEN ═══ */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: radial-gradient(ellipse at 50% 30%, #110820 0%, var(--bg-deep) 70%);
      transition: opacity 0.32s ease;
    }
    #loading-screen.hide { opacity: 0; pointer-events: none; }
    .aq-logo-load {
      font-family: 'Cinzel Decorative', serif; font-size: 1.6rem; font-weight: 900;
      background: linear-gradient(135deg, #f0d060 0%, #d4af37 50%, #c8961e 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: 0.1em; filter: drop-shadow(0 0 12px rgba(212,175,55,0.5));
      animation: breathe 1.8s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100%{opacity:.7;transform:scale(1)} 50%{opacity:1;transform:scale(1.04)} }
    .gold-bar {
      width: 160px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 2px; overflow: hidden; position: relative;
    }
    .gold-bar::after {
      content: ''; position: absolute; inset-block: 0; width: 60px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: barSweep 1.2s ease-in-out infinite;
    }
    @keyframes barSweep { from{transform:translateX(-60px)} to{transform:translateX(220px)} }
    .load-txt { font-size: 0.82rem; color: var(--text-muted); letter-spacing: 0.08em; }

    /* ═══ MAIN LAYOUT ═══ */
    #dashboard {
      display: none;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 55% at 8% 0%, rgba(212,175,55,0.07) 0%, transparent 58%),
        radial-gradient(ellipse 55% 75% at 92% 100%, rgba(212,175,55,0.05) 0%, transparent 58%),
        var(--bg-deep);
    }
    #dashboard.show { display: grid; animation: dashIn .38s ease; }
    @keyframes dashIn { from{opacity:0;transform:scale(.99)} to{opacity:1;transform:none} }
    [dir="ltr"] #dashboard { grid-template-columns: 1fr var(--sidebar-w); }

    /* ═══ SIDEBAR ═══ */
    .sidebar {
      background: linear-gradient(180deg, rgba(212,175,55,0.07) 0%, rgba(212,175,55,0.015) 100%), var(--bg-card);
      border-left: 1px solid var(--border-gold);
      display: flex; flex-direction: column;
      height: 100vh; position: sticky; top: 0; overflow-y: auto;
      padding: 18px 11px;
      scrollbar-width: thin; scrollbar-color: rgba(212,175,55,0.18) transparent;
      order: 2;
    }
    [dir="ltr"] .sidebar { border-left: none; border-right: 1px solid var(--border-gold); order: 1; }

    /* Clock */
    .clock-block {
      background: linear-gradient(135deg, rgba(212,175,55,0.13) 0%, rgba(212,175,55,0.04) 100%);
      border: 1px solid var(--border-gold); border-radius: var(--radius);
      padding: 13px 14px; margin-bottom: 18px; text-align: center;
      box-shadow: var(--shadow-gold);
    }
    .clock-time {
      font-family: 'Cinzel Decorative', serif; font-size: 1.22rem; color: var(--gold);
      letter-spacing: 0.1em; text-shadow: 0 0 10px rgba(212,175,55,0.45);
    }
    .clock-date { font-size: 0.72rem; color: var(--text-muted); margin-top: 5px; line-height: 1.65; }

    /* Nav */
    .nav-list { display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 11px;
      border-radius: 9px; border: 1px solid transparent;
      background: transparent; color: var(--text-primary); cursor: pointer;
      font-family: inherit; font-size: 0.86rem; text-decoration: none;
      transition: all 0.2s ease; text-align: right;
      animation: fadeInSlide 0.36s ease both;
    }
    @keyframes fadeInSlide { from{opacity:0;transform:translateX(10px)} to{opacity:1;transform:none} }
    [dir="ltr"] .nav-item { text-align: left; }
    [dir="ltr"] .nav-item { animation-name: fadeInSlideL; }
    @keyframes fadeInSlideL { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:none} }
    .nav-item:hover {
      background: rgba(212,175,55,0.09); border-color: var(--border-gold); color: var(--gold2);
      transform: translateX(-3px); box-shadow: 0 0 10px rgba(212,175,55,0.12);
    }
    [dir="ltr"] .nav-item:hover { transform: translateX(3px); }
    .nav-emoji { font-size: 1.05rem; flex-shrink: 0; }
    .nav-label { flex: 1; }
    .nav-arrow { color: var(--gold3); font-size: 1rem; opacity: 0.55; }

    /* Logout */
    .logout-btn {
      margin-top: 12px; padding: 10px 14px; border-radius: var(--radius);
      border: 1px solid rgba(255,80,80,0.28); background: rgba(255,80,80,0.05);
      color: #ff7575; cursor: pointer; font-family: inherit; font-size: 0.86rem;
      transition: all 0.2s ease; width: 100%;
    }
    .logout-btn:hover { background: rgba(255,80,80,0.13); border-color: rgba(255,80,80,0.55); }

    /* ═══ MAIN CONTENT ═══ */
    .main-content {
      padding: 26px 34px; display: flex; flex-direction: column; gap: 28px;
      overflow-y: auto; min-height: 100vh; order: 1;
    }
    [dir="ltr"] .main-content { order: 2; }

    /* Topbar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 18px; border-bottom: 1px solid var(--border-gold);
      flex-wrap: wrap; gap: 12px;
    }
    .topbar-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

    /* Logo */
    .logo-wrap { display: flex; flex-direction: column; }
    .logo-text {
      font-family: 'Cinzel Decorative', serif; font-size: 1.65rem; font-weight: 900;
      background: linear-gradient(135deg, #f0d060 0%, #d4af37 40%, #c8961e 65%, #f0d060 100%);
      background-size: 220% 220%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: shimmerGold 3.5s linear infinite; letter-spacing: 0.08em;
      filter: drop-shadow(0 0 12px rgba(212,175,55,0.4));
    }
    @keyframes shimmerGold { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    .logo-under {
      height: 2px; margin-top: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: pulseWidth 2.2s ease-in-out infinite;
    }
    @keyframes pulseWidth { 0%,100%{opacity:.35;transform:scaleX(.65)} 50%{opacity:1;transform:scaleX(1)} }

    /* Connection */
    .connection-badge { display: flex; align-items: center; gap: 7px; }
    .neon-bulb {
      width: 9px; height: 9px; border-radius: 50%; background: var(--neon-green); flex-shrink: 0;
      box-shadow: 0 0 5px var(--neon-green), 0 0 12px rgba(0,255,136,0.45);
      animation: blinkNeon 2.6s ease-in-out infinite;
    }
    @keyframes blinkNeon { 0%,100%{opacity:1;box-shadow:0 0 5px var(--neon-green),0 0 16px rgba(0,255,136,.55)} 50%{opacity:.5;box-shadow:0 0 3px var(--neon-green)} }
    .conn-label { font-size: 0.78rem; color: var(--neon-green); letter-spacing: 0.05em; }

    /* Globe */
    .globe-wrapper { position: relative; }
    .globe-btn { cursor: pointer; user-select: none; width: 42px; height: 42px; position: relative; display: block; }
    .globe-orb { width: 42px; height: 42px; position: relative; animation: rotateGlobe 14s linear infinite; }
    .globe-btn:hover .globe-orb { filter: drop-shadow(0 0 8px rgba(212,175,55,0.5)); }
    @keyframes rotateGlobe { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .globe-svg { width: 100%; height: 100%; display: block; }
    .globe-flag {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem; animation: counterRotate 14s linear infinite; pointer-events: none;
    }
    @keyframes counterRotate { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
    .lang-dropdown {
      position: absolute; top: 50px; right: 0;
      background: linear-gradient(160deg, #12122a 0%, var(--bg-card) 100%);
      border: 1px solid var(--border-gold); border-radius: var(--radius);
      padding: 8px; display: none; grid-template-columns: 1fr 1fr; gap: 3px;
      z-index: 1000; min-width: 218px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 20px rgba(212,175,55,0.1);
    }
    .lang-dropdown.open { display: grid; animation: dropIn .16s ease; }
    [dir="ltr"] .lang-dropdown { right: auto; left: 0; }
    @keyframes dropIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
    .lang-item {
      display: flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: 8px;
      background: transparent; border: 1px solid transparent; color: var(--text-primary);
      cursor: pointer; font-size: 0.8rem; font-family: inherit; transition: all .14s ease;
    }
    .lang-item:hover,.lang-item.active-lang { background:rgba(212,175,55,.1); border-color:var(--border-gold); color:var(--gold2); }
    .lang-flag { font-size: 1.15rem; }

    /* User Chip */
    .user-chip {
      display: flex; align-items: center; gap: 8px; padding: 5px 12px;
      border-radius: 50px; border: 1px solid var(--border-gold);
      background: rgba(212,175,55,.05);
    }
    .user-name { font-size: 0.8rem; color: var(--gold2); max-width: 115px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Welcome */
    .welcome-strip {
      text-align: center; padding: 20px 24px;
      border: 1px solid var(--border-gold); border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(212,175,55,.09) 0%, rgba(212,175,55,.02) 100%);
      box-shadow: var(--shadow-gold);
      animation: fadeInUp .5s ease both;
    }
    .welcome-text { font-size: 1.35rem; color: var(--text-muted); }
    .welcome-brand {
      font-family: 'Cinzel Decorative', serif; font-size: 1.55rem; font-weight: 900;
      background: linear-gradient(90deg, #f0d060, #d4af37, #c8961e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

    /* Gates */
    .section-title {
      font-family: 'Cinzel Decorative', serif; font-size: .9rem; color: var(--gold);
      letter-spacing: .15em; text-transform: uppercase; margin-bottom: 16px; text-align: center;
    }
    .gates-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
    .gate-card {
      position: relative; overflow: hidden; padding: 26px 18px; border-radius: var(--radius);
      border: 1px solid var(--border-gold);
      background: linear-gradient(135deg, rgba(212,175,55,.09) 0%, rgba(212,175,55,.025) 100%);
      display: flex; flex-direction: column; align-items: center; gap: 11px;
      cursor: pointer; font-family: inherit; color: var(--text-primary);
      transition: all .28s ease; box-shadow: var(--shadow-gold); text-decoration: none;
      animation: fadeInUp .45s ease both;
    }
    .gate-card:hover {
      transform: translateY(-5px); border-color: var(--gold);
      box-shadow: 0 8px 38px rgba(212,175,55,.22), 0 0 0 1px rgba(212,175,55,.28);
      background: linear-gradient(135deg, rgba(212,175,55,.17) 0%, rgba(212,175,55,.055) 100%);
    }
    .gate-icon { font-size: 2.2rem; filter: drop-shadow(0 0 7px rgba(212,175,55,.38)); }
    .gate-label { font-size: .88rem; color: var(--gold2); text-align: center; font-weight: 600; line-height: 1.4; }
    .gate-shine { position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 50%); pointer-events:none; }

    /* Holding Banner */
    .holding-banner {
      border: 1px solid var(--border-gold); border-radius: var(--radius);
      padding: 18px 26px;
      background: linear-gradient(90deg, rgba(212,175,55,.08) 0%, rgba(212,175,55,.025) 50%, rgba(212,175,55,.08) 100%);
      animation: bannerFloat 3.2s ease-in-out infinite; box-shadow: var(--shadow-gold);
    }
    @keyframes bannerFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    .holding-inner { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; }
    .holding-diamond { color:var(--gold); font-size:.75rem; animation:rotateDiamond 5s linear infinite; }
    @keyframes rotateDiamond { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .holding-text {
      font-family: 'Cinzel Decorative', serif; font-size: .82rem; color: var(--gold2);
      letter-spacing: .07em; text-align: center;
    }

    /* ═══ HAND POINTER ═══ */
    .hand-pointer-wrap { display: flex; justify-content: center; padding-bottom: 10px; }
    .hand-pointer {
      display: inline-flex; align-items: center; gap: 13px; padding: 18px 30px;
      border-radius: var(--radius); border: 1px solid var(--border-gold);
      background: linear-gradient(135deg, rgba(212,175,55,.1) 0%, transparent 100%);
      cursor: pointer; font-family: inherit; color: var(--text-primary); text-decoration: none;
      animation: handBounce 1.9s ease-in-out infinite;
      transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
      box-shadow: var(--shadow-gold);
    }
    .hand-pointer:hover { background:rgba(212,175,55,.17); border-color:var(--gold); box-shadow:0 0 22px rgba(212,175,55,.28); }
    @keyframes handBounce { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-5px) scale(1.025)} }

    /* RTL → hand points LEFT (👈), LTR → hand points RIGHT (👉) */
    .hand-rtl { font-size:1.9rem; animation:swayRTL 1.3s ease-in-out infinite; }
    .hand-ltr { font-size:1.9rem; animation:swayLTR 1.3s ease-in-out infinite; }
    @keyframes swayRTL { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-6px)} }
    @keyframes swayLTR { 0%,100%{transform:translateX(0)} 50%{transform:translateX(6px)} }

    /* show correct hand based on dir */
    [dir="rtl"] .hand-rtl { display:inline-block; }
    [dir="rtl"] .hand-ltr { display:none; }
    [dir="ltr"] .hand-ltr { display:inline-block; }
    [dir="ltr"] .hand-rtl { display:none; }

    .hand-label { font-family:'Cinzel Decorative',serif; font-size:.95rem; color:var(--gold2); letter-spacing:.07em; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(212,175,55,.22); border-radius: 3px; }

    /* Responsive */
    @media (max-width: 780px) {
      #dashboard.show { grid-template-columns: 1fr !important; }
      .sidebar {
        position: fixed; bottom: 0; left: 0; right: 0;
        height: auto; max-height: 48vh; overflow-y: auto;
        z-index: 100; border-left: none; border-top: 1px solid var(--border-gold);
        flex-direction: row; flex-wrap: wrap; justify-content: center;
        padding: 10px; order: 99 !important;
      }
      .main-content { padding: 14px; padding-bottom: 230px; order: 1 !important; }
      .clock-block { display: none; }
      .gates-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div id="loading-screen">
    <div class="aq-logo-load">AlQurmanix</div>
    <div class="gold-bar"></div>
    <p class="load-txt" id="loading-msg">جارٍ التحقق من هويتك...</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <aside class="sidebar">
      <div class="clock-block">
        <div class="clock-time" id="clock-time">--:--:--</div>
        <div class="clock-date" id="clock-date">---</div>
      </div>
      <nav class="nav-list" id="nav-list"></nav>
      <button class="logout-btn" onclick="window._aqxSignOut()">🚪 <span id="lbl-logout">تسجيل الخروج</span></button>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="logo-wrap">
          <span class="logo-text">AlQurmanix</span>
          <div class="logo-under"></div>
        </div>
        <div class="topbar-right">
          <div class="connection-badge">
            <span class="neon-bulb"></span>
            <span class="conn-label" id="lbl-connected">متصل</span>
          </div>
          <div class="globe-wrapper" id="globe-wrapper">
            <div class="globe-btn" id="globe-btn" title="اختر اللغة">
              <div class="globe-orb">
                <svg class="globe-svg" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <radialGradient id="gGrad" cx="40%" cy="35%">
                      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.85"/>
                      <stop offset="55%" stop-color="#1a1a2e" stop-opacity="0.95"/>
                      <stop offset="100%" stop-color="#0d0d1a"/>
                    </radialGradient>
                  </defs>
                  <circle cx="30" cy="30" r="28" fill="url(#gGrad)" stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.55"/>
                  <ellipse cx="30" cy="30" rx="14" ry="28" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-opacity="0.38"/>
                  <ellipse cx="30" cy="30" rx="28" ry="8"  fill="none" stroke="#d4af37" stroke-width="0.45" stroke-opacity="0.38"/>
                  <ellipse cx="30" cy="30" rx="28" ry="17" fill="none" stroke="#d4af37" stroke-width="0.28" stroke-opacity="0.28"/>
                </svg>
                <span class="globe-flag" id="globe-flag">🇸🇦</span>
              </div>
            </div>
            <div class="lang-dropdown" id="lang-dropdown"></div>
          </div>
          <div class="user-chip">
            <span>👤</span>
            <span class="user-name" id="user-name">---</span>
          </div>
        </div>
      </div>

      <div class="welcome-strip">
        <span class="welcome-text" id="lbl-welcome">أهلاً بك في</span>
        <span class="welcome-brand">&nbsp;AlQurmanix&nbsp;</span>
        <span style="color:var(--gold);font-size:1.1rem">✦</span>
      </div>

      <section>
        <h2 class="section-title" id="lbl-gates-title">اختر بوابتك</h2>
        <div class="gates-grid" id="gates-grid"></div>
      </section>

      <div class="holding-banner">
        <div class="holding-inner">
          <span class="holding-diamond">◆</span>
          <span class="holding-text" id="lbl-holding">مجموعة شركات AlQurmanix القابضة ش.م.م</span>
          <span class="holding-diamond">◆</span>
        </div>
      </div>

      <div class="hand-pointer-wrap">
        <a class="hand-pointer" id="hand-pointer" href="./marketplace.html"
           onclick="event.preventDefault(); navTo('./marketplace.html')">
          <span class="hand-rtl">👈</span>
          <span class="hand-ltr">👉</span>
          <span class="hand-label" id="lbl-next">الصفحة التالية</span>
        </a>
      </div>
    </main>
  </div>

  <!-- ══ UI Scripts (plain JS — no module needed) ══ -->
  <script>
    const NAV_ITEMS = [
      {key:"profile",      emoji:"👤", file:"./profile.html"},
      {key:"settings",     emoji:"⚙️", file:"./settings.html"},
      {key:"notifications",emoji:"🔔", file:"./notifications.html"},
      {key:"support",      emoji:"🎧", file:"./support.html"},
      {key:"ai",           emoji:"🤖", file:"./alqurmanix-ai.html"},
      {key:"docs",         emoji:"📚", file:"./docs-membership.html"},
      {key:"policies",     emoji:"⚖️", file:"./policies.html"},
      {key:"parking",      emoji:"🅿️", file:"./parking.html"},
      {key:"wallet",       emoji:"💰", file:"./wallet.html"},
      {key:"earnCoin",     emoji:"🪙", file:"./earn-coin.html"},
      {key:"careers",      emoji:"💼", file:"./careers.html"},
      {key:"supportUs",    emoji:"❤️", file:"./support-us.html"},
      {key:"donate",       emoji:"🤲", file:"./donate.html"},
      {key:"marketplace",  emoji:"🛒", file:"./marketplace.html"},
      {key:"community",    emoji:"🏛️", file:"./community.html"},
    ];
    const GATES = [
      {key:"employees",emoji:"👔",file:"./gate-employees.html"},
      {key:"clients",  emoji:"🤝",file:"./gate-clients.html"},
      {key:"business", emoji:"🏢",file:"./gate-business.html"},
      {key:"social",   emoji:"🌐",file:"./gate-social.html"},

    let currentLang = "ar";

    function navTo(file) {
      sessionStorage.setItem("aqx_auth_entry", "true");
      window.location.href = file;
    }

    function applyLang(lang) {
      currentLang = lang;
      const L = LANGS[lang], t = L.t;
      document.documentElement.lang = lang;
      document.documentElement.dir = L.dir;
      document.getElementById("globe-flag").textContent  = L.flag;
      document.getElementById("lbl-connected").textContent = t.connected;
      document.getElementById("lbl-welcome").textContent   = t.welcome;
      document.getElementById("lbl-holding").textContent   = t.holding;
      document.getElementById("lbl-next").textContent      = t.nextPage;
      document.getElementById("lbl-logout").textContent    = t.logout;
      document.getElementById("lbl-gates-title").textContent = t.gatesTitle;

      // Nav
      const navList = document.getElementById("nav-list");
      navList.innerHTML = "";
      NAV_ITEMS.forEach((item, i) => {
        const a = document.createElement("a");
        a.className = "nav-item";
        a.href = item.file;
        a.style.animationDelay = (i * 32) + "ms";
        a.addEventListener("click", e => { e.preventDefault(); navTo(item.file); });
        a.innerHTML = `<span class="nav-emoji">${item.emoji}</span><span class="nav-label">${t[item.key]||item.key}</span><span class="nav-arrow">›</span>`;
        navList.appendChild(a);
      });

      // Gates
      const gatesGrid = document.getElementById("gates-grid");
      gatesGrid.innerHTML = "";
      GATES.forEach((gate, i) => {
        const a = document.createElement("a");
        a.className = "gate-card";
        a.href = gate.file;
        a.style.animationDelay = (i * 65) + "ms";
        a.addEventListener("click", e => { e.preventDefault(); navTo(gate.file); });
        a.innerHTML = `<span class="gate-icon">${gate.emoji}</span><span class="gate-label">${t[gate.key]||gate.key}</span><div class="gate-shine"></div>`;
        gatesGrid.appendChild(a);
      });

      // Lang dropdown
      const dd = document.getElementById("lang-dropdown");
      dd.innerHTML = "";
      Object.entries(LANGS).forEach(([k, v]) => {
        const btn = document.createElement("button");
        btn.className = "lang-item" + (k === lang ? " active-lang" : "");
        btn.innerHTML = `<span class="lang-flag">${v.flag}</span><span>${v.label}</span>`;
        btn.addEventListener("click", () => { applyLang(k); dd.classList.remove("open"); });
        dd.appendChild(btn);
      });
    }

    // Globe toggle
    document.getElementById("globe-btn").addEventListener("click", e => {
      e.stopPropagation();
      document.getElementById("lang-dropdown").classList.toggle("open");
    });
    document.addEventListener("click", e => {
      if (!document.getElementById("globe-wrapper").contains(e.target))
        document.getElementById("lang-dropdown").classList.remove("open");
    });

    // Clock
    const localeMap = {ar:"ar-SA",zh:"zh-CN",ko:"ko-KR",ja:"ja-JP",hi:"hi-IN"};
    function tickClock() {
      const now = new Date(), locale = localeMap[currentLang] || "en-US";
      document.getElementById("clock-time").textContent = now.toLocaleTimeString(locale,  {hour:"2-digit",minute:"2-digit",second:"2-digit"});
      document.getElementById("clock-date").textContent = now.toLocaleDateString(locale, {weekday:"long",year:"numeric",month:"long",day:"numeric"});
    }
    setInterval(tickClock, 1000);
    tickClock();

    // History guard
    window.history.pushState(null, "", window.location.href);
    window.addEventListener("popstate", () => {
      window.history.pushState(null, "", window.location.href);
    });

    // Called by Firebase after auth — INSTANT show
    window.renderDashboard = function(displayName) {
      document.getElementById("user-name").textContent = displayName;
      applyLang("ar");
      const ls = document.getElementById("loading-screen");
      ls.classList.add("hide");
      document.getElementById("dashboard").classList.add("show");
      setTimeout(() => { if (ls.parentNode) ls.parentNode.removeChild(ls); }, 350);
    };
  </script>

  <script type="module">
    import { initializeApp }     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut }
                                  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, serverTimestamp }
                                  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app  = initializeApp({
      apiKey:            "AIzaSyCoM-Aqq7VwTDx5ZeHmIpHM4sm2XM0WdKw",
      authDomain:        "alqurmanix-15b92.firebaseapp.com",
      projectId:         "alqurmanix-15b92",
      storageBucket:     "alqurmanix-15b92.firebasestorage.app",
      messagingSenderId: "477352026568",
      appId:             "1:477352026568:web:49f90cd3fc74b6948ba0fd",
      measurementId:     "G-VJF36N1MCD"
    });
    const auth = getAuth(app);
    const db   = getFirestore(app);

    function hardRedirect() {
      sessionStorage.removeItem("aqx_auth_entry");
      window.location.replace("./index.html");
    }

    window._aqxSignOut = async () => {
      sessionStorage.removeItem("aqx_auth_entry");
      await signOut(auth);
      hardRedirect();
    };

    onAuthStateChanged(auth, async (user) => {
      // ── STEP 1: Fast checks (synchronous Firebase token) ──
      if (!user)                { hardRedirect(); return; }
      if (!user.emailVerified)  { await signOut(auth); hardRedirect(); return; }

      // ── STEP 2: INSTANT UI render — don't wait for Firestore ──
      const displayName = user.displayName || user.email.split("@")[0];
      window.renderDashboard(displayName);
      sessionStorage.setItem("aqx_auth_entry", "true");

      // ── STEP 3: Firestore check in background ──
      try {
        const userRef = doc(db, "users", user.uid);
        const snap    = await getDoc(userRef);

        if (!snap.exists())                                        { await signOut(auth); hardRedirect(); return; }
        const data = snap.data();
        if (data.status !== "active" || data.inactivityStatus !== "active") { await signOut(auth); hardRedirect(); return; }

        // Update displayName if Firestore has one
        if (data.displayName) document.getElementById("user-name").textContent = data.displayName;

        // Fire-and-forget lastActivity update — NEVER blocks UI
        updateDoc(userRef, { lastActivity: serverTimestamp() }).catch(() => {});

      } catch (err) {
        // Non-fatal: network issue, don't redirect on Firestore errors
        console.warn("Firestore background check:", err.code || err.message);
      }
    });
  </script>
