<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
   <style>
html.aqx-guard-pending body {
  visibility: hidden !important;
}
</style>
<script>
document.documentElement.classList.add("aqx-guard-pending");
</script> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتظرونا قريباً</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447, #1b1b2f);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .container {
            padding: 20px;
            max-width: 600px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #e43f5a;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.2rem;
            color: #b0c4de;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .loader {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #e43f5a;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>انتظرونا قريباً</h1>
        <p>نحن نعمل على إطلاق شي مميز لأجلكم. تابعونا، سنكون معكم في أقرب وقت!</p>
        <div class="loader"></div>
    </div>
</body>
</html>
