     يوضع مباشرة بعد <body>
====================================================== -->

<style>

}

  position: fixed;

  display: flex;

#aqxGuard .aqx-card {
  width: min(440px, 100%);
  background: #111c30;

  border-radius: 17px;
  padding: 25px;

#aqxGuard .aqx-logo {

#aqxGuard .aqx-spinner {

</style>

<div id="aqxGuard">
  <div class="aqx-card">
    <div class="aqx-logo">AQX</div>
    <h3 id="aqxGuardTitle">التحقق الأمني</h3>
    <div class="aqx-spinner" id="aqxGuardSpinner"></div>
    <div class="aqx-message" id="aqxGuardMessage">
      جارٍ التحقق من الهوية وصلاحية الجلسة...
    </div>
    <button
      class="aqx-button aqx-hidden"
      id="aqxGuardRetry"
      type="button"
    >إعادة المحاولة</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>

<script>
(() => {
"use strict";

/* ======================================================
   1. إعدادات AQX
====================================================== */

const AQX = Object.freeze({

  SUPABASE_URL:
    "https://fkiokwwztbyztleeuwks.supabase.co",

  PUBLIC_KEY:
    "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_",

  IDENTITY_URL:
    "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity",

  SOC_URL:
    "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-soc",

  LOGIN_PAGE: "/secure-aqx.html",

  RESTRICTED_PAGE: "/account-status.html",

  CHECK_INTERVAL: 30000,

  SOC_INTERVAL: 60000,

  REQUEST_TIMEOUT: 12000,

  LOCK_NAME: "aqx-internal-page-lock"
});


/* ======================================================
   2. تهيئة Supabase
====================================================== */

if (!window.supabase?.createClient) {
  showFailure("تعذر تحميل مكتبة الاتصال بخدمات الهوية.");
  return;
}

const sb = window.supabase.createClient(
  AQX.SUPABASE_URL,
  AQX.PUBLIC_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


/* ======================================================
   3. حالة الحماية
====================================================== */

const state = {
  user: null,
  authSession: null,
  accessToken: null,

  identityToken: null,
  restrictedToken: null,

  restricted: false,
  authorized: false,
  stopped: false,
  checking: false,

  lockRelease: null,
  lockOwned: false,

  checkTimer: null,
  socTimer: null,
  heartbeatTimer: null,

  lastActivity: Date.now(),
  activityCount: 0,
  clickCount: 0,
  navigationCount: 0,
  hiddenSince: null,
  hiddenDuration: 0,

  lastSOCCheck: 0,
  lastIdentityCheck: 0
};

const guard = document.getElementById("aqxGuard");
const title = document.getElementById("aqxGuardTitle");
const message = document.getElementById("aqxGuardMessage");
const spinner = document.getElementById("aqxGuardSpinner");
const retryButton = document.getElementById("aqxGuardRetry");

document.body.classList.add("aqx-locked");


/* ======================================================
   4. واجهة رسائل الحماية
====================================================== */

function showMessage(text, heading = "التحقق الأمني") {
  title.textContent = heading;
  message.textContent = text;
  spinner.classList.remove("aqx-hidden");
  retryButton.classList.add("aqx-hidden");
  guard.classList.remove("aqx-hidden");
}

function showFailure(text, heading = "تعذر التحقق") {
  title.textContent = heading;
  message.textContent = text;
  spinner.classList.add("aqx-hidden");
  retryButton.classList.remove("aqx-hidden");
  guard.classList.remove("aqx-hidden");
}

function releaseContent() {
  state.authorized = true;
  guard.classList.add("aqx-hidden");
  document.body.classList.remove("aqx-locked");
}

function blockContent(text, heading = "تم إيقاف الوصول") {
  state.authorized = false;
  stopMonitoring();
  document.body.classList.add("aqx-locked");
  showFailure(text, heading);
}


/* ======================================================
   5. أدوات الاتصال
====================================================== */

function getStored(key, storage = localStorage) {
  try {
    return storage.getItem(key);
  } catch (_) {
    return null;
  }
}

function isNetworkError(error) {
  const m = String(error?.message || "").toLowerCase();

  return (
    error?.name === "AbortError" ||
    m.includes("failed to fetch") ||
    m.includes("network") ||
    m.includes("timeout") ||
    m.includes("load failed")
  );
}

async function fetchJSON(url, options = {}) {
  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    AQX.REQUEST_TIMEOUT
  );

  try {
    const response = await fetch(url, {
      ...options,
      cache: "no-store",
      signal: controller.signal
    });

    const raw = await response.text();

    let data = {};

    try {
      data = raw ? JSON.parse(raw) : {};
    } catch (_) {
      throw new Error("استجابة الخادم ليست JSON صالحًا.");
    }

    if (!response.ok) {
      const error = new Error(
        data.message ||
        data.error_description ||
        data.error ||
        "HTTP " + response.status
      );

      error.status = response.status;
      error.code = String(
        data.code ||
        data.error_code ||
        data.error?.code ||
        ""
      ).toUpperCase();

      error.data = data;

      throw error;
    }

    return data;

  } finally {
    clearTimeout(timer);
  }
}


/* ======================================================
   6. الحصول على جلسة Supabase الفعلية
====================================================== */

async function getAuthenticatedUser() {

  const result = await sb.auth.getSession();

  if (result.error) {
    throw result.error;
  }

  const session = result.data?.session;

  if (!session?.access_token) {
    const error = new Error("جلسة تسجيل الدخول غير موجودة.");
    error.code = "AUTH_SESSION_MISSING";
    throw error;
  }

  // التحقق من المستخدم عن طريق خادم Supabase نفسه.
  const verified = await sb.auth.getUser(
    session.access_token
  );

  if (verified.error || !verified.data?.user) {
    const error = new Error(
      "تعذر تأكيد المستخدم من خادم المصادقة."
    );

    error.code = "AUTH_USER_INVALID";
    throw error;
  }

  state.authSession = session;
  state.accessToken = session.access_token;
  state.user = verified.data.user;

  return verified.data.user;
}


/* ======================================================
   7. تحديد نوع جلسة AQX
====================================================== */

function readIdentitySession() {

  const normal = getStored("aqx_session_token");

  const restricted = getStored(
    "aqx_restricted_session_token",
    sessionStorage
  );

  state.identityToken = normal || null;
  state.restrictedToken = restricted || null;

  state.restricted = !normal && !!restricted;

  if (!normal && !restricted) {
    const error = new Error(
      "رمز جلسة AQX غير موجود."
    );

    error.code = "AQX_SESSION_MISSING";
    throw error;
  }
}


/* ======================================================
   8. رؤوس الاتصال
====================================================== */

function identityHeaders() {

  const headers = {
    "apikey": AQX.PUBLIC_KEY,
    "Authorization": "Bearer " + state.accessToken,
    "Content-Type": "application/json",
    "Accept": "application/json"
  };

  if (state.restricted) {
    headers["x-aqx-restricted-session"] =
      state.restrictedToken;
  } else {
    headers["x-aqx-session"] =
      state.identityToken;
  }

  return headers;
}


/* ======================================================
   9. التحقق من جلسة الهوية
====================================================== */

async function verifyIdentity() {

  readIdentitySession();

  const endpoint = state.restricted
    ? "/v1/restricted-session/check"
    : "/v1/session/check";

  const data = await fetchJSON(
    AQX.IDENTITY_URL + endpoint,
    {
      method: "POST",
      headers: identityHeaders(),
      body: JSON.stringify({})
    }
  );

  if (data.valid === false) {
    const error = new Error(
      data.message || "جلسة الهوية غير صالحة."
    );

    error.code = data.code || "AQX_SESSION_INVALID";
    error.data = data;

    throw error;
  }

  if (data.valid !== true) {
    throw new Error(
      "رد المحرك لا يؤكد صلاحية جلسة الهوية."
    );
  }

  if (state.restricted && data.restricted !== true) {
    throw new Error(
      "استجابة الجلسة المقيّدة غير مكتملة."
    );
  }

  state.lastIdentityCheck = Date.now();

  return data;
}


/* ======================================================
   10. مراقبة AQX-SOC
====================================================== */

function collectTelemetry() {

  const screenInfo = {
    width: screen.width,
    height: screen.height,
    pixelRatio: window.devicePixelRatio || 1
  };

  return {
    user_agent: navigator.userAgent,
    language: navigator.language,
    platform: navigator.platform,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,

    screen: screenInfo,

    viewport: {
      width: window.innerWidth,
      height: window.innerHeight
    },

    online: navigator.onLine,
    visible: document.visibilityState === "visible",
    focused: document.hasFocus(),

    webdriver: navigator.webdriver === true,

    activity_count: state.activityCount,
    click_count: state.clickCount,
    navigation_count: state.navigationCount,

    page_age_seconds: Math.floor(
      (Date.now() - PAGE_STARTED_AT) / 1000
    ),

    hidden_duration_seconds: Math.floor(
      state.hiddenDuration / 1000
    ),

    page_path: location.pathname
  };
}

const PAGE_STARTED_AT = Date.now();

async function verifyBehavior() {

  if (state.restricted) {
    // الجلسة المقيّدة لا تستخدم مسار SOC الخاص بالجلسة العادية.
    return true;
  }

  const data = await fetchJSON(
    AQX.SOC_URL + "/v1/check",
    {
      method: "POST",

      headers: {
        "apikey": AQX.PUBLIC_KEY,

        "Authorization":
          "Bearer " + state.accessToken,

        "Content-Type": "application/json",
        "Accept": "application/json",

        "x-aqx-session": state.identityToken
      },

      body: JSON.stringify({
        action: "dashboard_access",
        client_telemetry: collectTelemetry()
      })
    }
  );

  if (
    data.success === true &&
    data.decision === "allow"
  ) {
    state.lastSOCCheck = Date.now();
    return true;
  }

  if (
    data.decision === "deny" ||
    data.success === false
  ) {
    const error = new Error(
      data.message ||
      "محرك الأمن لم يسمح بالوصول."
    );

    error.code = data.code || "SOC_ACCESS_DENIED";
    error.securityDenied = true;

    throw error;
  }

  throw new Error(
    "استجابة محرك SOC غير حاسمة."
  );
}


/* ======================================================
   11. التحقق الشامل
====================================================== */

async function verifyAll() {

  if (state.checking || state.stopped) return;

  state.checking = true;

  try {

    await getAuthenticatedUser();

    await verifyIdentity();

    if (state.restricted) {

      const currentPage =
        location.pathname.split("/").pop();

      if (
        currentPage.toLowerCase() !==
        "account-status.html"
      ) {
        location.replace(AQX.RESTRICTED_PAGE);
        return;
      }

      releaseContent();
      startMonitoring();
      return;
    }

    await verifyBehavior();

    releaseContent();

    startMonitoring();

  } finally {
    state.checking = false;
  }
}


/* ======================================================
   12. تصنيف الأخطاء
====================================================== */

const INVALID_CODES = new Set([
  "SESSION_NOT_FOUND",
  "SESSION_REVOKED",
  "SESSION_EXPIRED",
  "AQX_SESSION_INVALID",
  "SERVICE_SESSION_INVALID",
  "DASHBOARD_SESSION_INVALID",
  "IDLE_TIMEOUT",
  "INVALID_CREDENTIALS"
]);

async function handleError(error) {

  console.error("[AQX PAGE GUARD]", error);

  const code = String(error?.code || "").toUpperCase();

  if (
    code === "AUTH_SESSION_MISSING" ||
    code === "AUTH_USER_INVALID"
  ) {
    stopMonitoring();

    location.replace(AQX.LOGIN_PAGE);
    return;
  }

  if (
    code === "AQX_SESSION_MISSING" ||
    INVALID_CODES.has(code) ||
    (error?.status === 401 && !isNetworkError(error))
  ) {
    stopMonitoring();

    blockContent(
      "انتهت جلسة الهوية أو أكد الخادم عدم صلاحيتها. ارجع إلى تسجيل الدخول.",
      "جلسة الهوية غير صالحة"
    );

    location.replace(AQX.LOGIN_PAGE);
    return;
  }

  if (error?.securityDenied) {

    blockContent(
      "محرك AQX-SOC لم يسمح بالوصول إلى هذه الصفحة. تم حجب المحتوى.",
      "رفض أمني"
    );

    return;
  }

  // الشبكة و5xx والردود غير المكتملة لا تمسح الجلسة.
  blockContent(
    "تعذر إكمال التحقق من المحرك الأمني. لم يتم مسح جلسة الدخول أو تسجيل الخروج. أعد المحاولة.",
    "تعذر التحقق مؤقتًا"
  );
}


/* ======================================================
   13. منع فتح أكثر من تبويب
====================================================== */

let fallbackHeartbeat = null;

async function acquireTabLock() {

  const name =
    AQX.LOCK_NAME + "-" + state.user.id;

  if (navigator.locks?.request) {

    let resolveAcquired;

    const acquired = new Promise(resolve => {
      resolveAcquired = resolve;
    });

    let release;

    const hold = new Promise(resolve => {
      release = resolve;
    });

    state.lockRelease = release;

    navigator.locks.request(
      name,
      {
        mode: "exclusive",
        ifAvailable: true
      },

      async lock => {

        if (!lock) {
          resolveAcquired(false);
          return;
        }

        state.lockOwned = true;
        resolveAcquired(true);

        await hold;

        state.lockOwned = false;
      }

    ).catch(error => {
      resolveAcquired(false);
      console.error("AQX tab lock:", error);
    });

    return acquired;
  }

  // بديل للمتصفحات التي لا تدعم Web Locks.
  const key = "aqx_active_internal_tab";
  const now = Date.now();

  try {

    const current = localStorage.getItem(key);

    if (current) {
      const owner = JSON.parse(current);

      if (
        owner.id !== TAB_ID &&
        now - owner.time < 15000
      ) {
        return false;
      }
    }

    localStorage.setItem(
      key,
      JSON.stringify({
        id: TAB_ID,
        time: now
      })
    );

    const verify = JSON.parse(
      localStorage.getItem(key) || "{}"
    );

    if (verify.id !== TAB_ID) return false;

    state.lockOwned = true;

    fallbackHeartbeat = setInterval(() => {
      if (!state.lockOwned) return;

      localStorage.setItem(
        key,
        JSON.stringify({
          id: TAB_ID,
          time: Date.now()
        })
      );
    }, 5000);

    state.lockRelease = () => {
      clearInterval(fallbackHeartbeat);

      try {
        const owner = JSON.parse(
          localStorage.getItem(key) || "{}"
        );

        if (owner.id === TAB_ID) {
          localStorage.removeItem(key);
        }
      } catch (_) {}

      state.lockOwned = false;
    };

    return true;

  } catch (_) {
    // إذا تعذر التخزين لا نمسح الجلسة.
    return true;
  }
}

const TAB_ID =
  "aqx-" + Math.random().toString(36).slice(2);

function releaseTabLock() {

  if (state.lockRelease) {
    state.lockRelease();
    state.lockRelease = null;
  }
}


/* ======================================================
   14. مراقبة النشاط دون تسجيل ضغطات المفاتيح
====================================================== */

function activity(event) {

  if (!state.authorized) return;

  state.lastActivity = Date.now();
  state.activityCount++;

  if (event?.type === "click") {
    state.clickCount++;
  }
}

document.addEventListener(
  "click",
  activity,
  { passive: true }
);

document.addEventListener(
  "pointerdown",
  activity,
  { passive: true }
);

document.addEventListener(
  "scroll",
  activity,
  { passive: true }
);

document.addEventListener(
  "keydown",
  activity,
  { passive: true }
);

document.addEventListener(
  "visibilitychange",
  () => {

    if (document.hidden) {
      state.hiddenSince = Date.now();
    } else if (state.hiddenSince) {

      state.hiddenDuration +=
        Date.now() - state.hiddenSince;

      state.hiddenSince = null;
    }
  }
);


/* ======================================================
   15. منع الرجوع للخلف
====================================================== */

function installBackGuard() {

  history.pushState(
    { aqx_internal_guard: true },
    "",
    location.href
  );

  window.addEventListener("popstate", () => {

    if (!state.authorized) return;

    state.navigationCount++;

    history.pushState(
      { aqx_internal_guard: true },
      "",
      location.href
    );

  });

}

installBackGuard();


/* ======================================================
   16. الفحص الدوري
====================================================== */

function startMonitoring() {

  if (state.checkTimer || state.restricted) return;

  state.checkTimer = setInterval(async () => {

    try {
      await getAuthenticatedUser();
      await verifyIdentity();

    } catch (error) {
      await handleError(error);
    }

  }, AQX.CHECK_INTERVAL);


  state.socTimer = setInterval(async () => {

    if (state.restricted) return;

    try {

      await getAuthenticatedUser();

      await verifyBehavior();

    } catch (error) {
      await handleError(error);
    }

  }, AQX.SOC_INTERVAL);

}

function stopMonitoring() {

  clearInterval(state.checkTimer);
  clearInterval(state.socTimer);

  state.checkTimer = null;
  state.socTimer = null;

}


/* ======================================================
   17. منع استمرار صفحة غير متحققة
====================================================== */

window.addEventListener("storage", event => {

  if (
    event.key === "aqx_session_token" &&
    !event.newValue
  ) {
    blockContent(
      "تم تغيير بيانات جلسة الهوية في تبويب آخر. أعد التحقق."
    );
  }

});


/* ======================================================
   18. أحداث الصفحة
====================================================== */

window.addEventListener("pagehide", () => {

  state.stopped = true;

  stopMonitoring();
  releaseTabLock();

});

window.addEventListener("pageshow", event => {

  if (event.persisted) {
    state.stopped = false;
    boot();
  }

});

retryButton.addEventListener("click", () => {
  boot();
});


/* ======================================================
   19. التشغيل الرئيسي
====================================================== */

async function boot() {

  if (state.checking) return;

  state.stopped = false;

  showMessage(
    "جارٍ تأكيد تسجيل الدخول والتحقق من جلسة الهوية والسلوك الأمني..."
  );

  try {

    await getAuthenticatedUser();

    const lock = await acquireTabLock();

    if (!lock) {

      blockContent(
        "هذه الصفحة مفتوحة بالفعل في تبويب آخر. استخدم التبويب المفتوح أو أغلقه أولًا.",
        "التبويب مستخدم"
      );

      return;
    }

    await verifyAll();

  } catch (error) {

    await handleError(error);

  }
}


/* ======================================================
   20. مراقبة تجديد رمز Supabase
====================================================== */

sb.auth.onAuthStateChange((event, session) => {

  if (
    event === "TOKEN_REFRESHED" &&
    session?.access_token
  ) {
    state.authSession = session;
    state.accessToken = session.access_token;
  }

  if (event === "SIGNED_OUT") {

    state.authorized = false;

    blockContent(
      "تم إنهاء جلسة المصادقة."
    );

  }

});


/* ======================================================
   21. تشغيل الحارس
====================================================== */

boot();

})();
</script>
