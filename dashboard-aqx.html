<!-- AQX IDENTITY | UNIVERSAL INTERNAL PAGE GUARD -->
<script>
(() => {
  "use strict";

  /* =========================================
     1. AQX CONFIGURATION
  ========================================= */

  const CONFIG = Object.freeze({
    SUPABASE_URL: "https://fkiokwwztbyztleeuwks.supabase.co",

    SUPABASE_KEY:
      "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_",

    IDENTITY_URL:
      "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity",

    SOC_URL:
      "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-soc",

    LOGIN_PAGE: "/secure-aqx.html",
    RESTRICTED_PAGE: "/account-status.html",

    REQUEST_TIMEOUT: 2500,
    MONITOR_INTERVAL: 60000,

    LOCK_HEARTBEAT: 5000,
    LOCK_EXPIRY: 15000,

    SESSION_KEY: "aqx_session_token",
    RESTRICTED_KEY: "aqx_restricted_session_token"
  });

  /* =========================================
     2. RUNTIME STATE
  ========================================= */

  const state = {
    initialized: false,
    checking: false,
    authorized: false,
    restricted: false,
    accessToken: null,
    sessionToken: null,
    userId: null,
    overlay: null,
    lockRelease: null,
    lockOwner: null,
    lockKey: null,
    monitor: null,
    lastActivity: Date.now(),
    destroyed: false
  };

  const randomId = () =>
    (crypto.randomUUID
      ? crypto.randomUUID()
      : Date.now() + "-" + Math.random().toString(36).slice(2));

  /* =========================================
     3. SECURITY UI
  ========================================= */

  function createOverlay() {
    if (state.overlay) return;

    const style = document.createElement("style");

    style.textContent = `
      #aqx-identity-guard {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #101827;
        color: #fff;
        font-family: Arial, sans-serif;
        direction: rtl;
        text-align: center;
      }

      #aqx-identity-guard .aqx-panel {
        width: 100%;
        max-width: 390px;
        padding: 30px 22px;
        border: 1px solid #29364b;
        border-radius: 18px;
        background: #172235;
        box-sizing: border-box;
      }

      #aqx-identity-guard .aqx-spinner {
        width: 38px;
        height: 38px;
        margin: 0 auto 20px;
        border: 3px solid #40506a;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: aqxspin .7s linear infinite;
      }

      @keyframes aqxspin {
        to { transform: rotate(360deg); }
      }

      #aqx-identity-guard h3 {
        margin: 0 0 12px;
        font-size: 19px;
      }

      #aqx-identity-guard p {
        color: #bdc8d8;
        font-size: 14px;
        line-height: 1.8;
      }

      #aqx-identity-guard button {
        margin-top: 14px;
        padding: 12px 24px;
        border: 0;
        border-radius: 9px;
        background: #0284c7;
        color: white;
        font-size: 15px;
        cursor: pointer;
      }
    `;

    document.head.appendChild(style);

    const overlay = document.createElement("div");

    overlay.id = "aqx-identity-guard";

    overlay.innerHTML = `
      <div class="aqx-panel">
        <div class="aqx-spinner" id="aqx-spinner"></div>
        <h3 id="aqx-title">التحقق من الهوية</h3>
        <p id="aqx-message">جارٍ الاتصال بخدمات الهوية...</p>
        <div id="aqx-action"></div>
      </div>
    `;

    document.body.appendChild(overlay);

    state.overlay = overlay;
  }

  function showGate(title, message, buttonText, callback) {
    createOverlay();

    const spinner = document.getElementById("aqx-spinner");
    const titleElement = document.getElementById("aqx-title");
    const messageElement = document.getElementById("aqx-message");
    const action = document.getElementById("aqx-action");

    spinner.style.display = buttonText ? "none" : "block";

    titleElement.textContent = title;
    messageElement.textContent = message;

    action.innerHTML = "";

    if (buttonText && callback) {
      const button = document.createElement("button");

      button.type = "button";
      button.textContent = buttonText;
      button.addEventListener("click", callback);

      action.appendChild(button);
    }
  }

  function removeGate() {
    if (state.overlay) {
      state.overlay.remove();
      state.overlay = null;
    }
  }

  /* =========================================
     4. NETWORK WITH SHORT TIMEOUT
  ========================================= */

  async function request(url, options = {}) {
    const controller = new AbortController();

    const timeout = setTimeout(
      () => controller.abort(),
      CONFIG.REQUEST_TIMEOUT
    );

    try {
      const response = await fetch(url, {
        ...options,
        signal: controller.signal,
        cache: "no-store"
      });

      let json = {};

      try {
        json = await response.json();
      } catch (_) {
        json = {};
      }

      return {
        ok: response.ok,
        status: response.status,
        data: json
      };

    } catch (error) {
      const networkError = new Error(
        error.name === "AbortError"
          ? "انتهت مهلة الاتصال بالخادم"
          : "تعذر الاتصال بالخادم"
      );

      networkError.network = true;

      throw networkError;

    } finally {
      clearTimeout(timeout);
    }
  }

  /* =========================================
     5. READ SUPABASE ACCESS TOKEN
  ========================================= */

  function getAccessToken() {
    const keys = Object.keys(localStorage);

    for (const key of keys) {
      if (!key.endsWith("-auth-token")) continue;

      try {
        const stored = JSON.parse(localStorage.getItem(key));

        const token =
          stored?.access_token ||
          stored?.currentSession?.access_token ||
          stored?.session?.access_token;

        if (token) return token;

      } catch (_) {}
    }

    return null;
  }

  /* =========================================
     6. AUTHENTICATED USER CHECK
  ========================================= */

  async function verifySupabaseUser() {
    const token = getAccessToken();

    if (!token) {
      const error = new Error("لا توجد جلسة دخول موحدة");
      error.invalidSession = true;
      throw error;
    }

    const result = await request(
      CONFIG.SUPABASE_URL + "/auth/v1/user",
      {
        method: "GET",
        headers: {
          "apikey": CONFIG.SUPABASE_KEY,
          "Authorization": "Bearer " + token,
          "Accept": "application/json"
        }
      }
    );

    if (result.status === 401) {
      const error = new Error("جلسة Supabase غير صالحة");
      error.invalidSession = true;
      throw error;
    }

    if (!result.ok) {
      throw new Error("تعذر التحقق من حساب Supabase");
    }

    if (!result.data || !result.data.id) {
      throw new Error("استجابة هوية غير مكتملة");
    }

    state.accessToken = token;
    state.userId = result.data.id;

    return result.data;
  }

  /* =========================================
     7. IDENTITY HEADERS
  ========================================= */

  function identityHeaders() {
    return {
      "apikey": CONFIG.SUPABASE_KEY,
      "Authorization": "Bearer " + state.accessToken,
      "Content-Type": "application/json",
      "Accept": "application/json",

      ...(state.restricted
        ? {
            "x-aqx-restricted-session": state.sessionToken
          }
        : {
            "x-aqx-session": state.sessionToken
          })
    };
  }

  /* =========================================
     8. VERIFY AQX IDENTITY SESSION
  ========================================= */

  async function verifyIdentitySession() {
    const endpoint = state.restricted
      ? "/v1/restricted-session/check"
      : "/v1/session/check";

    const result = await request(
      CONFIG.IDENTITY_URL + endpoint,
      {
        method: "POST",
        headers: identityHeaders(),
        body: JSON.stringify({})
      }
    );

    if (result.status === 401) {
      const error = new Error("جلسة الهوية غير صالحة");
      error.invalidSession = true;
      throw error;
    }

    if (!result.ok) {
      throw new Error("تعذر التحقق من جلسة AQX Identity");
    }

    const data = result.data?.data || result.data;

    if (state.restricted) {
      if (data?.valid === true && data?.restricted === true) {
        return true;
      }

      if (data?.valid === false) {
        const error = new Error("الجلسة المقيّدة غير صالحة");
        error.invalidSession = true;
        throw error;
      }

      throw new Error("استجابة الجلسة المقيّدة غير حاسمة");
    }

    if (data?.valid === true) {
      return true;
    }

    if (data?.valid === false) {
      const error = new Error("جلسة الهوية منتهية أو غير صالحة");
      error.invalidSession = true;
      throw error;
    }

    throw new Error("لم يصل تأكيد واضح من محرك الهوية");
  }

  /* =========================================
     9. SECURITY OPERATIONS CENTER
  ========================================= */

  async function verifySecurityCenter() {
    const result = await request(
      CONFIG.SOC_URL + "/v1/check",
      {
        method: "POST",
        headers: identityHeaders(),
        body: JSON.stringify({
          action: "dashboard_access",
          client_telemetry: {}
        })
      }
    );

    if (!result.ok) {
      throw new Error("تعذر إتمام فحص مركز الحماية");
    }

    const data = result.data?.data || result.data;

    if (
      data?.success === true &&
      data?.decision === "allow"
    ) {
      return true;
    }

    if (
      data?.success === true &&
      data?.decision === "deny"
    ) {
      const error = new Error("تم رفض الوصول بواسطة مركز الحماية");
      error.securityDenied = true;
      throw error;
    }

    throw new Error("استجابة مركز الحماية غير حاسمة");
  }

  /* =========================================
     10. TAB LOCK
  ========================================= */

  async function acquireTabLock() {
    const lockName = "aqx-page-" + state.userId;

    state.lockOwner = randomId();

    if (navigator.locks && navigator.locks.request) {
      return new Promise((resolve) => {
        let resolved = false;

        navigator.locks.request(
          lockName,
          {
            mode: "exclusive",
            ifAvailable: true
          },
          async (lock) => {
            if (!lock) {
              resolved = true;
              resolve(false);
              return;
            }

            let release;

            const hold = new Promise((done) => {
              release = done;
            });

            state.lockRelease = release;

            resolved = true;
            resolve(true);

            await hold;
          }
        ).catch(() => {
          if (!resolved) resolve(false);
        });
      });
    }

    const key = "aqx-tab-lock-" + state.userId;
    state.lockKey = key;

    const now = Date.now();

    try {
      const current = JSON.parse(localStorage.getItem(key) || "null");

      if (
        current &&
        current.owner !== state.lockOwner &&
        current.expires > now
      ) {
        return false;
      }

      localStorage.setItem(
        key,
        JSON.stringify({
          owner: state.lockOwner,
          expires: now + CONFIG.LOCK_EXPIRY
        })
      );

      const confirmed = JSON.parse(
        localStorage.getItem(key) || "null"
      );

      if (confirmed?.owner !== state.lockOwner) {
        return false;
      }

      state.monitor = setInterval(() => {
        if (state.destroyed) return;

        try {
          const latest = JSON.parse(
            localStorage.getItem(key) || "null"
          );

          if (latest?.owner !== state.lockOwner) {
            blockSecondTab();
            return;
          }

          localStorage.setItem(
            key,
            JSON.stringify({
              owner: state.lockOwner,
              expires: Date.now() + CONFIG.LOCK_EXPIRY
            })
          );

        } catch (_) {
          blockSecondTab();
        }
      }, CONFIG.LOCK_HEARTBEAT);

      return true;

    } catch (_) {
      return false;
    }
  }

  function releaseTabLock() {
    state.destroyed = true;

    if (state.lockRelease) {
      state.lockRelease();
      state.lockRelease = null;
    }

    if (state.monitor) {
      clearInterval(state.monitor);
      state.monitor = null;
    }

    if (state.lockKey) {
      try {
        const current = JSON.parse(
          localStorage.getItem(state.lockKey) || "null"
        );

        if (current?.owner === state.lockOwner) {
          localStorage.removeItem(state.lockKey);
        }
      } catch (_) {}
    }
  }

  function blockSecondTab() {
    state.authorized = false;

    showGate(
      "التبويب غير مسموح",
      "الحساب مفتوح بالفعل في تبويب آخر. أغلق هذا التبويب واستخدم التبويب الأساسي.",
      "العودة لتسجيل الدخول",
      () => location.replace(CONFIG.LOGIN_PAGE)
    );
  }

  /* =========================================
     11. ERROR HANDLING
  ========================================= */

  function handleVerificationError(error, initial = false) {
    console.error("[AQX GUARD]", error);

    if (error.invalidSession) {
      state.authorized = false;

      location.replace(CONFIG.LOGIN_PAGE);
      return;
    }

    if (error.securityDenied) {
      state.authorized = false;

      showGate(
        "تم رفض الوصول",
        "مركز الحماية رفض السماح بفتح هذه الصفحة.",
        "العودة",
        () => location.replace(CONFIG.LOGIN_PAGE)
      );

      return;
    }

    if (!initial && state.authorized) {
      console.warn(
        "[AQX GUARD] تعذر تحديث الفحص. لم يتم حذف الجلسة."
      );

      return;
    }

    state.authorized = false;

    showGate(
      "تعذر تأكيد الهوية",
      "لم يصل تأكيد موثوق من الخادم. لم يتم حذف الجلسة. حاول مرة أخرى.",
      "إعادة المحاولة",
      () => boot(true)
    );
  }

  /* =========================================
     12. COMPLETE VERIFICATION
  ========================================= */

  async function verifyAll() {
    if (state.checking) return false;

    state.checking = true;

    try {
      await verifySupabaseUser();

      const [identityResult] = await Promise.all([
        verifyIdentitySession()
      ]);

      if (!identityResult) {
        throw new Error("فشل التحقق من الهوية");
      }

      if (!state.restricted) {
        await verifySecurityCenter();
      }

      state.authorized = true;

      return true;

    } finally {
      state.checking = false;
    }
  }

  /* =========================================
     13. INITIALIZATION
  ========================================= */

  async function boot(isRetry = false) {
    if (state.checking) return;

    if (!isRetry) {
      createOverlay();

      showGate(
        "التحقق من الهوية",
        "جارٍ الاتصال بخدمات الهوية...",
        null,
        null
      );
    } else {
      showGate(
        "إعادة التحقق",
        "جارٍ إعادة الاتصال بخدمات AQX...",
        null,
        null
      );
    }

    try {
      const restrictedToken =
        sessionStorage.getItem(CONFIG.RESTRICTED_KEY);

      const normalToken =
        localStorage.getItem(CONFIG.SESSION_KEY);

      if (restrictedToken) {
        state.restricted = true;
        state.sessionToken = restrictedToken;

      } else if (normalToken) {
        state.restricted = false;
        state.sessionToken = normalToken;

      } else {
        location.replace(CONFIG.LOGIN_PAGE);
        return;
      }

      await verifySupabaseUser();

      if (state.restricted) {
        const valid = await verifyIdentitySession();

        if (valid) {
          location.replace(CONFIG.RESTRICTED_PAGE);
        }

        return;
      }

      const lockAcquired = await acquireTabLock();

      if (!lockAcquired) {
        blockSecondTab();
        return;
      }

      const valid = await verifyAll();

      if (!valid) return;

      state.initialized = true;

      removeGate();

      startMonitoring();
      installNavigationProtection();
      installActivityMonitoring();

      console.info("[AQX GUARD] Identity verified.");

    } catch (error) {
      handleVerificationError(error, true);
    }
  }

  /* =========================================
     14. BACK NAVIGATION PROTECTION
  ========================================= */

  function installNavigationProtection() {
    history.pushState(
      { aqxGuard: true },
      "",
      location.href
    );

    window.addEventListener("popstate", () => {
      if (!state.authorized) return;

      history.pushState(
        { aqxGuard: true },
        "",
        location.href
      );
    });

    document.addEventListener("click", (event) => {
      const link = event.target.closest("a[target='_blank']");

      if (link) {
        event.preventDefault();

        console.warn(
          "[AQX GUARD] فتح روابط في تبويب جديد غير مسموح."
        );
      }
    }, true);
  }

  /* =========================================
     15. ACTIVITY MONITORING
  ========================================= */

  function installActivityMonitoring() {
    const events = [
      "pointerdown",
      "keydown",
      "scroll",
      "touchstart",
      "click"
    ];

    events.forEach((eventName) => {
      document.addEventListener(
        eventName,
        () => {
          state.lastActivity = Date.now();
        },
        { passive: true }
      );
    });
  }

  /* =========================================
     16. SESSION MONITORING
  ========================================= */

  function startMonitoring() {
    if (state.monitor && !state.lockKey) {
      clearInterval(state.monitor);
    }

    const timer = setInterval(async () => {
      if (!state.authorized || state.checking) return;

      try {
        await verifyAll();

      } catch (error) {
        handleVerificationError(error, false);
      }

    }, CONFIG.MONITOR_INTERVAL);

    state.monitor = timer;

    document.addEventListener("visibilitychange", async () => {
      if (
        document.visibilityState === "visible" &&
        state.authorized &&
        !state.checking
      ) {
        try {
          await verifyAll();
        } catch (error) {
          handleVerificationError(error, false);
        }
      }
    });
  }

  /* =========================================
     17. CROSS-TAB SESSION CHANGES
  ========================================= */

  window.addEventListener("storage", (event) => {
    if (!state.authorized) return;

    if (
      event.key === CONFIG.SESSION_KEY &&
      !state.restricted &&
      !event.newValue
    ) {
      state.authorized = false;

      showGate(
        "تغيرت حالة الجلسة",
        "تم تغيير بيانات الجلسة في تبويب آخر. أعد التحقق قبل المتابعة.",
        "إعادة التحقق",
        () => boot(true)
      );
    }
  });

  /* =========================================
     18. PAGE EXIT
  ========================================= */

  window.addEventListener("pagehide", () => {
    releaseTabLock();
  });

  /* =========================================
     19. START
  ========================================= */

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      () => boot(false),
      { once: true }
    );
  } else {
    boot(false);
  }

})();
</script>
