<body>
<div class="aurora"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grain"></div></div>
<main class="frame" id="frame">
<div class="card" id="card">
<section class="royal" aria-hidden="true">
<i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i>
<div class="brand">
<div class="mark"><svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a6b"/><stop offset="1" stop-color="#4b3fc4"/></linearGradient></defs><path d="M32 8l20 46h-9l-3.6-9H24.6L21 54h-9z M27.4 36h9.2L32 24z" fill="url(#lg)"/></svg></div>
<div><b>AQX</b><span>القرماني إكس</span></div>
</div>
<div class="pitch">
<h1>بوابتك إلى إدارة الروابط والفهارس</h1>
<p>مساحة إدارة خاصة ومحمية، تجمع روابطك وفهارسك في مكان واحد منظم وآمن.</p>
</div>
<div class="chips"><span class="chip"><i></i>دخول مشفّر</span><span class="chip"><i></i>حماية متعددة الطبقات</span><span class="chip"><i></i>وصول للإدارة فقط</span></div>
</section>
<section class="form">
<h2>تسجيل دخول الإدارة</h2>
<p class="sub">أدخل بريدك الإلكتروني والرقم السري للمتابعة.</p>
<div id="loginBox">
<input class="hp" type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="field">
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>
<input type="email" id="email" placeholder=" " autocomplete="username" inputmode="email" maxlength="120" spellcheck="false" autocapitalize="off">
<label for="email">البريد الإلكتروني</label>
</div>
<div class="field">
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/><circle cx="12" cy="15.5" r="1.3"/></svg>
<input type="password" id="pass" placeholder=" " autocomplete="current-password" maxlength="128">
<label for="pass">الرقم السري</label>
<button type="button" class="eye" id="eye" aria-label="إظهار الرقم السري"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<div class="row"><button type="button" class="link" id="forgot">هل نسيت الرقم السري؟</button></div>
<button type="button" class="btn" id="go"><span class="spin"></span><span id="goTxt">تسجيل الدخول</span></button>
<div class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>اتصال محمي ومشفّر</div>
</div>
<div class="foot">AQX القرماني إكس</div>
</section>
</div>
</main>
