<style>
:root{
  --pearl:#f4f6fd; --mist:#e6ebfa; --lilac:#ddd6fb; --sky:#cfe3fb;
  --sapphire:#1b2a6b; --royal:#3b3fd8; --violet:#7a5cff;
  --gold:#c49a3a; --gold-l:#f3d98b; --gold-d:#9a741f;
  --ink:#16204f; --soft:#5d6794; --line:rgba(27,42,107,.14);
  --ok:#14a36b; --err:#d8344f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#f7f4ff 0%,#e8f0ff 45%,#fdf6e4 100%);
  display:grid;place-items:center;padding:24px;overflow-x:hidden;
  -webkit-user-select:none;user-select:none;
  padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));
}
input{-webkit-user-select:text;user-select:text}

/* الخلفية: شفق نوراني فاتح */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.o1{width:520px;height:520px;background:radial-gradient(circle,#b7a6ff,transparent 70%);top:-160px;right:-120px}
.o2{width:560px;height:560px;background:radial-gradient(circle,#8fc3ff,transparent 70%);bottom:-200px;left:-140px;animation-delay:-6s}
.o3{width:420px;height:420px;background:radial-gradient(circle,#ffe2a1,transparent 70%);top:35%;left:38%;animation-delay:-12s;opacity:.6}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.15)}}
.grain{position:absolute;inset:0;background-image:linear-gradient(rgba(27,42,107,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(27,42,107,.045) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 75%);mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 75%)}

/* الإطار الذهبي المتحرك */
.frame{
  position:relative;z-index:2;width:min(1060px,100%);border-radius:36px;padding:2px;
  background:linear-gradient(120deg,var(--gold-l),#fff 18%,var(--violet) 40%,var(--gold) 62%,#fff 80%,var(--gold-l));
  background-size:300% 300%;animation:sheen 9s linear infinite;
  box-shadow:0 40px 90px -30px rgba(40,50,140,.45),0 12px 30px -12px rgba(122,92,255,.35);
  transform-style:preserve-3d;transition:transform .25s ease-out;
  animation-name:sheen,rise;animation-duration:9s,1s;animation-timing-function:linear,cubic-bezier(.2,.8,.2,1);animation-iteration-count:infinite,1;
}
@keyframes sheen{to{background-position:300% 0}}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.97)}}
.card{display:grid;grid-template-columns:1.05fr 1fr;border-radius:34px;overflow:hidden;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4)}

/* اللوحة الملكية */
.royal{
  position:relative;padding:48px 44px;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:620px;
  background:radial-gradient(120% 90% at 85% 0%,#6d5cff 0%,transparent 55%),radial-gradient(90% 80% at 0% 100%,#2a8bff 0%,transparent 60%),linear-gradient(160deg,#1b2a6b,#33309e 60%,#4b3fc4);
}
.ring{position:absolute;border-radius:50%;border:1.5px solid rgba(243,217,139,.35);animation:spin 40s linear infinite}
.r1{width:420px;height:420px;left:-120px;bottom:-140px}
.r2{width:640px;height:640px;left:-230px;bottom:-250px;border-color:rgba(255,255,255,.18);animation-duration:70s;animation-direction:reverse}
.r3{width:230px;height:230px;top:-70px;right:-60px;border-style:dashed}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{position:relative;display:flex;align-items:center;gap:16px}
.mark{
  width:70px;height:70px;border-radius:22px;display:grid;place-items:center;position:relative;
  background:linear-gradient(145deg,#fff8de,var(--gold-l) 45%,var(--gold));
  box-shadow:0 14px 30px -8px rgba(0,0,0,.35),inset 0 2px 0 #fff;
  animation:float 5s ease-in-out infinite;
}
.mark svg{width:40px;height:40px}
@keyframes float{50%{transform:translateY(-7px) rotate(-3deg)}}
.brand b{font-family:'Cormorant Garamond',serif;font-size:46px;letter-spacing:4px;line-height:1;background:linear-gradient(180deg,#fff,var(--gold-l));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{display:block;font-size:15px;color:#dfe4ff;margin-top:6px;font-weight:500}
.pitch{position:relative}
.pitch h1{font-size:38px;line-height:1.35;font-weight:800;margin-bottom:14px}
.pitch p{color:#dfe4ff;font-size:16px;line-height:1.9;max-width:360px}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 12px var(--gold-l)}

/* النموذج */
.form{padding:52px 48px;display:flex;flex-direction:column;justify-content:center}
.form h2{font-size:32px;font-weight:800;color:var(--sapphire)}
.form .sub{color:var(--soft);margin:8px 0 30px;font-size:15.5px}
.field{position:relative;margin-bottom:18px}
.field input{
  width:100%;height:62px;border-radius:18px;border:1.5px solid var(--line);background:#fff;
  padding:22px 54px 0 52px;font:600 16px 'Tajawal';color:var(--ink);outline:none;transition:.25s;direction:ltr;text-align:right;
}
.field input::placeholder{color:transparent}
.field label{position:absolute;right:54px;top:20px;color:var(--soft);font-size:15.5px;pointer-events:none;transition:.22s;font-weight:500}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:9px;font-size:12px;color:var(--royal);font-weight:700}
.field input:focus{border-color:var(--royal);box-shadow:0 0 0 5px rgba(59,63,216,.12),0 10px 24px -12px rgba(59,63,216,.45)}
.field .ic{position:absolute;right:18px;top:19px;width:24px;height:24px;color:var(--royal);opacity:.85}
.eye{position:absolute;left:14px;top:15px;width:34px;height:34px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--soft);display:grid;place-items:center;transition:.2s}
.eye:hover{background:var(--mist);color:var(--royal)}
.eye svg{width:22px;height:22px}
.row{display:flex;justify-content:flex-start;margin:2px 0 24px}
.link{border:0;background:none;font:700 14.5px 'Tajawal';color:var(--royal);cursor:pointer;padding:4px 0;position:relative}
.link::after{content:"";position:absolute;right:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,var(--gold),var(--violet));transition:.3s}
.link:hover::after{width:100%}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}

.btn{
  position:relative;width:100%;height:64px;border:0;border-radius:20px;cursor:pointer;overflow:hidden;
  font:800 18px 'Tajawal';color:#1b1535;letter-spacing:.3px;
  background:linear-gradient(110deg,var(--gold-d),var(--gold) 20%,var(--gold-l) 50%,var(--gold) 80%,var(--gold-d));background-size:240% 100%;animation:gold 6s linear infinite;
  box-shadow:0 18px 34px -12px rgba(196,154,58,.7),inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(120,80,10,.25);
  transition:transform .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:12px;
}
@keyframes gold{to{background-position:240% 0}}
.btn::before{content:"";position:absolute;top:0;bottom:0;width:70px;right:-120px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%{right:-120px}55%,100%{right:120%}}
.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 26px 40px -14px rgba(196,154,58,.85),inset 0 2px 0 rgba(255,255,255,.7)}
.btn:active:not(:disabled){transform:translateY(0) scale(.99)}
.btn:disabled{filter:saturate(.6);cursor:not-allowed}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(27,21,53,.25);border-top-color:#1b1535;animation:spin .8s linear infinite;display:none}
.btn.load .spin{display:block}
.secure{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;font-size:13px;color:var(--soft)}
.secure svg{width:16px;height:16px;color:var(--ok)}
.foot{margin-top:26px;text-align:center;font-size:12.5px;color:var(--soft);opacity:.85}

/* النوافذ المنبثقة الفخمة */
.veil{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;background:rgba(40,46,120,.28);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.veil.on{display:grid;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal{
  position:relative;width:min(460px,100%);border-radius:32px;padding:2px;
  background:linear-gradient(135deg,var(--gold-l),#fff,var(--violet),var(--gold));background-size:300% 300%;animation:sheen 8s linear infinite,pop .55s cubic-bezier(.2,1.2,.3,1);
  box-shadow:0 50px 100px -30px rgba(30,40,130,.6);
}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(30px)}}
.mbody{border-radius:30px;background:linear-gradient(180deg,#fff,#f4f2ff);padding:42px 34px 32px;text-align:center;position:relative;overflow:hidden}
.mbody::before{content:"";position:absolute;inset:-40% -20% auto -20%;height:200px;background:radial-gradient(circle,rgba(243,217,139,.55),transparent 65%)}
.badge{position:relative;width:104px;height:104px;margin:0 auto 22px;display:grid;place-items:center}
.badge::before,.badge::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:.35;animation:ping 2.2s ease-out infinite}
.badge::after{animation-delay:1.1s}
@keyframes ping{to{transform:scale(1.7);opacity:0}}
.disc{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative;box-shadow:0 18px 36px -10px currentColor}
.disc svg{width:50px;height:50px}
.disc path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .7s .35s forwards ease-out}
@keyframes draw{to{stroke-dashoffset:0}}
.t-ok{color:var(--ok)}.t-ok .disc{background:linear-gradient(145deg,#2fd69a,#0f9b66)}
.t-err{color:var(--err)}.t-err .disc{background:linear-gradient(145deg,#ff6f86,#d0233f)}
.t-info{color:var(--royal)}.t-info .disc{background:linear-gradient(145deg,#7a8cff,#3b3fd8)}
.t-gold{color:var(--gold)}.t-gold .disc{background:linear-gradient(145deg,#ffe9a8,#c49a3a)}
.mbody h3{position:relative;font-size:26px;font-weight:800;color:var(--sapphire);margin-bottom:6px}
.mbody .name{position:relative;font-size:30px;font-weight:800;margin:2px 0 10px;background:linear-gradient(100deg,var(--gold-d),var(--gold),var(--violet),var(--royal));-webkit-background-clip:text;background-clip:text;color:transparent}
.mbody p{position:relative;color:var(--soft);line-height:1.9;font-size:15.5px}
.mfield{position:relative;margin-top:20px}
.mfield input{width:100%;height:56px;border-radius:16px;border:1.5px solid var(--line);padding:0 18px;font:600 16px 'Tajawal';direction:ltr;text-align:right;outline:none;background:#fff}
.mfield input:focus{border-color:var(--royal);box-shadow:0 0 0 5px rgba(59,63,216,.12)}
.macts{position:relative;display:flex;gap:10px;margin-top:24px}
.mbtn{flex:1;height:54px;border-radius:16px;border:0;cursor:pointer;font:800 16px 'Tajawal';transition:.2s}
.mbtn.p{color:#fff;background:linear-gradient(135deg,var(--royal),var(--violet));box-shadow:0 14px 26px -10px rgba(59,63,216,.7)}
.mbtn.g{color:var(--sapphire);background:var(--mist)}
.mbtn:hover{transform:translateY(-2px)}
.bar{position:relative;height:6px;border-radius:9px;background:var(--mist);margin-top:26px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--violet))}
.bar.go i{animation:fill 2.8s linear forwards}
@keyframes fill{to{width:100%}}
canvas#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

@media(max-width:860px){
  .card{grid-template-columns:1fr}.royal{display:none}.form{padding:40px 26px}
  .frame{border-radius:30px}.card{border-radius:28px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
</style>
</head>
<body>

<div class="aurora"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grain"></div></div>

<main class="frame" id="frame">
  <div class="card">

    <section class="royal" aria-hidden="true">
      <i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i>
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a6b"/><stop offset="1" stop-color="#4b3fc4"/></linearGradient></defs><path d="M32 8l20 46h-9l-3.6-9H24.6L21 54h-9z M27.4 36h9.2L32 24z" fill="url(#lg)"/></svg></div>
        <div><b>AQX</b><span>القرماني إكس</span></div>
      </div>
      <div class="pitch">
        <h1>بوابتك إلى إدارة الروابط والفهارس</h1>
        <p>مساحة إدارة خاصة ومحمية، تجمع روابطك وفهارسك في مكان واحد منظم وآمن.</p>
      </div>
      <div class="chips"><span class="chip"><i></i>دخول مشفّر</span><span class="chip"><i></i>حماية متعددة الطبقات</span><span class="chip"><i></i>وصول للإدارة فقط</span></div>
    </section>

    <section class="form">
      <h2>تسجيل دخول الإدارة</h2>
      <p class="sub">أدخل بريدك الإلكتروني والرقم السري للمتابعة.</p>

      <div id="loginBox" autocomplete="off">
        <input class="hp" type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="field">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>
          <input type="email" id="email" placeholder=" " autocomplete="username" inputmode="email" maxlength="120" spellcheck="false" autocapitalize="off">
          <label for="email">البريد الإلكتروني</label>
        </div>

        <div class="field">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/><circle cx="12" cy="15.5" r="1.3"/></svg>
          <input type="password" id="pass" placeholder=" " autocomplete="current-password" maxlength="128">
          <label for="pass">الرقم السري</label>
          <button type="button" class="eye" id="eye" aria-label="إظهار الرقم السري">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div class="row"><button type="button" class="link" id="forgot">هل نسيت الرقم السري؟</button></div>

        <button type="button" class="btn" id="go"><span class="spin"></span><span id="goTxt">تسجيل الدخول</span></button>

        <div class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>اتصال محمي ومشفّر</div>
      </div>
      <div class="foot">AQX القرماني إكس</div>
    </section>

  </div>
</main>

<div class="veil" id="veil"><div class="modal"><div class="mbody" id="mbody"></div></div></div>
<canvas id="fx"></canvas>

  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  err:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11v6M12 7.5v.1"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="3"/><path d="M4 8l8 5.5L20 8"/></svg>'
};
function esc(s){const d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
function modal({tone='info',icon='info',title='',name='',text='',extra='',actions=[]}){
  mbody.innerHTML=
   `<div class="badge t-${tone}"><div class="disc">${ICON[icon]}</div></div>
    <h3>${esc(title)}</h3>${name?`<div class="name">${esc(name)}</div>`:''}
    ${text?`<p>${esc(text)}</p>`:''}${extra}
    ${actions.length?`<div class="macts" id="macts"></div>`:''}`;
  const box=$('macts');
  actions.forEach(a=>{const b=document.createElement('button');b.className='mbtn '+(a.ghost?'g':'p');b.textContent=a.label;b.onclick=a.fn;box.appendChild(b);});
  veil.classList.add('on');
}
function closeModal(){ veil.classList.remove('on'); mbody.innerHTML=''; }
veil.addEventListener('click',e=>{ if(e.target===veil && !veil.dataset.lock) closeModal(); });

function lockInfo(){ try{ return JSON.parse(localStorage.getItem('aqx_l')||'{}'); }catch(e){ return {}; } }
function saveLock(o){ try{ localStorage.setItem('aqx_l',JSON.stringify(o)); }catch(e){} }
let lockTimer=null;
function applyLock(){
  const l=lockInfo(); clearInterval(lockTimer);
  const left=Math.ceil(((l.until||0)-Date.now())/1000);
  if(left>0){
    go.disabled=true;
    const tick=()=>{ const s=Math.ceil(((lockInfo().until||0)-Date.now())/1000);
      if(s<=0){ clearInterval(lockTimer); go.disabled=false; goTxt.textContent='تسجيل الدخول'; saveLock({n:0}); return; }
      goTxt.textContent='محاولات كثيرة، انتظر '+s+' ثانية'; };
    tick(); lockTimer=setInterval(tick,1000);
  }
}
applyLock();

async function callEngine(payload){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),TIMEOUT_MS);
  try{
    const r=await fetch(ENGINE,{method:'POST',body:JSON.stringify(payload),signal:ctrl.signal,redirect:'follow',credentials:'omit',referrerPolicy:'no-referrer'});
    const txt=await r.text(); let d;
    try{ d=JSON.parse(txt); }catch(e){ throw new Error('bad-response'); }
    return d;
  } finally { clearTimeout(t); }
}
const isOk = d => d && (d.success===true || d.ok===true || d.status==='success' || d.status==='ok' || d.result==='success');

async function login(){
  if(go.disabled) return;
  if($('website').value) return;
  if(Date.now()-startedAt<1200) return;
  const em=email.value.trim().toLowerCase(), pw=pass.value;
  const valid=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em);
  if(!valid || pw.length<1){
    $('frame').classList.remove('shake'); void $('frame').offsetWidth; $('frame').classList.add('shake');
    modal({tone:'gold',icon:'info',title:'البيانات غير مكتملة',text: !valid?'اكتب بريدًا إلكترونيًا صحيحًا.':'اكتب الرقم السري للمتابعة.',actions:[{label:'حسنًا',fn:closeModal}]});
    return;
  }
  go.disabled=true; go.classList.add('load'); goTxt.textContent='جارٍ المصادقة';
  try {
    const userCredential = await signInWithEmailAndPassword(auth, em, pw);
    const user = userCredential.user;
    const idToken = await user.getIdToken();

    goTxt.textContent='جارٍ التحقق الأمني';

    const d = await callEngine({ idToken: idToken });
    
    if(isOk(d)){
      saveLock({n:0});
      try{ sessionStorage.setItem('aqx_session',JSON.stringify({token:idToken,email:em,name:WELCOME_NAME,t:Date.now()})); }catch(e){}
      pass.value='';
      veil.dataset.lock='1';
      modal({tone:'ok',icon:'ok',title:'تم تسجيل الدخول بنجاح',name:'أهلًا بك يا '+WELCOME_NAME,
        text:'يسعدنا عودتك إلى AQX القرماني إكس. جارٍ فتح لوحة التحكم.',
        extra:'<div class="bar go" id="bar"><i></i></div>'});
      confetti();
      setTimeout(()=>{ location.replace(DASHBOARD); },2900);
      return;
    }
    fail(d && d.message);
  } catch(err) {
    if(err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
      fail('البريد الإلكتروني أو الرقم السري غير صحيح.');
    } else if(err.name==='AbortError') {
      netErr('انتهت مهلة الاتصال بالمحرك. تحقق من الإنترنت وحاول مرة أخرى.');
    } else {
      fail(err.message || 'تعذّر إتمام المصادقة.');
    }
  } finally {
    go.classList.remove('load'); if(!lockInfo().until || lockInfo().until<Date.now()){ go.disabled=false; goTxt.textContent='تسجيل الدخول'; }
  }
}

function fail(msg){
  const l=lockInfo(); const n=(l.n||0)+1; const o={n};
  if(n>=MAX_TRIES){ o.until=Date.now()+LOCK_SECONDS*1000; o.n=0; }
  saveLock(o);
  $('frame').classList.remove('shake'); void $('frame').offsetWidth; $('frame').classList.add('shake');
  const left=MAX_TRIES-n;
  modal({tone:'err',icon:'err',title:'تعذّر تسجيل الدخول',
    text:String(msg||'خطأ في بيانات الاعتماد.')+(o.until?' تم إيقاف الدخول مؤقتًا للحماية.':' المحاولات المتبقية: '+left+'.'),
    actions:[{label:'إعادة المحاولة',fn:()=>{closeModal();pass.focus();}}]});
  pass.value=''; applyLock();
}
function netErr(t){ modal({tone:'err',icon:'err',title:'لا يوجد اتصال بالمحرك',text:t,actions:[{label:'إغلاق',ghost:true,fn:closeModal},{label:'إعادة المحاولة',fn:()=>{closeModal();login();}}]}); }

go.onclick=login;
[email,pass].forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') login(); }));

$('forgot').onclick=()=>{
  modal({tone:'info',icon:'mail',title:'استعادة الرقم السري',text:'اكتب بريدك الإلكتروني وسنرسل لك رابط استعادة كلمة المرور.',
    extra:'<div class="mfield"><input type="email" id="fe" placeholder="name@example.com" autocomplete="off" maxlength="120"></div>',
    actions:[{label:'إلغاء',ghost:true,fn:closeModal},{label:'إرسال',fn:sendReset}]});
  setTimeout(()=>{const f=$('fe'); if(f){f.value=email.value.trim(); f.focus(); f.addEventListener('keydown',e=>{if(e.key==='Enter')sendReset();});}},80);
};

let resetBusy=false;
async function sendReset(){
  if(resetBusy) return;
  const em=($('fe').value||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){$('fe').style.borderColor='var(--err)'; return; }
  resetBusy=true;
  modal({tone:'info',icon:'mail',title:'جارٍ الإرسال',text:'لحظات من فضلك.'});
  try{
    await sendPasswordResetEmail(auth, em);
    modal({tone:'ok',icon:'ok',title:'تم إرسال الرابط',text:'تم إرسال تعليمات استعادة الرقم السري إلى بريدك الإلكتروني بنجاح.',actions:[{label:'تمام',fn:closeModal}]});
  }catch(e){
    modal({tone:'err',icon:'err',title:'تعذّر إرسال الطلب',text:'تأكد من صحة البريد الإلكتروني المحاولة مرة أخرى.',actions:[{label:'إغلاق',fn:closeModal}]});
  }finally{ resetBusy=false; }
}

function confetti(){
  const c=$('fx'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#f3d98b','#c49a3a','#7a5cff','#3b3fd8','#8fc3ff','#ffffff'];
  const P=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight/2.3,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,s:Math.random()*8+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function draw(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.vy+=.34;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++f<190) requestAnimationFrame(draw); else x.clearRect(0,0,c.width,c.height);
  })();
}

})();
</script>
