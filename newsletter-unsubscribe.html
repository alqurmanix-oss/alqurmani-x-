
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7f4ee">
  <title>إلغاء اشتراك النشرة البريدية | AQX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f7f4ee;
      color: #253047;
      font-family: Tahoma, Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 35px 25px;
      text-align: center;
      background: #fff;
      border: 1px solid #e8e0d2;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.05);
    }

    .logo {
      color: #17243a;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      margin: 25px 0 15px;
      font-size: 21px;
    }

    p {
      line-height: 2;
      color: #64748b;
      font-size: 15px;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f5f9;
      font-size: 14px;
      line-height: 2;
    }

    .success {
      color: #187044;
      background: #ecfdf3;
    }

    .error {
      color: #b42318;
      background: #fef3f2;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">AQX</div>
    <p>القرماني إكس</p>

    <h1>إلغاء اشتراك النشرة البريدية</h1>

    <div id="status" class="status" role="status" aria-live="polite">
      جارٍ التحقق من رابط إلغاء الاشتراك...
    </div>

    <div class="footer">
      منظومة القرماني إكس AQX
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const ACTION_URL =
        "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-newsletter-worker/action";

      const statusBox = document.getElementById("status");
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token") || "";

      function showError(message) {
        statusBox.className = "status error";
        statusBox.textContent = message;
      }

      function showSuccess(message) {
        statusBox.className = "status success";
        statusBox.textContent = message;
      }

      if (!/^[a-f0-9]{64}$/i.test(token)) {
        showError("رابط إلغاء الاشتراك غير صالح أو غير مكتمل.");
        return;
      }

      // تنفيذ الإلغاء من خلال نقطة المعالجة الآمنة بالخلفية.
      const target = new URL(ACTION_URL);
      target.searchParams.set("decision", "reject");
      target.searchParams.set("token", token);

      statusBox.textContent = "جارٍ تنفيذ طلب إلغاء الاشتراك...";

      // الاحتفاظ بسلوك التحويل الأصلي حتى تتولى الخلفية تنفيذ الطلب.
      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
