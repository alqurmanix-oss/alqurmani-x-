
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7f4ee">
  <title>إلغاء الاشتراك | AQX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f7f4ee;
      color: #253047;
      font-family: Tahoma, Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 35px 25px;
      text-align: center;
      background: #fff;
      border: 1px solid #e8e0d2;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.05);
    }

    .logo {
      color: #17243a;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      margin: 25px 0 15px;
      font-size: 21px;
      color: #187044;
    }

    p {
      line-height: 2;
      color: #64748b;
      font-size: 15px;
    }

    .status {
      margin-top: 20px;
      padding: 20px 15px;
      border-radius: 10px;
      background: #ecfdf3;
      color: #187044;
      font-size: 15px;
      line-height: 2;
    }

    .countdown {
      margin-top: 18px;
      color: #64748b;
      font-size: 13px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">AQX</div>
    <p>القرماني إكس</p>

    <h1>تم إلغاء اشتراكك بنجاح</h1>

    <div class="status" role="status" aria-live="polite">
      نأسف لعدم استمرارك معنا، ونشكرك على وقتك واهتمامك.
      <br>
      تم تسجيل طلب إلغاء اشتراكك في النشرة البريدية.
    </div>

    <div class="countdown">
      سيتم إغلاق الصفحة تلقائيًا خلال
      <strong id="timer">15</strong> ثانية.
    </div>

    <div class="footer">
      منظومة القرماني إكس AQX
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      let remaining = 15;
      const timer = document.getElementById("timer");

      const interval = setInterval(() => {
        remaining--;
        timer.textContent = remaining;

        if (remaining <= 0) {
          clearInterval(interval);
          window.close();
        }
      }, 1000);
    })();
  </script>
</body>
</html>
