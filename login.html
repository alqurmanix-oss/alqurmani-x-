
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131b">
<meta name="description" content="بوابة الهوية والحساب الموحد AQX">
<title>تسجيل الدخول | القرماني إكس AQX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

<style>
:root{
  --bg:#10131b;
  --panel:#191e29;
  --panel2:#202737;
  --gold:#d8b66a;
  --gold2:#f1d99b;
  --text:#f5f3ed;
  --muted:#a9afbd;
  --line:#343c4d;
  --danger:#ff7777;
  --success:#69d6a1;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    radial-gradient(circle at 50% 0%,#30364a 0,transparent 48%),
    var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}
.container{width:100%;max-width:440px}
.brand{text-align:center;margin-bottom:24px}
.logo{
  width:72px;height:72px;border-radius:22px;
  margin:0 auto 13px;
  display:grid;place-items:center;
  color:#171923;font-size:25px;font-weight:900;
  background:linear-gradient(145deg,var(--gold2),#b78d3e);
  box-shadow:0 8px 30px #d8b66a30;
}
.brand h1{font-size:23px;margin:0 0 8px}
.brand p{color:var(--muted);font-size:13px;margin:0}
.card{
  background:linear-gradient(160deg,#202635,#171c27);
  border:1px solid var(--line);
  border-radius:22px;padding:25px;
  box-shadow:0 20px 70px #0006;
}
.card h2{font-size:19px;margin:0 0 7px}
.subtitle{color:var(--muted);font-size:13px;margin:0 0 23px}
label{display:block;font-size:13px;margin:0 0 9px}
.field{margin-bottom:17px}
input{
  width:100%;height:49px;padding:0 14px;
  border-radius:12px;border:1px solid var(--line);
  background:#111722;color:white;font-size:15px;
  outline:none;direction:ltr;text-align:left;
}
input:focus{border-color:var(--gold)}
button{
  width:100%;height:49px;border:0;border-radius:12px;
  cursor:pointer;font-size:14px;font-weight:bold;
  transition:.2s;
}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{
  color:#171923;
  background:linear-gradient(110deg,var(--gold2),#c49a4d);
}
.primary:hover{filter:brightness(1.08)}
.links{
  display:flex;justify-content:space-between;
  gap:12px;margin:16px 0 20px;font-size:12px;
}
a{color:var(--gold2);text-decoration:none}
a:hover{text-decoration:underline}
.separator{
  display:flex;align-items:center;gap:12px;
  color:var(--muted);font-size:12px;margin:20px 0;
}
.separator:before,.separator:after{
  content:"";height:1px;background:var(--line);flex:1
}
.providers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.provider{
  background:var(--panel2);border:1px solid var(--line);
  color:var(--text);height:46px;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.provider:hover{border-color:var(--gold);background:#293246}
.provider .symbol{font-size:17px;font-weight:bold}
.message{
  display:none;padding:12px 13px;border-radius:11px;
  font-size:13px;line-height:1.7;margin-bottom:16px;
}
.message.show{display:block}
.message.error{background:#5a252b55;color:#ffaaaa;border:1px solid #9b454d}
.message.success{background:#17493655;color:#8ce4b6;border:1px solid #347e5c}
.message.info{background:#35425b66;color:#d5dfef;border:1px solid #536782}
.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}
.hidden{display:none!important}
.loading{opacity:.7;pointer-events:none}
@media(max-width:390px){
  .card{padding:20px}
  .providers{grid-template-columns:1fr}
}
</style>
</head>

<body>
<main class="container">

  <header class="brand">
    <div class="logo">AQX</div>
    <h1>القرماني إكس AQX</h1>
    <p>بوابة الهوية والحساب الموحد</p>
  </header>

  <section class="card">
    <h2>تسجيل الدخول</h2>
    <p class="subtitle">أدخل بيانات حسابك للوصول إلى خدمات AQX</p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" name="email" type="email"
          placeholder="name@example.com"
          autocomplete="username" required maxlength="320">
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password"
          placeholder="أدخل كلمة المرور"
          autocomplete="current-password" required minlength="8">
      </div>

      <button id="loginButton" class="primary" type="submit">
        تسجيل الدخول
      </button>
    </form>

    <div class="links">
      <a href="confirmed.html?action=forgot">نسيت كلمة المرور؟</a>
      <a href="signup.html">إنشاء حساب جديد</a>
    </div>

    <div id="oauthSection" class="hidden">
      <div class="separator">أو الدخول باستخدام</div>
      <div id="providers" class="providers"></div>
    </div>

    <div id="providerLoading" class="message info show">
      جارٍ تحميل خيارات تسجيل الدخول...
    </div>
  </section>

  <footer class="footer">
    © AQX — القرماني إكس
  </footer>
</main>

<script>
(() => {
  "use strict";

  const CONFIG = Object.freeze({
    SUPABASE_URL:
      "https://fkiokwwztbyztleeuwks.supabase.co",

    SUPABASE_KEY:
      "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_",

    IDENTITY_API:
      "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-identity",

    LOGIN_URL:
      "https://id.alqurmanix.com/login.html",

    SUCCESS_URL:
      "https://id.alqurmanix.com/secure-aqx.html",

    OAUTH_PENDING_KEY:
      "aqx_oauth_login_pending",

    AQX_SESSION_KEY:
      "aqx_session_token",

    AQX_SESSION_ID_KEY:
      "aqx_session_id",

    LOGIN_PROOF_KEY:
      "aqx_login_proof"
  });

  const PROVIDERS = {
    google: {
      label:"Google",
      icon:"G",
      provider:"google"
    },
    github: {
      label:"GitHub",
      icon:"⌘",
      provider:"github"
    },
    apple: {
      label:"Apple",
      icon:"●",
      provider:"apple"
    },
    facebook: {
      label:"Facebook",
      icon:"f",
      provider:"facebook"
    },
    discord: {
      label:"Discord",
      icon:"◈",
      provider:"discord"
    },
    microsoft: {
      label:"Microsoft",
      icon:"▦",
      provider:"azure"
    },
    linkedin: {
      label:"LinkedIn",
      icon:"in",
      provider:"linkedin_oidc"
    }
  };

  if (!window.supabase || !window.supabase.createClient) {
    document.getElementById("message").textContent =
      "تعذر تحميل مكتبة تسجيل الدخول. أعد تحميل الصفحة.";
    document.getElementById("message").className =
      "message show error";
    return;
  }

  const supabase = window.supabase.createClient(
    CONFIG.SUPABASE_URL,
    CONFIG.SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        flowType:"pkce"
      }
    }
  );

  const $ = id => document.getElementById(id);

  let busy = false;
  let oauthFinishing = false;
  let loginCompleting = false;

  function showMessage(text,type="info"){
    const box=$("message");
    box.textContent=text;
    box.className="message show "+type;
  }

  function clearMessage(){
    const box=$("message");
    box.textContent="";
    box.className="message";
  }

  function setBusy(value){
    busy=value;
    $("loginButton").disabled=value;
    $("loginButton").textContent =
      value ? "جارٍ التحقق..." : "تسجيل الدخول";
  }

  function safeText(value){
    return String(value || "").slice(0,500);
  }

  function clearLoginProof(){
    sessionStorage.removeItem(CONFIG.LOGIN_PROOF_KEY);
  }

  function clearAqxLocalSession(){
    localStorage.removeItem(CONFIG.AQX_SESSION_KEY);
    localStorage.removeItem(CONFIG.AQX_SESSION_ID_KEY);
    clearLoginProof();
  }

  async function getPolicy(){
    const response=await fetch(
      CONFIG.IDENTITY_API+"/v1/registration/status",
      {
        method:"GET",
        headers:{
          "apikey":CONFIG.SUPABASE_KEY,
          "Accept":"application/json"
        },
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("تعذر الاتصال بمحرك الهوية.");
    }

    const data=await response.json();

    if(data.success!==true || !Array.isArray(data.login_methods)){
      throw new Error("استجابة إعدادات الدخول غير صالحة.");
    }

    return data;
  }

  function renderProviders(methods){
    const host=$("providers");
    host.replaceChildren();

    const enabled=[...new Set(methods)]
      .filter(key=>PROVIDERS[key]);

    enabled.forEach(key=>{
      const item=PROVIDERS[key];
      const button=document.createElement("button");

      button.type="button";
      button.className="provider";
      button.dataset.provider=key;

      const symbol=document.createElement("span");
      symbol.className="symbol";
      symbol.textContent=item.icon;

      const label=document.createElement("span");
      label.textContent=item.label;

      button.append(symbol,label);
      button.addEventListener("click",()=>startOAuth(key));

      host.append(button);
    });

    $("oauthSection").classList.toggle(
      "hidden",enabled.length===0
    );
  }

  async function loadProviders(){
    $("providerLoading").classList.remove("hidden");

    try{
      const policy=await getPolicy();
      renderProviders(policy.login_methods);
      $("providerLoading").classList.add("hidden");
    }catch(error){
      $("providerLoading").textContent =
        "تعذر تحميل خيارات الدخول. يمكنك المحاولة لاحقًا.";
      $("providerLoading").classList.remove("hidden");
      console.error("AQX provider loading:",error);
    }
  }

  async function providerIsEnabled(key){
    const policy=await getPolicy();
    return policy.login_methods.includes(key);
  }

  async function startOAuth(key){
    if(busy)return;

    const item=PROVIDERS[key];
    if(!item)return;

    setBusy(true);
    clearMessage();
    clearLoginProof();

    try{
      // إعادة التحقق من إعداد المزود من المحرك قبل استخدامه.
      if(!(await providerIsEnabled(key))){
        throw new Error("طريقة تسجيل الدخول هذه غير متاحة حاليًا.");
      }

      sessionStorage.setItem(CONFIG.OAUTH_PENDING_KEY,key);

      const {error}=await supabase.auth.signInWithOAuth({
        provider:item.provider,
        options:{
          redirectTo:CONFIG.LOGIN_URL,
          queryParams:
            key==="google" ? {prompt:"select_account"} : undefined
        }
      });

      if(error)throw error;

    }catch(error){
      sessionStorage.removeItem(CONFIG.OAUTH_PENDING_KEY);
      clearLoginProof();

      showMessage(
        safeText(error.message || "تعذر بدء تسجيل الدخول."),
        "error"
      );

      setBusy(false);
    }
  }

  /*
   * إنشاء جلسة AQX واستلام إثبات الدخول الأمني.
   * لا يسمح بالانتقال إلى صفحة الفحص دون إثبات صالح.
   */
  async function createAqxSession(session){

    clearLoginProof();

    const response=await fetch(
      CONFIG.IDENTITY_API+"/v1/session/start",
      {
        method:"POST",
        headers:{
          "apikey":CONFIG.SUPABASE_KEY,
          "Authorization":"Bearer "+session.access_token,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({})
      }
    );

    const data=await response.json().catch(()=>({}));

    if(
      !response.ok ||
      data.success!==true ||
      !data.aqx_session_token
    ){
      throw new Error(
        data.message || "تعذر إنشاء جلسة AQX الآمنة."
      );
    }

    /*
     * التحقق من إثبات الدخول الصادر من المحرك.
     */
    const proof=data.login_proof;

    if(
      !proof ||
      typeof proof.token!=="string" ||
      proof.token.length<30 ||
      proof.token.length>100 ||
      proof.purpose!=="dashboard_access" ||
      proof.single_use!==true ||
      !proof.expires_at
    ){
      throw new Error(
        "محرك الهوية لم يصدر إثبات الدخول الأمني المطلوب."
      );
    }

    const expiry=Date.parse(proof.expires_at);

    if(
      !Number.isFinite(expiry) ||
      expiry<=Date.now()
    ){
      throw new Error(
        "إثبات الدخول الأمني منتهي أو غير صالح."
      );
    }

    /*
     * حفظ جلسة AQX.
     */
    localStorage.setItem(
      CONFIG.AQX_SESSION_KEY,
      data.aqx_session_token
    );

    if(data.session_id){
      localStorage.setItem(
        CONFIG.AQX_SESSION_ID_KEY,
        data.session_id
      );
    }else{
      localStorage.removeItem(CONFIG.AQX_SESSION_ID_KEY);
    }

    /*
     * حفظ الإثبات في التبويب الحالي فقط.
     * لا يتم حفظه في localStorage.
     */
    sessionStorage.setItem(
      CONFIG.LOGIN_PROOF_KEY,
      proof.token
    );

    return data;
  }

  /*
   * إكمال عملية تسجيل الدخول.
   */
  async function completeLogin(){

    if(loginCompleting)return;

    loginCompleting=true;
    oauthFinishing=true;
    setBusy(true);

    clearLoginProof();

    showMessage(
      "تمت المصادقة. جارٍ تجهيز جلسة AQX والتحقق الأمني...",
      "info"
    );

    try{

      const {data:userData,error:userError} =
        await supabase.auth.getUser();

      if(userError || !userData?.user){
        throw new Error("تعذر التحقق من هوية الحساب.");
      }

      const user=userData.user;

      if(!user.email_confirmed_at){
        await supabase.auth.signOut({scope:"local"});

        sessionStorage.removeItem(CONFIG.OAUTH_PENDING_KEY);

        throw new Error(
          "يجب تأكيد البريد الإلكتروني أولًا."
        );
      }

      const {data:sessionData,error:sessionError} =
        await supabase.auth.getSession();

      if(sessionError || !sessionData?.session){
        throw new Error(
          "لم يتم العثور على جلسة دخول صالحة."
        );
      }

      /*
       * لا ننتقل قبل إنشاء جلسة AQX واستلام الإثبات.
       */
      await createAqxSession(sessionData.session);

      sessionStorage.removeItem(CONFIG.OAUTH_PENDING_KEY);

      showMessage(
        "تم تسجيل الدخول بنجاح. جارٍ تحويلك للفحص الأمني...",
        "success"
      );

      window.location.replace(CONFIG.SUCCESS_URL);

    }catch(error){

      console.error("AQX login error:",error);

      clearLoginProof();
      sessionStorage.removeItem(CONFIG.OAUTH_PENDING_KEY);

      showMessage(
        safeText(error.message || "تعذر إكمال تسجيل الدخول."),
        "error"
      );

      loginCompleting=false;
      oauthFinishing=false;
      setBusy(false);
    }
  }

  /*
   * تسجيل الدخول بالبريد وكلمة المرور.
   */
  $("loginForm").addEventListener("submit",async event=>{

    event.preventDefault();

    if(busy)return;

    clearMessage();
    clearLoginProof();

    const email=$("email").value.trim().toLowerCase();
    const password=$("password").value;

    if(!email || !password){
      showMessage(
        "أدخل البريد الإلكتروني وكلمة المرور.",
        "error"
      );
      return;
    }

    setBusy(true);

    try{

      const {data,error}=await supabase.auth.signInWithPassword({
        email,
        password
      });

      if(error)throw error;

      if(!data?.session){
        throw new Error("لم يتم إنشاء جلسة دخول.");
      }

      await completeLogin();

    }catch(error){

      console.error("AQX password login:",error);

      clearLoginProof();

      let message=error.message || "تعذر تسجيل الدخول.";

      if(/invalid login credentials/i.test(message)){
        message="البريد الإلكتروني أو كلمة المرور غير صحيحة.";
      }else if(/email not confirmed/i.test(message)){
        message="يجب تأكيد البريد الإلكتروني قبل تسجيل الدخول.";
      }

      showMessage(safeText(message),"error");

      setBusy(false);
      oauthFinishing=false;
      loginCompleting=false;
    }
  });

  /*
   * إنهاء OAuth فقط إذا كان هذا التبويب قد بدأ العملية.
   * وجود جلسة قديمة وحده لا يؤدي إلى إعادة توجيه.
   */
  async function finishExplicitOAuth(){

    const pending=sessionStorage.getItem(CONFIG.OAUTH_PENDING_KEY);

    if(!pending)return;

    if(oauthFinishing || loginCompleting)return;

    try{

      const {data,error}=await supabase.auth.getSession();

      if(error)throw error;

      if(data?.session){
        await completeLogin();
      }

    }catch(error){

      console.error("AQX OAuth callback:",error);

      sessionStorage.removeItem(CONFIG.OAUTH_PENDING_KEY);
      clearLoginProof();

      showMessage(
        safeText(
          error.message ||
          "تعذر إكمال تسجيل الدخول عبر المزود."
        ),
        "error"
      );

      oauthFinishing=false;
      loginCompleting=false;
      setBusy(false);
    }
  }

  /*
   * الاستماع إلى اكتمال مصادقة OAuth.
   */
  supabase.auth.onAuthStateChange((event,session)=>{

    if(
      event==="SIGNED_IN" &&
      session &&
      sessionStorage.getItem(CONFIG.OAUTH_PENDING_KEY)
    ){
      // تنفيذ خارج callback الخاص بـ Supabase.
      setTimeout(()=>{
        finishExplicitOAuth();
      },0);
    }
  });

  /*
   * التهيئة.
   */
  async function initialize(){

    // لا نسمح بإثبات قديم عند فتح الصفحة.
    clearLoginProof();

    // تحميل خيارات الدخول من محرك AQX.
    await loadProviders();

    // استكمال OAuth فقط عند وجود عملية بدأها هذا التبويب.
    await finishExplicitOAuth();
  }

  initialize();

})();
</script>
</body>
</html>
