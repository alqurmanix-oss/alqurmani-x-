
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AQX Identity | الحساب الموحد</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f3f5fa;color:#182033;
 font-family:Tahoma,Arial,sans-serif;
 min-height:100vh;display:grid;place-items:center;padding:20px
}
.card{
 width:100%;max-width:440px;background:#fff;padding:28px;
 border-radius:20px;box-shadow:0 12px 45px #17255412
}
.logo{text-align:center;margin-bottom:24px}
.logo strong{font-size:27px;color:#2458c5;letter-spacing:1px}
.logo p{color:#758098;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{flex:1}
button{
 border:0;border-radius:10px;padding:13px;
 background:#2458c5;color:#fff;font-weight:bold;
 cursor:pointer;font-size:14px
}
button.secondary{background:#edf1fa;color:#263b68}
button.google{background:#fff;color:#263248;border:1px solid #dce1ea;width:100%;margin-top:10px}
button:disabled{opacity:.55;cursor:wait}
input{
 width:100%;padding:14px;border:1px solid #dce1ea;
 border-radius:10px;margin:7px 0 13px;font-size:14px;
 outline:none
}
input:focus{border-color:#4776d5}
label{font-size:13px;font-weight:bold;color:#44516a}
.panel{display:none}
.panel.active{display:block}
.message{
 padding:12px;border-radius:10px;background:#eef3ff;
 color:#254b9a;font-size:13px;margin:12px 0;display:none;
 line-height:1.7
}
.message.error{background:#fff0f0;color:#b52c2c}
.profile{
 background:#f5f7fc;border-radius:12px;padding:16px;
 margin:16px 0;line-height:2
}
.profile b{color:#2458c5}
.small{font-size:12px;color:#8992a4;text-align:center;margin-top:18px}
a{color:#2458c5;text-decoration:none;font-size:13px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="card">
 <div class="logo">
  <strong>AQX IDENTITY</strong>
  <p>حسابك الموحد لجميع خدمات AQX</p>
 </div>

 <div id="authArea">
  <div class="tabs">
   <button class="secondary" onclick="showPanel('login')">تسجيل الدخول</button>
   <button class="secondary" onclick="showPanel('register')">إنشاء حساب</button>
  </div>

  <div id="login" class="panel active">
   <label>البريد الإلكتروني</label>
   <input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com">
   <label>كلمة المرور</label>
   <input id="loginPassword" type="password" autocomplete="current-password" placeholder="كلمة المرور">
   <button style="width:100%" onclick="login()">دخول الحساب</button>
   <p><a href="#" onclick="forgotPassword();return false">نسيت كلمة المرور؟</a></p>
   <button class="google" onclick="googleLogin()">الدخول باستخدام Google</button>
  </div>

  <div id="register" class="panel">
   <label>البريد الإلكتروني</label>
   <input id="regEmail" type="email" autocomplete="email" placeholder="name@example.com">
   <label>كلمة المرور</label>
   <input id="regPassword" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل">
   <label>تأكيد كلمة المرور</label>
   <input id="regConfirm" type="password" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور">
   <button style="width:100%" onclick="register()">إنشاء الحساب</button>
   <button class="google" onclick="googleLogin()">التسجيل باستخدام Google</button>
  </div>

  <div id="recovery" class="panel">
   <label>كلمة المرور الجديدة</label>
   <input id="newPassword" type="password" autocomplete="new-password">
   <button style="width:100%" onclick="changePassword()">تغيير كلمة المرور</button>
  </div>
 </div>

 <div id="userArea" class="hidden">
  <h3>مرحباً بك في AQX 👋</h3>
  <div class="profile">
   <div>معرف AQX: <b id="aqxId">...</b></div>
   <div>البريد: <span id="userEmail">...</span></div>
   <div>حالة الحساب: <b>نشط</b></div>
  </div>
  <button style="width:100%" onclick="logout()">تسجيل الخروج</button>
 </div>

 <div id="message" class="message"></div>
 <div class="small">AQX Identity · الحساب الموحد لمنظومة Qurmani X</div>
</div>

<script>
const SUPABASE_URL =
 "https://fkiokwwztbyztleeuwks.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_";

const API_BASE =
 SUPABASE_URL + "/functions/v1/aqx-identity";

const supabase = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:true
  }
 }
);

const $ = id => document.getElementById(id);

function message(text,error=false){
 const box=$("message");
 box.textContent=text;
 box.className="message"+(error?" error":"");
 box.style.display="block";
}

function clearMessage(){
 $("message").style.display="none";
}

function showPanel(name){
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 $(name).classList.add("active");
 clearMessage();
}

async function getAccessToken(){
 const {data,error}=await supabase.auth.getSession();
 if(error || !data.session) throw new Error("انتهت جلسة الدخول. سجّل الدخول مجدداً.");
 return data.session.access_token;
}

async function api(path,method="POST",sessionToken=null){
 const accessToken=await getAccessToken();
 const headers={
  "apikey":SUPABASE_KEY,
  "Authorization":"Bearer "+accessToken,
  "Content-Type":"application/json"
 };
 if(sessionToken) headers["x-aqx-session"]=sessionToken;

 const response=await fetch(API_BASE+path,{
  method,
  headers,
  body:method==="GET"?undefined:"{}"
 });
 const result=await response.json().catch(()=>({}));
 if(!response.ok){
  throw new Error(result.message||result.error||"تعذر الاتصال بمحرك AQX");
 }
 return result;
}

async function startAqxSession(){
 const result=await api("/v1/session/start");
 if(!result.success || !result.aqx_session_token){
  throw new Error("لم يتم إنشاء جلسة AQX.");
 }
 sessionStorage.setItem("aqx_session_token",result.aqx_session_token);
 return result;
}

async function loadProfile(){
 const result=await api("/v1/me");
 if(!result.profile) throw new Error("ملف الهوية غير موجود.");
 $("aqxId").textContent=result.profile.aqx_id;
 $("userEmail").textContent=result.profile.primary_email;
}

async function openUserArea(){
 const token=sessionStorage.getItem("aqx_session_token");
 if(token){
  try{
   const check=await api("/v1/session/check","POST",token);
   if(!check.valid) throw new Error("الجلسة غير صالحة");
  }catch(e){
   sessionStorage.removeItem("aqx_session_token");
   await startAqxSession();
  }
 }else{
  await startAqxSession();
 }
 await loadProfile();
 $("authArea").classList.add("hidden");
 $("userArea").classList.remove("hidden");
 clearMessage();
}

async function login(){
 try{
  clearMessage();
  const {error}=await supabase.auth.signInWithPassword({
   email:$("loginEmail").value.trim(),
   password:$("loginPassword").value
  });
  if(error) throw error;
  await openUserArea();
  message("تم تسجيل الدخول بنجاح.");
 }catch(e){message(e.message,true)}
}

async function register(){
 try{
  clearMessage();
  const email=$("regEmail").value.trim();
  const password=$("regPassword").value;
  if(password.length<8) throw new Error("كلمة المرور يجب ألا تقل عن 8 أحرف.");
  if(password!==$("regConfirm").value) throw new Error("كلمتا المرور غير متطابقتين.");

  const {data,error}=await supabase.auth.signUp({
   email,password,
   options:{emailRedirectTo:location.origin+"/"}
  });
  if(error) throw error;

  if(data.session){
   await openUserArea();
   message("تم إنشاء الحساب بنجاح.");
  }else{
   message("تم إنشاء طلب الحساب. راجع بريدك الإلكتروني لتأكيد التسجيل قبل الدخول.");
  }
 }catch(e){message(e.message,true)}
}

async function googleLogin(){
 try{
  const {error}=await supabase.auth.signInWithOAuth({
   provider:"google",
   options:{redirectTo:location.origin+"/"}
  });
  if(error) throw error;
 }catch(e){message(e.message,true)}
}

async function forgotPassword(){
 try{
  const email=$("loginEmail").value.trim();
  if(!email) throw new Error("اكتب بريدك الإلكتروني أولاً.");
  const {error}=await supabase.auth.resetPasswordForEmail(email,{
   redirectTo:location.origin+"/"
  });
  if(error) throw error;
  message("أرسلنا رابط استعادة كلمة المرور إلى بريدك.");
 }catch(e){message(e.message,true)}
}

async function changePassword(){
 try{
  const password=$("newPassword").value;
  if(password.length<8) throw new Error("كلمة المرور قصيرة.");
  const {error}=await supabase.auth.updateUser({password});
  if(error) throw error;
  message("تم تغيير كلمة المرور بنجاح.");
  showPanel("login");
 }catch(e){message(e.message,true)}
}

async function logout(){
 try{
  const token=sessionStorage.getItem("aqx_session_token");
  if(token){
   await api("/v1/session/logout","POST",token);
  }
 }catch(e){
  console.error(e);
 }finally{
  sessionStorage.removeItem("aqx_session_token");
  await supabase.auth.signOut({scope:"global"});
  $("userArea").classList.add("hidden");
  $("authArea").classList.remove("hidden");
  showPanel("login");
  message("تم تسجيل الخروج.");
 }
}

// استعادة حالة الحساب عند فتح الصفحة
async function init(){
 const {data}=await supabase.auth.getSession();
 if(data.session){
  try{await openUserArea()}
  catch(e){
   sessionStorage.removeItem("aqx_session_token");
   await supabase.auth.signOut();
   message("انتهت الجلسة. سجّل الدخول مرة أخرى.",true);
  }
 }
}

supabase.auth.onAuthStateChange((event)=>{
 if(event==="PASSWORD_RECOVERY"){
  $("authArea").classList.remove("hidden");
  showPanel("recovery");
 }
});

// فحص الجلسة وتجديد نشاطها كل 5 دقائق
setInterval(async()=>{
 if($("userArea").classList.contains("hidden")) return;
 const token=sessionStorage.getItem("aqx_session_token");
 if(!token) return;
 try{
  const result=await api("/v1/session/check","POST",token);
  if(!result.valid) await logout();
 }catch(e){
  console.error("AQX session check:",e);
 }
},5*60*1000);

init();
</script>
</body>
</html>
