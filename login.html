<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b">
<meta name="description" content="بوابة الحساب الموحد AQX Identity">
<title>تسجيل الدخول | AQX Identity</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:flex;align-items:center;justify-content:center;
  background:#10131b;color:#fff;
  font-family:Arial,Tahoma,sans-serif
}
.container{
  width:100%;max-width:440px;padding:30px;
  background:#1a1f2b;border:1px solid #30394a;
  border-radius:18px;box-shadow:0 15px 50px #0005
}
.logo{text-align:center;font-size:27px;font-weight:bold;color:#91aaff}
h1{text-align:center;font-size:23px;margin:18px 0 8px}
.subtitle{text-align:center;color:#aab3c4;font-size:14px;line-height:1.8}
label{display:block;margin:18px 0 8px}
input{
  width:100%;padding:14px;border-radius:10px;
  border:1px solid #394357;background:#101722;
  color:white;font-size:16px;outline:none
}
input:focus{border-color:#718fff}
button{
  width:100%;padding:14px;margin-top:18px;
  border:0;border-radius:10px;background:#5578ed;
  color:white;font-size:16px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.55;cursor:wait}
.secondary{background:#30394a}
.danger{background:#8b343b}
.hidden{display:none!important}
.message{
  display:none;padding:13px;margin-top:17px;
  border-radius:10px;line-height:1.8;
  background:#292f3c;color:#fff;overflow-wrap:anywhere
}
.message.error{display:block;background:#49272c;color:#ffc4c4}
.message.success{display:block;background:#203c32;color:#b9f4d2}
.message.info{display:block;background:#29364c;color:#c9dcff}
.panel{
  margin-top:20px;padding:17px;border-radius:12px;
  background:#111925;border:1px solid #394357;line-height:1.9
}
.status{font-weight:bold;color:#ffd17b}
.small{font-size:13px;color:#aab3c4;line-height:1.8}
.links{text-align:center;margin-top:20px;line-height:2}
a{color:#91aaff;text-decoration:none}
#turnstileBox{margin-top:18px;display:flex;justify-content:center}
</style>
</head>

<body>
<main class="container">
  <div class="logo">AQX IDENTITY</div>
  <h1 id="pageTitle">تسجيل الدخول</h1>
  <p class="subtitle" id="pageSubtitle">
    ادخل إلى حسابك الموحد للوصول إلى خدمات AQX
  </p>

  <form id="loginForm">
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username"
      placeholder="name@example.com" required>

    <label for="password">كلمة المرور</label>
    <input id="password" type="password"
      autocomplete="current-password"
      placeholder="أدخل كلمة المرور" required>

    <button id="loginButton" type="submit">تسجيل الدخول</button>
  </form>

  <div id="message" class="message" role="alert"></div>

  <section id="accountPanel" class="panel hidden">
    <div id="accountStatus" class="status"></div>
    <div id="accountReason"></div>
    <div id="accountExpiry" class="small"></div>
    <div id="accountActions"></div>
  </section>

  <section id="securityPanel" class="panel hidden">
    <strong>فحص الحماية</strong>
    <p class="small">أكمل فحص الحماية لمتابعة الدخول.</p>
    <div id="turnstileBox"></div>
    <button id="verifyButton" type="button">تأكيد ومتابعة</button>
  </section>

  <div class="links">
    <a href="/forgot-password">نسيت كلمة المرور؟</a>
    <br>
    <a href="/signup">إنشاء حساب جديد</a>
  </div>
</main>

<script>
(() => {
"use strict";

/* إعدادات الحساب الموحد */
const SUPABASE_URL =
  "https://fkiokwwztbyztleeuwks.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4DCXObCqPUoNnI8ANOo8dA_nRAg0y5_";

const IDENTITY_URL =
  SUPABASE_URL + "/functions/v1/aqx-identity";

const TURNSTILE_SITE_KEY =
  "0x4AAAAAAF3T0LhduY-AjZNc";

/* إنشاء عميل Supabase */
const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const $ = id => document.getElementById(id);

let accessToken = null;
let loginProof = null;
let turnstileToken = "";
let turnstileWidget = null;
let currentMode = null;
let sessionTimer = null;
let turnstileLoading = false;

/* واجهة الرسائل */
function showMessage(text,type="info"){
  const el=$("message");
  el.textContent=text;
  el.className="message "+type;
}

function clearMessage(){
  $("message").className="message";
  $("message").textContent="";
}

function showAccount(title,reason="",expiry=""){
  $("accountPanel").classList.remove("hidden");
  $("accountStatus").textContent=title;
  $("accountReason").textContent=reason;
  $("accountExpiry").textContent=expiry;
}

function hideAccount(){
  $("accountPanel").classList.add("hidden");
  $("accountActions").innerHTML="";
}

/* استدعاء محرك AQX */
async function api(path,body={},options={}){
  const headers={
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY
  };

  if(accessToken){
    headers.Authorization="Bearer "+accessToken;
  }

  if(options.restrictedToken){
    headers["x-aqx-restricted-session"]=options.restrictedToken;
  }

  if(options.sessionToken){
    headers["x-aqx-session"]=options.sessionToken;
  }

  const response=await fetch(IDENTITY_URL+path,{
    method:"POST",
    headers,
    body:JSON.stringify(body),
    cache:"no-store"
  });

  const result=await response.json().catch(()=>({}));

  if(!response.ok){
    const error=new Error(
      result.message || result.error || "تعذر تنفيذ الطلب"
    );
    error.status=response.status;
    error.code=result.error;
    error.data=result;
    throw error;
  }

  return result;
}

/* إنهاء مراقبة الجلسة */
function stopSessionMonitor(){
  if(sessionTimer){
    clearInterval(sessionTimer);
    sessionTimer=null;
  }
}

/* عرض حالة الحساب المقيّد */
function restrictionLabel(type){
  const labels={
    self_disabled:"الحساب معطّل بناءً على طلب صاحبه",
    admin_disabled:"الحساب معطّل إدارياً",
    frozen:"الحساب مجمّد مؤقتاً",
    review:"الحساب قيد المراجعة الأمنية",
    banned:"الحساب محظور",
    account:"الوصول إلى الحساب مقيّد",
    email:"البريد الإلكتروني مقيّد",
    domain:"نطاق البريد مقيّد",
    disposable_domain:"البريد المؤقت غير مسموح",
    access_restricted:"الوصول مقيّد"
  };
  return labels[type] || "الحساب مقيّد";
}

/* مراقبة الجلسة المؤقتة */
async function checkRestrictedSession(){
  const token=sessionStorage.getItem("aqx_restricted_token");
  if(!token || !accessToken)return;

  try{
    const state=await api(
      "/v1/restricted-session/check",
      {},
      {restrictedToken:token}
    );

    if(state.valid!==true){
      stopSessionMonitor();
      sessionStorage.removeItem("aqx_restricted_token");
      showMessage("انتهت الجلسة المؤقتة. سجّل الدخول مجدداً.","error");
      return;
    }

    const restriction=state.restriction || {};
    const expiry=state.session_expires_at
      ? "انتهاء الجلسة المؤقتة: "+
        new Date(state.session_expires_at).toLocaleString("ar-EG")
      : "";

    showAccount(
      restrictionLabel(restriction.type),
      restriction.reason || "الحساب مقيّد حالياً.",
      expiry
    );

  }catch(error){
    if(error.status===401){
      stopSessionMonitor();
      sessionStorage.removeItem("aqx_restricted_token");
      showMessage("الجلسة المؤقتة غير صالحة أو انتهت.","error");
    }else{
      showMessage("تعذر التحقق من الجلسة المؤقتة. أعد المحاولة.","error");
    }
  }
}

function startRestrictedMonitor(){
  stopSessionMonitor();
  checkRestrictedSession();
  sessionTimer=setInterval(checkRestrictedSession,5*60*1000);
}

/* عرض أدوات الحساب المقيّد */
function renderRestriction(restriction){
  const type=restriction?.type || "access_restricted";

  showAccount(
    restrictionLabel(type),
    restriction?.reason || "الحساب غير متاح للاستخدام الكامل.",
    restriction?.expires_at
      ? "انتهاء التقييد: "+
        new Date(restriction.expires_at).toLocaleString("ar-EG")
      : "لا توجد مدة انتهاء محددة للتقييد."
  );

  const actions=$("accountActions");
  actions.innerHTML="";

  if(restriction?.reactivation_allowed===true){
    const btn=document.createElement("button");
    btn.textContent="طلب إعادة تنشيط الحساب";
    btn.onclick=requestReactivation;
    actions.appendChild(btn);
  }

  const logout=document.createElement("button");
  logout.className="secondary";
  logout.textContent="إنهاء الجلسة المؤقتة";
  logout.onclick=logoutRestricted;
  actions.appendChild(logout);
}

/* طلب إعادة التنشيط */
async function requestReactivation(){
  try{
    showMessage("جارٍ إرسال طلب إعادة التنشيط...","info");
    await api("/v1/account/reactivation/request");
    showMessage(
      "إذا كان الحساب مؤهلاً لإعادة التنشيط فستصلك رسالة على بريدك المسجل.",
      "success"
    );
  }catch(error){
    showMessage(error.message,"error");
  }
}

/* إنهاء الجلسة المؤقتة */
async function logoutRestricted(){
  const token=sessionStorage.getItem("aqx_restricted_token");

  try{
    if(token){
      await api(
        "/v1/restricted-session/logout",
        {},
        {restrictedToken:token}
      );
    }
  }catch(error){
    console.error(error);
  }

  sessionStorage.removeItem("aqx_restricted_token");
  stopSessionMonitor();
  await supabase.auth.signOut();
  accessToken=null;
  currentMode=null;
  hideAccount();
  $("loginForm").classList.remove("hidden");
  showMessage("تم إنهاء الجلسة المؤقتة.","success");
}

/* مراقبة الجلسة العادية */
async function checkNormalSession(){
  const token=sessionStorage.getItem("aqx_session_token");
  if(!token || !accessToken)return;

  try{
    const result=await api(
      "/v1/session/check",
      {},
      {sessionToken:token}
    );

    if(result.valid!==true){
      stopSessionMonitor();
      sessionStorage.removeItem("aqx_session_token");
      showMessage("انتهت جلسة AQX. سجّل الدخول مجدداً.","error");
    }
  }catch(error){
    if(error.status===401){
      stopSessionMonitor();
      sessionStorage.removeItem("aqx_session_token");
      showMessage("جلسة AQX غير صالحة.","error");
    }
  }
}

function startNormalMonitor(){
  stopSessionMonitor();
  sessionTimer=setInterval(checkNormalSession,5*60*1000);
}

/* تحميل Cloudflare Turnstile عند الحاجة */
function loadTurnstile(){
  return new Promise((resolve,reject)=>{
    if(window.turnstile){
      resolve();
      return;
    }

    if(turnstileLoading){
      const wait=setInterval(()=>{
        if(window.turnstile){
          clearInterval(wait);
          resolve();
        }
      },200);
      setTimeout(()=>{
        clearInterval(wait);
        reject(new Error("تعذر تحميل فحص الحماية"));
      },12000);
      return;
    }

    turnstileLoading=true;
    const script=document.createElement("script");
    script.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    script.async=true;
    script.defer=true;

    script.onload=()=>{
      turnstileLoading=false;
      resolve();
    };

    script.onerror=()=>{
      turnstileLoading=false;
      reject(new Error("تعذر تحميل خدمة فحص الحماية"));
    };

    document.head.appendChild(script);
  });
}

async function renderTurnstile(){
  $("securityPanel").classList.remove("hidden");

  await loadTurnstile();

  if(turnstileWidget!==null)return;

  turnstileWidget=window.turnstile.render(
    "#turnstileBox",
    {
      sitekey:TURNSTILE_SITE_KEY,
      callback(token){
        turnstileToken=token;
      },
      "expired-callback"(){
        turnstileToken="";
      },
      "error-callback"(){
        turnstileToken="";
      }
    }
  );
}

/* استهلاك إثبات الدخول الأمني */
async function consumeLoginProof(){
  if(!loginProof)return true;

  if(!turnstileToken){
    await renderTurnstile();
    showMessage("أكمل فحص الحماية أولاً.","info");
    return false;
  }

  const sessionToken=sessionStorage.getItem("aqx_session_token");

  const result=await api(
    "/v1/security/login-proof/consume",
    {
      proof_token:loginProof,
      captcha_token:turnstileToken
    },
    {sessionToken}
  );

  if(result.valid!==true){
    throw new Error("تعذر تأكيد إثبات الدخول الأمني");
  }

  loginProof=null;
  $("securityPanel").classList.add("hidden");

  return true;
}

/* استهلاك تذكرة التحويل */
async function consumeRedirectTicket(ticket){
  if(!ticket)return false;

  const response=await fetch(
    IDENTITY_URL+"/v1/redirect/consume",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY
      },
      body:JSON.stringify({redirect_ticket:ticket}),
      cache:"no-store"
    }
  );

  const result=await response.json().catch(()=>({}));

  if(!response.ok || result.success!==true ||
     typeof result.redirect_uri!=="string"){
    throw new Error("تعذر التحقق من تذكرة التحويل");
  }

  const target=new URL(result.redirect_uri);

  if(target.protocol!=="https:"){
    throw new Error("رابط التحويل غير آمن");
  }

  location.assign(target.href);
  return true;
}

/* بدء تسجيل الدخول */
$("loginForm").addEventListener("submit",async event=>{
  event.preventDefault();

  clearMessage();
  hideAccount();
  stopSessionMonitor();

  const button=$("loginButton");
  button.disabled=true;
  button.textContent="جارٍ تسجيل الدخول...";

  try{
    const email=$("email").value.trim();
    const password=$("password").value;

    /* أولاً: مصادقة Supabase */
    const {data,error}=await supabase.auth.signInWithPassword({
      email,
      password
    });

    if(error)throw error;

    if(!data.session?.access_token){
      throw new Error("لم يتم الحصول على رمز الدخول");
    }

    accessToken=data.session.access_token;

    /* ثانياً: طلب جلسة AQX */
    const params=new URLSearchParams(location.search);
    const returnTo=params.get("return_to") || "";

    const started=await api("/v1/session/start",{
      return_to:returnTo
    });

    /* ثالثاً: معالجة الجلسة المؤقتة */
    if(started.restricted===true){
      currentMode="restricted";

      sessionStorage.removeItem("aqx_session_token");
      sessionStorage.removeItem("aqx_restricted_token");

      sessionStorage.setItem(
        "aqx_restricted_token",
        started.restricted_session_token
      );

      $("loginForm").classList.add("hidden");

      renderRestriction(started.restriction);
      showMessage(
        "تم تسجيل الدخول إلى جلسة الوصول المقيّد.",
        "info"
      );

      startRestrictedMonitor();
      return;
    }

    /* رابعاً: الجلسة العادية */
    if(!started.aqx_session_token){
      throw new Error("لم يُرجع المحرك رمز جلسة AQX");
    }

    currentMode="normal";

    sessionStorage.removeItem("aqx_restricted_token");
    sessionStorage.setItem(
      "aqx_session_token",
      started.aqx_session_token
    );

    loginProof=started.login_proof?.token || null;

    /* خامساً: إثبات الدخول */
    if(loginProof){
      const verified=await consumeLoginProof();

      if(!verified){
        button.disabled=false;
        button.textContent="تسجيل الدخول";
        showMessage(
          "الجلسة أُنشئت. أكمل فحص الحماية للمتابعة.",
          "info"
        );
        return;
      }
    }

    /* سادساً: التحويل الآمن عند وجود تذكرة */
    if(started.redirect_ticket){
      await consumeRedirectTicket(started.redirect_ticket);
      return;
    }

    $("loginForm").classList.add("hidden");
    showMessage("تم تسجيل الدخول بنجاح إلى AQX.","success");
    showAccount(
      "الحساب نشط",
      "تم إنشاء جلسة الحساب الموحد بنجاح.",
      started.expires_at
        ? "انتهاء الجلسة: "+
          new Date(started.expires_at).toLocaleString("ar-EG")
        : ""
    );

    const logout=document.createElement("button");
    logout.className="secondary";
    logout.textContent="تسجيل الخروج";
    logout.onclick=logoutNormal;
    $("accountActions").appendChild(logout);

    startNormalMonitor();

  }catch(error){
    console.error("AQX login error:",error);

    showMessage(
      translateError(error.code || error.message),
      "error"
    );

    /* لا نترك جلسة Supabase مفتوحة عند فشل إنشاء جلسة AQX */
    if(!currentMode){
      await supabase.auth.signOut().catch(()=>{});
      accessToken=null;
    }

  }finally{
    if(!$("loginForm").classList.contains("hidden")){
      button.disabled=false;
      button.textContent="تسجيل الدخول";
    }
  }
});

/* متابعة فحص الحماية */
$("verifyButton").addEventListener("click",async()=>{
  try{
    if(!turnstileToken){
      showMessage("أكمل فحص الحماية أولاً.","error");
      return;
    }

    $("verifyButton").disabled=true;

    const verified=await consumeLoginProof();

    if(!verified)return;

    const params=new URLSearchParams(location.search);
    const returnTo=params.get("return_to") || "";

    /*
      تذكرة التحويل تُنشأ عند بدء الجلسة.
      إن لم توجد تذكرة، نعرض نجاح الدخول.
    */
    $("loginForm").classList.add("hidden");
    showMessage("تم تأكيد الدخول الأمني بنجاح.","success");

    showAccount(
      "الحساب نشط",
      "تم تأكيد إثبات الدخول.",
      ""
    );

    startNormalMonitor();

  }catch(error){
    showMessage(error.message,"error");
    if(window.turnstile && turnstileWidget!==null){
      window.turnstile.reset(turnstileWidget);
      turnstileToken="";
    }
  }finally{
    $("verifyButton").disabled=false;
  }
});

/* تسجيل الخروج العادي */
async function logoutNormal(){
  const token=sessionStorage.getItem("aqx_session_token");

  try{
    if(token){
      await api(
        "/v1/session/logout",
        {},
        {sessionToken:token}
      );
    }
  }catch(error){
    console.error(error);
  }

  sessionStorage.removeItem("aqx_session_token");
  stopSessionMonitor();

  await supabase.auth.signOut();

  accessToken=null;
  currentMode=null;
  loginProof=null;

  $("loginForm").classList.remove("hidden");
  hideAccount();
  showMessage("تم تسجيل الخروج.","success");
}

/* تحويل رموز الأخطاء إلى رسائل عربية */
function translateError(code){
  const errors={
    "Invalid login credentials":"البريد الإلكتروني أو كلمة المرور غير صحيحة.",
    "EMAIL_NOT_VERIFIED":"يجب تأكيد البريد الإلكتروني أولاً.",
    "ACCOUNT_SELF_DISABLED":"الحساب معطّل بناءً على طلبك.",
    "ACCOUNT_ADMIN_DISABLED":"الحساب معطّل إدارياً.",
    "CENTRAL_ACCESS_BLOCKED":"الحساب أو البريد مقيّد من استخدام AQX.",
    "DISPOSABLE_EMAIL_NOT_ALLOWED":"البريد المؤقت غير مسموح به.",
    "LOGIN_PROVIDER_DISABLED":"تسجيل الدخول بهذا المزود غير متاح حالياً.",
    "LOGIN_RATE_LIMITED":"تم تجاوز عدد محاولات الدخول. حاول لاحقاً.",
    "SERVER_AUTH_NOT_CONFIGURED":"خدمة الحساب الموحد غير مهيأة على الخادم.",
    "CAPTCHA_NOT_CONFIGURED":"خدمة فحص الحماية غير مهيأة على الخادم.",
    "INVALID_RETURN_TO":"رابط التحويل غير صحيح.",
    "RETURN_TO_NOT_REGISTERED":"الخدمة المطلوبة غير مسجلة في AQX."
  };

  return errors[code] || code ||
    "حدث خطأ أثناء تسجيل الدخول. حاول مرة أخرى.";
}

/* تنظيف الجلسات المحلية عند إغلاق الصفحة */
window.addEventListener("pagehide",()=>{
  stopSessionMonitor();
});

/* تحديث حالة الجلسة عند العودة للصفحة */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;

  if(currentMode==="restricted"){
    checkRestrictedSession();
  }else if(currentMode==="normal"){
    checkNormalSession();
  }
});

})();
</script>
</body>
</html>
