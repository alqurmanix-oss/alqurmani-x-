<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <title>إنشاء حساب | AQX Auth</title>  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1020;
      color: #f2f5ff;
      font-family: Tahoma, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 23px;
      border: 1px solid #293751;
      border-radius: 20px;
      background: #111a2e;
      box-shadow: 0 20px 60px #0004;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 15px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: linear-gradient(135deg, #6d7cff, #a05bff);
      font-size: 23px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      margin: 12px 0 26px;
      text-align: center;
      color: #aab6cc;
      font-size: 13px;
      line-height: 1.9;
    }

    .field { margin-bottom: 17px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      min-height: 49px;
      padding: 13px;
      border: 1px solid #293751;
      border-radius: 11px;
      outline: none;
      background: #0b1325;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: #7d89ff;
      box-shadow: 0 0 0 3px #6d7cff20;
    }

    input::placeholder { color: #71809a; }

    .password-note {
      margin-top: 7px;
      color: #aab6cc;
      font-size: 11px;
      line-height: 1.8;
    }

    button {
      width: 100%;
      min-height: 49px;
      margin-top: 5px;
      border: 0;
      border-radius: 11px;
      background: #6d7cff;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    #message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    #message.show { display: block; }

    #message.error {
      color: #ffaaaa;
      background: #ff737315;
      border: 1px solid #ff737355;
    }

    #message.success {
      color: #8af0c9;
      background: #36d39915;
      border: 1px solid #36d39955;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #aab6cc;
      font-size: 12px;
    }

    @media (max-width: 360px) {
      .card { padding: 23px 16px; }
    }
  </style></head><body>
  <main class="card">
    <div class="logo">AQX</div><h1>إنشاء حساب جديد</h1>

<p class="subtitle">
  أنشئ حسابك الموحد للوصول إلى خدمات AQX.
  ستحتاج إلى تفعيل بريدك الإلكتروني.
</p>

<div id="message" role="status" aria-live="polite"></div>

<form id="registerForm">
  <div class="field">
    <label for="email">البريد الإلكتروني</label>
    <input
      id="email"
      name="email"
      type="email"
      autocomplete="email"
      maxlength="254"
      dir="ltr"
      placeholder="name@example.com"
      required>
  </div>

  <div class="field">
    <label for="password">كلمة المرور</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="new-password"
      minlength="12"
      maxlength="128"
      placeholder="12 حرفًا على الأقل"
      required>
    <div class="password-note">
      استخدم كلمة مرور قوية لا تقل عن 12 حرفًا.
    </div>
  </div>

  <div class="field">
    <label for="confirmPassword">تأكيد كلمة المرور</label>
    <input
      id="confirmPassword"
      name="confirmPassword"
      type="password"
      autocomplete="new-password"
      minlength="12"
      maxlength="128"
      placeholder="أعد كتابة كلمة المرور"
      required>
  </div>

  <button id="submitButton" type="submit">
    إنشاء الحساب
  </button>
</form>

<div class="footer">AQX Auth — الحساب الموحد</div>

  </main>  <script>
    'use strict';

    const form = document.getElementById('registerForm');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');

    let submitting = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'show ' + type;
    }

    function getDeviceId() {
      const key = 'aqx_auth_device_id_v1';

      try {
        let id = localStorage.getItem(key);

        if (!id) {
          id = crypto.randomUUID
            ? crypto.randomUUID()
            : 'aqx-' + Date.now().toString(36) +
              '-' + Math.random().toString(36).slice(2) +
              Math.random().toString(36).slice(2);

          localStorage.setItem(key, id);
        }

        return id;
      } catch (error) {
        return 'aqx-' + Date.now().toString(36) +
          '-' + Math.random().toString(36).slice(2) +
          Math.random().toString(36).slice(2);
      }
    }

    function finishRequest() {
      submitting = false;
      button.disabled = false;
      button.textContent = 'إنشاء الحساب';
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      if (submitting) return;

      if (!form.reportValidity()) return;

      const email = document.getElementById('email')
        .value.trim().toLowerCase();

      const password = document.getElementById('password').value;

      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showMessage('كلمتا المرور غير متطابقتين.', 'error');
        return;
      }

      if (password.length < 12 || password.length > 128) {
        showMessage(
          'يجب أن تكون كلمة المرور بين 12 و128 حرفًا.',
          'error'
        );
        return;
      }

      if (
        typeof google === 'undefined' ||
        !google.script ||
        !google.script.run
      ) {
        showMessage(
          'الواجهة ليست مفتوحة من محرك Google Apps Script. افتح رابط المحرك المنشور.',
          'error'
        );
        return;
      }

      submitting = true;
      button.disabled = true;
      button.textContent = 'جارٍ إنشاء الحساب...';
      message.className = '';

      const payload = {
        email: email,
        password: password,
        deviceId: getDeviceId()
      };

      const timeoutId = setTimeout(function() {
        if (submitting) {
          finishRequest();
          showMessage(
            'استغرق الطلب وقتًا أطول من المتوقع. لا تحاول التسجيل مرارًا قبل التحقق مما إذا كان الحساب قد أُنشئ بالفعل.',
            'error'
          );
        }
      }, 45000);

      google.script.run
        .withSuccessHandler(function(result) {
          clearTimeout(timeoutId);
          finishRequest();

          if (result && result.ok === true) {
            showMessage(
              result.message ||
              'تم إنشاء الحساب. راجع بريدك الإلكتروني لتفعيل الحساب.',
              'success'
            );

            form.reset();
            return;
          }

          showMessage(
            result && result.message
              ? result.message
              : 'لم يكتمل التسجيل. حاول مرة أخرى بعد التحقق من حالة الحساب.',
            'error'
          );
        })
        .withFailureHandler(function(error) {
          clearTimeout(timeoutId);
          finishRequest();

          showMessage(
            error && error.message
              ? 'تعذر إكمال الطلب: ' + error.message
              : 'حدث خطأ أثناء الاتصال بالمحرك.',
            'error'
          );
        })
        .registerAccount(payload);
    });
  </script></body>
</html>
