<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد | AQX Auth Core</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-color: #238636;
      --accent-hover: #2ea043;
      --error-color: #da3633;
      --success-color: #238636;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .register-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .brand-header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: #58a6ff;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .submit-btn:hover {
      background-color: var(--accent-hover);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error {
      background-color: rgba(218, 54, 51, 0.15);
      border: 1px solid var(--error-color);
      color: #f85149;
    }

    .alert-success {
      background-color: rgba(35, 134, 54, 0.15);
      border: 1px solid var(--success-color);
      color: #3fb950;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #ffffff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
      display: none;
      margin-left: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="brand-header">
      <h1>إنشاء حساب جديد</h1>
      <p>منظومة AQX الأمنيّة المركزية</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="registerForm" onsubmit="handleRegistration(event)">
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">كلمة السر</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="passwordConfirm">تأكيد كلمة السر</label>
        <input type="password" id="passwordConfirm" class="form-control" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        <span>تسجيل الحساب</span>
        <div id="btnSpinner" class="spinner"></div>
      </button>
    </form>
  </div>

  <script>
    // رابط المحرك الجديد الذي أرسلته يا أبا عبد الله
    const ENGINE_URL = "https://script.google.com/macros/s/AKfycbx0MTO76Yn9EzlXrXhlFG8m8ahUZf_RNjR9tM5C0oiFlh3ck2oKFmUDjqVTR3FhTPUf/exec";

    // الحصول على معرف فريد وثابت للجهاز وتخزينه محلياً لفحص قاعدة الـ 5 حسابات
    function getDeviceId() {
      let deviceId = localStorage.getItem("aqx_device_id");
      if (!deviceId) {
        deviceId = "AQX-DEV-" + Math.random().toString(36).substring(2, 11) + "-" + Date.now();
        localStorage.setItem("aqx_device_id", deviceId);
      }
      return deviceId;
    }

    function showAlert(message, type) {
      const alertBox = document.getElementById("alertBox");
      alertBox.textContent = message;
      alertBox.className = "alert " + (type === "success" ? "alert-success" : "alert-error");
      alertBox.style.display = "block";
    }

    function hideAlert() {
      const alertBox = document.getElementById("alertBox");
      alertBox.style.display = "none";
    }

    async function handleRegistration(event) {
      event.preventDefault();
      hideAlert();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const passwordConfirm = document.getElementById("passwordConfirm").value;
      const submitBtn = document.getElementById("submitBtn");
      const btnSpinner = document.getElementById("btnSpinner");

      if (password !== passwordConfirm) {
        showAlert("كلمة السر وتأكيد كلمة السر غير متطابقين.", "error");
        return;
      }

      if (password.length < 8) {
        showAlert("كلمة السر يجب أن تكون 8 أحرف على الأقل.", "error");
        return;
      }

      submitBtn.disabled = true;
      btnSpinner.style.display = "inline-block";

      const payload = {
        email: email,
        password: password,
        password_confirm: passwordConfirm,
        device_id: getDeviceId()
      };

      try {
        const response = await fetch(ENGINE_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          showAlert(result.message || "تم إنشاء الحساب بنجاح!", "success");
          document.getElementById("registerForm").reset();
        } else {
          showAlert(result.message || "حدث خطأ أثناء التسجيل.", "error");
        }

      } catch (error) {
        showAlert("تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً.", "error");
      } finally {
        submitBtn.disabled = false;
        btnSpinner.style.display = "none";
      }
    }
  </script>
</body>
</html>
